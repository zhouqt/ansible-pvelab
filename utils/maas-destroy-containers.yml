---

- name: Destroy LXD containers
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags: [destroy, cleanup]

  vars:
    lxd_project_name: "maas-ha"
    lxd_containers:
      - maas-ha-1
      - maas-ha-2
      - maas-ha-3

  tasks:
    - name: Stop containers
      command: lxc stop {{ item }} --force
      loop: "{{ lxd_containers }}"
      ignore_errors: yes
      tags: destroy

    - name: Delete containers
      command: lxc delete {{ item }} --force
      loop: "{{ lxd_containers }}"
      ignore_errors: yes
      tags: destroy

    - name: Delete local image
      command: lxc image delete jammy
      ignore_errors: yes
      tags: destroy

    - name: Switch to default project
      command: lxc project switch default
      tags: destroy

    - name: Delete MAAS HA project
      command: lxc project delete {{ lxd_project_name }}
      ignore_errors: yes
      tags: destroy

    - name: Verify cleanup
      command: lxc list --format yaml
      register: remaining
      changed_when: false
      tags: destroy

    - name: Display remaining containers
      debug:
        msg: "Remaining containers: {{ remaining.stdout | from_yaml | map(attribute='name') | list }}"
      tags: destroy