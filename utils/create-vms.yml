---

- name: Create OpenStack VMs in MAAS
  hosts: localhost
  connection: local
  tags: [create-vms]
  vars:
    maas_host: "192.168.122.10"
    maas_api_key: "mDokAqxvV7XXhOBXd7:sCPM681aA6r3q2F8gu:PCogeKWkIkD0mIeDIQI3K7RWlqshYMZ1"
    vm_host_id: 5
    control_vms:
      - { name: "os-control-1", memory: 16384, cores: 4, disk: 80 }
      - { name: "os-control-2", memory: 16384, cores: 4, disk: 80 }
      - { name: "os-control-3", memory: 16384, cores: 4, disk: 80 }
    compute_vms:
      - { name: "os-compute-1", memory: 32768, cores: 4, disk: 100 }
      - { name: "os-compute-2", memory: 32768, cores: 4, disk: 100 }
  tasks:
    - name: Check if VMs already exist in MAAS
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/"
        method: GET
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        return_content: yes
      register: existing_machines
      changed_when: false

    - name: Set fact for existing VM hostnames
      set_fact:
        existing_vm_hostnames: "{{ existing_machines.content | from_json | selectattr('hostname', 'match', '^os-') | map(attribute='hostname') | list }}"

    - name: Display existing VMs
      debug:
        msg: "Existing OpenStack VMs: {{ existing_vm_hostnames }}"

    - name: Create control VMs if not exist
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/vm-hosts/{{ vm_host_id }}/?op=compose"
        method: POST
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        body:
          hostname: "{{ item.name }}"
          memory: "{{ item.memory }}"
          cores: "{{ item.cores }}"
          storage: "root:{{ item.disk }}"
        body_format: form-urlencoded
        status_code: 200
      loop: "{{ control_vms }}"
      when: item.name not in existing_vm_hostnames
      register: control_vm_created

    - name: Create compute VMs if not exist
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/vm-hosts/{{ vm_host_id }}/?op=compose"
        method: POST
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        body:
          hostname: "{{ item.name }}"
          memory: "{{ item.memory }}"
          cores: "{{ item.cores }}"
          storage: "root:{{ item.disk }}"
        body_format: form-urlencoded
        status_code: 200
      loop: "{{ compute_vms }}"
      when: item.name not in existing_vm_hostnames
      register: compute_vm_created

- name: Add network interfaces to VMs
  hosts: localhost
  connection: local
  tags: [add-interfaces]
  vars:
    lxd_project: "maas-managed"
    control_vms: ["os-control-1", "os-control-2", "os-control-3"]
    compute_vms: ["os-compute-1", "os-compute-2"]
    networks:
      overlay: "virbr2"
      storage: "virbr3"
      external: "virbr4"
  tasks:
    - name: Add overlay network interface to control VMs
      shell: |
        lxc config device add {{ item }} eth1 nic nictype=bridged parent={{ networks.overlay }} name=eth1 --project {{ lxd_project }} || true
      loop: "{{ control_vms }}"
      changed_when: false

    - name: Add storage network interface to control VMs
      shell: |
        lxc config device add {{ item }} eth2 nic nictype=bridged parent={{ networks.storage }} name=eth2 --project {{ lxd_project }} || true
      loop: "{{ control_vms }}"
      changed_when: false

    - name: Add overlay network interface to compute VMs
      shell: |
        lxc config device add {{ item }} eth1 nic nictype=bridged parent={{ networks.overlay }} name=eth1 --project {{ lxd_project }} || true
      loop: "{{ compute_vms }}"
      changed_when: false

    - name: Add storage network interface to compute VMs
      shell: |
        lxc config device add {{ item }} eth2 nic nictype=bridged parent={{ networks.storage }} name=eth2 --project {{ lxd_project }} || true
      loop: "{{ compute_vms }}"
      changed_when: false

    - name: Add external network interface to compute VMs
      shell: |
        lxc config device add {{ item }} eth3 nic nictype=bridged parent={{ networks.external }} name=eth3 --project {{ lxd_project }} || true
      loop: "{{ compute_vms }}"
      changed_when: false

- name: Configure compute VMs for nested VMX
  hosts: localhost
  connection: local
  tags: [nested-vmx]
  vars:
    lxd_project: "maas-managed"
    compute_vms: ["os-compute-1", "os-compute-2"]
  tasks:
    - name: Enable host CPU passthrough for nested VMX
      shell: |
        lxc config set {{ item }} raw.qemu="-cpu host" --project {{ lxd_project }} || true
      loop: "{{ compute_vms }}"
      changed_when: false

- name: Commission VMs in MAAS
  hosts: localhost
  connection: local
  tags: [commission]
  vars:
    maas_host: "192.168.122.10"
    maas_api_key: "mDokAqxvV7XXhOBXd7:sCPM681aA6r3q2F8gu:PCogeKWkIkD0mIeDIQI3K7RWlqshYMZ1"
    all_vms: ["os-control-1", "os-control-2", "os-control-3", "os-compute-1", "os-compute-2"]
  tasks:
    - name: Get system IDs for all VMs
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/"
        method: GET
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        return_content: yes
      register: machines_info
      changed_when: false

    - name: Set system_id facts
      set_fact:
        vm_system_ids: "{{ machines_info.content | from_json | selectattr('hostname', 'in', all_vms) | items2dict(key_name='hostname', value_name='system_id') }}"

    - name: Commission all VMs
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/{{ vm_system_ids[item] }}/?op=commission"
        method: POST
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        status_code: 200
      loop: "{{ all_vms }}"
      register: commission_result

    - name: Wait for commissioning to complete
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/"
        method: GET
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        return_content: yes
      register: machines_status
      until: "(machines_status.content | from_json | selectattr('hostname', 'in', all_vms) | selectattr('status_name', '==', 'Ready') | list | length) >= 5"
      retries: 60
      delay: 30
      changed_when: false

- name: Deploy Ubuntu on VMs
  hosts: localhost
  connection: local
  tags: [deploy]
  vars:
    maas_host: "192.168.122.10"
    maas_api_key: "mDokAqxvV7XXhOBXd7:sCPM681aA6r3q2F8gu:PCogeKWkIkD0mIeDIQI3K7RWlqshYMZ1"
    all_vms: ["os-control-1", "os-control-2", "os-control-3", "os-compute-1", "os-compute-2"]
    ubuntu_series: "jammy"
  tasks:
    - name: Get system IDs for all VMs
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/"
        method: GET
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        return_content: yes
      register: machines_info
      changed_when: false

    - name: Set system_id facts
      set_fact:
        vm_system_ids: "{{ machines_info.content | from_json | selectattr('hostname', 'in', all_vms) | items2dict(key_name='hostname', value_name='system_id') }}"

    - name: Deploy Ubuntu on all VMs
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/{{ vm_system_ids[item] }}/?op=deploy"
        method: POST
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        body:
          distro_series: "{{ ubuntu_series }}"
        body_format: form-urlencoded
        status_code: 200
      loop: "{{ all_vms }}"
      register: deploy_result

    - name: Wait for deployment to complete
      uri:
        url: "http://{{ maas_host }}:5240/MAAS/api/2.0/machines/"
        method: GET
        headers:
          Authorization: "ApiKey admin:{{ maas_api_key }}"
        return_content: yes
      register: machines_status
      until: "(machines_status.content | from_json | selectattr('hostname', 'in', all_vms) | selectattr('status_name', '==', 'Deployed') | list | length) >= 5"
      retries: 90
      delay: 30
      changed_when: false

    - name: Get deployed VM IP addresses
      set_fact:
        vm_ips: "{{ machines_status.content | from_json | selectattr('hostname', 'in', all_vms) | items2dict(key_name='hostname', value_name='ip_addresses[0]') }}"

    - name: Display deployed VM information
      debug:
        msg: |
          Deployed VMs:
          {% for vm in all_vms %}
          {{ vm }}: {{ vm_ips[vm] }}
          {% endfor %}