---

- name: Configure Network Routing for Juju/MAAS Integration
  hosts: localhost
  connection: local
  tags: [network-setup]
  tasks:
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: 1
        state: present
        reload: yes
      become: true

    - name: Configure NAT for MAAS VM networks to reach Juju controller
      iptables:
        table: nat
        chain: POSTROUTING
        source: 192.168.165.0/24
        destination: 192.168.122.0/24
        jump: MASQUERADE
        state: present
      become: true

    - name: Configure NAT for MAAS VM networks to reach internet
      iptables:
        table: nat
        chain: POSTROUTING
        source: 192.168.165.0/24
        out_interface: eno1
        jump: MASQUERADE
        state: present
      become: true

    - name: Allow forwarding from MAAS networks
      iptables:
        chain: FORWARD
        source: 192.168.165.0/24
        jump: ACCEPT
        state: present
      become: true

    - name: Allow forwarding to MAAS networks
      iptables:
        chain: FORWARD
        destination: 192.168.165.0/24
        jump: ACCEPT
        state: present
      become: true

- name: Configure MAAS DHCP Gateway
  hosts: localhost
  connection: local
  tags: [maas-dhcp]
  vars:
    maas_host: "192.168.122.10"
  tasks:
    - name: Set gateway for virbr1 subnet in MAAS
      shell: |
        ssh root@{{ maas_host }} "maas maas-admin subnet update 2 gateway_ip=192.168.165.1 dns_servers=8.8.8.8,8.8.4.4"
      register: subnet_update
      changed_when: subnet_update.rc == 0

- name: Add Gateway to Deployed VMs
  hosts: localhost
  connection: local
  tags: [vm-gateway]
  vars:
    maas_vms:
      - "192.168.165.7"
      - "192.168.165.8"
      - "192.168.165.9"
      - "192.168.165.201"
      - "192.168.165.202"
  tasks:
    - name: Add default gateway to VMs
      shell: |
        ssh ubuntu@{{ item }} "sudo ip route add default via 192.168.165.1" 2>/dev/null || true
      loop: "{{ maas_vms }}"
      changed_when: false

    - name: Add DNS to VMs
      shell: |
        ssh ubuntu@{{ item }} "sudo echo 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf" 2>/dev/null || true
      loop: "{{ maas_vms }}"
      changed_when: false

    - name: Verify connectivity to Juju controller from VMs
      shell: |
        ssh ubuntu@{{ item }} "ping -c 2 192.168.122.217"
      loop: "{{ maas_vms }}"
      register: ping_result
      changed_when: false

    - name: Display connectivity status
      debug:
        msg: |
          VM Connectivity Status:
          {% for result in ping_result.results %}
          {{ result.item }}: {{ 'OK' if result.rc == 0 else 'FAILED' }}
          {% endfor %}