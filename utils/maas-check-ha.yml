---

- name: Check cluster health
  hosts: maas_ha[0]
  become: true
  tags: [check]
  tasks:
    - name: Get Pacemaker resources status
      command: pcs status resources
      register: pcs_resources
      changed_when: false
      tags: check

    - name: Get Pacemaker nodes status
      command: pcs status nodes
      register: pcs_nodes
      changed_when: false
      tags: check

    - name: Display cluster status
      debug:
        msg:
          - "=== Pacemaker Resources ==="
          - "{{ pcs_resources.stdout_lines }}"
          - ""
          - "=== Nodes ==="
          - "{{ pcs_nodes.stdout_lines }}"
      tags: check

- name: Check MAAS status on all nodes
  hosts: maas_ha
  become: true
  tags: [check, maas]
  tasks:
    - name: Check MAAS API
      uri:
        url: "http://localhost:5240/MAAS/api/2.0/version/"
        method: GET
        status_code: 200
        timeout: 5
      register: maas_api
      ignore_errors: yes
      tags: check

    - name: Get MAAS service status
      command: maas status
      register: maas_status
      changed_when: false
      ignore_errors: yes
      tags: check

    - name: Display MAAS status
      debug:
        msg:
          - "Node: {{ inventory_hostname }}"
          - "API Status: {{ maas_api.status | default('FAILED') }}"
          - "Services:"
          - "{{ maas_status.stdout_lines | default(['Not available']) }}"
      tags: check

- name: Check PostgreSQL status
  hosts: maas_ha
  become: true
  tags: [check, postgresql]
  tasks:
    - name: Check if PostgreSQL is Primary or Standby
      become_user: postgres
      command: psql -t -c "SELECT pg_is_in_recovery();"
      register: pg_recovery
      changed_when: false
      ignore_errors: yes
      tags: check

    - name: Display PostgreSQL status
      debug:
        msg: "{{ inventory_hostname }}: {{ 'Standby' if pg_recovery.stdout.strip() == 't' else 'Primary' if pg_recovery.stdout.strip() == 'f' else 'Not running' }}"
      tags: check

- name: Check VIPs
  hosts: maas_ha[0]
  become: true
  tags: [check, vip]
  tasks:
    - name: Check MAAS VIP
      command: ip addr show
      register: ip_show
      changed_when: false
      tags: check

    - name: Display VIP status
      debug:
        msg:
          - "MAAS VIP ({{ maas_vip }}): {{ 'Present' if maas_vip in ip_show.stdout else 'Not on this node' }}"
          - "PostgreSQL VIP ({{ pgsql_vip }}): {{ 'Present' if pgsql_vip in ip_show.stdout else 'Not on this node' }}"
      tags: check

- name: Summary
  hosts: localhost
  tags: [check]
  tasks:
    - name: Display summary
      debug:
        msg:
          - "=== MAAS HA Cluster Health Check ==="
          - "Run with -v for detailed output"
          - ""
          - "To fix issues, run: ansible-playbook fix-maas-ha.yml"
      tags: check