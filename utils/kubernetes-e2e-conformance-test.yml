---

- name: Kubernetes e2e CNCF conformance tests
  hosts: localhost
  gather_facts: yes
  vars:
    juju_k8s_cmd: "juju-36"

    k8s_juju_controller: "lxd-os-k8s-ctrl"
    k8s_model: "k8s"

    k8s_e2e_app_name: "kubernetes-e2e"
    k8s_e2e_charm_channel: "1.32/stable"
    k8s_e2e_base: "ubuntu@22.04"
    k8s_e2e_constraints: "cores=2 mem=8G root-disk=20G"
    k8s_e2e_num_units: 1

    k8s_e2e_test_focus: '\[Conformance\]'
    k8s_e2e_test_skip: '\[Flaky\]|\[Serial\]'
    k8s_e2e_test_parallelism: 25
    k8s_e2e_test_timeout: 30000
    k8s_e2e_test_extra: "-allowed-not-ready-nodes=2"

    k8s_e2e_test_wait: "3h"
    k8s_e2e_test_max_seconds: 14400
    k8s_e2e_poll_interval: 60

    k8s_e2e_skip_deploy: false
    k8s_e2e_skip_run: false

    k8s_e2e_result_dir: "{{ playbook_dir }}/../results/k8s-e2e-{{ '%Y%m%d-%H%M%S' | strftime }}"

  pre_tasks:
    - name: show the configuration
      debug:
        msg:
          - "========== Kubernetes e2e conformance tests =========="
          - "Juju controller: {{ k8s_juju_controller }}"
          - "Juju model: {{ k8s_model }}"
          - "Charm: {{ k8s_e2e_app_name }} ({{ k8s_e2e_charm_channel }})"
          - "Base: {{ k8s_e2e_base }}"
          - "Focus: {{ k8s_e2e_test_focus }}"
          - "Skip: {{ k8s_e2e_test_skip }}"
          - "wait time: {{ k8s_e2e_test_wait }}"
          - "result dir: {{ k8s_e2e_result_dir }}"
          - "==========================================="

    - name: create the result directory
      file:
        path: "{{ k8s_e2e_result_dir }}"
        state: directory
        mode: '0755'

    - name: verify the juju client works
      command: "which {{ juju_k8s_cmd }}"
      register: juju_path
      changed_when: false
      failed_when: juju_path.rc != 0

    - name: verify the target model is reachable
      command: "{{ juju_k8s_cmd }} status -m {{ k8s_juju_controller }}:{{ k8s_model }} --format short"
      register: model_status
      changed_when: false
      failed_when: model_status.rc != 0

    - name: show the current model status
      debug:
        msg: "{{ model_status.stdout_lines }}"

  tasks:
    - name: deploy the kubernetes-e2e charm
      block:
        - name: check whether kubernetes-e2e is deployed
          shell: "{{ juju_k8s_cmd }} status -m {{ k8s_juju_controller }}:{{ k8s_model }} {{ k8s_e2e_app_name }} --format json 2>/dev/null"
          register: e2e_app_status
          changed_when: false
          failed_when: false

        - name: deploy the kubernetes-e2e charm
          shell: >
            {{ juju_k8s_cmd }} deploy {{ k8s_e2e_app_name }}
            --base {{ k8s_e2e_base }}
            --channel {{ k8s_e2e_charm_channel }}
            --constraints "{{ k8s_e2e_constraints }}"
            -n {{ k8s_e2e_num_units }}
            -m {{ k8s_juju_controller }}:{{ k8s_model }}
          when: e2e_app_status.rc != 0
          register: e2e_deploy

        - name: show the deploy output
          debug:
            msg: "{{ e2e_deploy.stdout_lines | default(['already deployed']) }}"

        - name: relate kube-control (kubernetes-e2e <-> kubernetes-control-plane)
          shell: >
            {{ juju_k8s_cmd }} integrate -m {{ k8s_juju_controller }}:{{ k8s_model }}
            {{ k8s_e2e_app_name }}:kube-control kubernetes-control-plane:kube-control
            2>&1 || echo ALREADY_RELATED
          register: kube_control_rel
          changed_when: "'ALREADY_RELATED' not in kube_control_rel.stdout"

        - name: check whether easyrsa exists
          shell: "{{ juju_k8s_cmd }} status -m {{ k8s_juju_controller }}:{{ k8s_model }} easyrsa --format json 2>/dev/null"
          register: easyrsa_status
          changed_when: false
          failed_when: false

        - name: relate certificates (kubernetes-e2e <-> easyrsa)
          shell: >
            {{ juju_k8s_cmd }} integrate -m {{ k8s_juju_controller }}:{{ k8s_model }}
            {{ k8s_e2e_app_name }} easyrsa
            2>&1 || echo ALREADY_RELATED
          when: easyrsa_status.rc == 0
          register: certs_rel
          changed_when: "'ALREADY_RELATED' not in certs_rel.stdout"

        - name: warn that easyrsa is missing
          debug:
            msg: "WARNING: easyrsa is not deployed, so the certificates relation cannot be made. The charm will stay Blocked"
          when: easyrsa_status.rc != 0

        - name: wait for kubernetes-e2e to become active or blocked (up to 10 minutes)
          shell: |
            {{ juju_k8s_cmd }} wait-for application {{ k8s_e2e_app_name }} \
              -m {{ k8s_juju_controller }}:{{ k8s_model }} \
              --query='status=="active" || status=="blocked"' \
              --timeout 600 2>&1 || true
            echo "---"
            {{ juju_k8s_cmd }} status -m {{ k8s_juju_controller }}:{{ k8s_model }} {{ k8s_e2e_app_name }} --format short
          register: e2e_wait
          changed_when: false

        - name: show the kubernetes-e2e status
          debug:
            msg: "{{ e2e_wait.stdout_lines }}"

      when: not k8s_e2e_skip_deploy

    - name: verify the kubernetes-e2e unit message is "Ready to test."
      shell: "{{ juju_k8s_cmd }} status -m {{ k8s_juju_controller }}:{{ k8s_model }} {{ k8s_e2e_app_name }}/0 --format json"
      register: e2e_unit_status
      changed_when: false
      retries: 10
      delay: 30
      until: "'Ready to test' in e2e_unit_status.stdout"
      failed_when: false

    - name: show the unit status
      debug:
        msg: "{{ e2e_unit_status.stdout }}"

    - name: run the test action (CNCF conformance)
      block:
        - name: submit the test action
          shell: |
            {{ juju_k8s_cmd }} run -m {{ k8s_juju_controller }}:{{ k8s_model }} \
              {{ k8s_e2e_app_name }}/0 test \
              focus='{{ k8s_e2e_test_focus }}' \
              skip='{{ k8s_e2e_test_skip }}' \
              parallelism={{ k8s_e2e_test_parallelism }} \
              timeout={{ k8s_e2e_test_timeout }} \
              extra='{{ k8s_e2e_test_extra }}' \
              --wait={{ k8s_e2e_test_wait }} \
              --format=json
          register: test_result
          async: "{{ k8s_e2e_test_max_seconds }}"
          poll: "{{ k8s_e2e_poll_interval }}"

        - name: parse the test action JSON result
          set_fact:
            test_result_json: "{{ test_result.stdout | from_json }}"

        - name: show the test action output
          debug:
            msg: "{{ test_result_json | to_nice_json }}"

      when: not k8s_e2e_skip_run
      rescue:
        - name: the test action failed or timed out
          debug:
            msg:
              - "the test action did not finish within {{ k8s_e2e_test_wait }}"
              - "possible task ID: check juju task list -m {{ k8s_juju_controller }}:{{ k8s_model }}"
              - "inspect by hand: {{ juju_k8s_cmd }} show-task <task-id>"

    - name: fetch the test logs
      shell: |
        {{ juju_k8s_cmd }} scp -m {{ k8s_juju_controller }}:{{ k8s_model }} \
          --proxy=false {{ k8s_e2e_app_name }}/0:*.log.tar.gz {{ k8s_e2e_result_dir }}/ 2>&1
        ls -la {{ k8s_e2e_result_dir }}/*.log.tar.gz 2>/dev/null || echo NO_LOG_TARBALL
      register: log_pull
      changed_when: false
      failed_when: false

    - name: fetch the JUnit XML
      shell: |
        {{ juju_k8s_cmd }} scp -m {{ k8s_juju_controller }}:{{ k8s_model }} \
          --proxy=false {{ k8s_e2e_app_name }}/0:*-junit.tar.gz {{ k8s_e2e_result_dir }}/ 2>&1
        ls -la {{ k8s_e2e_result_dir }}/*-junit.tar.gz 2>/dev/null || echo NO_JUNIT_TARBALL
      register: junit_pull
      changed_when: false
      failed_when: false

    - name: extract the results
      shell: |
        cd {{ k8s_e2e_result_dir }}
        for f in *.tar.gz; do
          [ -f "$f" ] || continue
          tar xzf "$f" 2>/dev/null && rm "$f"
        done
        find . -type f
      register: extracted
      changed_when: false

    - name: show the extracted files
      debug:
        msg: "{{ extracted.stdout_lines | default(['no files']) }}"

    - name: parse the test statistics
      shell: |
        LOG=$(ls {{ k8s_e2e_result_dir }}/*.log 2>/dev/null | head -1)
        if [ -z "$LOG" ]; then
          echo "no log file found"
          exit 0
        fi
        echo "log file: $LOG"
        echo ""
        echo "=== pass/fail summary ==="
        echo "Passed:  $(grep -c '\[PASSED\]' "$LOG" 2>/dev/null || echo 0)"
        echo "Failed:  $(grep -c '\[FAILED\]' "$LOG" 2>/dev/null || echo 0)"
        echo "Skipped: $(grep -c '\[SKIPPED\]' "$LOG" 2>/dev/null || echo 0)"
        echo ""
        echo "=== failing cases (if any) ==="
        grep '\[FAILED\]' "$LOG" 2>/dev/null | head -10
        echo ""
        echo "=== last 5 test results ==="
        grep -E '\[(PASSED|FAILED|SKIPPED)\]' "$LOG" 2>/dev/null | tail -5
      register: stats
      changed_when: false
      failed_when: false

    - name: show the test statistics
      debug:
        msg: "{{ stats.stdout_lines | default(['no results']) }}"

    - name: keep the charm deployed (never removed, so the tests can be re-run)
      debug:
        msg: "the kubernetes-e2e charm stays deployed. To remove it: {{ juju_k8s_cmd }} remove-application {{ k8s_e2e_app_name }} -m {{ k8s_juju_controller }}:{{ k8s_model }}"

    - name: final report
      debug:
        msg:
          - ""
          - "==========================================="
          - "Kubernetes e2e CNCF conformance tests finished"
          - "==========================================="
          - "Charm: {{ k8s_e2e_app_name }} ({{ k8s_e2e_charm_channel }})"
          - "result dir: {{ k8s_e2e_result_dir }}"
          - ""
          - "next steps:"
          - "  1. view the JUnit report:  ls {{ k8s_e2e_result_dir }}/*-junit/"
          - "  2. inspect failing cases:   grep FAILED {{ k8s_e2e_result_dir }}/*.log"
          - "  3. run the tests again:     {{ juju_k8s_cmd }} run -m {{ k8s_juju_controller }}:{{ k8s_model }} {{ k8s_e2e_app_name }}/0 test --wait=3h"
          - "  4. remove the charm:       {{ juju_k8s_cmd }} remove-application {{ k8s_e2e_app_name }} -m {{ k8s_juju_controller }}:{{ k8s_model }}"
          - "==========================================="

  handlers:
    - name: error handling
      debug:
        msg: "the playbook hit an error, check the output above"
