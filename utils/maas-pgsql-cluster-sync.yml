---

- name: Detect Primary node from Pacemaker
  hosts: maas_ha
  become: true
  tags: [check, cluster, verify, sync, resync]
  tasks:
    - name: Get cluster status from any online node
      command: crm_mon -1 -A
      register: cluster_status
      changed_when: false
      run_once: true
      tags: always

    - name: Display cluster status
      debug:
        msg: "{{ cluster_status.stdout_lines }}"
      run_once: true
      tags: check

    - name: Check if Primary is elected
      set_fact:
        primary_elected: "{{ 'Promoted:' in cluster_status.stdout or 'Masters:' in cluster_status.stdout or 'Master:' in cluster_status.stdout }}"
      run_once: true
      tags: always

    - name: Fail if no Primary
      fail:
        msg: "No Primary node elected. Check cluster status with 'crm_mon -1 -A'."
      when: not primary_elected
      run_once: true
      tags: always

    - name: Extract Primary node name from Pacemaker
      shell: |
        primary=$(crm_mon -1 | grep -E '(Promoted|Masters?):' | awk -F'[][]' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}' | head -1)
        if [ -z "$primary" ]; then
          primary=$(crm_mon -1 -A | grep 'pgsql-status.*PRI' | awk '/Node:/{print $3}' | head -1)
        fi
        if [ -z "$primary" ]; then
          echo "UNKNOWN"
          exit 1
        fi
        echo "$primary"
      register: primary_detection
      changed_when: false
      tags: always

    - name: Set current_primary and IP facts on ALL hosts
      set_fact:
        current_primary: "{{ primary_detection.stdout | trim }}"
      tags: always

    - name: Resolve primary IP from node_ips
      shell: "echo {{ node_ips[inventory_hostname] }}"
      register: _dummy
      changed_when: false
      when: false

    - name: Set current_primary_ip
      set_fact:
        current_primary_ip: "{% for k, v in node_ips.items() %}{% if k == current_primary %}{{ v }}{% endif %}{% endfor %}"
      tags: always

    - name: Fail if primary detection failed
      fail:
        msg: "Could not detect primary node from Pacemaker. Got: '{{ current_primary }}'"
      when: current_primary == 'UNKNOWN' or current_primary == ''
      run_once: true
      tags: always

    - name: Display detected Primary
      debug:
        msg: "Detected Primary: {{ current_primary }} ({{ current_primary_ip }})"
      run_once: true
      tags: always

- name: Verify PostgreSQL replication on standbys
  hosts: maas_ha
  become: true
  tags: [verify, replication]
  serial: 1
  tasks:
    - name: Skip if this is the primary node
      debug:
        msg: "Skipping {{ inventory_hostname }} - this is the primary node"
      when: inventory_hostname == current_primary
      tags: verify

    - name: Check if PostgreSQL is running
      command: pg_isready -h 127.0.0.1 -p 5432
      register: pg_ready
      changed_when: false
      failed_when: false
      when: inventory_hostname != current_primary
      tags: verify

    - name: Check replication status
      become_user: postgres
      command: psql -t -c "SELECT pg_is_in_recovery();"
      register: in_recovery
      changed_when: false
      failed_when: false
      when: inventory_hostname != current_primary
      tags: verify

    - name: Get standby state
      set_fact:
        pg_running: "{{ pg_ready.rc == 0 }}"
        is_standby: "{{ in_recovery.stdout | default('') | trim == 't' }}"
      when: inventory_hostname != current_primary
      tags: verify

    - name: Check streaming replication
      become_user: postgres
      command: psql -t -c "SELECT status FROM pg_stat_wal_receiver LIMIT 1;"
      register: wal_status
      changed_when: false
      failed_when: false
      when: inventory_hostname != current_primary
      tags: verify

    - name: Display standby status
      debug:
        msg: "{{ inventory_hostname }}: running={{ pg_running | default('N/A') }}, standby={{ is_standby | default('N/A') }}, wal_status={{ wal_status.stdout | default('') | trim }}"
      when: inventory_hostname != current_primary
      tags: verify

- name: Sync standby nodes if needed
  hosts: maas_ha
  become: true
  tags: [sync, resync]
  serial: 1
  vars:
    postgresql_version: "{{ version_matrix[ubuntu_version].postgresql_version }}"

  tasks:
    - name: Skip if this is the primary node
      debug:
        msg: "Skipping {{ inventory_hostname }} - this is the primary node ({{ current_primary }}), no sync needed"
      when: inventory_hostname == current_primary
      tags: sync

    - name: Check if resync is needed
      when: inventory_hostname != current_primary
      block:
        - name: Check if PostgreSQL is running on this standby
          command: pg_isready -h 127.0.0.1 -p 5432
          register: pg_ready
          changed_when: false
          failed_when: false
          tags: sync

        - name: Set pg_running fact
          set_fact:
            pg_running: "{{ pg_ready.rc == 0 }}"
          tags: sync

        - name: Check data directory exists and has content
          stat:
            path: /var/lib/postgresql/{{ postgresql_version }}/main/PG_VERSION
          register: pg_version_file
          tags: sync

        - name: Check data directory identifier
          become_user: postgres
          shell: /usr/lib/postgresql/{{ postgresql_version }}/bin/pg_controldata /var/lib/postgresql/{{ postgresql_version }}/main
          register: control_data
          changed_when: false
          failed_when: false
          when: pg_version_file.stat.exists
          tags: sync

        - name: Get primary identifier
          delegate_to: "{{ current_primary }}"
          become_user: postgres
          shell: /usr/lib/postgresql/{{ postgresql_version }}/bin/pg_controldata /var/lib/postgresql/{{ postgresql_version }}/main
          register: primary_control
          changed_when: false
          tags: sync

        - name: Extract database identifiers
          set_fact:
            local_dbid: "{{ control_data.stdout | regex_search('Database system identifier:\\s*(\\d+)', '\\1') | first }}"
            primary_dbid: "{{ primary_control.stdout | regex_search('Database system identifier:\\s*(\\d+)', '\\1') | first }}"
          when: pg_version_file.stat.exists and control_data.rc == 0 and primary_control.rc == 0
          tags: sync

        - name: Determine if resync needed (DB identifiers mismatch or data dir missing)
          set_fact:
            needs_resync: >-
              {{
                not pg_version_file.stat.exists
                or control_data.rc | default(1) != 0
                or (local_dbid | default('') != primary_dbid | default('none'))
              }}
          tags: sync

        - name: Check Pacemaker pgsql-data-status attribute
          delegate_to: "{{ current_primary }}"
          shell: "crm_mon -1 -A | grep -A5 'Node: {{ inventory_hostname }}' | grep 'pgsql-data-status' | awk '{print $NF}' | tr -d ' '"
          register: pacemaker_data_status
          changed_when: false
          ignore_errors: yes
          tags: sync

        - name: Check Pacemaker pgsql-status attribute
          delegate_to: "{{ current_primary }}"
          shell: "crm_mon -1 -A | grep -A5 'Node: {{ inventory_hostname }}' | grep 'pgsql-status' | awk '{print $NF}' | tr -d ' '"
          register: pacemaker_pgsql_status
          changed_when: false
          ignore_errors: yes
          tags: sync

        - name: Force resync if pgsql-data-status is DISCONNECT
          set_fact:
            needs_resync: true
          when: pacemaker_data_status.stdout | default('') == 'DISCONNECT'
          tags: sync

        - name: Force resync if pgsql-status is STOP or DISCONNECT and PostgreSQL is down
          set_fact:
            needs_resync: true
          when: pacemaker_pgsql_status.stdout | default('') in ['STOP', 'DISCONNECT'] and not pg_running
          tags: sync

        - name: Check if PGSQL.lock exists preventing Pacemaker start
          stat:
            path: /var/lib/pgsql/tmp/PGSQL.lock
          register: pgsql_lock_exists
          tags: sync

        - name: Force resync if PGSQL.lock exists and PostgreSQL is down
          set_fact:
            needs_resync: true
          when: pgsql_lock_exists.stat.exists and not pg_running
          tags: sync

        - name: Check if standby is streaming (no resync needed if healthy)
          set_fact:
            needs_resync: false
          when: >-
            pg_running and
            pacemaker_data_status.stdout | default('') is search('STREAMING') and
            pacemaker_pgsql_status.stdout | default('') is search('HS:')
          tags: sync

      rescue:
        - name: Mark for resync on error
          set_fact:
            needs_resync: true
          tags: sync

    - name: Display resync status
      debug:
        msg: "{{ inventory_hostname }}: needs_resync={{ needs_resync | default('skipped (primary)') }}"
      tags: sync

    - name: Perform resync
      when: (needs_resync | default(false)) and inventory_hostname != current_primary
      block:
        - name: Display resync starting
          debug:
            msg: "Starting resync of {{ inventory_hostname }} from primary {{ current_primary }} ({{ current_primary_ip }})"
          tags: sync

        - name: Ensure replication slot exists on primary
          delegate_to: "{{ current_primary }}"
          become_user: postgres
          shell: |
            slot_name="standby{{ groups['maas_ha'].index(inventory_hostname) }}"
            existing=$(psql -t -c "SELECT slot_name FROM pg_replication_slots WHERE slot_name = '${slot_name}';" | tr -d ' ')
            if [ "$existing" = "$slot_name" ]; then
              echo "slot ${slot_name} already exists"
              exit 0
            fi
            psql -c "SELECT pg_create_physical_replication_slot('${slot_name}');"
          register: slot_created
          changed_when: "'pg_create_physical_replication_slot' in slot_created.stdout"
          tags: sync

        - name: Cleanup Pacemaker resource BEFORE stopping PostgreSQL
          delegate_to: "{{ current_primary }}"
          command: crm resource cleanup pgsql {{ inventory_hostname }}
          ignore_errors: yes
          tags: sync

        - name: Wait for Pacemaker to process cleanup
          pause:
            seconds: 5
          tags: sync

        - name: Remove PGSQL.lock file BEFORE stopping PostgreSQL
          file:
            path: /var/lib/pgsql/tmp/PGSQL.lock
            state: absent
          ignore_errors: yes
          tags: sync

        - name: Stop PostgreSQL process if running
          shell: |
            su - postgres -c "/usr/lib/postgresql/{{ postgresql_version }}/bin/pg_ctl -D /var/lib/postgresql/{{ postgresql_version }}/main stop -m fast" 2>/dev/null || true
            systemctl stop postgresql 2>/dev/null || true
            sleep 2
            pkill -9 postgres 2>/dev/null || true
          tags: sync

        - name: Wait for PostgreSQL to fully stop
          wait_for:
            port: 5432
            host: "127.0.0.1"
            state: stopped
            timeout: 30
          ignore_errors: yes
          tags: sync

        - name: Remove old data directory completely
          file:
            path: /var/lib/postgresql/{{ postgresql_version }}/main
            state: absent
          tags: sync

        - name: Create new data directory
          file:
            path: /var/lib/postgresql/{{ postgresql_version }}/main
            state: directory
            owner: postgres
            group: postgres
            mode: '0700'
          tags: sync

        - name: Ensure pgsql tmp directory exists
          file:
            path: /var/lib/pgsql/tmp
            state: directory
            owner: postgres
            group: postgres
            mode: '0750'
          tags: sync

        - name: Ensure PostgreSQL log directory exists
          file:
            path: /var/log/postgresql
            state: directory
            owner: postgres
            group: postgres
            mode: '1775'
          tags: sync

        - name: Take base backup from Primary (use primary's direct IP, not VIP)
          become_user: postgres
          command: >
            pg_basebackup
            -h {{ current_primary_ip }}
            -p 5432
            -U postgres
            -D /var/lib/postgresql/{{ postgresql_version }}/main
            -Fp -Xs -P -R
          tags: sync

        - name: Remove recovery.conf if created by pg_basebackup (PostgreSQL 16+ uses standby.signal)
          file:
            path: /var/lib/postgresql/{{ postgresql_version }}/main/recovery.conf
            state: absent
          ignore_errors: yes
          tags: sync

        - name: Configure postgresql.auto.conf for standby
          copy:
            dest: /var/lib/postgresql/{{ postgresql_version }}/main/postgresql.auto.conf
            content: |
              primary_conninfo = 'host={{ pgsql_vip }} port=5432 user={{ replication_user }} password={{ replication_pass }} application_name={{ inventory_hostname }}'
              primary_slot_name = 'standby{{ groups["maas_ha"].index(inventory_hostname) }}'
            owner: postgres
            group: postgres
            mode: '0600'
          tags: sync

        - name: Ensure standby.signal exists (PostgreSQL 12+ recovery mechanism)
          file:
            path: /var/lib/postgresql/{{ postgresql_version }}/main/standby.signal
            state: touch
            owner: postgres
            group: postgres
            mode: '0600'
          tags: sync

        - name: Remove existing symlinks before recreating
          file:
            path: "/var/lib/postgresql/{{ postgresql_version }}/main/{{ item }}"
            state: absent
          loop:
            - postgresql.conf
            - pg_hba.conf
          ignore_errors: yes
          tags: sync

        - name: Create symlink to postgresql.conf in data directory
          file:
            src: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
            dest: "/var/lib/postgresql/{{ postgresql_version }}/main/postgresql.conf"
            state: link
            force: yes
            owner: postgres
          tags: sync

        - name: Create symlink to pg_hba.conf in data directory
          file:
            src: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
            dest: "/var/lib/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
            state: link
            force: yes
            owner: postgres
          tags: sync

        - name: Cleanup Pacemaker resource to let it rediscover the node
          delegate_to: "{{ current_primary }}"
          command: crm resource cleanup pgsql {{ inventory_hostname }}
          ignore_errors: yes
          tags: sync

        - name: Wait for Pacemaker to detect and start PostgreSQL
          pause:
            seconds: 20
          tags: sync

        - name: Check if PostgreSQL is running
          command: pg_isready -h 127.0.0.1 -p 5432
          register: pg_ready_after_cleanup
          changed_when: false
          failed_when: false
          tags: sync

        - name: Start PostgreSQL manually if Pacemaker hasn't started it
          become_user: postgres
          shell: |
            touch /var/log/postgresql/postgresql-{{ postgresql_version }}-ha.log
            /usr/lib/postgresql/{{ postgresql_version }}/bin/pg_ctl -D /var/lib/postgresql/{{ postgresql_version }}/main \
              -o '-c config_file=/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf' \
              -l /var/log/postgresql/postgresql-{{ postgresql_version }}-ha.log start
          when: pg_ready_after_cleanup.rc != 0
          ignore_errors: yes
          tags: sync

        - name: Wait for PostgreSQL to be ready
          wait_for:
            port: 5432
            host: "127.0.0.1"
            delay: 5
            timeout: 90
          tags: sync

        - name: Cleanup Pacemaker resource again after manual start
          delegate_to: "{{ current_primary }}"
          command: crm resource cleanup pgsql {{ inventory_hostname }}
          ignore_errors: yes
          when: pg_ready_after_cleanup.rc != 0
          tags: sync

    - name: Verify standby is in recovery
      become_user: postgres
      command: psql -t -c "SELECT pg_is_in_recovery();"
      register: verify_recovery
      retries: 10
      delay: 5
      until: verify_recovery.stdout | trim == 't'
      when: inventory_hostname != current_primary
      tags: sync

    - name: Display sync complete
      debug:
        msg: >-
          {{ inventory_hostname }} sync complete,
          in_recovery={{ verify_recovery.stdout | trim if inventory_hostname != current_primary else 'primary node (skipped)' }}
      tags: sync

- name: Final cluster verification
  hosts: maas_ha[0]
  become: true
  tags: [verify, final]
  tasks:
    - name: Wait for cluster to settle
      pause:
        seconds: 10
      tags: verify

    - name: Get final cluster status
      command: crm_mon -1 -A
      register: final_status
      changed_when: false
      tags: verify

    - name: Display final cluster status
      debug:
        msg: "{{ final_status.stdout_lines }}"
      tags: verify

    - name: Check all nodes are replicating
      shell: |
        crm_mon -1 -A | grep -E "pgsql-data-status.*STREAMING" | wc -l
      register: streaming_count
      changed_when: false
      tags: verify

    - name: Verify replication count
      debug:
        msg: "{{ streaming_count.stdout | trim }} nodes are streaming (expected: {{ groups['maas_ha'] | length - 1 }})"
      tags: verify

    - name: Test database connection via VIP
      become_user: postgres
      command: psql -h {{ pgsql_vip }} -c "SELECT version();"
      register: db_test
      changed_when: false
      tags: verify

    - name: Display connection test
      debug:
        msg: "Database connection via VIP successful"
      when: db_test.rc == 0
      tags: verify
