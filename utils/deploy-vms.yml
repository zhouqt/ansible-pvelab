---

- name: Commission and Deploy OpenStack VMs
  hosts: localhost
  connection: local
  tags: [deploy-vms]
  vars:
    all_vms: ["os-control-1", "os-control-2", "os-control-3", "os-compute-1", "os-compute-2"]
  tasks:
    - name: Add network interfaces to control VMs
      shell: |
        lxc config device add {{ item }} eth1 nic nictype=bridged parent=virbr2 name=eth1 --project maas-managed 2>/dev/null || echo "Interface may already exist"
        lxc config device add {{ item }} eth2 nic nictype=bridged parent=virbr3 name=eth2 --project maas-managed 2>/dev/null || echo "Interface may already exist"
      loop: ["os-control-1", "os-control-2", "os-control-3"]
      changed_when: "'added' in result.stdout"
      register: result

    - name: Add network interfaces to compute VMs
      shell: |
        lxc config device add {{ item }} eth1 nic nictype=bridged parent=virbr2 name=eth1 --project maas-managed 2>/dev/null || echo "Interface may already exist"
        lxc config device add {{ item }} eth2 nic nictype=bridged parent=virbr3 name=eth2 --project maas-managed 2>/dev/null || echo "Interface may already exist"
        lxc config device add {{ item }} eth3 nic nictype=bridged parent=virbr4 name=eth3 --project maas-managed 2>/dev/null || echo "Interface may already exist"
      loop: ["os-compute-1", "os-compute-2"]
      changed_when: "'added' in result.stdout"
      register: result

    - name: Enable nested VMX on compute VMs
      shell: |
        lxc config set {{ item }} raw.qemu="-cpu host" --project maas-managed 2>/dev/null || true
      loop: ["os-compute-1", "os-compute-2"]
      changed_when: false

    - name: Commission all VMs via MAAS CLI
      shell: |
        ssh root@192.168.122.10 "maas maas-admin machine commission \$(maas maas-admin machines read hostname={{ item }} | jq -r '.[].system_id')"
      loop: "{{ all_vms }}"
      register: commission_result
      changed_when: false

    - name: Wait for VMs to be Ready
      shell: |
        ssh root@192.168.122.10 "maas maas-admin machines read | jq -r '.[] | select(.hostname | startswith(\"os-\")) | select(.status_name == \"Ready\") | .hostname' | wc -l"
      register: ready_count
      until: ready_count.stdout | int >= 5
      retries: 60
      delay: 30
      changed_when: false

    - name: Deploy Ubuntu on all VMs
      shell: |
        ssh root@192.168.122.10 "maas maas-admin machine deploy \$(maas maas-admin machines read hostname={{ item }} | jq -r '.[].system_id') distro_series=jammy"
      loop: "{{ all_vms }}"
      register: deploy_result
      changed_when: false

    - name: Wait for VMs to be Deployed
      shell: |
        ssh root@192.168.122.10 "maas maas-admin machines read | jq -r '.[] | select(.hostname | startswith(\"os-\")) | select(.status_name == \"Deployed\") | .hostname' | wc -l"
      register: deployed_count
      until: deployed_count.stdout | int >= 5
      retries: 90
      delay: 30
      changed_when: false

    - name: Get deployed VM IP addresses
      shell: |
        ssh root@192.168.122.10 "maas maas-admin machines read hostname={{ item }} | jq -r '.[].ip_addresses[0]'"
      loop: "{{ all_vms }}"
      register: vm_ips
      changed_when: false

    - name: Display deployed VM information
      debug:
        msg: |
          Deployed VMs:
          {% for result in vm_ips.results %}
          {{ result.item }}: {{ result.stdout }}
          {% endfor %}