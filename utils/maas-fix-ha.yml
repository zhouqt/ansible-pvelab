---

- name: Diagnose pgsql-status mismatch
  hosts: maas_ha[0]
  become: true
  tags: [diagnose]
  tasks:
    - name: Get cluster status with attributes
      command: crm_mon -1 -A
      register: cluster_status
      changed_when: false
      tags: diagnose

    - name: Find nodes with pgsql-status STOP
      shell: |
        crm_mon -1 -A | grep -B1 "pgsql-status.*STOP" | grep "Node:" | awk '{print $3}' | tr -d ':'
      register: stop_nodes
      changed_when: false
      tags: diagnose

    - name: Find nodes with DISCONNECT data status
      shell: |
        crm_mon -1 -A | grep -B1 "pgsql-data-status.*DISCONNECT" | grep "Node:" | awk '{print $3}' | tr -d ':'
      register: disconnect_nodes
      changed_when: false
      tags: diagnose

    - name: Check failed resource actions
      shell: |
        crm_mon -1 -A | grep -A5 "Failed Resource Actions" || echo "No failed actions"
      register: failed_actions
      changed_when: false
      tags: diagnose

    - name: Display diagnosis
      debug:
        msg:
          - "=== Nodes with STOP status (need fix): {{ stop_nodes.stdout_lines | default([]) }} ==="
          - "=== Nodes with DISCONNECT (need resync): {{ disconnect_nodes.stdout_lines | default([]) }} ==="
          - "=== Failed Actions ==="
          - "{{ failed_actions.stdout_lines | default(['None']) }}"
      tags: diagnose

    - name: Set facts for fix targets
      set_fact:
        nodes_to_fix: "{{ stop_nodes.stdout_lines | default([]) }}"
        nodes_to_resync: "{{ disconnect_nodes.stdout_lines | default([]) }}"
      tags: diagnose

- name: Fix PostgreSQL systemd vs Pacemaker conflict
  hosts: maas_ha
  become: true
  tags: [fix, postgresql]
  tasks:
    - name: Check if this node needs fix
      delegate_to: "{{ groups['maas_ha'][0] }}"
      shell: crm_mon -1 -A | grep "{{ inventory_hostname }}" | grep "pgsql-status.*STOP"
      register: needs_fix
      changed_when: false
      failed_when: false
      tags: postgresql

    - name: Stop systemd PostgreSQL (critical for Pacemaker to manage)
      systemd:
        name: postgresql
        state: stopped
      when: needs_fix.rc == 0
      tags: postgresql

    - name: Disable systemd PostgreSQL (prevent auto-start conflict)
      systemd:
        name: postgresql
        enabled: no
      when: needs_fix.rc == 0
      tags: postgresql

    - name: Remove PGSQL.lock file if exists
      file:
        path: /var/lib/pgsql/tmp/PGSQL.lock
        state: absent
      ignore_errors: yes
      tags: postgresql

- name: Cleanup Pacemaker failed resources
  hosts: maas_ha[0]
  become: true
  tags: [fix, pacemaker]
  tasks:
    - name: Cleanup pgsql resource for specific nodes
      command: pcs resource cleanup ms_pgsql {{ item }}
      loop: "{{ nodes_to_fix | default([]) }}"
      register: cleanup_result
      ignore_errors: yes
      when: nodes_to_fix | length > 0
      tags: pacemaker

    - name: General cleanup if no specific nodes
      command: pcs resource cleanup
      register: general_cleanup
      ignore_errors: yes
      when: nodes_to_fix | default([]) | length == 0
      tags: pacemaker

    - name: Refresh Pacemaker resources
      command: pcs resource refresh
      ignore_errors: yes
      tags: pacemaker

    - name: Wait for cluster to settle
      pause:
        seconds: 30
      tags: pacemaker

- name: Verify pgsql-status after fix
  hosts: maas_ha[0]
  become: true
  tags: [verify, pgsql]
  tasks:
    - name: Get updated cluster status
      command: crm_mon -1 -A
      register: updated_status
      changed_when: false
      tags: pgsql

    - name: Check remaining STOP status nodes
      shell: |
        crm_mon -1 -A | grep -E "pgsql-status.*STOP" | wc -l
      register: remaining_stop
      changed_when: false
      tags: pgsql

    - name: Check DISCONNECT nodes
      shell: |
        crm_mon -1 -A | grep -E "pgsql-data-status.*DISCONNECT" | awk '{print $2}' | tr -d ':'
      register: still_disconnected
      changed_when: false
      tags: pgsql

    - name: Display verification result
      debug:
        msg:
          - "=== Updated Cluster Status ==="
          - "{{ updated_status.stdout_lines }}"
          - ""
          - "=== Nodes still with STOP status: {{ remaining_stop.stdout }} ==="
          - "=== Nodes still DISCONNECT: {{ still_disconnected.stdout_lines | default([]) }} ==="
      tags: pgsql

    - name: Alert if nodes need resync
      debug:
        msg:
          - "WARNING: {{ still_disconnected.stdout_lines | length }} nodes have DISCONNECT status"
          - "Run pgsql-cluster-sync.yml to resync:"
          - "ansible-playbook pgsql-cluster-sync.yml"
      when: still_disconnected.stdout_lines | default([]) | length > 0
      tags: pgsql

- name: Create PostgreSQL config symlinks for DISCONNECT nodes
  hosts: maas_ha
  become: true
  tags: [fix, config]
  tasks:
    - name: Check if this node is disconnected
      delegate_to: "{{ groups['maas_ha'][0] }}"
      shell: crm_mon -1 -A | grep "{{ inventory_hostname }}" | grep "pgsql-data-status.*DISCONNECT"
      register: is_disconnected
      changed_when: false
      failed_when: false
      tags: config

    - name: Create symlink to postgresql.conf in data directory
      file:
        src: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
        dest: "/var/lib/postgresql/{{ postgresql_version }}/main/postgresql.conf"
        state: link
        force: yes
      when: is_disconnected.rc == 0
      tags: config

    - name: Create symlink to pg_hba.conf in data directory
      file:
        src: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
        dest: "/var/lib/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
        state: link
        force: yes
      when: is_disconnected.rc == 0
      tags: config

- name: Hold MAAS snap version
  hosts: maas_ha
  become: true
  tags: [fix, snap]
  tasks:
    - name: Hold MAAS snap to prevent auto-upgrade (newer snapd)
      command: snap hold maas
      changed_when: false
      ignore_errors: yes
      register: snap_hold_result
      tags: snap

    - name: Hold MAAS snap to prevent auto-upgrade (older snapd fallback)
      command: snap set maas refresh.held=true
      changed_when: false
      when: snap_hold_result is failed
      ignore_errors: yes
      tags: snap

    - name: Verify MAAS snap status
      command: snap info maas
      register: snap_info
      changed_when: false
      tags: snap

    - name: Display snap status
      debug:
        msg: "{{ snap_info.stdout_lines | select('search', 'held|refresh') | list | join(', ') | default('MAAS snap info not available') }}"
      tags: snap

- name: Restart MAAS services
  hosts: maas_ha
  become: true
  tags: [fix, maas]
  tasks:
    - name: Restart MAAS snap
      command: snap restart maas
      tags: maas

    - name: Wait for MAAS API to be ready
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 5240
        delay: 15
        timeout: 120
      tags: maas

- name: Final cluster verification
  hosts: maas_ha[0]
  become: true
  tags: [verify]
  tasks:
    - name: Check Pacemaker resources
      command: pcs status resources
      register: pcs_status
      changed_when: false
      tags: verify

    - name: Check PostgreSQL replication from Primary
      become_user: postgres
      command: psql -h {{ pgsql_vip }} -t -c "SELECT client_addr, state, sync_state FROM pg_stat_replication;"
      register: replication_status
      changed_when: false
      ignore_errors: yes
      tags: verify

    - name: Check MAAS API on all nodes
      uri:
        url: "http://{{ hostvars[item]['ansible_host'] }}:5240/MAAS/api/2.0/version/"
        method: GET
        status_code: 200
        timeout: 10
      loop: "{{ groups['maas_ha'] }}"
      register: maas_api_check
      ignore_errors: yes
      tags: verify

    - name: Display final status
      debug:
        msg:
          - "=== Pacemaker Resources ==="
          - "{{ pcs_status.stdout_lines }}"
          - ""
          - "=== PostgreSQL Replication ==="
          - "{{ replication_status.stdout_lines | default(['No replication']) }}"
          - ""
          - "=== MAAS API Status ==="
          - "{% for result in maas_api_check.results %}{{ result.item }}: {{ result.status | default('FAILED') }}{% if not loop.last %}, {% endif %}{% endfor %}"
      tags: verify