       2b. Snap apparmor: {{ apparmor_fix.stdout | default('Skipped') | regex_replace('\n', ', ') }}
        3. Containers started: {{ start_result.stdout_lines | default(['None']) | length }} operations
        4. OSD reattach: {{ osd_reattach.stdout | default('Skipped') | regex_replace('\n', ', ') }}
        5. LXCFS fix: {{ 'Applied' if (lxcfs_fix.stdout | default('')) is search('Fixed') else 'Not needed' }}
        6. Static IPs: {{ static_ip_check.stdout | default('Unknown') }}
        7. Vault: {{ 'Unsealed' if (vault_sealed.stdout | default('true')) == 'false' else ('Just unsealed' if vault_unseal is changed else 'Sealed/Unavailable') }}
        8. MySQL cluster: {{ mysql_cluster_health.stdout | default('Unknown') }} {{ '(rebooted+rejoined)' if mysql_reboot is changed else '' }}
       9.0. eth4 NIC ensured: {{ eth4_ensure.stdout | default('Skipped') | regex_replace('\n', ', ') }}
        9. br-ex IP migration: {{ 'Done' if (brex_migrate.stdout | default('')) is search('FIXED') else 'Not needed' }}
       9b. OVN restart: {{ ovn_restart.stdout | default('Skipped') | regex_replace('\n', ', ') }}
       10. Metadata patch: {{ metadata_patch_result.stdout | default('Skipped') | regex_replace('\n', ', ') }}
       10b. Metadata agent restart: {{ metadata_agent_restart.stdout | default('Skipped') | regex_replace('\n', ', ') }}
       11. Ceph OSD: {{ osd_activate.stdout | default('Skipped') | regex_replace('\n', ', ') }} {{ '(fallback)' if osd_activate_fallback is changed else '' }}
       11b. Ceph cluster_addr fix: {{ osd_cluster_addr_fix.stdout | default('Skipped') | regex_replace('\n', ', ') }}
       11c. Ceph health (action): {{ ceph_health_action.stdout_lines | default(['N/A']) | join(' | ') }}
       11d. Ceph health (cli): {{ ceph_status_check.stdout_lines | default(['N/A']) | select('match', '^(Health|PGs|HEALTH_|active\\+clean|peering|down|osds?:)') | list | join(' / ') }}
       12. iSCSI cinder-native: {{ 'Restored' if iscsi_storage_check.stat.exists | default(false) else 'N/A (no iSCSI storage)' }}
       13-14. Service verification + error resolution
       13b. End-to-end VM smoke test: {{ recovery_smoke_result | default('Not run') }}
       15. LMA Nagios: {{ nagios_route_fix.stdout | default('Skipped') | regex_replace('\n', ', ') }}
       16. NRPE ack-reboot: {{ ack_reboot_results.results | default([]) | length }} units acknowledged

      Juju Application Status:
      {{ juju_app_status.stdout | default('Unable to get status') }}

      OpenStack API: {{ 'Working' if os_token.rc == 0 else 'Not accessible' }}

      Hypervisors:
      {{ hypervisor_list.stdout | default('Unable to list') }}

      Error Units Resolved: {{ error_units.stdout_lines | default([]) | length }}

