---
- name: Switch to OpenStack model
  shell: "{{ juju_openstack_cmd }} switch {{ juju_controller_name }}:admin/{{ juju_openstack_model }}"
  changed_when: false

- name: Get current OVN chassis bridge-interface-mappings
  shell: "{{ juju_openstack_cmd }} config ovn-chassis bridge-interface-mappings"
  register: current_bridge_mappings
  changed_when: false

- name: Discover virbr1 NIC name on first compute node
  shell: |
    vm_ip=$(lxc list {{ compute_vm_names[0] }} --project {{ lxd_project }} --format json 2>/dev/null | \
            jq -r '[.[].state.network | to_entries[] | select(.key != "lo") | .value.addresses[] | select(.family=="inet" and (.address | startswith("192.168.165.")))] | .[0].address')
    ssh -o StrictHostKeyChecking=no ubuntu@$vm_ip bash -s << 'SCRIPT'
    ip -4 -o addr show | grep '192\.168\.165\.' | awk '{print $2}' | head -1
    SCRIPT
  register: virbr1_nic_name
  changed_when: false

- name: Display discovered virbr1 NIC name
  debug:
    msg: "virbr1 NIC on compute nodes: {{ virbr1_nic_name.stdout }}"

- name: Update OVN chassis bridge-interface-mappings (add br-mgmt)
  shell: |
    CURRENT="{{ current_bridge_mappings.stdout }}"
    if echo "$CURRENT" | grep -q "{{ mgmt_net.ovs_bridge }}"; then
      echo "br-mgmt already configured: $CURRENT"
    else
      NEW="$CURRENT {{ mgmt_net.ovs_bridge }}:{{ virbr1_nic_name.stdout }}"
      {{ juju_openstack_cmd }} config ovn-chassis bridge-interface-mappings="$NEW"
      echo "Updated bridge-interface-mappings to: $NEW"
    fi
  register: update_bridge_mappings
  changed_when: "'Updated' in update_bridge_mappings.stdout"

- name: Get current neutron-api flat-network-providers
  shell: "{{ juju_openstack_cmd }} config neutron-api flat-network-providers"
  register: current_flat_providers
  changed_when: false

- name: Update neutron-api flat-network-providers (add physnet2)
  shell: |
    CURRENT="{{ current_flat_providers.stdout }}"
    if echo "$CURRENT" | grep -q "{{ mgmt_net.physical_network }}"; then
      echo "{{ mgmt_net.physical_network }} already in flat-network-providers"
    else
      NEW="$CURRENT {{ mgmt_net.physical_network }}"
      {{ juju_openstack_cmd }} config neutron-api flat-network-providers="$NEW"
      echo "Updated flat-network-providers to: $NEW"
    fi
  register: update_flat_providers
  changed_when: "'Updated' in update_flat_providers.stdout"

- name: Wait for OVN chassis to reconfigure
  pause:
    seconds: 60
  when: update_bridge_mappings.changed or update_flat_providers.changed

- name: Get compute VM management IPs
  shell: |
    for vm in {{ compute_vm_names | join(' ') }}; do
      ip=$(lxc list $vm --project {{ lxd_project }} --format json 2>/dev/null | \
           jq -r '[.[].state.network | to_entries[] | select(.key != "lo") | .value.addresses[] | select(.family=="inet" and (.address | startswith("192.168.165.")))] | .[0].address' 2>/dev/null)
      echo "$vm:$ip"
    done
  register: compute_mgmt_ips
  changed_when: false

- name: Migrate IP from virbr1 NIC to br-mgmt on compute nodes
  shell: |
    vm_ip=$(echo "{{ item }}" | cut -d: -f2)
    [ -z "$vm_ip" ] && exit 0
    ssh -o StrictHostKeyChecking=no ubuntu@$vm_ip bash -s << 'SCRIPT'
    VIRBR1_IFACE=$(ip -4 -o addr show | grep '192\.168\.165\.' | awk '{print $2}' | head -1)
    BR_MGMT="{{ mgmt_net.ovs_bridge }}"

    BR_IP=$(ip -4 -o addr show $BR_MGMT 2>/dev/null | awk '{print $4}' | head -1)
    if [ -n "$BR_IP" ]; then
      echo "br-mgmt already has IP $BR_IP on $(hostname)"
      exit 0
    fi

    if ovs-vsctl port-to-br $VIRBR1_IFACE 2>/dev/null | grep -q .; then
      CURRENT_IP=$(ip -4 -o addr show $VIRBR1_IFACE 2>/dev/null | awk '{print $4}' | head -1)
      if [ -n "$CURRENT_IP" ]; then
        echo "Moving $CURRENT_IP from $VIRBR1_IFACE to $BR_MGMT on $(hostname)"
        sudo ip addr del $CURRENT_IP dev $VIRBR1_IFACE 2>/dev/null || true
        sudo ip addr add $CURRENT_IP dev $BR_MGMT 2>/dev/null || true
        sudo ip link set $BR_MGMT up
      fi
    else
      echo "$VIRBR1_IFACE not yet in OVS bridge, skipping IP migration"
    fi
    SCRIPT
  loop: "{{ compute_mgmt_ips.stdout_lines }}"
  changed_when: true
  ignore_errors: true

- name: Persist br-mgmt config via netplan on compute nodes
  shell: |
    vm_ip=$(echo "{{ item }}" | cut -d: -f2)
    [ -z "$vm_ip" ] && exit 0
    VIRBR1_NIC="{{ virbr1_nic_name.stdout }}"
    OVS_BR="{{ mgmt_net.ovs_bridge }}"
    ssh -o StrictHostKeyChecking=no ubuntu@$vm_ip bash -s -- "$VIRBR1_NIC" "$OVS_BR" << 'SCRIPT'
    VIRBR1_IFACE=$1
    BR_MGMT=$2
    MGMT_IP=$(ip -4 -o addr show $BR_MGMT 2>/dev/null | awk '{print $4}' | head -1)
    if [ -z "$MGMT_IP" ]; then
      MGMT_IP=$(ip -4 -o addr show $VIRBR1_IFACE 2>/dev/null | awk '{print $4}' | head -1)
    fi
    [ -z "$MGMT_IP" ] && exit 0

    if grep -q "$VIRBR1_IFACE" /etc/netplan/50-cloud-init.yaml 2>/dev/null; then
      sudo sed -i "/$VIRBR1_IFACE/,/dhcp4/s/dhcp4: true/dhcp4: false/" /etc/netplan/50-cloud-init.yaml 2>/dev/null || true
    fi

    sudo tee /etc/netplan/60-br-mgmt.yaml << EOF
    network:
      version: 2
      bridges:
        $BR_MGMT:
          addresses: [$MGMT_IP]
          parameters:
            stp: false
    EOF
    sudo chmod 600 /etc/netplan/60-br-mgmt.yaml
    echo "Netplan updated for $BR_MGMT with $MGMT_IP on $(hostname)"
    SCRIPT
  loop: "{{ compute_mgmt_ips.stdout_lines }}"
  changed_when: true
  ignore_errors: true

- name: Check if mgmt-net already exists
  shell: bash -c 'source {{ project_dir }}/credentials/admin-openrc.sh && openstack network show {{ mgmt_net.name }} -f value -c id 2>/dev/null' || echo "not_found"
  register: mgmt_net_check
  changed_when: false

- name: Create mgmt-net provider network
  shell: |
    bash -c 'source {{ project_dir }}/credentials/admin-openrc.sh && \
      openstack network create {{ mgmt_net.name }} \
        --provider-network-type flat \
        --provider-physical-network {{ mgmt_net.physical_network }} \
        --share'
  when: mgmt_net_check.stdout == "not_found"
  register: create_mgmt_net
  changed_when: create_mgmt_net.rc == 0

- name: Create mgmt-subnet
  shell: |
    bash -c 'source {{ project_dir }}/credentials/admin-openrc.sh && \
      openstack subnet create {{ mgmt_net.subnet_name }} \
        --network {{ mgmt_net.name }} \
        --subnet-range {{ mgmt_net.cidr }} \
        --gateway {{ mgmt_net.gateway }} \
        --allocation-pool start={{ mgmt_net.allocation_pool_start }},end={{ mgmt_net.allocation_pool_end }} \
        --dhcp'
  when: mgmt_net_check.stdout == "not_found"
  register: create_mgmt_subnet
  changed_when: create_mgmt_subnet.rc == 0

- name: Display mgmt-net summary
  debug:
    msg: |
      Management Network Configuration Complete
      Network: {{ mgmt_net.name }} ({{ mgmt_net.physical_network }})
      Subnet: {{ mgmt_net.cidr }}, pool {{ mgmt_net.allocation_pool_start }}-{{ mgmt_net.allocation_pool_end }}
      OVS Bridge: {{ mgmt_net.ovs_bridge }}

