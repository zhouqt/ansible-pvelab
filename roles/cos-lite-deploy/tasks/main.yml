---

- name: Set StorageClass as default
  shell: |
    ssh -o StrictHostKeyChecking=no ubuntu@{{ k8s_control_plane_ip }} \
      kubectl patch sc {{ cos_storage_class }} -p \
      '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  register: sc_patch
  changed_when: "'patched' in sc_patch.stdout"
  failed_when: false

- name: Allow NodePort range from Octavia subnet in K8s default security group
  shell: |
    bash {{ k8s_openstack_rc | default(project_dir + '/credentials/admin-openrc-lxd-openstack.sh') }} >/dev/null 2>&1
    SG_ID=$(openstack security group list --project admin -f value -c ID -c Name | grep default | head -1 | awk '{print $1}')
    openstack security group rule create "$SG_ID" \
      --protocol tcp --dst-port 30000:32767 \
      --remote-ip {{ cos_octavia_subnet | default('10.0.0.0/24') }} \
      --ingress 2>/dev/null || true
  changed_when: false

- name: Check if K8s cloud already exists
  shell: "{{ juju_k8s_cmd }} clouds --controller {{ cos_controller }} --format json"
  register: juju_clouds
  changed_when: false

- name: Add K8s cloud to Juju
  shell: >
    {{ juju_k8s_cmd }} add-k8s {{ cos_cloud_name }}
    --controller {{ cos_controller }}
    --storage {{ cos_storage_class }}
  when: "cos_cloud_name not in juju_clouds.stdout"

- name: Check if cos-lite model exists
  shell: "{{ juju_k8s_cmd }} models -m {{ cos_controller }}: --format json"
  register: juju_models
  changed_when: false

- name: Create cos-lite model
  shell: "{{ juju_k8s_cmd }} add-model {{ cos_model_name }} {{ cos_cloud_name }} -c {{ cos_controller }}"
  when: "cos_model_name not in juju_models.stdout"

- name: Check if COS apps already deployed
  shell: "{{ juju_k8s_cmd }} status -m {{ cos_controller }}:{{ cos_model_name }} --format json"
  register: cos_status
  changed_when: false
  failed_when: false

- name: Deploy cos-lite bundle
  shell: "{{ juju_k8s_cmd }} deploy cos-lite --trust --channel {{ cos_channel }} -m {{ cos_controller }}:{{ cos_model_name }}"
  when: "cos_status.rc != 0 or 'prometheus' not in cos_status.stdout"

- name: Configure Traefik external hostname
  shell: |
    {{ juju_k8s_cmd }} config -m {{ cos_controller }}:{{ cos_model_name }} traefik external_hostname={{ cos_traefik_hostname | default('cos-lite') }}
  changed_when: false
  failed_when: false

- name: Wait for COS Lite to settle (up to 15 min)
  shell: |
    {{ juju_k8s_cmd }} wait-for model {{ cos_model_name }} -m {{ cos_controller }}:{{ cos_model_name }} \
      --query='life=="alive" && status=="available"' --timeout 900s 2>/dev/null || \
    {{ juju_k8s_cmd }} status -m {{ cos_controller }}:{{ cos_model_name }} --format short
  register: cos_wait
  changed_when: false
  failed_when: false

- name: Display COS status
  shell: "{{ juju_k8s_cmd }} status -m {{ cos_controller }}:{{ cos_model_name }} --format short"
  register: cos_final_status
  changed_when: false

- name: Show COS status
  debug:
    msg: "{{ cos_final_status.stdout }}"

- name: Create COS offers
  shell: |
    {{ juju_k8s_cmd }} switch {{ cos_controller }}:{{ cos_model_name }}
    {{ juju_k8s_cmd }} offer prometheus:receive-remote-write 2>/dev/null || true
    {{ juju_k8s_cmd }} offer loki:logging 2>/dev/null || true
    {{ juju_k8s_cmd }} offer grafana:grafana-dashboard 2>/dev/null || true
  changed_when: false

- name: Check if grafana-agent already deployed in K8s model
  shell: "{{ juju_k8s_cmd }} status -m {{ cos_controller }}:{{ cos_k8s_model }} grafana-agent --format json 2>/dev/null"
  register: ga_check
  changed_when: false
  failed_when: false

- name: Deploy grafana-agent in K8s model
  shell: "{{ juju_k8s_cmd }} deploy grafana-agent --base ubuntu@22.04 -m {{ cos_controller }}:{{ cos_k8s_model }}"
  when: ga_check.rc != 0

- name: Consume COS offers in K8s model
  shell: |
    {{ juju_k8s_cmd }} switch {{ cos_controller }}:{{ cos_k8s_model }}
    {{ juju_k8s_cmd }} consume {{ cos_controller }}:admin/{{ cos_model_name }}.prometheus prometheus-cos 2>/dev/null || true
    {{ juju_k8s_cmd }} consume {{ cos_controller }}:admin/{{ cos_model_name }}.loki loki-cos 2>/dev/null || true
    {{ juju_k8s_cmd }} consume {{ cos_controller }}:admin/{{ cos_model_name }}.grafana grafana-cos 2>/dev/null || true
  changed_when: false

- name: Integrate grafana-agent with COS (CMR)
  shell: |
    {{ juju_k8s_cmd }} switch {{ cos_controller }}:{{ cos_k8s_model }}
    {{ juju_k8s_cmd }} integrate grafana-agent prometheus-cos 2>/dev/null || true
    {{ juju_k8s_cmd }} integrate grafana-agent loki-cos 2>/dev/null || true
    {{ juju_k8s_cmd }} integrate grafana-agent grafana-cos 2>/dev/null || true
  changed_when: false

- name: Integrate kubernetes-control-plane with grafana-agent
  shell: "{{ juju_k8s_cmd }} integrate -m {{ cos_controller }}:{{ cos_k8s_model }} kubernetes-control-plane:cos-agent grafana-agent 2>/dev/null || true"
  changed_when: false

- name: Integrate kubernetes-worker with grafana-agent
  shell: "{{ juju_k8s_cmd }} integrate -m {{ cos_controller }}:{{ cos_k8s_model }} kubernetes-worker:cos-agent grafana-agent 2>/dev/null || true"
  changed_when: false

- name: Get Traefik NodePort
  shell: |
    ssh -o StrictHostKeyChecking=no ubuntu@{{ k8s_control_plane_ip }} \
      kubectl get svc -n {{ cos_model_name }} traefik-lb -o jsonpath='{.spec.ports[?(@.name=="traefik")].nodePort}' 2>/dev/null
  register: traefik_nodeport
  changed_when: false
  failed_when: false

- name: Get Grafana admin password
  shell: "{{ juju_k8s_cmd }} run -m {{ cos_controller }}:{{ cos_model_name }} grafana/0 get-admin-password 2>/dev/null"
  register: grafana_password
  changed_when: false
  failed_when: false

- name: Display COS Lite access info
  debug:
    msg: |
      ========================================
      COS Lite Observability Stack
      ========================================

      Access via SSH tunnel:
        ssh -L 8080:localhost:{{ traefik_nodeport.stdout | default('32747') }} ubuntu@{{ k8s_control_plane_ip }}
        Then open: http://localhost:8080/cos-lite-grafana

      Grafana user: admin
      {{ grafana_password.stdout | default('Password: (run: juju-36 run -m cos-lite grafana/0 get-admin-password)') }}

      Paths:
        Grafana:      /cos-lite-grafana
        Prometheus:   /cos-lite-prometheus-0
        Alertmanager: /cos-lite-alertmanager
        Catalogue:    /cos-lite-catalogue
