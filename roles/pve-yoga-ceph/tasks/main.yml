---

- name: Define the isolated Juju 3.x command prefix
  ansible.builtin.set_fact:
    pve_yoga_juju_cmd: "JUJU_DATA={{ pve_yoga_juju_data }} {{ pve_yoga_juju_bin }}"
    pve_yoga_model: "{{ pve_yoga_controller_name }}:{{ pve_yoga_model_name }}"

- name: Read OpenStack Juju status before Ceph OSD setup
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} status -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_ceph_status
  changed_when: false

- name: Require ceph-mon and ceph-osd applications to be deployed
  ansible.builtin.assert:
    that:
      - pve_yoga_ceph_status.rc == 0
      - "'ceph-mon' in (pve_yoga_ceph_status.stdout | from_json).applications"
      - "'ceph-osd' in (pve_yoga_ceph_status.stdout | from_json).applications"
    fail_msg: "run --tags pve-yoga-control-plane to deploy ceph-mon / ceph-osd first, then run the Ceph role."

- name: Copy OSD helper scripts to PVE host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/pve/scripts/{{ item }}"
    dest: "/root/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - yoga-setup-osd-lv.sh
    - mk-osd.sh
    - yoga-osd-lvm.conf
    - ceph-osd-boot-activate.sh
    - ceph-osd-activate.service
    - ceph-osd-charm-lxc-patch.py

- name: Refuse to run while any OSD CT conf still carries the old loop block
  ansible.builtin.shell: |
    set -euo pipefail
    bad=""
    for vmid in {{ pve_yoga_osd_vmids | join(' ') }}; do
      conf="/etc/pve/lxc/$vmid.conf"
      [ -e "$conf" ] || continue
      grep -q '# yoga-osd-loop-' "$conf" && bad="$bad $vmid"
    done
    if [ -n "$bad" ]; then
      echo "OSD-LOOP-RESIDUE:$bad"
      exit 1
    fi
    echo "OSD-LOOP-CLEAN"
  args:
    executable: /bin/bash
  register: pve_yoga_ceph_loop_residue
  changed_when: false
  failed_when: "'OSD-LOOP-CLEAN' not in pve_yoga_ceph_loop_residue.stdout"

- name: Read the host thin pool utilisation before creating OSD volumes
  ansible.builtin.command:
    argv:
      - lvs
      - --noheadings
      - -o
      - lv_size,data_percent,metadata_percent
      - --units
      - g
      - "{{ pve_yoga_osd_thinpool }}"
  register: pve_yoga_ceph_pool_usage
  changed_when: false

- name: Require enough thin pool headroom for this environment
  ansible.builtin.assert:
    that:
      - (pve_yoga_ceph_pool_usage.stdout.split()[1] | float) < (pve_yoga_osd_thinpool_max_data_percent | float)
    fail_msg: >-
      thin pool {{ pve_yoga_osd_thinpool }} usage
      {{ pve_yoga_ceph_pool_usage.stdout.split()[1] }}% has reached the cap
      {{ pve_yoga_osd_thinpool_max_data_percent }}%({{ pve_yoga_ceph_pool_usage.stdout | trim }}).
      tear down unused envs first (--tags pve-yoga-teardown) to free pool space, or raise
      pve_yoga_osd_thinpool_max_data_percent.

- name: Build the vmid:osdindex mapping
  ansible.builtin.set_fact:
    pve_yoga_osd_lv_spec: >-
      {{ pve_yoga_osd_vmids
         | zip(range(0, pve_yoga_osd_vmids | length))
         | map('join', ':') | join(' ') }}

- name: Set up host thin-LV OSD devices and CT device mounts
  ansible.builtin.command: "bash /root/yoga-setup-osd-lv.sh '{{ pve_yoga_osd_lv_spec }}'"
  environment:
    OSD_SIZE_MB: "{{ pve_yoga_osd_size_mb }}"
    OSD_LV_PREFIX: "{{ pve_yoga_osd_lv_prefix }}"
    OSD_THINPOOL: "{{ pve_yoga_osd_thinpool }}"
    OSD_THINPOOL_MAX_DATA_PERCENT: "{{ pve_yoga_osd_thinpool_max_data_percent }}"
  register: pve_yoga_ceph_lv_setup
  changed_when: "'YOGA-SETUP-OSD-LV-DONE' in pve_yoga_ceph_lv_setup.stdout"

- name: Start (or restart) OSD CTs so the new device mount and cgroup rules apply
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "$(pct status {{ item }})" = "status: stopped" ]; then
      pct start {{ item }}
    else
      pct reboot {{ item }}
    fi
  args:
    executable: /bin/bash
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  when: pve_yoga_ceph_lv_setup.changed

- name: Wait for OSD CTs to come back
  ansible.builtin.command: "pct exec {{ item }} -- systemctl is-system-running"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_yoga_ceph_ct_ready
  until: pve_yoga_ceph_ct_ready.stdout | trim in ['running', 'degraded']
  failed_when: pve_yoga_ceph_ct_ready.stdout | trim not in ['running', 'degraded']
  retries: 30
  delay: 5
  changed_when: false

- name: Recover the control plane disturbed by the OSD CT restart
  ansible.builtin.include_role:
    name: pve-yoga-recovery
    tasks_from: mysql-rebuild.yml

- name: Restore and unseal the yoga Vault if the OSD CT restart broke it
  ansible.builtin.include_role:
    name: pve-yoga-recovery
    tasks_from: vault-unseal.yml

- name: Resolve units left in error state by the OSD CT restart
  ansible.builtin.include_role:
    name: pve-yoga-recovery
    tasks_from: resolve-error-units.yml

- name: Require /dev/osd-block inside every OSD CT
  ansible.builtin.command: "pct exec {{ item }} -- test -b /dev/osd-block"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  changed_when: false

- name: Require the device-mapper control node inside every OSD CT
  ansible.builtin.command: "pct exec {{ item }} -- test -c /dev/mapper/control"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  changed_when: false

- name: Install a udev-free lvm.conf inside every OSD CT
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ item }}"
      - /root/yoga-osd-lvm.conf
      - /etc/lvm/lvm.conf
      - --perms
      - "0644"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"

- name: Install the Ceph OSD boot-activation unit inside every OSD CT
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item }}
    pct push "$vmid" /root/ceph-osd-boot-activate.sh /usr/local/sbin/ceph-osd-boot-activate.sh --perms 0755
    pct push "$vmid" /root/ceph-osd-activate.service /etc/systemd/system/ceph-osd-activate.service --perms 0644
    pct exec "$vmid" -- systemctl daemon-reload
    pct exec "$vmid" -- systemctl enable ceph-osd-activate.service
  args:
    executable: /bin/bash
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  changed_when: false

- name: Re-activate any existing Ceph OSDs after the CT (re)start
  ansible.builtin.command: "pct exec {{ item }} -- /usr/local/sbin/ceph-osd-boot-activate.sh"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  changed_when: false

- name: Push the OSD creation helper into each OSD CT
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ item }}"
      - /root/mk-osd.sh
      - /root/mk-osd.sh
      - --perms
      - "0700"
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"

- name: Wait for the ceph-osd charm to publish the bootstrap-osd keyring in each OSD guest
  ansible.builtin.shell: |
    set -euo pipefail
    pct exec {{ item }} -- test -f /var/lib/ceph/bootstrap-osd/ceph.keyring
  args:
    executable: /bin/bash
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_yoga_ceph_bootstrap_keyring
  until: pve_yoga_ceph_bootstrap_keyring.rc == 0
  retries: 60
  delay: 10
  changed_when: false

- name: Create one Ceph OSD per device when missing
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item }}
    if pct exec "$vmid" -- bash -c '
         vg=$(pvs --noheadings -o vg_name /dev/osd-block 2>/dev/null | tr -d " ")
         [ -n "$vg" ] && lvs --noheadings -o lv_tags "$vg" 2>/dev/null | grep -q "ceph.osd_id"
       '; then
      echo "OSD-EXISTS $vmid"
    else
      pct exec "$vmid" -- bash /root/mk-osd.sh
    fi
  args:
    executable: /bin/bash
  loop: "{{ pve_yoga_osd_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_yoga_ceph_osd_create
  changed_when: >-
    'OSD-EXISTS' not in pve_yoga_ceph_osd_create.stdout
    and 'MKOSD-SKIP-EXISTS' not in pve_yoga_ceph_osd_create.stdout

- name: Map each ceph-osd unit to the guest that runs it
  ansible.builtin.set_fact:
    pve_yoga_ceph_osd_units: >-
      {{ pve_yoga_ceph_osd_units | default([])
         + [ {'unit': item.key,
              'vmid': pve_yoga_workload_vmids[item.value.machine | int]} ] }}
  loop: "{{ ((pve_yoga_ceph_status.stdout | from_json).applications['ceph-osd'].units) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Push the ceph-osd charm patcher into the OSD guests
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ item.vmid }}"
      - /root/ceph-osd-charm-lxc-patch.py
      - /root/ceph-osd-charm-lxc-patch.py
      - --perms
      - "0700"
  loop: "{{ pve_yoga_ceph_osd_units }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Accept PVE LXC passthrough device nodes in the ceph-osd charm
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    charm="/var/lib/juju/agents/unit-{{ item.unit | replace('/', '-') }}/charm"
    out="$(pct exec "$vmid" -- python3 /root/ceph-osd-charm-lxc-patch.py \
             "$charm/lib/charms_ceph/utils.py")"
    echo "$out"
    if [ "$out" = "PATCHED" ]; then
      pct exec "$vmid" -- bash -c "rm -f $charm/lib/charms_ceph/__pycache__/utils.cpython-*.pyc"
    fi
  args:
    executable: /bin/bash
  loop: "{{ pve_yoga_ceph_osd_units }}"
  loop_control:
    label: "{{ item.unit }}"
  register: pve_yoga_ceph_charm_patch
  changed_when: "'PATCHED' in pve_yoga_ceph_charm_patch.stdout_lines"

- name: Re-read OpenStack Juju status after patching the ceph-osd charm
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} status -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_ceph_status_patched
  changed_when: false

- name: Re-run the ceph-osd hooks that failed before the charm was patched
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} resolved -m {{ pve_yoga_model }} {{ item.unit }}"
  loop: "{{ pve_yoga_ceph_osd_units }}"
  loop_control:
    label: "{{ item.unit }}"
  changed_when: false
  when: >-
    (pve_yoga_ceph_status_patched.stdout | from_json)
    .applications['ceph-osd'].units[item.unit]['workload-status'].current == 'error'

- name: Register the prepared OSD device with the ceph-osd charm and publish the OSD count
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} run {{ item.unit }} add-disk osd-devices=/dev/osd-block --wait=10m -m {{ pve_yoga_model }}"
  loop: "{{ pve_yoga_ceph_osd_units }}"
  loop_control:
    label: "{{ item.unit }}"
  register: pve_yoga_ceph_add_disk
  changed_when: false

- name: Wait for ceph-mon to become active
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} wait-for application ceph-mon --timeout 30m -m {{ pve_yoga_model }}"
  changed_when: false

- name: Wait for ceph-osd to become active
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} wait-for application ceph-osd --timeout 30m -m {{ pve_yoga_model }}"
  changed_when: false

- name: Derive the public address of a Ceph monitor unit
  ansible.builtin.set_fact:
    pve_yoga_ceph_mon_address: >-
      {{ ((pve_yoga_ceph_status.stdout | from_json).applications['ceph-mon'].units
          | dict2items | map(attribute='value') | map(attribute='public-address')
          | first) }}

- name: Derive the Ceph monitor guest id from its public address
  ansible.builtin.set_fact:
    pve_yoga_ceph_mon_vmid: >-
      {{ (pve_yoga_ceph_mon_address.split('.') | last | int) + (pve_yoga_ip_offset | int) }}

- name: Require the derived Ceph monitor guest to exist on the PVE host
  ansible.builtin.command: "pct status {{ pve_yoga_ceph_mon_vmid }}"
  changed_when: false

- name: Read Ceph cluster health from a Ceph monitor host
  ansible.builtin.command: "pct exec {{ pve_yoga_ceph_mon_vmid }} -- ceph -s"
  register: pve_yoga_ceph_health
  changed_when: false

- name: Report Ceph cluster health
  ansible.builtin.debug:
    var: pve_yoga_ceph_health.stdout_lines
