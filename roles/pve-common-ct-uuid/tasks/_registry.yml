---

- name: Record the identity of vmid {{ pve_common_ct_uuid_current.vmid }} in the host registry
  ansible.builtin.command:
    argv:
      - python3
      - "{{ pve_common_ct_uuid_helper_dir }}/ct_uuid_registry.py"
      - --file
      - "{{ pve_common_ct_uuid_registry_file }}"
      - --set
      - "{{ pve_common_ct_uuid_current.vmid }}={{ pve_common_ct_uuid_current.system_uuid }}"
  register: pve_common_ct_uuid_registry_write
  changed_when: pve_common_ct_uuid_registry_write.stdout | trim == 'changed'
