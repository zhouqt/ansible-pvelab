---

pve_ct_system_uuid_registry: {}

pve_ct_system_uuid_namespace: pve-ct-host

pve_ct_system_uuid_dir: /var/lib/ansible-pve/dmi

pve_ct_system_uuid_items: []

pve_ct_system_uuid_apply_live: false

pve_ct_system_uuid_restart_services: []

pve_ct_system_uuid_live_dir: /run/ansible-pve-dmi

pve_ct_system_uuid_verify_running: true

pve_ct_system_uuid_verify_only: false

pve_ct_system_uuid_print_registry: false

pve_ct_system_uuid_source: /sys/firmware/dmi/tables/DMI
pve_ct_system_uuid_registry_file: /etc/pve/priv/ansible-pve/ct-system-uuid.conf
pve_ct_system_uuid_helper_dir: /usr/local/lib/ansible-pve
pve_ct_system_uuid_conf_dir: /etc/pve/lxc

pve_ct_system_uuid_guest_dmi: /sys/firmware/dmi/tables/DMI
pve_ct_system_uuid_guest_product_uuid_mount: /sys/devices/virtual/dmi/id/product_uuid
pve_ct_system_uuid_guest_product_uuid: /sys/class/dmi/id/product_uuid

pve_ct_system_uuid_install_sync_unit: true
pve_ct_system_uuid_sync_script: /usr/local/sbin/pve-ct-dmi-sync.sh
pve_ct_system_uuid_sync_unit: /etc/systemd/system/pve-ct-dmi-sync.service
