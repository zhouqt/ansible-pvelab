---
- name: Check if MAAS cloud exists in Juju
  shell: >-
    {{ juju_openstack_cmd }} clouds --format json 2>/dev/null |
    jq -r '.clouds["{{ juju_cloud_name }}"].type' || echo "not_found"
  register: maas_cloud_check
  changed_when: false

- name: Create MAAS cloud configuration for Juju
  shell: |
    cat > /tmp/maas-cloud.yaml << 'EOF'
    clouds:
      {{ juju_cloud_name }}:
        type: maas
        auth-types: [oauth1]
        endpoint: {{ maas_api_url }}
        regions:
          default:
            endpoint: {{ maas_api_url }}
    EOF
    {{ juju_openstack_cmd }} add-cloud {{ juju_cloud_name }} -f /tmp/maas-cloud.yaml --client --replace
  register: add_cloud
  changed_when: "'successfully' in add_cloud.stderr or add_cloud.rc == 0"

- name: Check if MAAS credentials exist
  shell: >-
    {{ juju_openstack_cmd }} credentials --format json 2>/dev/null |
    jq -r '.credentials["{{ juju_cloud_name }}"]' || echo "not_found"
  register: maas_creds_check
  changed_when: false

- name: Add MAAS credentials to Juju
  shell: |
    cat > /tmp/maas-creds.yaml << 'EOF'
    credentials:
      {{ juju_cloud_name }}:
        default:
          auth-type: oauth1
          maas-oauth: "{{ maas_api_key }}"
    EOF
    {{ juju_openstack_cmd }} add-credential {{ juju_cloud_name }} -f /tmp/maas-creds.yaml --client 2>/dev/null || \
    {{ juju_openstack_cmd }} update-credential {{ juju_cloud_name }} default -f /tmp/maas-creds.yaml --client
  register: add_credential
  changed_when: "'added' in add_credential.stdout or 'updated' in add_credential.stderr"

- name: Check if Juju controller already exists on MAAS
  shell: >-
    {{ juju_openstack_cmd }} controllers --format yaml 2>/dev/null |
    grep "{{ juju_controller_name }}" || echo "not_found"
  register: controller_check
  changed_when: false

- name: Bootstrap Juju controller on MAAS
  shell: |
    {{ juju_openstack_cmd }} bootstrap {{ juju_cloud_name }} {{ juju_controller_name }} \
      --credential default \
      --config bootstrap-timeout=900 \
      --bootstrap-series jammy \
      --no-gui
  when: controller_check.stdout == "not_found"
  register: juju_bootstrap
  until: juju_bootstrap.rc == 0
  retries: 3
  delay: 60
  changed_when: juju_bootstrap.rc == 0

- name: Wait for controller to be ready
  shell: "{{ juju_openstack_cmd }} status"
  register: juju_ready
  until: juju_ready.rc == 0
  retries: 10
  delay: 10
  changed_when: false

- name: Check if openstack model exists
  shell: >-
    {{ juju_openstack_cmd }} models --format yaml 2>/dev/null |
    grep "{{ juju_model_name }}" || echo "not_found"
  register: model_check
  changed_when: false

- name: Create OpenStack model
  shell: "{{ juju_openstack_cmd }} add-model {{ juju_model_name }}"
  when: model_check.stdout == "not_found"
  register: create_model
  changed_when: "'added' in create_model.stdout"

- name: Switch to openstack model
  shell: "{{ juju_openstack_cmd }} switch {{ juju_controller_name }}:admin/{{ juju_model_name }}"
  register: switch_model
  changed_when: false

- name: Display Juju status
  shell: "{{ juju_openstack_cmd }} status"
  register: status_output
  changed_when: false

- debug:
    msg: "{{ status_output.stdout }}"
