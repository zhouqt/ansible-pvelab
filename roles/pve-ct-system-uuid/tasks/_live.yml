---

- name: Read the identity the running container exposes
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - md5sum
      - "{{ pve_ct_system_uuid_guest_dmi }}"
      - "{{ pve_ct_system_uuid_guest_product_uuid_mount }}"
  register: pve_ct_system_uuid_live_guest
  changed_when: false
  check_mode: false

- name: Hash the host-side copies
  ansible.builtin.command:
    argv:
      - md5sum
      - "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/DMI"
      - "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/product_uuid"
  register: pve_ct_system_uuid_live_host
  changed_when: false
  check_mode: false

- name: Decide whether the running container still sees the host identity
  ansible.builtin.set_fact:
    pve_ct_system_uuid_live_needed: >-
      {{ (pve_ct_system_uuid_live_guest.stdout_lines
          | map('regex_replace', '^([0-9a-f]+)\s.*$', '\1') | join(' '))
         != (pve_ct_system_uuid_live_host.stdout_lines
          | map('regex_replace', '^([0-9a-f]+)\s.*$', '\1') | join(' ')) }}

- name: Report a container that already reads its own copies
  ansible.builtin.debug:
    msg: >-
      vmid {{ pve_ct_system_uuid_current.vmid }} already reads its own DMI copies;
      no hot bind needed.
  when: not (pve_ct_system_uuid_live_needed | bool)

- name: Ensure the staging directory exists inside the running container
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - mkdir
      - -p
      - "{{ pve_ct_system_uuid_live_dir }}"
  changed_when: false
  when: pve_ct_system_uuid_live_needed | bool

- name: Push the per-container copies into the running container
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/{{ dmicopy.name }}"
      - "{{ pve_ct_system_uuid_live_dir }}/{{ dmicopy.name }}"
      - --perms
      - "0444"
  loop:
    - name: DMI
      target: "{{ pve_ct_system_uuid_guest_dmi }}"
    - name: product_uuid
      target: "{{ pve_ct_system_uuid_guest_product_uuid_mount }}"
  loop_control:
    loop_var: dmicopy
  when: pve_ct_system_uuid_live_needed | bool

- name: Read the mount that currently backs each guest path
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - nsenter
      - -t
      - "1"
      - -m
      - --
      - findmnt
      - -n
      - -o
      - SOURCE,TARGET
      - --target
      - "{{ dmicopy.target }}"
  loop:
    - name: DMI
      target: "{{ pve_ct_system_uuid_guest_dmi }}"
    - name: product_uuid
      target: "{{ pve_ct_system_uuid_guest_product_uuid_mount }}"
  loop_control:
    loop_var: dmicopy
  register: pve_ct_system_uuid_live_mounts
  changed_when: false
  failed_when: false
  when: pve_ct_system_uuid_live_needed | bool

- name: Unbind a stale mount from the container init namespace
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - nsenter
      - -t
      - "1"
      - -m
      - --
      - umount
      - "{{ mnt.dmicopy.target }}"
  loop: "{{ pve_ct_system_uuid_live_mounts.results | default([]) }}"
  loop_control:
    loop_var: mnt
    label: "{{ mnt.dmicopy.name }}"
  when:
    - pve_ct_system_uuid_live_needed | bool
    - mnt.stdout | default('') | trim | split() | length == 2
    - mnt.stdout.split()[1] == mnt.dmicopy.target

- name: Bind the per-container copies into the container init namespace
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - nsenter
      - -t
      - "1"
      - -m
      - --
      - mount
      - --bind
      - "{{ pve_ct_system_uuid_live_dir }}/{{ dmicopy.name }}"
      - "{{ dmicopy.target }}"
  loop:
    - name: DMI
      target: "{{ pve_ct_system_uuid_guest_dmi }}"
    - name: product_uuid
      target: "{{ pve_ct_system_uuid_guest_product_uuid_mount }}"
  loop_control:
    loop_var: dmicopy
  when: pve_ct_system_uuid_live_needed | bool

- name: Read the identity the container exposes after the bind
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - md5sum
      - "{{ pve_ct_system_uuid_guest_dmi }}"
      - "{{ pve_ct_system_uuid_guest_product_uuid_mount }}"
  register: pve_ct_system_uuid_live_after
  changed_when: false
  check_mode: false
  when: pve_ct_system_uuid_live_needed | bool

- name: Assert the container now reads the per-container copies
  ansible.builtin.assert:
    that:
      - >-
        (pve_ct_system_uuid_live_after.stdout_lines
         | map('regex_replace', '^([0-9a-f]+)\s.*$', '\1') | join(' '))
        == (pve_ct_system_uuid_live_host.stdout_lines
         | map('regex_replace', '^([0-9a-f]+)\s.*$', '\1') | join(' '))
    fail_msg: >-
      pve-ct-system-uuid: vmid {{ pve_ct_system_uuid_current.vmid }} still does not
      read the per-container copies after the hot bind:
      {{ pve_ct_system_uuid_live_after.stdout_lines | default([]) }}
    quiet: true
  when: pve_ct_system_uuid_live_needed | bool

- name: Restart the services that cached the old identity
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_ct_system_uuid_current.vmid }}"
      - --
      - systemctl
      - restart
      - "{{ service }}"
  loop: "{{ pve_ct_system_uuid_current.restart_services }}"
  loop_control:
    loop_var: service
  when:
    - pve_ct_system_uuid_live_needed | bool
    - pve_ct_system_uuid_current.restart_services | length > 0
