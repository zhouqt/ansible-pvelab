---
- name: Ensure the per-container DMI directory exists
  ansible.builtin.file:
    path: "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}"
    state: directory
    mode: "0755"

- name: Generate the patched DMI table and product_uuid
  ansible.builtin.command:
    argv:
      - python3
      - "{{ pve_ct_system_uuid_helper_dir }}/patch_smbios_uuid.py"
      - --source
      - "{{ pve_ct_system_uuid_source }}"
      - --dest-dir
      - "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}"
      - --uuid
      - "{{ pve_ct_system_uuid_current.system_uuid }}"
  register: pve_ct_system_uuid_generate
  changed_when: >-
    pve_ct_system_uuid_generate.stdout | trim
    == 'uuid=' ~ pve_ct_system_uuid_current.system_uuid ~ ' changed'

- name: Assert the DMI copy carries the expected UUID
  ansible.builtin.assert:
    that:
      - pve_ct_system_uuid_generate.stdout.startswith('uuid=' ~ pve_ct_system_uuid_current.system_uuid ~ ' ')
    fail_msg: >-
      pve-ct-system-uuid: unexpected helper output for vmid
      {{ pve_ct_system_uuid_current.vmid }}: {{ pve_ct_system_uuid_generate.stdout }}
    quiet: true

- name: Inspect the generated files
  ansible.builtin.stat:
    path: "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/{{ dmi_file }}"
  loop:
    - DMI
    - product_uuid
  loop_control:
    loop_var: dmi_file
    label: "{{ dmi_file }}"
  register: pve_ct_system_uuid_generated_files

- name: Assert both files exist with mode 0444
  ansible.builtin.assert:
    that:
      - stat.exists
      - stat.mode == '0444'
    fail_msg: >-
      pve-ct-system-uuid: {{ dmi_result.dmi_file }} of vmid {{ pve_ct_system_uuid_current.vmid }}
      is missing or has an unexpected mode ({{ stat.mode | default('absent') }}).
    quiet: true
  loop: "{{ pve_ct_system_uuid_generated_files.results }}"
  loop_control:
    loop_var: dmi_result
    label: "{{ dmi_result.dmi_file }}"
  vars:
    stat: "{{ dmi_result.stat }}"
