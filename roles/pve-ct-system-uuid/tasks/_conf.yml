---

- name: Inspect the container configuration file
  ansible.builtin.stat:
    path: "{{ pve_ct_system_uuid_conf_dir }}/{{ pve_ct_system_uuid_current.vmid }}.conf"
  register: pve_ct_system_uuid_conf_file

- name: Fail loudly when the container configuration is missing
  ansible.builtin.assert:
    that:
      - pve_ct_system_uuid_conf_file.stat.exists
    fail_msg: >-
      pve-ct-system-uuid: {{ pve_ct_system_uuid_conf_dir }}/
      {{ pve_ct_system_uuid_current.vmid }}.conf does not exist.
    quiet: true

- name: Write the DMI bind mounts and the identity record
  ansible.builtin.command:
    argv:
      - python3
      - "{{ pve_ct_system_uuid_helper_dir }}/ct_conf_entries.py"
      - --conf
      - "{{ pve_ct_system_uuid_conf_dir }}/{{ pve_ct_system_uuid_current.vmid }}.conf"
      - --entry
      - >-
        {{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/DMI
        {{ pve_ct_system_uuid_guest_dmi | regex_replace('^/', '') }} none bind,create=file 0 0
      - --entry
      - >-
        {{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/product_uuid
        {{ pve_ct_system_uuid_guest_product_uuid_mount | regex_replace('^/', '') }} none bind,create=file 0 0
      - --prune-source
      - "{{ pve_ct_system_uuid_dir }}/{{ pve_ct_system_uuid_current.vmid }}/"
  register: pve_ct_system_uuid_conf_write
  changed_when: pve_ct_system_uuid_conf_write.stdout | trim == 'changed'

- name: Report a config that changed but needs a container restart to take effect
  ansible.builtin.debug:
    msg: >-
      vmid {{ pve_ct_system_uuid_current.vmid }} is running: the new mount entries
      only apply after the next start or a hot bind
      (-e pve_ct_system_uuid_apply_live=true).
  when:
    - pve_ct_system_uuid_conf_write is changed
    - pve_ct_system_uuid_running | bool
    - not (pve_ct_system_uuid_apply_live | bool)
