---

sunbeam_valid_stages:
  - status
  - pve-prepare
  - node-prepare
  - bootstrap
  - join
  - configure
  - storage
  - verify
  - vm-volume-test
sunbeam_stage: status

sunbeam_staging_dir: /root/.ansible/sunbeam-staging

sunbeam_confirm_pve_create: false
sunbeam_confirm_cluster_bootstrap: false
sunbeam_confirm_cluster_join: false
sunbeam_confirm_external_changes: false
sunbeam_confirm_ceph_osd: false

sunbeam_vm_volume_test: false
sunbeam_vm_test_keep: false
sunbeam_health_require_all_active: false

sunbeam_force_node_prepare: false

sunbeam_force_configure: false

sunbeam_bootstrap_timeout: 7200
sunbeam_join_timeout: 5400
sunbeam_configure_timeout: 7200
sunbeam_poll_interval: 30

sunbeam_microceph_bin: /snap/bin/microceph
sunbeam_microceph_ceph_bin: /snap/bin/microceph.ceph

sunbeam_pct_bin: /usr/sbin/pct
sunbeam_ip_bin: /usr/sbin/ip
sunbeam_lvs_bin: /usr/sbin/lvs
sunbeam_udevadm_bin: /usr/bin/udevadm

sunbeam_osd_udev_rules_path: /etc/udev/rules.d/70-pve-ceph-osd.rules
