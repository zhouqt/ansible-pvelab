---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Require explicit authorization for PVE-side changes
  ansible.builtin.assert:
    that:
      - sunbeam_confirm_pve_create | bool
      - sunbeam_confirm_external_changes | bool
    fail_msg: >-
      This stage creates CTs / thin LVs on the PVE host and reconciles CT config.
      To confirm, pass -e sunbeam_confirm_pve_create=true -e sunbeam_confirm_external_changes=true.
      To only run the read-only preflight, pass -e sunbeam_pve_preflight_only=true instead.
  when: not (sunbeam_pve_preflight_only | bool)

- name: Require the expected PVE SDN bridges
  ansible.builtin.command:
    argv: ["{{ sunbeam_ip_bin }}", -o, link, show, "{{ item }}"]
  loop: "{{ sunbeam_host_expected_bridges }}"
  changed_when: false
  loop_control:
    label: "{{ item }}"

- name: Read PVE SDN vnet and subnet configuration
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/pve/sdn/vnets.cfg
    - /etc/pve/sdn/subnets.cfg
  register: sunbeam_pve_sdn

- name: Require Sunbeam vnets and subnets to already exist
  ansible.builtin.assert:
    that:
      - sunbeam_host_expected_vnets
        | select('in', sunbeam_pve_sdn.results[0].content | b64decode)
        | list | length == sunbeam_host_expected_vnets | length
      - sunbeam_host_expected_subnet_ids
        | select('in', sunbeam_pve_sdn.results[1].content | b64decode)
        | list | length == sunbeam_host_expected_subnet_ids | length
    fail_msg: >-
      PVE SDN does not match the Sunbeam plan. This playbook only validates PVE
      networking, it never rewrites it; first create pub21 / int23 / pub12 and their
      subnets on PVE per the approved plan. Expected subnet ids
      {{ sunbeam_host_expected_subnet_ids }}, found:
      {{ sunbeam_pve_sdn.results[1].content | b64decode | regex_replace('\n', ' | ') }}

- name: Require the container template to be available
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ sunbeam_template | basename }}"
  register: sunbeam_pve_template_stat

- name: Assert the container template exists
  ansible.builtin.assert:
    that:
      - sunbeam_pve_template_stat.stat.exists
    fail_msg: "Missing container template {{ sunbeam_template }}."

- name: Check the external bridge for address conflicts
  ansible.builtin.include_tasks: _external_ip_conflict_check.yml

- name: Check which OSD thin LVs already exist
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_lvs_bin }}"
      - --noheadings
      - -o
      - lv_name
      - "{{ sunbeam_pve_storage }}/{{ item.osd_pve_lv | basename }}"
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_osd_lv_check
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.osd_pve_lv | basename }}"

- name: Read the thin pool fill level
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_lvs_bin }}"
      - --noheadings
      - --units
      - g
      - --nosuffix
      - -o
      - data_percent,lv_size
      - "{{ sunbeam_pve_storage }}/{{ sunbeam_pve_thinpool_lv }}"
  register: sunbeam_thinpool_state
  changed_when: false

- name: Compute the worst-case thin pool fill after this run
  ansible.builtin.set_fact:
    sunbeam_thinpool_pending_lvs: >-
      {{ sunbeam_pve_osd_lv_check.results | selectattr('rc', 'ne', 0) | list | length }}
    sunbeam_thinpool_data_percent: >-
      {{ (sunbeam_thinpool_state.stdout.split()[0] | float) }}
    sunbeam_thinpool_size_gb: >-
      {{ (sunbeam_thinpool_state.stdout.split()[1] | float) }}

- name: Refuse to add thin LVs that would overrun the shared pool
  ansible.builtin.assert:
    that:
      - sunbeam_thinpool_data_percent | float < sunbeam_thinpool_max_data_percent | float
      - >-
        (sunbeam_thinpool_data_percent | float
         + (sunbeam_thinpool_pending_lvs | int * sunbeam_osd_size_gb | int)
           / sunbeam_thinpool_size_gb | float * 100)
        < sunbeam_thinpool_max_data_percent | float
    fail_msg: >-
      Thin pool {{ sunbeam_pve_storage }} is {{ sunbeam_thinpool_data_percent | round(2) }}%
      full ({{ sunbeam_thinpool_size_gb | round(1) }} GB) and this run would add
      {{ sunbeam_thinpool_pending_lvs | int }} x {{ sunbeam_osd_size_gb }} GB, reaching
      {{ (sunbeam_thinpool_data_percent | float + (sunbeam_thinpool_pending_lvs | int * sunbeam_osd_size_gb | int)
          / sunbeam_thinpool_size_gb | float * 100) | round(2) }}%, past the
      {{ sunbeam_thinpool_max_data_percent }}% gate. The pool is shared with the other
      environments on this host; free space or raise the gate deliberately.

- name: Stop before any PVE-side write when only the preflight was requested
  ansible.builtin.meta: end_host
  when: sunbeam_pve_preflight_only | bool

- name: Create the missing OSD thin LVs
  ansible.builtin.command:
    argv:
      - lvcreate
      - -V
      - "{{ sunbeam_osd_size_gb }}G"
      - -T
      - "{{ sunbeam_pve_storage }}/{{ sunbeam_pve_thinpool_lv }}"
      - -n
      - "{{ item.item.osd_pve_lv | basename }}"
      - "{{ sunbeam_pve_storage }}"
  loop: "{{ sunbeam_pve_osd_lv_check.results }}"
  when: item.rc != 0
  loop_control:
    label: "{{ item.item.osd_pve_lv | basename }}"

- name: Ensure the OSD by-id symlink points at the OSD thin LV
  ansible.builtin.file:
    src: "{{ item.osd_pve_lv }}"
    dest: "{{ item.osd_by_id }}"
    state: link
    force: false
  loop: "{{ sunbeam_nodes }}"
  loop_control:
    label: "{{ item.osd_by_id }}"

- name: Install the udev rule that recreates the OSD by-id aliases at boot
  ansible.builtin.template:
    src: pve-ceph-osd.rules.j2
    dest: "{{ sunbeam_osd_udev_rules_path }}"
    owner: root
    group: root
    mode: "0644"
  register: sunbeam_osd_udev_rule

- name: Reload udev rules after installing the OSD alias rule
  ansible.builtin.command:
    argv: ["{{ sunbeam_udevadm_bin }}", control, --reload]
  when: sunbeam_osd_udev_rule.changed
  changed_when: true

- name: Apply the new OSD alias rule to the block devices that already exist
  ansible.builtin.command:
    argv: ["{{ sunbeam_udevadm_bin }}", trigger, --subsystem-match=block, --settle]
  when: sunbeam_osd_udev_rule.changed
  changed_when: true

- name: Read the device links udev maintains for each OSD thin LV
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_udevadm_bin }}"
      - info
      - --query=property
      - --name={{ item.item.osd_pve_lv }}
      - --property=DEVLINKS
  loop: "{{ sunbeam_pve_osd_lv_check.results }}"
  when: item.rc == 0
  register: sunbeam_osd_devlinks
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.item.osd_pve_lv | basename }}"

- name: Assert the OSD by-id alias is provided by udev, not by a leftover symlink
  ansible.builtin.assert:
    that:
      - item.stdout | default('') is search(item.item.item.osd_by_id | regex_escape)
    fail_msg: >-
      udev does not maintain {{ item.item.item.osd_by_id }} for
      {{ item.item.item.osd_pve_lv }} (DEVLINKS: {{ item.stdout | default('') | trim | default('(none)', true) }}).
      Any alias you can see right now was created by hand and will vanish on the next
      host reboot, after which {{ item.item.item.fqdn }} fails to start. Check
      {{ sunbeam_osd_udev_rules_path }} against this device.
  loop: "{{ sunbeam_osd_devlinks.results }}"
  loop_control:
    label: "{{ item.item.item.osd_by_id }}"

- name: Stat the OSD by-id aliases
  ansible.builtin.stat:
    path: "{{ item.osd_by_id }}"
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_osd_by_id_stat
  loop_control:
    label: "{{ item.osd_by_id }}"

- name: Assert every OSD by-id alias is a resolvable block device
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk | default(false)
    fail_msg: >-
      {{ item.item.osd_by_id }} does not exist or is not a block device; the devN entry in
      the CT config will fail at pct start.
    loop: "{{ sunbeam_osd_by_id_stat.results }}"
    loop_control:
      label: "{{ item.item.osd_by_id }}"

- name: Check whether each Sunbeam CT exists
  ansible.builtin.command:
    argv: ["{{ sunbeam_pct_bin }}", status, "{{ item.vmid }}"]
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_ct_check
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.fqdn }}"

- name: Create the missing Sunbeam CTs
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_pct_bin }}"
      - create
      - "{{ item.item.vmid }}"
      - "{{ sunbeam_template }}"
      - --hostname
      - "{{ item.item.hostname }}"
      - --cores
      - "{{ sunbeam_ct_cores }}"
      - --memory
      - "{{ sunbeam_ct_memory_mb }}"
      - --swap
      - "{{ sunbeam_ct_swap_mb }}"
      - --rootfs
      - "{{ sunbeam_pve_storage }}:{{ sunbeam_rootfs_size_gb }}"
      - --ostype
      - "{{ sunbeam_ct_ostype }}"
      - --features
      - "{{ sunbeam_ct_features }}"
      - --onboot
      - "{{ sunbeam_ct_onboot }}"
      - --startup
      - "order={{ sunbeam_ct_startup_order }}"
      - --nameserver
      - "{{ sunbeam_ct_nameserver }}"
      - --tags
      - "{{ sunbeam_ct_tags }}"
      - --unprivileged
      - "0"
      - --net0
      - "name={{ item.item.interfaces.generic }},bridge={{ item.item.pve_bridges[item.item.interfaces.generic] }},ip={{ item.item.pub_ip }}/24,gw={{ sunbeam_management_gateway }},type=veth"
      - --net1
      - "name={{ item.item.interfaces.internal }},bridge={{ item.item.pve_bridges[item.item.interfaces.internal] }},ip={{ item.item.internal_ip }}/24,type=veth"
      - --net2
      - "name={{ item.item.interfaces.external }},bridge={{ item.item.pve_bridges[item.item.interfaces.external] }},ip=manual,type=veth"
  loop: "{{ sunbeam_pve_ct_check.results }}"
  when: item.rc != 0
  loop_control:
    label: "{{ item.item.fqdn }}"

- name: Read each Sunbeam CT configuration file
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ item.vmid }}.conf"
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_conf
  failed_when: false
  loop_control:
    label: "{{ item.fqdn }}"

- name: Build a vmid -> CT config map
  ansible.builtin.set_fact:
    sunbeam_pve_conf_map: >-
      {{ dict(sunbeam_pve_conf.results | selectattr('content', 'defined')
              | map(attribute='item.vmid') | map('string')
              | zip(sunbeam_pve_conf.results | selectattr('content', 'defined')
                    | map(attribute='content') | map('b64decode'))) }}

- name: Assert every Sunbeam CT is a privileged container
  ansible.builtin.assert:
    that:
      - sunbeam_pve_conf_map[item.vmid | string] is not search('(?m)^unprivileged:\s*1\s*$')
    fail_msg: >-
      CT {{ item.vmid }} ({{ item.fqdn }}) is an **unprivileged** container. Sunbeam needs a
      privileged one for /dev/kvm, /dev/net/tun and OSD block device passthrough, and an
      existing unprivileged container cannot be converted in place. Recreate it with
      --unprivileged 0 (this stage passes it explicitly for newly created containers).
  loop: "{{ sunbeam_nodes }}"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Find managed keys that would land in the wrong CT config section
  ansible.builtin.set_fact:
    sunbeam_pve_conf_misplaced: >-
      {%- set out = [] -%}
      {%- for n in sunbeam_nodes -%}
      {%-   set conf = sunbeam_pve_conf_map[n.vmid | string] | default('') -%}
      {%-   set lines = conf.split('\n') -%}
      {%-   set headers = lines | select('match', '^\\[') | list -%}
      {%-   if headers -%}
      {%-     set boundary = lines.index(headers[0]) -%}
      {%-     for idx in range(boundary + 1, lines | length) -%}
      {%-       if lines[idx] | regex_search('^(dev[0-9]+|features|lxc\\.cap\\.drop|lxc\\.mount\\.entry):') -%}
      {%-         set _ = out.append(n.fqdn ~ ' :: ' ~ lines[idx] ~ ' (after ' ~ headers[0] ~ ')') -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Refuse to rewrite a CT config whose managed keys sit inside a section
  ansible.builtin.assert:
    that:
      - sunbeam_pve_conf_misplaced | length == 0
    fail_msg: >-
      These managed keys are inside an INI section of the CT config, where PVE would
      ignore them, and a blind rewrite would hide that:
      {{ sunbeam_pve_conf_misplaced }}
      Inspect the file and either drop the section or move the keys back to the top
      level by hand.

- name: Collect every devN slot this stage writes, per CT
  ansible.builtin.set_fact:
    sunbeam_pve_slots: >-
      {%- set out = {} -%}
      {%- for n in sunbeam_nodes -%}
      {%-   set entries = [] -%}
      {%-   for d in n.pve_devices -%}
      {%-     set _ = entries.append({'index': d.index | int, 'path': d.path}) -%}
      {%-   endfor -%}
      {%-   for d in (n.char_devices | default([])) -%}
      {%-     set _ = entries.append({'index': d.index | int, 'path': d.path}) -%}
      {%-   endfor -%}
      {%-   if n.loop_devices | bool -%}
      {%-     for i in range(sunbeam_loop_device_first, sunbeam_loop_device_last + 1) -%}
      {%-       set _ = entries.append({'index': i | int, 'path': '/dev/loop' ~ i}) -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%-   set _ = out.update({n.vmid | string: entries}) -%}
      {%- endfor -%}
      {{ out }}

- name: Refuse to overwrite a conflicting passthrough device slot
  ansible.builtin.assert:
    that:
      - >-
        sunbeam_pve_conf_map[item.0.vmid | string]
        is not search('(?m)^dev' ~ item.1.index ~ ': (?!' ~ (item.1.path | regex_escape) ~ ')')
    fail_msg: >-
      dev{{ item.1.index }} of CT {{ item.0.vmid }} is already occupied by another device
      (expected {{ item.1.path }}); refusing to overwrite the existing passthrough config.
      Adjust sunbeam_nodes[].pve_devices / char_devices / osd_slots after manual review.
  loop: "{{ sunbeam_pve_slots | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }} dev{{ item.1.index }}"

- name: Assert every compute node declares kvm and tun passthrough
  ansible.builtin.assert:
    that:
      - item.char_devices | default([]) | selectattr('path', 'equalto', '/dev/kvm') | list | length == 1
      - item.char_devices | default([]) | selectattr('path', 'equalto', '/dev/net/tun') | list | length == 1
    fail_msg: >-
      {{ item.fqdn }} carries the `compute` role but does not declare /dev/kvm and
      /dev/net/tun in its char_devices. Without them nova cannot boot an instance:
      kvm for the VM itself, tun for the metadata/security-group path.
  loop: "{{ sunbeam_compute_nodes }}"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Ensure OSD/rootfs block device passthrough entries
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.0.vmid }}.conf"
    line: "dev{{ item.1.index }}: {{ item.1.path }},mode=0660"
    regexp: "^dev{{ item.1.index }}:"
    insertbefore: '^\['
  loop: "{{ sunbeam_nodes | subelements('pve_devices') }}"
  loop_control:
    label: "{{ item.0.fqdn }} dev{{ item.1.index }}"

- name: Ensure character device passthrough entries
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.0.vmid }}.conf"
    line: >-
      dev{{ item.1.index }}: {{ item.1.path }},mode={{ item.1.mode }}{{ ',' + item.1.extra if item.1.extra is defined else '' }}
    regexp: "^dev{{ item.1.index }}:"
    insertbefore: '^\['
  loop: "{{ sunbeam_nodes | subelements('char_devices') }}"
  loop_control:
    label: "{{ item.0.fqdn }} dev{{ item.1.index }}"

- name: Ensure loop device passthrough entries for the rawfile CSI node
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ sunbeam_primary_node.vmid }}.conf"
    line: "dev{{ item }}: /dev/loop{{ item }},mode=0660"
    regexp: "^dev{{ item }}:"
    insertbefore: '^\['
  loop: "{{ range(sunbeam_loop_device_first, sunbeam_loop_device_last + 1) | list }}"
  when: sunbeam_primary_node.loop_devices | bool
  loop_control:
    label: "dev{{ item }} /dev/loop{{ item }}"

- name: Ensure the CT feature set
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "features: {{ sunbeam_ct_features }}"
    regexp: "^features:"
    insertbefore: '^\['
  loop: "{{ sunbeam_nodes }}"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Ensure an empty lxc.cap.drop line is present
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "lxc.cap.drop:"
    regexp: "^lxc\\.cap\\.drop:"
    insertbefore: '^\['
  loop: "{{ sunbeam_nodes }}"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Ensure node-specific bind mounts
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.0.vmid }}.conf"
    line: "lxc.mount.entry: {{ item.1 }}"
    regexp: "^lxc\\.mount\\.entry: {{ item.1.split(' ')[0] | regex_escape }} "
    insertbefore: '^\['
  loop: "{{ sunbeam_nodes | subelements('mounts') }}"
  loop_control:
    label: "{{ item.0.fqdn }} {{ item.1.split(' ')[0] }}"

- name: Ensure every Sunbeam CT is running
  ansible.builtin.command:
    argv: ["{{ sunbeam_pct_bin }}", start, "{{ item.vmid }}"]
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_ct_start
  changed_when: sunbeam_pve_ct_start.rc == 0
  failed_when: >-
    sunbeam_pve_ct_start.rc != 0 and 'already running' not in sunbeam_pve_ct_start.stderr
  loop_control:
    label: "{{ item.fqdn }}"

- name: Wait until each CT answers inside the container
  ansible.builtin.command:
    argv: ["{{ sunbeam_pct_bin }}", exec, "{{ item.vmid }}", "--", hostname]
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_ct_ready
  changed_when: false
  retries: 30
  delay: 5
  until: sunbeam_pve_ct_ready.rc == 0
  loop_control:
    label: "{{ item.fqdn }}"

- name: Check that every passthrough device exists inside its CT
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_pct_bin }}"
      - exec
      - "{{ item.0.key }}"
      - --
      - test
      - -e
      - "{{ item.1.path }}"
  loop: "{{ sunbeam_pve_slots | dict2items | subelements('value') }}"
  changed_when: false
  register: sunbeam_pve_device_inside
  loop_control:
    label: "{{ item.0.key }} {{ item.1.path }}"

- name: Assert every passthrough device is visible inside its CT
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      {{ item.item.1.path }} is not present inside CT {{ item.item.0.key }} (dev{{ item.item.1.index }}).
      The CT config declares it, but the container does not see it -- usually an
      unprivileged container, a slot already taken by another device, or a host
      device that no longer exists.
  loop: "{{ sunbeam_pve_device_inside.results }}"
  loop_control:
    label: "{{ item.item.0.key }} {{ item.item.1.path }}"

- name: Ensure Sunbeam FQDN entries resolve inside every CT
  ansible.builtin.command:
    argv: ["{{ sunbeam_pct_bin }}", exec, "{{ item.vmid }}", "--", bash, -s]
    stdin: "{{ lookup('template', 'ensure-hosts.sh.j2') }}"
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_pve_hosts
  changed_when: "'hosts changed=0' not in sunbeam_pve_hosts.stdout"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Report PVE preparation result
  ansible.builtin.debug:
    msg:
      - "CT: {{ sunbeam_nodes | map(attribute='fqdn') | join(', ') }}"
      - "OSD by-id: {{ sunbeam_nodes | map(attribute='osd_by_id') | join(', ') }}"
