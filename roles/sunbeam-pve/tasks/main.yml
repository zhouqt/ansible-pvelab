---
- name: Validate the requested Sunbeam stage
  ansible.builtin.assert:
    that:
      - sunbeam_stage in sunbeam_valid_stages
    fail_msg: >-
      sunbeam_stage must be one of {{ sunbeam_valid_stages | join(', ') }};
      current value is '{{ sunbeam_stage }}'.
  run_once: true

- name: Load the requested stage implementation
  ansible.builtin.include_tasks: "{{ sunbeam_stage }}.yml"
