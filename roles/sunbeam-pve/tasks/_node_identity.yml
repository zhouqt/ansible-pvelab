---
- name: Read the Sunbeam node identity from every node
  ansible.builtin.command:
    argv:
      - "{{ sunbeam_pct_bin }}"
      - exec
      - "{{ item.vmid }}"
      - --
      - "{{ sunbeam_snap_python }}"
      - -c
      - "from sunbeam import utils; print(utils.get_fqdn())"
  loop: "{{ sunbeam_nodes }}"
  register: sunbeam_node_identity_probe
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.fqdn }}"

- name: Require a readable Sunbeam identity from every node
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | default('') | trim) | length > 0
    fail_msg: >-
      Could not read the Sunbeam node identity (utils.get_fqdn()) on
      {{ item.item.fqdn }}: rc={{ item.rc | default('?') }}
      '{{ item.stdout | default('') | trim }}' {{ item.stderr | default('') | trim }}.
      Is the openstack snap installed (node-prepare) and /snap/openstack/current/bin/python3
      usable? Without this name the manifest and the join token would be keyed by a
      name Sunbeam does not know.
  loop: "{{ sunbeam_node_identity_probe.results }}"
  loop_control:
    label: "{{ item.item.fqdn }}"

- name: Record each node's Sunbeam identity
  ansible.builtin.set_fact:
    sunbeam_node_names: >-
      {{ sunbeam_node_names | default({})
         | combine({ (item.item.vmid | string): (item.stdout | trim) }) }}
  loop: "{{ sunbeam_node_identity_probe.results }}"
  loop_control:
    label: "{{ item.item.fqdn }}"