---
- name: Check for VMID 1122 collision with an existing container
  ansible.builtin.command: pct status 1122
  register: pve_kvm_1122_ct_status
  failed_when: false
  changed_when: false

- name: Refuse to overwrite an existing CT with the KVM workload VMID
  ansible.builtin.assert:
    that:
      - pve_kvm_1122_ct_status.rc != 0
    fail_msg: "VMID 1122 is already an LXC container; refusing to overwrite it. Verify against the migration runbook and migrate/clean up that guest by hand first."

- name: Check whether KVM workload VM 1122 exists
  ansible.builtin.command: qm status 1122
  register: pve_kvm_1122_status
  failed_when: false
  changed_when: false

- name: Read existing KVM workload VM configuration before modifying NICs
  ansible.builtin.command: qm config 1122
  register: pve_kvm_1122_config_before
  changed_when: false
  when: pve_kvm_1122_status.rc == 0

- name: Validate existing KVM uplink NIC before modifying the guest
  ansible.builtin.assert:
    that:
      - >-
        pve_kvm_1122_config_before.stdout is not search('(?m)^net4:')
        or
        (
          (pve_kvm_1122_config_before.stdout_lines | select('match', '^net4:') | list | length) == 1
          and (pve_kvm_1122_config_before.stdout_lines | select('match', '^net4:') | first)
            is search('bridge=' ~ pve_compute_uplink_bridge ~ '(?:,|$)')
          and (pve_kvm_1122_config_before.stdout_lines | select('match', '^net4:') | first)
            is search('virtio')
          and pve_kvm_1122_config_before.stdout is search('(?m)^ipconfig4: ip=manual$')
        )
    fail_msg: >-
      KVM VMID 1122 net4/ipconfig4 is already used by another configuration; expected a virtio
      NIC on {{ pve_compute_uplink_bridge }} with no IP configuration. Refusing to overwrite.
  when: pve_kvm_1122_status.rc == 0

- name: Validate existing KVM workload identity and primary networks before NIC changes
  ansible.builtin.assert:
    that:
      - "'name: nova-compute-kvm' in pve_kvm_1122_config_before.stdout"
      - "pve_kvm_1122_config_before.stdout is search('(?m)^net0: .*bridge=pub11(?:,|$)')"
      - "pve_kvm_1122_config_before.stdout is search('(?m)^net1: .*bridge=pub12(?:,|$)')"
      - "pve_kvm_1122_config_before.stdout is search('(?m)^net2: .*bridge=int13(?:,|$)')"
      - "pve_kvm_1122_config_before.stdout is search('(?m)^net3: .*bridge=int14(?:,|$)')"
      - "'ipconfig0: ip=192.168.11.122/24,gw=192.168.11.1' in pve_kvm_1122_config_before.stdout"
      - "('ipconfig1: ip=' ~ pve_kvm_1122_secondary_networks.oam ~ '/24') in pve_kvm_1122_config_before.stdout"
      - "('ipconfig2: ip=' ~ pve_kvm_1122_secondary_networks.internal ~ '/24') in pve_kvm_1122_config_before.stdout"
      - "('ipconfig3: ip=' ~ pve_kvm_1122_secondary_networks.storage ~ '/24') in pve_kvm_1122_config_before.stdout"
  fail_msg: >-
    KVM VMID 1122 does not match the declared nova-compute-kvm identity/network inventory;
    refusing to add or alter any NIC.
  when: pve_kvm_1122_status.rc == 0

- name: Read runtime state of KVM VM before adding a missing uplink NIC
  ansible.builtin.command: qm status 1122
  register: pve_kvm_1122_uplink_runtime
  changed_when: false
  when:
    - pve_kvm_1122_status.rc == 0
    - pve_kvm_1122_config_before.stdout is not search('(?m)^net4:')

- name: Require KVM VM to be stopped before adding a missing uplink NIC
  ansible.builtin.assert:
    that:
      - pve_kvm_1122_uplink_runtime.stdout is search('status: stopped')
      - pve_start_existing_compute_after_uplink | bool
    fail_msg: >-
      KVM VMID 1122 is missing net4 and is either running, or
      pve_start_existing_compute_after_uplink is false. Stop it in a controlled maintenance window
      and rerun with -e pve_start_existing_compute_after_uplink=true to authorize NIC addition and
      the normal pve-machines startup stage.
  when:
    - pve_kvm_1122_status.rc == 0
    - pve_kvm_1122_config_before.stdout is not search('(?m)^net4:')

- name: Add missing dedicated uplink NIC to stopped KVM VM 1122
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "1122"
      - --net4
      - "virtio,bridge={{ pve_compute_uplink_bridge }},firewall=0"
      - --ipconfig4
      - ip=manual
  when:
    - pve_kvm_1122_status.rc == 0
    - pve_kvm_1122_config_before.stdout is not search('(?m)^net4:')

- name: Create KVM workload VM 1122
  ansible.builtin.shell: |
    set -euo pipefail
    cd /var/tmp
    image=ubuntu-20.04-server-cloudimg-amd64.img
    if [ ! -s "$image" ]; then
      curl -fsSLo "$image" https://cloud-images.ubuntu.com/releases/focal/release/"$image"
    fi
    qm create 1122 --name nova-compute-kvm --ostype l26 --cores 4 --memory 8192 --balloon 0 \
      --cpu host --sockets 1 --net0 virtio,bridge=pub11,firewall=0 \
      --net1 virtio,bridge=pub12,firewall=0 --net2 virtio,bridge=int13,firewall=0 \
      --net3 virtio,bridge=int14,firewall=0 --net4 virtio,bridge={{ pve_compute_uplink_bridge }},firewall=0 \
      --onboot 1 --startup order=3 --agent 1 --serial0 socket --vga std
    qm importdisk 1122 "$image" '{{ pve_storage }}'
    qm set 1122 --scsihw virtio-scsi-pci --scsi0 '{{ pve_storage }}:vm-1122-disk-0,iothread=1'
    qm resize 1122 scsi0 32G
    qm set 1122 --ide2 '{{ pve_storage }}:cloudinit' --boot order=scsi0
    qm set 1122 --ciuser ubuntu --sshkeys /root/juju-client.pub \
      --ipconfig0 ip=192.168.11.122/24,gw=192.168.11.1 \
      --ipconfig1 ip={{ pve_kvm_1122_secondary_networks.oam }}/24 \
      --ipconfig2 ip={{ pve_kvm_1122_secondary_networks.internal }}/24 \
      --ipconfig3 ip={{ pve_kvm_1122_secondary_networks.storage }}/24 \
      --ipconfig4 ip=manual \
      --nameserver 8.8.8.8
  args:
    executable: /bin/bash
  environment:
    HTTP_PROXY: "{{ pve_maas_http_proxy }}"
    HTTPS_PROXY: "{{ pve_maas_https_proxy }}"
    http_proxy: "{{ pve_maas_http_proxy }}"
    https_proxy: "{{ pve_maas_https_proxy }}"
  when: pve_kvm_1122_status.rc != 0

- name: Read configuration of the KVM workload VM
  ansible.builtin.command: qm config 1122
  register: pve_kvm_1122_config
  changed_when: false

- name: Verify KVM workload VM identity and address
  ansible.builtin.assert:
    that:
      - "'name: nova-compute-kvm' in pve_kvm_1122_config.stdout"
      - "'ipconfig0: ip=192.168.11.122/24,gw=192.168.11.1' in pve_kvm_1122_config.stdout"
      - "pve_kvm_1122_config.stdout is search('(?m)^net0: .*bridge=pub11(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net1: .*bridge=pub12(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net2: .*bridge=int13(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net3: .*bridge=int14(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net1: .*bridge=pub12(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net2: .*bridge=int13(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net3: .*bridge=int14(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^net4: .*bridge=' ~ pve_compute_uplink_bridge ~ '(?:,|$)')"
      - "pve_kvm_1122_config.stdout is search('(?m)^ipconfig4: ip=manual$')"
      - "('ipconfig1: ip=' ~ pve_kvm_1122_secondary_networks.oam ~ '/24') in pve_kvm_1122_config.stdout"
      - "('ipconfig2: ip=' ~ pve_kvm_1122_secondary_networks.internal ~ '/24') in pve_kvm_1122_config.stdout"
      - "('ipconfig3: ip=' ~ pve_kvm_1122_secondary_networks.storage ~ '/24') in pve_kvm_1122_config.stdout"
      - "'ciuser: ubuntu' in pve_kvm_1122_config.stdout"
      - "'sshkeys:' in pve_kvm_1122_config.stdout"
    fail_msg: "the name, NICs, addresses or cloud-init user of VMID 1122 do not match the workload inventory; refusing to change them automatically."

- name: Read rendered cloud-init user data for KVM workload VM
  ansible.builtin.command: qm cloudinit dump 1122 user
  register: pve_kvm_1122_cloudinit
  changed_when: false

- name: Verify KVM workload VM receives the Juju client key
  ansible.builtin.assert:
    that:
      - "pve_juju_client_pubkey.stdout | trim in pve_kvm_1122_cloudinit.stdout"
    fail_msg: "the rendered cloud-init data of VMID 1122 does not contain the Juju client public key; refusing to continue."

- name: Check runtime state of the KVM workload VM
  ansible.builtin.command: qm status 1122
  register: pve_kvm_1122_runtime_status
  changed_when: false

- name: Start KVM workload VM if stopped
  ansible.builtin.command: qm start 1122
  when: "'status: stopped' in pve_kvm_1122_runtime_status.stdout"
