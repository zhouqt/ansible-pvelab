---
- name: Verify PVE storage is configured
  ansible.builtin.command: pvesm status
  register: pve_storage_inventory
  changed_when: false

- name: Check whether MAAS controller CT already exists
  ansible.builtin.command: "pct status {{ pve_maas_vmid }}"
  register: pve_maas_status
  failed_when: false
  changed_when: false

- name: Assert MAAS CT and PVE storage are ready
  ansible.builtin.assert:
    that:
      - "pve_storage in pve_storage_inventory.stdout"
      - pve_maas_status.rc == 0
    fail_msg: "run --tags pve-maas first and confirm {{ pve_storage }} is usable."

- name: Check PVE local focal template inventory
  ansible.builtin.command: pveam list local
  register: pve_template_inventory
  changed_when: false

- name: Require focal template before building workload machines
  ansible.builtin.assert:
    that:
      - pve_focal_template in pve_template_inventory.stdout
    fail_msg: "{{ pve_focal_template }} is missing; prepare the focal template first."

- name: Verify Juju client SSH identity is present
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - test -s ~/.ssh/id_ed25519.pub
  register: pve_juju_client_key_check
  changed_when: false

- name: Verify Juju client has the required private key
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - test -s ~/.ssh/id_ed25519
  register: pve_juju_client_private_key_check
  changed_when: false

- name: Read available Juju models
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - "{{ pve_juju_bin }} models --controller {{ pve_juju_controller_name }} --format json"
  register: pve_workload_juju_models
  changed_when: false

- name: Require Juju model listing to succeed
  ansible.builtin.assert:
    that:
      - pve_workload_juju_models.rc == 0
      - "'models' in (pve_workload_juju_models.stdout | from_json)"
    fail_msg: "cannot read the Juju model inventory; refusing to register workload guests while the model state is unknown."

- name: Read current OpenStack Juju machine inventory
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - "{{ pve_juju_bin }} status -m {{ pve_juju_controller_name }}:openstack --format json"
  register: pve_workload_openstack_status
  changed_when: false

- name: Fail safely if the OpenStack Juju status command fails
  ansible.builtin.assert:
    that:
      - pve_workload_openstack_status.rc == 0
      - "'machines' in (pve_workload_openstack_status.stdout | from_json)"
    fail_msg: "cannot read the OpenStack Juju model status; refusing to change PVE based on an incomplete machine inventory."

- name: Read current LMA Juju machine inventory
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - "{{ pve_juju_bin }} status -m {{ pve_juju_controller_name }}:lma --format json"
  register: pve_workload_lma_status
  changed_when: false

- name: Fail safely if the LMA Juju status command fails
  ansible.builtin.assert:
    that:
      - pve_workload_lma_status.rc == 0
      - "'machines' in (pve_workload_lma_status.stdout | from_json)"
    fail_msg: "cannot read the LMA Juju model status; refusing to change PVE based on an incomplete machine inventory."

- name: Validate existing OpenStack Juju machine-ID sequence before creating workload guests
  ansible.builtin.assert:
    that:
      - >-
        (
          (pve_workload_openstack_status.stdout | from_json).machines
          | dict2items | map(attribute='key') | map('int') | list | sort
        ) == range(0, ((pve_workload_openstack_status.stdout | from_json).machines | length)) | list
        and ((pve_workload_openstack_status.stdout | from_json).machines | length) <= 21
        or
        (
          (pve_workload_openstack_status.stdout | from_json).machines
          | dict2items | map(attribute='key') | map('int') | list | sort
        ) == ((range(0, 21) | list) + [22, 23])
    fail_msg: >-
      Existing OpenStack machine IDs must be a contiguous prefix 0-20 or the complete verified
      mapping 0-20,22,23 with 21 absent. Refusing to make PVE changes against a conflicting map.

- name: Validate existing OpenStack Juju machine addresses before creating workload guests
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.get('ip-addresses', []) is sequence
      - item.value.get('ip-addresses', []) is not string
      - item.value.get('dns-name', '') is string
      - >-
        (
          ('192.168.11.' ~ ((101 + (item.key | int)) | string))
          if (item.key | int) <= 20 else
          '192.168.11.123' if (item.key | int) == 22 else
          '192.168.11.122'
        ) in (item.value.get('ip-addresses', []) + [item.value.get('dns-name', '')])
    fail_msg: >-
      OpenStack machine {{ item.key }} does not have its fixed pub11 address; refuse to make
      PVE changes while the manual-provider machine map is ambiguous.
  loop: "{{ (pve_workload_openstack_status.stdout | from_json).machines | dict2items }}"
  loop_control:
    label: "Juju machine {{ item.key }}"

- name: Validate existing LMA Juju machine IDs before creating workload guests
  ansible.builtin.assert:
    that:
      - >-
        (
          (pve_workload_lma_status.stdout | from_json).machines | default({})
          | dict2items | map(attribute='key') | map('int') | list | sort
        ) == range(0, ((pve_workload_lma_status.stdout | from_json).machines | default({}) | length)) | list
      - "((pve_workload_lma_status.stdout | from_json).machines | default({}) | length) <= 4"
    fail_msg: "LMA machine IDs must be a contiguous prefix from 0 through 3; resolve other inventories manually."

- name: Assert required Juju models exist
  ansible.builtin.assert:
    that:
      - "'models' in (pve_workload_juju_models.stdout | from_json)"
      - "((pve_workload_juju_models.stdout | from_json).models | selectattr('short-name', 'equalto', 'openstack') | list | length) == 1"
      - "((pve_workload_juju_models.stdout | from_json).models | selectattr('short-name', 'equalto', 'lma') | list | length) == 1"
    fail_msg: "run --tags pve-juju-ctrl first to create the Juju controller and the two models."

- name: Check for an owned interrupted machine-ID gap operation
  ansible.builtin.stat:
    path: "{{ pve_workload_gap_marker }}"
  register: pve_workload_gap_marker_status

- name: Read an existing machine-ID gap marker
  ansible.builtin.slurp:
    src: "{{ pve_workload_gap_marker }}"
  register: pve_workload_gap_marker_data
  when: pve_workload_gap_marker_status.stat.exists

- name: Validate ownership marker before creating workload guests
  ansible.builtin.assert:
    that:
      - (pve_workload_gap_marker_data.content | b64decode | trim) in ['intent', 'ct-ready', 'registered']
    fail_msg: "Machine-ID gap marker is invalid; refusing to create or register workload guests."
  when: pve_workload_gap_marker_status.stat.exists

- name: Refuse workload guest changes when a machine-ID gap recovery marker exists
  ansible.builtin.assert:
    that:
      - not pve_workload_gap_marker_status.stat.exists
    fail_msg: >-
      A stale machine-21 gap marker exists at {{ pve_workload_gap_marker }}. The workload role
      does not create or remove Juju machines; inspect and resolve the reservation manually after
      verifying Juju 2.9 machine-ID behavior.

- name: Check whether KVM workload VMID 1122 exists
  ansible.builtin.command: qm status 1122
  register: pve_kvm_1122_status
  failed_when: false
  changed_when: false
  when: pve_create_kvm_1122 | bool

- name: Check whether VMID 1122 is occupied by an LXC container
  ansible.builtin.command: pct status 1122
  register: pve_kvm_1122_ct_status
  failed_when: false
  changed_when: false
  when: pve_create_kvm_1122 | bool

- name: Refuse VMID 1122 collision before optional KVM creation
  ansible.builtin.assert:
    that:
      - pve_kvm_1122_status.rc == 0 or pve_kvm_1122_ct_status.rc != 0
    fail_msg: "VMID 1122 is taken by an LXC or another PVE guest; refusing to overwrite it. Verify it by hand, then decide."
  when: pve_create_kvm_1122 | bool

- name: Refuse KVM VMID 1122 when its Juju machine mapping is not verified
  ansible.builtin.assert:
    that:
      - >-
        '23' in (pve_workload_openstack_status.stdout | from_json).machines
        or
        (
          (pve_workload_openstack_status.stdout | from_json).machines.keys()
          | map('int') | list | sort
        ) == range(0, ((pve_workload_openstack_status.stdout | from_json).machines | length)) | list
    fail_msg: >-
      Juju machine 23 for KVM VMID 1122 is not present and the current IDs are not a contiguous
      prefix; refusing to create/reuse a KVM guest whose manual-cloud registration would collide.

- name: Initialize Juju workload container inventory
  ansible.builtin.set_fact:
    pve_workload_containers: []

- name: Build Juju workload CT inventory, excluding KVM VMID 1122
  ansible.builtin.set_fact:
    pve_workload_containers: >-
      {{ pve_workload_containers + [{
        'vmid': item | int,
        'hostname': ('os' ~ (item | int - pve_workload_start_vmid) if (item | int) < 1124 else 'lma' ~ (item | int - 1124),
        'ip': '192.168.11.' ~ (item | int - 1000),
        'tags': ('juju,openstack' if (item | int) < 1124 else 'juju,lma'),
        'secondary_networks': (pve_workload_secondary_network_ips.get(item | int, pve_workload_secondary_network_ips.get(item | string, {})) if (item | int) < 1124 else {})
      }] }}
  loop: "{{ range(pve_workload_start_vmid | int, pve_workload_end_vmid | int + 1) | list }}"
  when: item | int != 1122

- name: Require explicit secondary network addresses for all OpenStack workload guests
  ansible.builtin.assert:
    that:
      - >-
        (pve_workload_secondary_network_ips.keys() | map('int') | list | sort)
        == (((range(1101, 1122) | list) + [1122, 1123]) | sort)
    fail_msg: >-
      Define oam/internal/storage addresses for every OpenStack workload VMID 1101-1123,
      including KVM VMID 1122. The repository does not contain a verified allocation for these
      networks; refusing to invent IPs or build incomplete manual-provider machines.

- name: Build secondary network address list
  ansible.builtin.set_fact:
    pve_workload_secondary_network_ip_list: >-
      {{ pve_workload_secondary_network_ips.values() | map('dict2items') | flatten
         | map(attribute='value') | list }}

- name: Require globally unique secondary network addresses
  ansible.builtin.assert:
    that:
      - pve_workload_secondary_network_ip_list | unique | length == 69
    fail_msg: "pve_workload_secondary_network_ips contains duplicate secondary network addresses."

- name: Validate secondary network addresses for OpenStack workload guests
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.keys() | list | sort == ['internal', 'oam', 'storage']
      - item.value.oam is string
      - item.value.internal is string
      - item.value.storage is string
      - item.value.oam is match('^192[.]168[.]12[.]([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
      - item.value.internal is match('^192[.]168[.]13[.]([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
      - item.value.storage is match('^192[.]168[.]14[.]([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
      - item.value.oam != '192.168.12.3'
      - item.value.internal != '192.168.13.3'
      - item.value.storage != '192.168.14.3'
    fail_msg: "the oam/internal/storage addresses of VMID {{ item.key }} are invalid or clash with MAAS CT 1000."
  loop: "{{ pve_workload_secondary_network_ips | dict2items }}"
  loop_control:
    label: "VMID {{ item.key }}"

- name: Set deterministic Juju machine registration IP lists
  ansible.builtin.set_fact:
    pve_openstack_machine_ips: >-
      {{ range(pve_workload_openstack_first_ip_octet | int, pve_workload_openstack_last_ip_octet | int + 1)
         | map('string') | map('regex_replace', '^', '192.168.11.') | list }}
    pve_lma_machine_ips: >-
      {{ range(pve_workload_lma_first_ip_octet | int, pve_workload_lma_last_ip_octet | int + 1)
         | map('string') | map('regex_replace', '^', '192.168.11.') | list }}

- name: Require workload range to match the validated manual-cloud machine map
  ansible.builtin.assert:
    that:
      - pve_workload_start_vmid | int == 1101
      - pve_workload_end_vmid | int == 1127
      - pve_workload_start_vmid | int == 1101 and pve_workload_openstack_last_ip_octet | int - pve_workload_openstack_first_ip_octet | int == 22
      - pve_workload_openstack_first_ip_octet | int == 101
      - pve_workload_openstack_last_ip_octet | int == 123
      - pve_workload_lma_first_ip_octet | int == 124
      - pve_workload_lma_last_ip_octet | int == 127
      - pve_create_kvm_1122 | bool
    fail_msg: "the current Juju machine mapping relies on the fixed 1101-1127 guest list and KVM 1122; to change it, update and verify the --to machine IDs in the deploy scripts first."

- name: Check for existing Juju workload CTs
  ansible.builtin.command: "pct config {{ item.vmid }}"
  register: pve_workload_ct_configs
  failed_when: false
  changed_when: false
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Check workload VMIDs are not occupied by KVM guests
  ansible.builtin.command: "qm status {{ item.vmid }}"
  register: pve_workload_qm_status
  failed_when: false
  changed_when: false
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Validate existing workload VMIDs are not occupied by KVM guests
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: "VMID {{ item.item.vmid }} is taken by a KVM VM; refusing to create or reuse a workload guest."
  loop: "{{ pve_workload_qm_status.results }}"
  loop_control:
    label: "{{ item.item.vmid }}"

- name: Validate identity of existing workload CTs
  ansible.builtin.assert:
    that:
      - "item.rc != 0 or ('hostname: ' ~ item.item.hostname) in item.stdout"
      - "item.rc != 0 or ('ip=192.168.11.' ~ (item.item.vmid | int - 1000) ~ '/24') in item.stdout"
    fail_msg: "VMID {{ item.item.vmid }} is already a CT with a different config; refusing to overwrite or reuse it."
  loop: "{{ pve_workload_ct_configs.results }}"
  loop_control:
    label: "{{ item.item.vmid }} {{ item.item.hostname }}"

- name: Check VMID 1122 is not already registered as an LXC workload CT
  ansible.builtin.assert:
    that:
      - >-
        (pve_workload_ct_configs.results | selectattr('item.vmid', 'equalto', 1122)
        | selectattr('rc', 'equalto', 0) | list | length) == 0
    fail_msg: "VMID 1122 appears in the workload inventory as a CT; the fixed Juju mapping requires 1122 to be a KVM guest. Verify the migration by hand first."

- name: Validate secondary network NIC identity of existing OpenStack workload CTs
  ansible.builtin.assert:
    that:
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=pub11')
        | select('search', 'ip=192[.]168[.]11[.]' ~ (item.item.vmid | int - 1000) ~ '/24')
        | select('search', 'gw=192[.]168[.]11[.]1')
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=pub12')
        | select('search', 'ip=' ~ item.item.secondary_networks.oam ~ '/24')
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=int13')
        | select('search', 'ip=' ~ item.item.secondary_networks.internal ~ '/24')
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=int14')
        | select('search', 'ip=' ~ item.item.secondary_networks.storage ~ '/24')
        | list | length) == 1
    fail_msg: "the oam/internal/storage NICs of VMID {{ item.item.vmid }} do not match the declared addresses; refusing to reuse it."
  loop: "{{ pve_workload_ct_configs.results | selectattr('item.tags', 'search', 'openstack') | list }}"
  loop_control:
    label: "{{ item.item.vmid }} {{ item.item.hostname }}"

- name: Validate PVE compute uplink variable invariants
  ansible.builtin.assert:
    that:
      - pve_compute_uplink_bridge in pve_juju_network_spaces | map(attribute='bridge') | list
      - pve_compute_uplink_pve_net_index | int == 4
      - pve_compute_uplink_guest_interface is match('^ens[0-9]+$')
      - pve_compute_uplink_vmids | sort == [1101, 1102, 1122]
    fail_msg: "the dedicated uplink must be net4 on a compute node and free of L3; existing guests only start after the NIC is added when that is explicitly authorised."

- name: Validate existing compute CT uplink NIC configuration
  ansible.builtin.assert:
    that:
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('match', '^net4:') | list | length) == 0 or
        (
          (item.stdout_lines | select('match', '^net4:') | list | length) == 1
          and
          (item.stdout_lines | select('match', '^net4:') | first)
            is search('name=' ~ pve_compute_uplink_guest_interface ~ '(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first)
            is search('bridge=' ~ pve_compute_uplink_bridge ~ '(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first) is search('ip=manual(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first) is not search('(?:^|,)gw=')
        )
    fail_msg: >-
      compute CT VMID {{ item.item.vmid }} already has net4, but it is not the L3-free
      {{ pve_compute_uplink_guest_interface }}->{{ pve_compute_uplink_bridge }} uplink; refusing to overwrite it.
  loop: >-
    {{ pve_workload_ct_configs.results
       | selectattr('item.vmid', 'in', pve_compute_uplink_vmids | difference([1122])) | list }}
  loop_control:
    label: "CT {{ item.item.vmid }}"

- name: Read runtime state of existing compute CTs missing the uplink NIC
  ansible.builtin.command: "pct status {{ item.item.vmid }}"
  register: pve_compute_uplink_ct_status
  changed_when: false
  when:
    - item.rc == 0
    - (item.stdout_lines | select('match', '^net4:') | list | length) == 0
  loop: >-
    {{ pve_workload_ct_configs.results
       | selectattr('item.vmid', 'in', pve_compute_uplink_vmids | difference([1122])) | list }}
  loop_control:
    label: "CT {{ item.item.vmid }}"

- name: Require existing compute CTs to be stopped before adding a missing uplink NIC
  ansible.builtin.assert:
    that:
      - '"status: stopped" in item.stdout'
      - pve_start_existing_compute_after_uplink | bool
    fail_msg: >-
      CT {{ item.item.item.vmid }} needs its dedicated pub11 uplink but is either running, or
      pve_start_existing_compute_after_uplink is false. Stop it in a controlled maintenance window
      and rerun with -e pve_start_existing_compute_after_uplink=true to authorize NIC addition and
      the normal pve-machines startup stage.
  loop: "{{ pve_compute_uplink_ct_status.results | default([]) | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "CT {{ item.item.item.vmid }}"

- name: Add missing uplink NIC to stopped compute CTs
  ansible.builtin.command:
    argv:
      - pct
      - set
      - "{{ item.item.item.vmid }}"
      - --net4
      - "name={{ pve_compute_uplink_guest_interface }},bridge={{ pve_compute_uplink_bridge }},ip=manual"
  loop: "{{ pve_compute_uplink_ct_status.results | default([]) | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "CT {{ item.item.item.vmid }}"

- name: Read Juju client public key
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - -
      - "{{ pve_juju_client_user }}"
      - -c
      - cat ~/.ssh/id_ed25519.pub
  register: pve_juju_client_pubkey
  changed_when: false

- name: Check whether the Juju client key is authorized on the MAAS CT
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - bash
      - -lc
      - "grep -qxF {{ pve_juju_client_pubkey.stdout | quote }} /home/{{ pve_juju_client_user }}/.ssh/authorized_keys"
  register: pve_juju_client_key_authorized
  failed_when: false
  changed_when: false

- name: Authorize the Juju client key for the MAAS CT user
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - bash
      - -lc
      - >-
        install -d -m 0700 -o {{ pve_juju_client_user }} -g {{ pve_juju_client_user }} /home/{{ pve_juju_client_user }}/.ssh;
        touch /home/{{ pve_juju_client_user }}/.ssh/authorized_keys;
        grep -qxF {{ pve_juju_client_pubkey.stdout | quote }} /home/{{ pve_juju_client_user }}/.ssh/authorized_keys
        || printf '%s\\n' {{ pve_juju_client_pubkey.stdout | quote }} >> /home/{{ pve_juju_client_user }}/.ssh/authorized_keys;
        chown {{ pve_juju_client_user }}:{{ pve_juju_client_user }} /home/{{ pve_juju_client_user }}/.ssh/authorized_keys;
        chmod 0600 /home/{{ pve_juju_client_user }}/.ssh/authorized_keys
  when: pve_juju_client_key_authorized.rc != 0

- name: Copy Juju client public key to PVE for workload bootstrapping
  ansible.builtin.copy:
    content: "{{ pve_juju_client_pubkey.stdout | trim }}\n"
    dest: /root/juju-client.pub
    owner: root
    group: root
    mode: "0600"

- name: Copy Juju CT initialization script to PVE host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/pve/scripts/juju-ct-init.sh"
    dest: /root/juju-ct-init.sh
    owner: root
    group: root
    mode: "0700"

- name: Create missing Juju workload LXC containers
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    hostname={{ item.hostname }}
    ip={{ item.ip }}
    tags={{ item.tags }}
    if pct config "$vmid" >/dev/null 2>&1; then
      echo "EXISTS-SKIP $vmid $hostname"
      exit 0
    fi
    networks=(--net0 "name=eth0,bridge=pub11,ip=${ip}/24,gw=192.168.11.1")
    if [[ "$tags" == *openstack* ]]; then
      networks+=(
        --net1 "name=eth1,bridge=pub12,ip={{ item.secondary_networks.oam }}/24"
        --net2 "name=eth2,bridge=int13,ip={{ item.secondary_networks.internal }}/24"
        --net3 "name=eth3,bridge=int14,ip={{ item.secondary_networks.storage }}/24"
      )
      if [[ "$vmid" == "1101" || "$vmid" == "1102" ]]; then
        networks+=(--net4 "name={{ pve_compute_uplink_guest_interface }},bridge={{ pve_compute_uplink_bridge }},ip=manual")
      fi
    fi
    pct create "$vmid" '{{ pve_focal_template }}' \
      --hostname "$hostname" --ostype ubuntu --cores 2 --memory 4096 --swap 0 \
      --rootfs '{{ pve_storage }}:16' --unprivileged 0 --features nesting=1,fuse=1 \
      "${networks[@]}" \
      --nameserver 8.8.8.8 --tags "$tags" --onboot 1 --startup 'order=3' \
      >"/var/tmp/ctcreate-${vmid}.log" 2>&1
    echo "CREATE-OK $vmid $hostname"
  args:
    executable: /bin/bash
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }} {{ item.ip }}"

- name: Read compute CT configurations after optional uplink NIC addition or creation
  ansible.builtin.command: "pct config {{ item }}"
  register: pve_compute_uplink_ct_configs_after
  changed_when: false
  loop: "{{ pve_compute_uplink_vmids | difference([1122]) }}"
  loop_control:
    label: "CT {{ item }}"

- name: Verify compute CT uplink NIC configuration after provisioning
  ansible.builtin.assert:
    that:
      - "item.stdout is search('(?m)^net4: .*name=' ~ pve_compute_uplink_guest_interface ~ '(?:,|$)')"
      - "item.stdout is search('(?m)^net4: .*bridge=' ~ pve_compute_uplink_bridge ~ '(?:,|$)')"
      - "item.stdout is search('(?m)^net4: .*ip=manual(?:,|$)')"
      - "item.stdout is not search('(?m)^net4: .*gw=')"
    fail_msg: "the dedicated uplink config of CT {{ item.item }} was not written persistently; refusing to register machines."
  loop: "{{ pve_compute_uplink_ct_configs_after.results }}"
  loop_control:
    label: "CT {{ item.item }}"

- name: Ensure workload LXC containers can run Juju agents
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    marker: "# {mark} ANSIBLE JUJU LXC SETTINGS"
    block: |
      lxc.apparmor.profile: unconfined
      lxc.cap.drop:
      lxc.cap.drop: mac_override sys_time sys_module sys_rawio
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Start workload LXC containers
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    if ! pct status "$vmid" | grep -q 'status: running'; then
      pct start "$vmid"
      echo "STARTED $vmid"
    fi
  args:
    executable: /bin/bash
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"
  register: pve_workload_ct_start
  changed_when: "'STARTED ' in pve_workload_ct_start.stdout"

- name: Initialize workload CTs and authorize the Juju client
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    key=$(< /root/juju-client.pub)
    for attempt in $(seq 1 15); do
      if pct exec "$vmid" -- env JUJU_CLIENT_PUBKEY="$key" bash -s </root/juju-ct-init.sh 2>/dev/null; then
        exit 0
      fi
      sleep 4
    done
    echo "CT $vmid did not finish juju-ct-init.sh" >&2
    exit 1
  args:
    executable: /bin/bash
  loop: "{{ pve_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Create KVM workload VM 1122 and register its Juju client key
  ansible.builtin.include_tasks: kvm-1122.yml
  vars:
    pve_kvm_1122_secondary_networks: >-
      {{ pve_workload_secondary_network_ips.get(1122, pve_workload_secondary_network_ips.get('1122', {})) }}
  when: pve_create_kvm_1122 | bool

- name: Copy Juju workload registration helper to PVE host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pve-machines/files/add-juju-machine.sh"
    dest: /root/add-juju-machine.sh
    owner: root
    group: root
    mode: "0700"

- name: Install Juju workload registration helper in MAAS CT
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ pve_juju_client_vmid }}"
      - /root/add-juju-machine.sh
      - /usr/local/sbin/add-juju-machine.sh
      - --perms
      - "0755"
  changed_when: false

- name: Copy Juju workload registration script to PVE host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/pve/scripts/register-workload-machines.sh"
    dest: /root/register-workload-machines.sh
    owner: root
    group: root
    mode: "0700"

- name: Install MAAS controller IP in Juju client known_hosts
  ansible.builtin.shell: |
    set -euo pipefail
    ip={{ pve_maas_ip }}
    if pct exec {{ pve_juju_client_vmid }} -- su - {{ pve_juju_client_user }} -c \
      "install -d -m 0700 ~/.ssh; touch ~/.ssh/known_hosts; \
       ssh-keygen -F \"[$ip]:22\" -f ~/.ssh/known_hosts >/dev/null || \
         ssh-keygen -F \"$ip\" -f ~/.ssh/known_hosts >/dev/null"; then
      exit 0
    fi
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    for attempt in $(seq 1 12); do
      if ssh-keyscan -T 3 -H "$ip" >"$tmp" 2>/dev/null && [ -s "$tmp" ]; then
        pct exec {{ pve_juju_client_vmid }} -- su - {{ pve_juju_client_user }} -c 'cat >> ~/.ssh/known_hosts' <"$tmp"
        exit 0
      fi
      sleep 5
    done
    echo "SSH did not become available on MAAS client $ip" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Install controller host key in Juju client known_hosts
  ansible.builtin.shell: |
    set -euo pipefail
    ip={{ pve_juju_controller_ip }}
    if pct exec {{ pve_juju_client_vmid }} -- su - {{ pve_juju_client_user }} -c \
      "install -d -m 0700 ~/.ssh; touch ~/.ssh/known_hosts; \
       ssh-keygen -F \"[$ip]:22\" -f ~/.ssh/known_hosts >/dev/null || \
         ssh-keygen -F \"$ip\" -f ~/.ssh/known_hosts >/dev/null"; then
      exit 0
    fi
    keyscan=$(ssh-keyscan -H "$ip" 2>/dev/null)
    [[ -n "$keyscan" ]] || { echo "SSH did not become available on Juju controller $ip" >&2; exit 1; }
    printf '%s\n' "$keyscan" | pct exec {{ pve_juju_client_vmid }} -- su - {{ pve_juju_client_user }} -c 'cat >> ~/.ssh/known_hosts'
  args:
    executable: /bin/bash
  changed_when: false

- name: Register and verify PVE workload machine IDs
  ansible.builtin.command: /root/register-workload-machines.sh
  environment:
    CLIENT_VMID: "{{ pve_juju_client_vmid }}"
    CLIENT_USER: "{{ pve_juju_client_user }}"
    JUJU_BIN: "{{ pve_juju_bin }}"
  register: pve_workload_registration
  changed_when: "'JUJU-WORKLOAD-MAPPING-CHANGED' in pve_workload_registration.stdout"
