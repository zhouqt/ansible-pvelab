---

juju_controller_name: "lxd-os-ctrl"
juju_model_name: "openstack"

nck_juju_ssh_key_path: "/home/zhouqt/.local/share/juju/ssh/juju_id_rsa"
nck_juju_ssh_pubkey_path: "/home/zhouqt/.local/share/juju/ssh/juju_id_rsa.pub"

nck_app: "nova-compute-kvm"
nck_series: "focal"
nck_channel: "ussuri/stable"
nck_ntp_channel: "stable"
nck_nrpe_channel: "stable"
nck_ovn_chassis_channel: "20.03/stable"

nck_lxd_project: "openstack"
nck_lxd_image_alias: "focal-vm"
nck_vm_name: "nova-compute-kvm"
nck_vm_cpu: 4
nck_vm_memory: "8GiB"
nck_vm_root_disk: "30GiB"

nck_eth0_bridge: "lxdbr165"
nck_eth1_bridge: "lxdbr165"
nck_eth0_ip: ""
nck_eth1_ip: "192.168.165.201"
nck_br_ex_ip: "192.168.122.195"
nck_internal_cidr: "192.168.165.0/24"
nck_internal_gw: "192.168.165.1"
nck_external_gw: "192.168.122.1"
nck_external_cidr: "192.168.122.0/24"
nck_dns: "8.8.8.8,8.8.4.4"

nck_vm_boot_timeout: 300
nck_vm_boot_poll_interval: 5

nck_aggregate_name: "iscsi-pool"
nck_availability_zone: "oceanstor"

nck_sim_iscsi_target_ip: "192.168.165.1"

nck_active_wait_retries: 60
nck_active_wait_delay: 10
