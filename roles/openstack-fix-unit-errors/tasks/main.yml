---
- name: Switch to openstack model
  shell: "{{ juju_openstack_cmd }} switch {{ juju_controller_name }}:admin/{{ juju_model_name }}"
  changed_when: false

- name: Install locale in MySQL containers
  shell: |
    for unit in mysql-innodb-cluster/0 mysql-innodb-cluster/1 mysql-innodb-cluster/2; do
      echo "Installing locale in $unit"
      {{ juju_openstack_cmd }} ssh $unit 'sudo apt-get update -qq && sudo apt-get install -qq -y locales && sudo locale-gen en_US.UTF-8' 2>/dev/null || true
    done
  register: locale_install
  changed_when: true
  ignore_errors: true

- name: Wait for locale installation
  shell: sleep 20
  changed_when: false

- name: Check MySQL cluster status
  shell: |
    {{ juju_openstack_cmd }} run-action mysql-innodb-cluster/0 cluster-status --wait 2>&1 | grep -E "status|ONLINE|OFFLINE|MISSING" || echo "Cluster check failed"
  register: mysql_cluster_status
  changed_when: false
  ignore_errors: true

- name: Display MySQL cluster status
  debug:
    msg: "MySQL Cluster Status: {{ mysql_cluster_status.stdout }}"

- name: Reboot MySQL cluster from complete outage
  shell: |
    {{ juju_openstack_cmd }} run-action mysql-innodb-cluster/0 reboot-cluster-from-complete-outage --wait 2>&1
  register: mysql_reboot
  changed_when: "'successfully' in mysql_reboot.stdout or 'restored' in mysql_reboot.stdout"
  ignore_errors: true

- name: Check if cluster was restored
  shell: |
    {{ juju_openstack_cmd }} run-action mysql-innodb-cluster/0 cluster-status --wait 2>&1 | grep "status.*OK" || echo "Cluster not fully restored"
  register: cluster_check
  changed_when: false
  ignore_errors: true

- name: Rejoin offline MySQL instances
  shell: |
    {{ juju_openstack_cmd }} ssh mysql-innodb-cluster/0 -- "sudo lxc exec juju-059f13-0-lxd-3 -- /snap/bin/mysqlsh --no-wizard --uri clusteruser@192.168.165.50 --password={{ mysql_cluster_password }} -e 'cluster = dba.get_cluster(\"jujuCluster\"); cluster.rejoin_instance(\"clusteruser@192.168.165.50:3306\")'" 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh mysql-innodb-cluster/0 -- "sudo lxc exec juju-059f13-0-lxd-3 -- /snap/bin/mysqlsh --no-wizard --uri clusteruser@192.168.165.59 --password={{ mysql_cluster_password }} -e 'cluster = dba.get_cluster(\"jujuCluster\"); cluster.rejoin_instance(\"clusteruser@192.168.165.50:3306\")'" 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Force remove offline instances from cluster
  shell: |
    {{ juju_openstack_cmd }} ssh mysql-innodb-cluster/0 -- "sudo lxc exec juju-059f13-0-lxd-3 -- /snap/bin/mysqlsh --no-wizard --uri clusteruser@192.168.165.59 --password={{ mysql_cluster_password }} --cluster -e 'cluster.remove_instance(\"clusteruser@192.168.165.50:3306\", {force: true})'" 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh mysql-innodb-cluster/0 -- "sudo lxc exec juju-059f13-0-lxd-3 -- /snap/bin/mysqlsh --no-wizard --uri clusteruser@192.168.165.59 --password={{ mysql_cluster_password }} --cluster -e 'cluster.remove_instance(\"clusteruser@192.168.165.53:3306\", {force: true})'" 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Wait for cluster to stabilize
  shell: sleep 10
  changed_when: false

- name: Restart MySQL router services
  shell: |
    for unit in keystone-mysql-router/0 cinder-mysql-router/0 glance-mysql-router/0 nova-mysql-router/0 neutron-mysql-router/0 dashboard-mysql-router/0 placement-mysql-router/0 vault-mysql-router/0; do
      echo "Restarting $unit"
      {{ juju_openstack_cmd }} ssh $unit 'sudo systemctl restart mysql-router' 2>/dev/null || true
    done
  changed_when: true
  ignore_errors: true

- name: Restart MySQL InnoDB Cluster units
  shell: |
    for unit in mysql-innodb-cluster/0 mysql-innodb-cluster/1 mysql-innodb-cluster/2; do
      echo "Restarting $unit"
      {{ juju_openstack_cmd }} ssh $unit 'sudo systemctl restart mysql' 2>/dev/null || true
    done
  changed_when: true
  ignore_errors: true

- name: Wait for MySQL to stabilize
  shell: sleep 30
  changed_when: false

- name: Force complete cache flush and restart OpenStack services
  shell: |
    {{ juju_openstack_cmd }} ssh keystone/0 -- 'sudo systemctl restart apache2 keystone-mysql-router memcached' 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh nova-cloud-controller/0 -- 'sudo systemctl restart apache2 nova-mysql-router memcached nova-conductor nova-scheduler' 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh neutron-api/0 -- 'sudo systemctl restart apache2 neutron-mysql-router memcached neutron-server' 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh glance/0 -- 'sudo systemctl restart glance-api' 2>/dev/null || true
    {{ juju_openstack_cmd }} ssh cinder/0 -- 'sudo systemctl restart cinder-api' 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Wait for services to stabilize
  shell: sleep 30
  changed_when: false

- name: Run deferred hooks on ceph-mon units
  shell: |
    {{ juju_openstack_cmd }} run-action ceph-mon/0 run-deferred-hooks --wait 2>/dev/null || true
    {{ juju_openstack_cmd }} run-action ceph-mon/1 run-deferred-hooks --wait 2>/dev/null || true
    {{ juju_openstack_cmd }} run-action ceph-mon/2 run-deferred-hooks --wait 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Wait for hooks to complete
  shell: sleep 15
  changed_when: false

- name: Check final unit status
  shell: '{{ juju_openstack_cmd }} status --format json 2>/dev/null | jq ".applications | to_entries[] | select(.value.status==\"error\") | \"\(.key): \(.value.status) - \(.value.message // \"no message\")\""'
  register: error_units
  changed_when: false
  ignore_errors: true

- name: Display error units
  debug:
    msg: "Remaining error units: {{ error_units.stdout | default('None') }}"

