---
pve_obs_cos_hub_pct_bin: /usr/sbin/pct

pve_openstack_obs_series: [jammy, noble]

pve_openstack_obs_place_on: keystone

pve_openstack_obs_nrpe_channel: "{{ pve_obs_cos_hub_nrpe_channel }}"
pve_openstack_obs_cos_proxy_channel: "{{ pve_obs_cos_hub_cos_proxy_channel }}"
pve_openstack_obs_grafana_agent_channel: "{{ pve_obs_cos_hub_grafana_agent_channel }}"
pve_openstack_obs_openstack_exporter_channel: latest/stable

pve_openstack_obs_enable_nrpe: true
pve_openstack_obs_enable_openstack_exporter: true

pve_openstack_obs_skip_wait: false

pve_openstack_obs_verify_budget: 900
pve_openstack_obs_verify_interval: 15
