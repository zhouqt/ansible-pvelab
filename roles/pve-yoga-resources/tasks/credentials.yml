---

- name: Read the OpenStack Juju status to locate the Keystone unit
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} status -m {{ pve_yoga_model }} --format json"
  delegate_to: "{{ pve_host }}"
  register: pve_yoga_resources_status
  changed_when: false

- name: Require the yoga model to be deployed with a Keystone unit
  ansible.builtin.assert:
    that:
      - pve_yoga_resources_status.rc == 0
      - "'keystone' in (pve_yoga_resources_status.stdout | from_json).applications"
      - "((pve_yoga_resources_status.stdout | from_json).applications['keystone'].units | length) > 0"
    fail_msg: >-
      {{ pve_yoga_model }} has no keystone unit. Run --tags pve-yoga-control-plane first
      bring the control plane up, then run pve-yoga-resources.

- name: Derive the Keystone endpoint address from the Juju status
  ansible.builtin.set_fact:
    pve_yoga_keystone_address: >-
      {{ ((pve_yoga_resources_status.stdout | from_json).applications['keystone'].units
          | dict2items | map(attribute='value') | map(attribute='public-address') | first) }}

- name: Derive the Keystone guest id from its public address
  ansible.builtin.set_fact:
    pve_yoga_keystone_vmid: >-
      {{ (pve_yoga_keystone_address.split('.') | last | int) + (pve_yoga_ip_offset | int) }}

- name: Require the derived Keystone guest to exist on the PVE host
  ansible.builtin.command: "pct status {{ pve_yoga_keystone_vmid }}"
  delegate_to: "{{ pve_host }}"
  changed_when: false

- name: Fetch this environment's Vault CA certificate from the Keystone guest
  ansible.builtin.command: >-
    pct exec {{ pve_yoga_keystone_vmid }} --
    cat /usr/local/share/ca-certificates/vault_juju_ca_cert.crt
  delegate_to: "{{ pve_host }}"
  register: pve_yoga_resources_ca
  changed_when: false

- name: Require a non-empty Vault CA certificate
  ansible.builtin.assert:
    that:
      - pve_yoga_resources_ca.rc == 0
      - "'BEGIN CERTIFICATE' in pve_yoga_resources_ca.stdout"
    fail_msg: >-
      could not fetch vault_juju_ca_cert.crt from CT {{ pve_yoga_keystone_vmid }}.
      make sure this env's vault is initialised and its CA distributed (--tags pve-yoga-control-plane).

- name: Install the Vault CA certificate next to the client RC
  ansible.builtin.copy:
    content: "{{ pve_yoga_resources_ca.stdout }}\n"
    dest: "{{ pve_yoga_ca_cert_file }}"
    mode: "0644"

- name: Require the Keystone admin password for this environment
  ansible.builtin.assert:
    that: pve_yoga_keystone_admin_password | length > 0
    fail_msg: >-
      cannot obtain the keystone admin password of {{ pve_yoga_env_slug }}. Check
      {{ pve_yoga_keystone_admin_password_file }}, or use
      pass it with -e vault_pve_yoga_keystone_admin_password=...

- name: Write the static OpenStack client RC for this environment
  ansible.builtin.template:
    src: admin-openrc.sh.j2
    dest: "{{ pve_yoga_openrc_file }}"
    mode: "0600"
