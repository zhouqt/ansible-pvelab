---
- name: Check existing Juju controllers
  shell: "{{ juju_openstack_cmd }} controllers --format json 2>/dev/null || echo \"{}\""
  register: existing_controllers
  changed_when: false

- name: Parse existing controllers list
  set_fact:
    controller_list: []
  when: existing_controllers.stdout == '{"controllers":null,"current-controller":""}' or existing_controllers.stdout == '{}'
  changed_when: false

- name: Check if any localhost controller exists
  shell: "{{ juju_openstack_cmd }} controllers --format yaml 2>/dev/null | grep -i localhost || echo \"none\""
  register: localhost_check
  changed_when: false

- name: Destroy localhost controllers if exist
  shell: |
    for ctrl in $({{ juju_openstack_cmd }} controllers --format yaml 2>/dev/null | grep -i localhost | awk '{print $2}'); do
      {{ juju_openstack_cmd }} destroy-controller $ctrl --destroy-all-models --destroy-storage -y 2>&1 || true
    done
  when: "'localhost' in localhost_check.stdout"
  register: destroy_result
  changed_when: true

- name: Wait for controller destruction to complete
  pause:
    seconds: 15
  when: "'localhost' in localhost_check.stdout"

- name: Clean up leftover LXD containers from wrong deployment
  shell: |
    for container in $(lxc list --format json | jq -r '.[] | select(.name | startswith("juju-")) | .name'); do
      lxc stop $container --force 2>/dev/null || true
      lxc delete $container --force 2>/dev/null || true
    done
  register: cleanup_containers
  changed_when: cleanup_containers.stdout != ''

