---

- name: Define the isolated Juju 3.x command prefix
  ansible.builtin.set_fact:
    pve_yoga_juju_cmd: "JUJU_DATA={{ pve_yoga_juju_data }} {{ pve_yoga_juju_bin }}"
    pve_yoga_model: "{{ pve_yoga_controller_name }}:{{ pve_yoga_model_name }}"

- name: Read OpenStack Juju status before configuring spaces
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} status -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_network_status
  changed_when: false

- name: Require machines 0-5 registered with no applications before space changes
  ansible.builtin.assert:
    that:
      - pve_yoga_network_status.rc == 0
      - "'machines' in (pve_yoga_network_status.stdout | from_json)"
      - >-
        ((pve_yoga_network_status.stdout | from_json).machines | default({}, true)
          | dict2items | map(attribute='key') | map('int') | list | sort)
        == (range(0, pve_yoga_workload_vmids | length) | list)
      - >-
        (((pve_yoga_network_status.stdout | from_json).applications | default({}, true) | length) == 0)
    fail_msg: >-
      Juju machines 0-5 are not all registered yet, or an application already exists. Spaces can only be configured after the machines report
      all the NICs and before any charm is deployed.

- name: Read Juju subnet inventory before space changes
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} subnets -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_network_subnets_before
  changed_when: false

- name: Require Juju to have discovered exactly the four declared CIDRs
  ansible.builtin.assert:
    that:
      - pve_yoga_network_subnets_before.rc == 0
      - "'subnets' in (pve_yoga_network_subnets_before.stdout | from_json)"
      - >-
        (((pve_yoga_network_subnets_before.stdout | from_json).subnets | default({}, true)).keys() | list | sort)
        == (pve_yoga_network_spaces | map(attribute='cidr') | list | sort)
    fail_msg: >-
      the Juju subnet list is not exactly the four CIDRs {{ pve_yoga_network_spaces | map(attribute='cidr') | join('/') }}.
      make sure every workload guest reports all four NICs, then retry.

- name: Read existing Juju spaces
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} spaces -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_network_spaces_before
  changed_when: false

- name: Create missing Juju spaces
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} add-space {{ item.name }} -m {{ pve_yoga_model }}"
  loop: "{{ pve_yoga_network_spaces }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (pve_yoga_network_spaces_before.stdout | from_json).spaces | map(attribute='name') | list

- name: Move each discovered subnet into its declared space
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} move-to-space {{ item.name }} {{ item.cidr }} -m {{ pve_yoga_model }} --force"
  loop: "{{ pve_yoga_network_spaces }}"
  loop_control:
    label: "{{ item.name }} {{ item.cidr }}"
  register: pve_yoga_network_move_results
  failed_when: false
  changed_when: false

- name: Report any refused subnet move (Juju may reject the bootstrap subnet)
  ansible.builtin.debug:
    msg: >-
      move-to-space {{ item.item.name }} {{ item.item.cidr }} returned rc={{ item.rc }}:
      {{ item.stderr | default('') | trim }}. If Juju refuses to use the machine the bootstrap lives on
      moving {{ pve_yoga_public_cidr }} out of alpha; use the fallback (keep alpha, bind with public=alpha,
      see docs/pve-yoga-openstack-deploy-runbook.md).
  loop: "{{ pve_yoga_network_move_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0

- name: Read final Juju subnet inventory
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} subnets -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_network_subnets_after
  changed_when: false

- name: Require every declared subnet to be assigned to its space
  ansible.builtin.assert:
    that:
      - pve_yoga_network_subnets_after.rc == 0
      - >-
        (pve_yoga_network_subnets_after.stdout | from_json).subnets[item.cidr].space == item.name
    fail_msg: >-
      subnet {{ item.cidr }} is not in the expected space {{ item.name }}. If Juju treats {{ pve_yoga_public_cidr }} as
      refusing to move it out of alpha; use the fallback and record it in the runbook.
  loop: "{{ pve_yoga_network_spaces }}"
  loop_control:
    label: "{{ item.name }} {{ item.cidr }}"

- name: Read OpenStack Juju model default space
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} model-config -m {{ pve_yoga_model }} default-space"
  register: pve_yoga_network_default_space_before
  changed_when: false

- name: Set OpenStack Juju model default space to internal
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} model-config -m {{ pve_yoga_model }} default-space={{ pve_yoga_default_space }}"
  when: pve_yoga_network_default_space_before.stdout | trim != pve_yoga_default_space

- name: Read configured OpenStack Juju model default space
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} model-config -m {{ pve_yoga_model }} default-space"
  register: pve_yoga_network_default_space_after
  changed_when: false

- name: Verify OpenStack Juju model default space
  ansible.builtin.assert:
    that:
      - pve_yoga_network_default_space_after.rc == 0
      - pve_yoga_network_default_space_after.stdout | trim == pve_yoga_default_space
    fail_msg: "model default-space is not {{ pve_yoga_default_space }}; fix it before deploying any charm."

- name: Read final Juju space inventory
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_yoga_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_yoga_juju_client_user }}"
      - -c
      - "{{ pve_yoga_juju_cmd }} spaces -m {{ pve_yoga_model }} --format json"
  register: pve_yoga_network_spaces_after
  changed_when: false

- name: Require each Juju space to contain exactly its declared subnet
  ansible.builtin.assert:
    that:
      - >-
        ((pve_yoga_network_spaces_after.stdout | from_json).spaces
          | selectattr('name', 'equalto', item.name)
          | map(attribute='subnets') | map('default', {}) | map('dict2items')
          | flatten | map(attribute='key') | list | sort) == [item.cidr]
    fail_msg: "Juju space {{ item.name }} must contain exactly the subnet {{ item.cidr }}."
  loop: "{{ pve_yoga_network_spaces }}"
  loop_control:
    label: "{{ item.name }} {{ item.cidr }}"
