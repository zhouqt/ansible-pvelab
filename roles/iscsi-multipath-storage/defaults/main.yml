---

iscsi_storage_file: "/home/iscsi-storage.img"
iscsi_storage_size: "50G"
iscsi_vg_name: "cinder-iscsi"

iscsi_container_name: "cinder-volume-host"
iscsi_container_project: "default"

iscsi_portal_ip_1: "192.168.165.250"
iscsi_portal_ip_2: "192.168.166.250"
iscsi_portal_bridge_1: "virbr1"
iscsi_portal_bridge_2: "virbr2"
iscsi_internet_bridge: "virbr0"
iscsi_gateway: "192.168.122.1"

iscsi_cinder_host: "cinder"
iscsi_volume_backend_name: "LVM_iSCSI"

iscsi_juju_model: "os-controller:openstack"

iscsi_compute_virbr2_ips:
  os-comp-v2-1: "192.168.166.94"
  os-comp-v2-2: "192.168.166.95"

iscsi_compute_juju_machines:
  os-comp-v2-1: "2"
  os-comp-v2-2: "4"

iscsi_compute_lxd_project: "maas-managed"

iscsi_mysql_juju_unit: "mysql-innodb-cluster/3"

iscsi_juju_cmd: "juju"

iscsi_compute_virbr2_nic: "enp7s0"

iscsi_openstack_rc: "{{ project_dir }}/credentials/admin-openrc.sh"
