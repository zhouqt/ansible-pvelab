---

- name: Require an explicit opt-in before restoring a savepoint
  ansible.builtin.assert:
    that:
      - pve_openstack_savepoint_restore | bool
    fail_msg: "a restore from a savepoint is refused by default. Once you are sure, add -e pve_openstack_savepoint_restore=true"

- name: Require a savepoint name
  ansible.builtin.assert:
    that:
      - pve_openstack_savepoint_name | length > 0
      - pve_openstack_savepoint_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,30}$')
    fail_msg: "pve_openstack_savepoint_name is required and may only contain letters, digits and . _ -"

- name: Define the restore member lists
  ansible.builtin.set_fact:
    pve_openstack_savepoint_prefix: "sp-{{ pve_openstack_env_slug }}-{{ pve_openstack_savepoint_name }}"
    pve_openstack_savepoint_workload: >-
      {%- set out = [] -%}
      {%- for vmid in pve_openstack_workload_vmids -%}
        {%- set kind = 'kvm' if (vmid | int) == (pve_openstack_workload_kvm_vmid | int) else 'ct' -%}
        {%- set _ = out.append({'role': 'm%02d' | format(loop.index0 + 1),
                                'vmid': vmid | int, 'kind': kind}) -%}
      {%- endfor -%}
      {{ out }}
    pve_openstack_savepoint_osd_lvs: >-
      {%- set out = [] -%}
      {%- for idx in range(pve_openstack_osd_vmids | length) -%}
        {%- set _ = out.append(pve_openstack_env_slug ~ '-osd-' ~ (idx | string)) -%}
      {%- endfor -%}
      {{ out }}
    pve_openstack_snat_cidrs: >-
      {{ pve_openstack_network_spaces | selectattr('snat', 'defined') | selectattr('snat')
         | map(attribute='cidr') | list }}

- name: Assemble the full guest member list
  ansible.builtin.set_fact:
    pve_openstack_savepoint_guests: >-
      {{ [{'role': 'ctrl', 'vmid': pve_openstack_controller_vmid | int, 'kind': 'ct'}]
         + pve_openstack_savepoint_workload }}

- name: Require every savepoint base to exist before touching the live volumes
  ansible.builtin.shell: |
    set -euo pipefail
    missing=""
    for role in {{ pve_openstack_savepoint_guests | map(attribute='role') | join(' ') }}; do
      base="{{ pve_openstack_savepoint_prefix }}-$role"
      lvs --noheadings -o lv_name pve-thin-pool/"$base" >/dev/null 2>&1 || missing="$missing $base"
    done
    i=0
    for origin in {{ pve_openstack_savepoint_osd_lvs | join(' ') }}; do
      base="{{ pve_openstack_savepoint_prefix }}-osd$i"
      lvs --noheadings -o lv_name pve-thin-pool/"$base" >/dev/null 2>&1 || missing="$missing $base"
      i=$((i + 1))
    done
    [ -z "$missing" ] || { echo "SAVEPOINT-MISSING:$missing" >&2; exit 1; }
    echo "SAVEPOINT-BASES-OK"
  args:
    executable: /bin/bash
  changed_when: false

- name: Restore this environment's SNAT rules
  ansible.builtin.shell: |
    set -euo pipefail
    snat_ip=$(ip -4 -o addr show vmbr0 | awk '{print $4}' | cut -d/ -f1 | head -1)
    [ -n "$snat_ip" ] || { echo "RESTORE-FAIL: vmbr0 has no IPv4 address" >&2; exit 1; }
    n=0
    for cidr in {{ pve_openstack_snat_cidrs | join(' ') }}; do
      if ! iptables -t nat -C POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip" 2>/dev/null; then
        iptables -t nat -A POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip"
        n=$((n + 1))
      fi
    done
    echo "RESTORE-SNAT-DONE added=$n to=$snat_ip"
  args:
    executable: /bin/bash
  register: pve_openstack_restore_snat
  changed_when: "'added=0' not in pve_openstack_restore_snat.stdout"
  when: pve_openstack_snat_cidrs | length > 0

- name: Stop every guest before swapping its rootfs volume
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    {% if item.kind == 'kvm' %}
    qm status "$vmid" | grep -q 'status: running' && qm shutdown "$vmid" --timeout 120 || true
    qm status "$vmid" | grep -q 'status: running' && qm stop "$vmid" || true
    {% else %}
    pct status "$vmid" | grep -q 'status: running' && pct shutdown "$vmid" --timeout 120 || true
    pct status "$vmid" | grep -q 'status: running' && pct stop "$vmid" || true
    {% endif %}
    echo "RESTORE-STOPPED $vmid"
  args:
    executable: /bin/bash
  loop: "{{ pve_openstack_savepoint_guests }}"
  loop_control:
    label: "{{ item.role }} ({{ item.vmid }})"
  changed_when: true

- name: Swap each guest rootfs volume back to the savepoint
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    base="{{ pve_openstack_savepoint_prefix }}-{{ item.role }}"
    {% if item.kind == 'kvm' %}
    origin=$(qm config "$vmid" | sed -n 's/^scsi0: *pve-thin-pool:\([^,]*\).*/\1/p')
    {% else %}
    origin=$(pct config "$vmid" | sed -n 's/^rootfs: *pve-thin-pool:\([^,]*\).*/\1/p')
    {% endif %}
    [ -n "$origin" ] || { echo "RESTORE-FAIL $vmid: cannot resolve the volume name" >&2; exit 1; }
    lvremove --yes "pve-thin-pool/$origin"
    lvcreate --yes --snapshot --name "$origin" "pve-thin-pool/$base"
    echo "RESTORE-SWAPPED $origin from $base"
  args:
    executable: /bin/bash
  loop: "{{ pve_openstack_savepoint_guests }}"
  loop_control:
    label: "{{ item.role }} ({{ item.vmid }})"
  register: pve_openstack_restore_swap
  changed_when: "'RESTORE-SWAPPED' in pve_openstack_restore_swap.stdout"

- name: Swap each OSD thin LV back to the savepoint and activate it
  ansible.builtin.shell: |
    set -euo pipefail
    origin="{{ item }}"
    base="{{ pve_openstack_savepoint_prefix }}-osd{{ idx }}"
    dev=$(readlink -f "/dev/pve-thin-pool/$origin")
    for holder in /sys/block/"$(basename "$dev")"/holders/*; do
      [ -e "$holder" ] || continue
      hname=$(basename "$holder")
      dmname=$(cat "/sys/block/$hname/dm/name")
      echo "RESTORE-OSD-DM-REMOVE $origin dm=$dmname"
      dmsetup remove "$dmname" || { echo "RESTORE-FAIL cannot remove dm device $dmname of $origin" >&2; exit 1; }
    done
    leftover=$(ls /sys/block/"$(basename "$dev")"/holders 2>/dev/null | tr '\n' ' ')
    [ -z "$leftover" ] || { echo "RESTORE-FAIL $origin is still held by dm devices: $leftover" >&2; exit 1; }
    lvremove --yes "pve-thin-pool/$origin"
    lvcreate --yes --snapshot --name "$origin" "pve-thin-pool/$base"
    lvchange -ay -K "pve-thin-pool/$origin"
    test -b "/dev/pve-thin-pool/$origin" || { echo "RESTORE-FAIL $origin has no device node after activation" >&2; exit 1; }
    echo "RESTORE-OSD-ACTIVE $origin from $base"
  args:
    executable: /bin/bash
  loop: "{{ pve_openstack_savepoint_osd_lvs }}"
  loop_control:
    label: "{{ item }}"
    index_var: idx
  register: pve_openstack_restore_osd
  changed_when: "'RESTORE-OSD-ACTIVE' in pve_openstack_restore_osd.stdout"
  when: pve_openstack_savepoint_include_osd | bool

- name: Give every restored yoga CT its own SMBIOS system UUID
  ansible.builtin.include_role:
    name: pve-common-ct-uuid
  vars:
    pve_common_ct_uuid_items: >-
      {{ pve_openstack_savepoint_guests | selectattr('kind', 'equalto', 'ct')
         | map(attribute='vmid') | list }}
    pve_common_ct_uuid_apply_live: true

- name: Start the controller first
  ansible.builtin.command: "pct start {{ pve_openstack_controller_vmid }}"
  changed_when: true

- name: Start the workload guests
  ansible.builtin.shell: |
    set -euo pipefail
    {% if item.kind == 'kvm' %}
    qm start {{ item.vmid }}
    {% else %}
    pct start {{ item.vmid }}
    {% endif %}
    echo "RESTORE-STARTED {{ item.vmid }}"
  args:
    executable: /bin/bash
  loop: "{{ pve_openstack_savepoint_guests | rejectattr('role', 'equalto', 'ctrl') | list }}"
  loop_control:
    label: "{{ item.role }} ({{ item.vmid }})"
  changed_when: true

- name: Wait for the controller to accept pct exec
  ansible.builtin.command: "pct exec {{ pve_openstack_controller_vmid }} -- true"
  register: pve_openstack_restore_ctrl_up
  retries: 30
  delay: 5
  until: pve_openstack_restore_ctrl_up.rc == 0
  changed_when: false

- name: Bring br-ex up on every compute node
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item }}
    if [ "$vmid" = "{{ pve_openstack_workload_kvm_vmid }}" ]; then
      last=$((vmid - {{ pve_openstack_ip_offset }}))
      ip="{{ pve_openstack_public_prefix }}.$last"
      pct exec {{ pve_openstack_juju_client_vmid }} -- su - {{ pve_openstack_juju_client_user }} -c \
        "ssh -i {{ pve_openstack_juju_data }}/ssh/juju_id_rsa -o StrictHostKeyChecking=no ubuntu@$ip \
         sudo ip link set br-ex up"
    else
      pct exec "$vmid" -- ip link set br-ex up
    fi
    echo "RESTORE-BREX-UP $vmid"
  args:
    executable: /bin/bash
  loop: "{{ pve_openstack_compute_uplink_vmids }}"
  loop_control:
    label: "compute {{ item }}"
  register: pve_openstack_restore_brex
  changed_when: "'RESTORE-BREX-UP' in pve_openstack_restore_brex.stdout"
  failed_when: false

- name: Hand off to the recovery role for MySQL GR rebuild and Vault unseal
  ansible.builtin.include_role:
    name: pve-openstack-recovery
  when: pve_openstack_savepoint_restore_run_recovery | bool
