---

- name: Point the shared deployment template at the compute/ceph tables
  ansible.builtin.set_fact:
    pve_ussuri_deploy_apps: "{{ pve_ussuri_compute_ceph_apps }}"
    pve_ussuri_deploy_relations: "{{ pve_ussuri_compute_ceph_relations }}"
    pve_ussuri_deploy_settle_seconds: "{{ pve_ussuri_compute_ceph_settle_seconds }}"
    pve_ussuri_deploy_rel_attempts: "{{ pve_ussuri_compute_ceph_rel_attempts }}"
    pve_ussuri_deploy_rel_delay: "{{ pve_ussuri_compute_ceph_rel_delay }}"

- name: Render the compute/ceph deployment script on the PVE host
  ansible.builtin.template:
    src: "{{ repo_root }}/roles/pve-control-plane/templates/{{ pve_deploy_control_template }}"
    dest: /root/deploy-compute-ceph.sh
    mode: "0700"

- name: Push the compute/ceph deployment script into the Juju client CT
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ pve_juju_client_vmid }}"
      - /root/deploy-compute-ceph.sh
      - /tmp/deploy-compute-ceph.sh

- name: Run the idempotent compute/ceph deployment as the Juju client
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_juju_client_user }}"
      - -c
      - bash /tmp/deploy-compute-ceph.sh
  register: pve_ussuri_ceph_deploy
  changed_when: "'DEPLOY ' in pve_ussuri_ceph_deploy.stdout or 'REL ' in pve_ussuri_ceph_deploy.stdout"

- name: Report what the deployment script did
  ansible.builtin.debug:
    msg: "{{ pve_ussuri_ceph_deploy.stdout_lines | select('match', '^(DEPLOY|SKIP|REL) ') | list }}"

- name: Wait for every compute/ceph application to appear in the model
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_juju_client_user }}"
      - -c
      - "{{ pve_juju_bin }} status -m {{ pve_ussuri_model }} --format json"
  register: pve_ussuri_ceph_apps_wait
  changed_when: false
  failed_when: false
  vars:
    pve_ussuri_deployed_apps: "{{ (pve_ussuri_ceph_apps_wait.stdout | default('{}', true) | from_json).applications | default({}) }}"
  until: >-
    (pve_ussuri_deploy_apps | map(attribute='app') | list)
    | difference(pve_ussuri_deployed_apps.keys() | list) | length == 0
  retries: 30
  delay: 10

- name: Require every compute/ceph application to be deployed
  ansible.builtin.assert:
    that:
      - >-
        pve_ussuri_deploy_apps | map(attribute='app') | list
        | difference((pve_ussuri_ceph_apps_wait.stdout | from_json).applications.keys() | list)
        | length == 0
    fail_msg: >-
      these applications did not come up: {{
        pve_ussuri_deploy_apps | map(attribute='app') | list
        | difference((pve_ussuri_ceph_apps_wait.stdout | from_json).applications.keys() | list)
        | join(', ') }}. Look at the output of /tmp/deploy-compute-ceph.sh and `juju status` first.