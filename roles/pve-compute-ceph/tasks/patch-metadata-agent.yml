---

- name: Copy the OVN metadata agent patch script to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/pve/scripts/ussuri-patch-ovn-metadata-agent.py"
    dest: /root/ussuri-patch-ovn-metadata-agent.py
    owner: root
    group: root
    mode: "0700"

- name: Push the OVN metadata agent patch script into the compute containers
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ item }}"
      - /root/ussuri-patch-ovn-metadata-agent.py
      - /usr/local/bin/ussuri-patch-ovn-metadata-agent.py
      - --perms
      - "0755"
  loop: "{{ pve_ussuri_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  changed_when: true

- name: Patch and restart the OVN metadata agent inside the compute containers
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item }}"
      - --
      - python3
      - /usr/local/bin/ussuri-patch-ovn-metadata-agent.py
      - --restart
  loop: "{{ pve_ussuri_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_ussuri_metadata_agent_patch
  changed_when: "'PATCHED:' in item.stdout or 'RESTARTED:' in item.stdout"

- name: Read the patched metadata agent source back from the compute containers
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item }}"
      - --
      - grep
      - -c
      - get_ip_version
      - /usr/lib/python3/dist-packages/neutron/agent/ovn/metadata/agent.py
  loop: "{{ pve_ussuri_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_ussuri_metadata_agent_patched
  changed_when: false

- name: Require the OVN metadata agent patch to be in place on every compute container
  ansible.builtin.assert:
    that:
      - (item.stdout | trim | int) > 0
    fail_msg: >-
      the neutron OVN metadata agent on CT {{ item.item }} has not been patched for LXC
      (get_ip_version is missing from agent.py). Run by hand inside that CT
      `python3 /usr/local/bin/ussuri-patch-ovn-metadata-agent.py --restart`.
  loop: "{{ pve_ussuri_metadata_agent_patched.results }}"
  loop_control:
    label: "CT {{ item.item }}"

- name: Require the OVN metadata agent service to be running in the compute containers
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item }}"
      - --
      - systemctl
      - is-active
      - neutron-ovn-metadata-agent.service
  loop: "{{ pve_ussuri_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_ussuri_metadata_agent_service
  changed_when: false
  failed_when: pve_ussuri_metadata_agent_service.stdout | trim != 'active'
