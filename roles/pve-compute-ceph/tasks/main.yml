---

- name: Define the Juju 2.9 model handle
  ansible.builtin.set_fact:
    pve_ussuri_model: "{{ pve_juju_controller_name }}:{{ pve_ussuri_model_name }}"

- name: Read the OpenStack model status before the compute/ceph stage
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_juju_client_user }}"
      - -c
      - "{{ pve_juju_bin }} status -m {{ pve_ussuri_model }} --format json"
  register: pve_ussuri_ceph_stage_status
  changed_when: false

- name: Require the control plane to be fully deployed before touching compute/ceph
  ansible.builtin.assert:
    that:
      - pve_ussuri_ceph_stage_status.rc == 0
      - >-
        pve_ussuri_core_applications
        | difference((pve_ussuri_ceph_stage_status.stdout | from_json).applications.keys() | list)
        | length == 0
    fail_msg: >-
      the control plane is still incomplete (missing: {{
        pve_ussuri_core_applications
        | difference((pve_ussuri_ceph_stage_status.stdout | from_json).applications.keys() | list)
        | join(', ') }}). Run --tags pve-control-plane first and wait for it to settle.

- name: Read the host thin pool utilisation before creating OSD volumes
  ansible.builtin.command:
    argv:
      - lvs
      - --noheadings
      - -o
      - lv_size,data_percent,metadata_percent
      - --units
      - g
      - "{{ pve_ussuri_osd_thinpool }}"
  register: pve_ussuri_ceph_pool_usage
  changed_when: false

- name: Require enough thin pool headroom for this environment
  ansible.builtin.assert:
    that:
      - (pve_ussuri_ceph_pool_usage.stdout.split()[1] | float) < (pve_ussuri_osd_thinpool_max_data_percent | float)
    fail_msg: >-
      thin pool {{ pve_ussuri_osd_thinpool }} usage
      {{ pve_ussuri_ceph_pool_usage.stdout.split()[1] }}% has reached the cap
      {{ pve_ussuri_osd_thinpool_max_data_percent }}%({{ pve_ussuri_ceph_pool_usage.stdout | trim }}).
      tear down unused envs to free pool space, or raise pve_ussuri_osd_thinpool_max_data_percent.

- name: Deploy the compute and Ceph applications
  ansible.builtin.include_tasks: deploy.yml

- name: Patch the OVN metadata agent so it works inside LXC containers
  ansible.builtin.include_tasks: patch-metadata-agent.yml
  tags: pve-ussuri-metadata-agent-patch

- name: Create the Ceph OSDs on the passthrough devices
  ansible.builtin.include_tasks: osd.yml

- name: Make the active ceph.conf readable by every Ceph client service user
  ansible.builtin.include_tasks: fix-ceph-client-access.yml

- name: Converge and verify the compute and Ceph applications
  ansible.builtin.include_tasks: verify.yml