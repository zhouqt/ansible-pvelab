---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Require explicit authorization for deployment configuration
  ansible.builtin.assert:
    that:
      - pve_sunbeam_confirm_external_changes | bool
    fail_msg: >-
      This stage applies the manifest to the existing juju model and creates the external
      network, tenant network and demo user.
      To confirm, pass -e pve_sunbeam_confirm_external_changes=true.

- name: Check whether the deployment is already configured
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-deployment-configured.sh.j2') }}"
  register: pve_sunbeam_deployment_state
  changed_when: false
  failed_when: false

- name: Classify the deployment configuration state
  ansible.builtin.set_fact:
    pve_sunbeam_configure_state: >-
      {{ (pve_sunbeam_deployment_state.stdout | default(''))
         | regex_findall('(?m)^configured=(\S+)') | first | default('unknown') }}
    pve_sunbeam_configure_missing: >-
      {{ (pve_sunbeam_deployment_state.stdout | default(''))
         | regex_findall('(?m)^configured=partial missing=(.*)$') | first | default('') }}

- name: Refuse to walk past a half-written openrc
  ansible.builtin.assert:
    that:
      - pve_sunbeam_repair_openrc | bool or pve_sunbeam_force_configure | bool
    fail_msg: >-
      {{ pve_sunbeam_admin_openrc_path }} exists but is incomplete: missing
      {{ pve_sunbeam_configure_missing | default('(unknown keys)') }}.
      Running further would leave every OpenStack call failing on an incomplete
      environment. Either repair the credentials in place with
      -e pve_sunbeam_repair_openrc=true (re-renders the openrc, touches no cloud resources),
      or replay the whole configuration with -e pve_sunbeam_force_configure=true.
  when: pve_sunbeam_configure_state == 'partial'

- name: Repair the half-written openrc
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'run-refresh-openrc.sh.j2') }}"
  register: pve_sunbeam_openrc_repair
  when:
    - pve_sunbeam_configure_state == 'partial'
    - pve_sunbeam_repair_openrc | bool

- name: Re-check the openrc after the repair
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-deployment-configured.sh.j2') }}"
  register: pve_sunbeam_deployment_state_repaired
  changed_when: false
  failed_when: false
  when:
    - pve_sunbeam_configure_state == 'partial'
    - pve_sunbeam_repair_openrc | bool

- name: Assert the repaired openrc is complete
  ansible.builtin.assert:
    that:
      - "'configured=yes' in (pve_sunbeam_deployment_state_repaired.stdout | default(''))"
    fail_msg: >-
      The openrc repair ran but {{ pve_sunbeam_admin_openrc_path }} is still incomplete:
      {{ pve_sunbeam_deployment_state_repaired.stdout | default('') | trim | default('(no output)', true) }}.
      Check {{ pve_sunbeam_node_log_dir }}/refresh-openrc.log inside {{ pve_sunbeam_primary_node.fqdn }}.
  when:
    - pve_sunbeam_configure_state == 'partial'
    - pve_sunbeam_repair_openrc | bool

- name: Decide whether configure deployment must run
  ansible.builtin.set_fact:
    pve_sunbeam_configure_needed: >-
      {{ pve_sunbeam_configure_state != 'yes' or pve_sunbeam_force_configure | bool }}

- name: Resolve the Sunbeam node identities
  ansible.builtin.include_tasks: _node_identity.yml
  when: pve_sunbeam_configure_needed | bool

- name: Render the Sunbeam deployment manifest
  ansible.builtin.template:
    src: manifest.yaml.j2
    dest: "{{ pve_sunbeam_staging_dir }}/manifest.yaml"
    mode: "0600"
  when: pve_sunbeam_configure_needed | bool

- name: Require the rendered manifest to be keyed by the probed node identities
  ansible.builtin.include_tasks: _manifest_identity_guard.yml
  when: pve_sunbeam_configure_needed | bool

- name: Read the manifest currently stored in the primary CT
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - cat
      - "{{ pve_sunbeam_manifest_path }}"
  register: pve_sunbeam_configure_manifest_current
  changed_when: false
  failed_when: false
  when: pve_sunbeam_configure_needed | bool

- name: Push the manifest into the primary CT when it differs
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - push
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - "{{ pve_sunbeam_staging_dir }}/manifest.yaml"
      - "{{ pve_sunbeam_manifest_path }}"
      - --user
      - "{{ pve_sunbeam_node_user }}"
      - --group
      - "{{ pve_sunbeam_node_user }}"
      - --perms
      - "0600"
  when:
    - pve_sunbeam_configure_needed | bool
    - >-
      (pve_sunbeam_configure_manifest_current.stdout | default('') | trim)
      != (lookup('template', 'manifest.yaml.j2') | trim)

- name: Apply the deployment configuration
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'run-configure-deployment.sh.j2') }}"
  when: pve_sunbeam_configure_needed | bool
  register: pve_sunbeam_configure_run
  async: "{{ pve_sunbeam_configure_timeout }}"
  poll: "{{ pve_sunbeam_poll_interval }}"
  failed_when: false

- name: Re-check the deployment configuration state
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-deployment-configured.sh.j2') }}"
  register: pve_sunbeam_deployment_state_after
  changed_when: false
  failed_when: false

- name: Restore the admin openrc that the configure CLI overwrote
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'run-refresh-openrc.sh.j2') }}"
  register: pve_sunbeam_openrc_restore
  when:
    - pve_sunbeam_configure_needed | bool
    - "'configured=yes' not in (pve_sunbeam_deployment_state_after.stdout | default(''))"

- name: Re-check the openrc after the restore
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-deployment-configured.sh.j2') }}"
  register: pve_sunbeam_deployment_state_final
  changed_when: false
  failed_when: false
  when:
    - pve_sunbeam_configure_needed | bool
    - "'configured=yes' not in (pve_sunbeam_deployment_state_after.stdout | default(''))"

- name: Assert the openrc file is in place
  ansible.builtin.assert:
    that:
      - "'configured=yes' in (pve_sunbeam_deployment_state_final.stdout | default(pve_sunbeam_deployment_state_after.stdout | default('')))"
    fail_msg: >-
      {{ pve_sunbeam_admin_openrc_path }} does not exist or is empty, which means configure
      deployment did not complete. Check {{ pve_sunbeam_node_log_dir }}/configure-deployment.log
      and {{ pve_sunbeam_node_log_dir }}/refresh-openrc.log inside {{ pve_sunbeam_primary_node.fqdn }}.
      State after the run:
      {{ (pve_sunbeam_deployment_state_final.stdout | default(pve_sunbeam_deployment_state_after.stdout | default(''))) | trim }}.

- name: Read the deployed OpenStack resource inventory
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'verify-deployment.sh.j2') }}"
  register: pve_sunbeam_deployment_inventory
  changed_when: false

- name: Assert the external network exists
  ansible.builtin.assert:
    that:
      - pve_sunbeam_external_network.openstack_name in pve_sunbeam_deployment_inventory.stdout
    fail_msg: >-
      External network {{ pve_sunbeam_external_network.openstack_name }} was not found in OpenStack.
      The manifest's external-networks does not match the live environment.

- name: Assert the tenant network exists
  ansible.builtin.assert:
    that:
      - pve_sunbeam_tenant_network_name in pve_sunbeam_deployment_inventory.stdout
    fail_msg: >-
      Tenant network {{ pve_sunbeam_tenant_network_name }} was not found in OpenStack (demo setup incomplete?).

- name: Point containerd's image pulls at the registry proxy
  ansible.builtin.include_tasks: _containerd_registry_proxy.yml

- name: Report deployment configuration result
  ansible.builtin.debug:
    msg: >-
      {{ [
           'openrc: ' ~ pve_sunbeam_admin_openrc_path ~ ' (' ~ pve_sunbeam_node_user ~ ', 0600)',
           'configure deployment state on entry: ' ~ pve_sunbeam_configure_state,
         ]
         + (['missing openrc keys: ' ~ pve_sunbeam_configure_missing]
            if (pve_sunbeam_configure_missing | default('') | length > 0) else [])
         + [
           'configure deployment executed this run: '
           ~ ('yes' if pve_sunbeam_configure_needed | bool else 'no (already configured)'),
           'configure CLI rc: ' ~ (pve_sunbeam_configure_run.rc | default('n/a (skipped)')),
           'admin openrc restored after configure: '
           ~ (pve_sunbeam_openrc_restore.stdout_lines | default(['n/a (skipped)']) | join('; ')),
           'resource inventory:',
         ]
         + pve_sunbeam_deployment_inventory.stdout_lines }}
