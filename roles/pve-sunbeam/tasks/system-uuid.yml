---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Give every Sunbeam CT its own SMBIOS system UUID
  ansible.builtin.include_role:
    name: pve-common-ct-uuid
  vars:
    pve_common_ct_uuid_items: "{{ pve_sunbeam_nodes | map(attribute='vmid') | list }}"
    pve_common_ct_uuid_apply_live: "{{ pve_sunbeam_system_uuid_apply_live | bool }}"
    pve_common_ct_uuid_restart_services: "{{ pve_sunbeam_system_uuid_restart_services }}"
    pve_common_ct_uuid_verify_only: "{{ not (pve_sunbeam_confirm_system_uuid | bool) }}"
