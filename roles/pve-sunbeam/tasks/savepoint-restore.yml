---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Require an explicit opt-in before restoring a savepoint
  ansible.builtin.assert:
    that:
      - pve_sunbeam_savepoint_restore | bool
    fail_msg: >-
      Restoring a savepoint destroys the current volumes of every guest. To
      confirm, pass -e pve_sunbeam_savepoint_restore=true.

- name: Require a usable savepoint name
  ansible.builtin.assert:
    that:
      - pve_sunbeam_env_id | length > 0
      - pve_sunbeam_savepoint_tag | length > 0
      - pve_sunbeam_savepoint_prefix is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$')
    fail_msg: >-
      pve_sunbeam_env_id / pve_sunbeam_savepoint_tag must be set and
      pve_sunbeam_savepoint_prefix ('{{ pve_sunbeam_savepoint_prefix | default("") }}')
      must be a valid LVM name.

- name: Check for the savepoint metadata file
  ansible.builtin.stat:
    path: "{{ pve_sunbeam_savepoint_metadata_dir }}/{{ pve_sunbeam_savepoint_prefix }}.txt"
  register: pve_sunbeam_savepoint_meta_stat

- name: Refuse to restore without the savepoint metadata file
  ansible.builtin.assert:
    that:
      - pve_sunbeam_savepoint_meta_stat.stat.exists
    fail_msg: >-
      {{ pve_sunbeam_savepoint_metadata_dir }}/{{ pve_sunbeam_savepoint_prefix }}.txt does
      not exist. It is written by the savepoint stage and says which volumes the
      savepoint consists of; a restore cannot proceed safely without it. Check
      `lvs` for the base volumes and the exact savepoint name.

- name: Read the savepoint metadata file
  ansible.builtin.slurp:
    src: "{{ pve_sunbeam_savepoint_metadata_dir }}/{{ pve_sunbeam_savepoint_prefix }}.txt"
  register: pve_sunbeam_savepoint_meta_raw

- name: Parse the savepoint metadata
  ansible.builtin.set_fact:
    pve_sunbeam_savepoint_meta: >-
      {{ dict(pve_sunbeam_savepoint_meta_raw.content | b64decode
              | regex_findall('(?m)^([a-z_]+)=(.*)$')) }}

- name: Assert the metadata describes this savepoint
  ansible.builtin.assert:
    that:
      - pve_sunbeam_savepoint_meta['prefix'] | default('') == pve_sunbeam_savepoint_prefix
    fail_msg: >-
      The metadata file declares prefix
      '{{ pve_sunbeam_savepoint_meta['prefix'] | default('?') }}', expected
      '{{ pve_sunbeam_savepoint_prefix }}'. The name resolves to the wrong file.

- name: Decide whether the OSD volumes are part of this savepoint
  ansible.builtin.set_fact:
    pve_sunbeam_savepoint_restore_osd: >-
      {{ pve_sunbeam_savepoint_meta['include_osd'] | default('false') | bool }}

- name: Warn when the savepoint does not contain the OSD volumes
  ansible.builtin.debug:
    msg: >-
      WARNING: this savepoint was taken with pve_sunbeam_savepoint_include_osd=false.
      The CT filesystems will be rolled back while Ceph keeps its current data:
      the resulting cluster is NOT consistent. Only use this for debugging the
      rootfs side.
  when: not pve_sunbeam_savepoint_restore_osd | bool

- name: Require every savepoint base to exist before touching the live volumes
  ansible.builtin.shell: |
    set -euo pipefail
    missing=""
    {% for n in pve_sunbeam_nodes %}
    lvs --noheadings -o lv_name "{{ pve_sunbeam_storage }}/{{ pve_sunbeam_savepoint_prefix }}-{{ n.hostname }}" >/dev/null 2>&1 \
      || missing="$missing {{ pve_sunbeam_savepoint_prefix }}-{{ n.hostname }}"
    {% endfor %}
    {% if pve_sunbeam_savepoint_restore_osd | bool %}
    {% for n in pve_sunbeam_nodes %}
    lvs --noheadings -o lv_name "{{ pve_sunbeam_storage }}/{{ pve_sunbeam_savepoint_prefix }}-osd-{{ n.vmid }}" >/dev/null 2>&1 \
      || missing="$missing {{ pve_sunbeam_savepoint_prefix }}-osd-{{ n.vmid }}"
    {% endfor %}
    {% endif %}
    [ -z "$missing" ] || { echo "SAVEPOINT-MISSING:$missing" >&2; exit 1; }
    echo "SAVEPOINT-BASES-OK"
  args:
    executable: /bin/bash
  changed_when: false

- name: Check the host network pieces the guests depend on
  ansible.builtin.shell: |
    set -uo pipefail
    missing=""
    for br in {{ pve_sunbeam_host_expected_bridges | join(' ') }}; do
      ip link show "$br" >/dev/null 2>&1 || missing="$missing bridge:$br"
    done
    for vnet in {{ pve_sunbeam_host_expected_vnets | join(' ') }}; do
      grep -q "^vnet: *$vnet\$" /etc/pve/sdn/vnets.cfg 2>/dev/null || missing="$missing vnet:$vnet"
    done
    for id in {{ pve_sunbeam_host_expected_subnet_ids | join(' ') }}; do
      grep -q "^subnet: .*$id\$" /etc/pve/sdn/subnets.cfg 2>/dev/null || missing="$missing subnet:$id"
    done
    snat_ip=$(ip -4 -o addr show vmbr0 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -1)
    if [ -z "$snat_ip" ]; then
      missing="$missing vmbr0-no-ipv4"
    else
      for cidr in {{ pve_sunbeam_host_expected_snat_cidrs | join(' ') }}; do
        iptables -t nat -C POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip" 2>/dev/null \
          || missing="$missing snat:$cidr"
      done
    fi
    echo "SNAT-SOURCE=${snat_ip:-none}"
    echo "NET-MISSING=${missing# }"
    [ -z "$missing" ]
  args:
    executable: /bin/bash
  register: pve_sunbeam_restore_net
  changed_when: false
  failed_when: false

- name: Repair the host network before restoring
  ansible.builtin.shell: |
    set -uo pipefail
    echo "== ifreload -a =="
    ifreload -a 2>&1 || echo "ifreload rc=$?"
    snat_ip=$(ip -4 -o addr show vmbr0 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -1)
    if [ -z "$snat_ip" ]; then
      echo "REPAIR-FAIL vmbr0 has no IPv4 address"
      exit 0
    fi
    added=0
    for cidr in {{ pve_sunbeam_host_expected_snat_cidrs | join(' ') }}; do
      if ! iptables -t nat -C POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip" 2>/dev/null; then
        iptables -t nat -A POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip"
        added=$((added + 1))
      fi
    done
    echo "REPAIR-SNAT added=$added to=$snat_ip"
  args:
    executable: /bin/bash
  when:
    - pve_sunbeam_savepoint_repair_network | bool
    - pve_sunbeam_restore_net.rc != 0
  register: pve_sunbeam_restore_net_repair
  changed_when: "'added=0' not in pve_sunbeam_restore_net_repair.stdout"

- name: Re-check the host network after the repair
  ansible.builtin.shell: |
    set -uo pipefail
    missing=""
    for br in {{ pve_sunbeam_host_expected_bridges | join(' ') }}; do
      ip link show "$br" >/dev/null 2>&1 || missing="$missing bridge:$br"
    done
    for vnet in {{ pve_sunbeam_host_expected_vnets | join(' ') }}; do
      grep -q "^vnet: *$vnet\$" /etc/pve/sdn/vnets.cfg 2>/dev/null || missing="$missing vnet:$vnet"
    done
    for id in {{ pve_sunbeam_host_expected_subnet_ids | join(' ') }}; do
      grep -q "^subnet: .*$id\$" /etc/pve/sdn/subnets.cfg 2>/dev/null || missing="$missing subnet:$id"
    done
    snat_ip=$(ip -4 -o addr show vmbr0 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -1)
    if [ -z "$snat_ip" ]; then
      missing="$missing vmbr0-no-ipv4"
    else
      for cidr in {{ pve_sunbeam_host_expected_snat_cidrs | join(' ') }}; do
        iptables -t nat -C POSTROUTING -s "$cidr" -o vmbr0 -j SNAT --to-source "$snat_ip" 2>/dev/null \
          || missing="$missing snat:$cidr"
      done
    fi
    echo "NET-MISSING=${missing# }"
    [ -z "$missing" ]
  args:
    executable: /bin/bash
  register: pve_sunbeam_restore_net_recheck
  changed_when: false
  failed_when: false
  when: pve_sunbeam_restore_net.rc != 0

- name: Decide whether the host network is ready
  ansible.builtin.set_fact:
    pve_sunbeam_restore_network_ok: >-
      {{ pve_sunbeam_restore_net.rc == 0
         or (pve_sunbeam_restore_net_recheck.rc | default(1)) == 0 }}

- name: Refuse to restore while the host network is incomplete
  ansible.builtin.assert:
    that:
      - pve_sunbeam_restore_network_ok | bool
    fail_msg: >-
      The host network is not ready for the guests: {{ pve_sunbeam_restore_net.stdout }}
      {% if pve_sunbeam_restore_net_repair is defined %}{{ pve_sunbeam_restore_net_repair.stdout | default('') }}{% endif %}
      {% if pve_sunbeam_restore_net_recheck is defined %}{{ pve_sunbeam_restore_net_recheck.stdout | default('') }}{% endif %}
      Restoring the volumes now would produce a cluster that boots without a data
      path. Fix the PVE SDN bridges/subnets (this playbook never rewrites them)
      and the POSTROUTING SNAT rules, then retry.

- name: Report the preflight result
  ansible.builtin.debug:
    msg:
      - "savepoint: {{ pve_sunbeam_savepoint_prefix }}"
      - "taken: {{ pve_sunbeam_savepoint_meta['taken'] | default('?') }} (fsid {{ pve_sunbeam_savepoint_meta['ceph_fsid'] | default('?') }})"
      - "OSD volumes included: {{ pve_sunbeam_savepoint_restore_osd }}"
      - "host network: {{ pve_sunbeam_restore_net.stdout_lines | default([]) }}"
  when: pve_sunbeam_savepoint_preflight_only | bool

- name: Stop before touching the guests (preflight only)
  ansible.builtin.meta: end_host
  when: pve_sunbeam_savepoint_preflight_only | bool

- name: Define the restore order (workers first, primary last)
  ansible.builtin.set_fact:
    pve_sunbeam_savepoint_stop_order: "{{ pve_sunbeam_worker_nodes + [pve_sunbeam_primary_node] }}"

- name: Stop the worker guests in parallel
  ansible.builtin.shell: |
    set -uo pipefail
    pct_bin={{ pve_sunbeam_pct_bin | quote }}
    fail=0
    for vmid in {{ pve_sunbeam_worker_nodes | map(attribute='vmid') | join(' ') }}; do
      (
        if "$pct_bin" status "$vmid" | grep -q 'status: running'; then
          "$pct_bin" shutdown "$vmid" --timeout 300 || true
        fi
        if "$pct_bin" status "$vmid" | grep -q 'status: running'; then
          "$pct_bin" stop "$vmid"
        fi
        "$pct_bin" status "$vmid" | grep -q 'status: stopped' \
          || { echo "RESTORE-FAIL $vmid did not stop" >&2; exit 1; }
        echo "RESTORE-STOPPED $vmid"
      ) &
    done
    for pid in $(jobs -p); do wait "$pid" || fail=1; done
    [ "$fail" -eq 0 ]
  args:
    executable: /bin/bash
  changed_when: true

- name: Stop the primary guest
  ansible.builtin.shell: |
    set -euo pipefail
    pct_bin={{ pve_sunbeam_pct_bin | quote }}
    vmid={{ pve_sunbeam_primary_node.vmid }}
    if "$pct_bin" status "$vmid" | grep -q 'status: running'; then
      "$pct_bin" shutdown "$vmid" --timeout 300 || true
    fi
    if "$pct_bin" status "$vmid" | grep -q 'status: running'; then
      "$pct_bin" stop "$vmid"
    fi
    "$pct_bin" status "$vmid" | grep -q 'status: stopped' \
      || { echo "RESTORE-FAIL $vmid did not stop" >&2; exit 1; }
    echo "RESTORE-STOPPED $vmid"
  args:
    executable: /bin/bash
  changed_when: true

- name: Detach loop devices that outlive the stopped guests
  ansible.builtin.include_tasks: _detach_guest_loops.yml

- name: Require every volume about to be replaced to be closed
  ansible.builtin.shell: |
    set -uo pipefail
    open=""
    {% for n in pve_sunbeam_savepoint_stop_order %}
    origin=$(pct config "{{ n.vmid }}" | sed -n 's/^rootfs: *{{ pve_sunbeam_storage }}:\([^,]*\).*/\1/p')
    for lv in "$origin"{% if pve_sunbeam_savepoint_restore_osd | bool %} "{{ n.osd_pve_lv | basename }}"{% endif %}; do
      [ -n "$lv" ] || continue
      attr=$(lvs --noheadings -o attr "{{ pve_sunbeam_storage }}/$lv" 2>/dev/null | tr -d ' ')
      [ -n "$attr" ] || continue
      if [ "${attr:4:1}" = "o" ]; then
        open="$open $lv"
      fi
    done
    {% endfor %}
    [ -z "$open" ] || { echo "VOLUMES-OPEN:$open" >&2; exit 1; }
    echo "VOLUMES-CLOSED"
  args:
    executable: /bin/bash
  changed_when: false

- name: Swap each guest rootfs volume back to its savepoint
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    base="{{ pve_sunbeam_savepoint_prefix }}-{{ item.hostname }}"
    origin=$(pct config "$vmid" | sed -n 's/^rootfs: *{{ pve_sunbeam_storage }}:\([^,]*\).*/\1/p')
    [ -n "$origin" ] || { echo "RESTORE-FAIL $vmid: cannot parse the rootfs volume name" >&2; exit 1; }
    lvremove --yes "{{ pve_sunbeam_storage }}/$origin"
    lvcreate --yes --snapshot --name "$origin" "{{ pve_sunbeam_storage }}/$base"
    echo "RESTORE-SWAPPED $origin from $base"
  args:
    executable: /bin/bash
  loop: "{{ pve_sunbeam_savepoint_stop_order }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.vmid }})"
  register: pve_sunbeam_restore_swap
  changed_when: "'RESTORE-SWAPPED' in pve_sunbeam_restore_swap.stdout"

- name: Swap each OSD thin LV back to its savepoint and activate it
  ansible.builtin.shell: |
    set -euo pipefail
    origin="{{ item.osd_pve_lv | basename }}"
    base="{{ pve_sunbeam_savepoint_prefix }}-osd-{{ item.vmid }}"
    lvremove --yes "{{ pve_sunbeam_storage }}/$origin"
    lvcreate --yes --snapshot --name "$origin" "{{ pve_sunbeam_storage }}/$base"
    lvchange -ay -K "{{ pve_sunbeam_storage }}/$origin"
    test -b "/dev/{{ pve_sunbeam_storage }}/$origin" \
      || { echo "RESTORE-FAIL $origin has no device node after activation" >&2; exit 1; }
    echo "RESTORE-OSD-ACTIVE $origin from $base"
  args:
    executable: /bin/bash
  loop: "{{ pve_sunbeam_nodes }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.osd_pve_lv | basename }})"
  register: pve_sunbeam_restore_osd
  changed_when: "'RESTORE-OSD-ACTIVE' in pve_sunbeam_restore_osd.stdout"
  when: pve_sunbeam_savepoint_restore_osd | bool

- name: Regenerate the OSD by-id aliases
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_udevadm_bin }}"
      - trigger
      - --subsystem-match=block
      - --settle
  when: pve_sunbeam_savepoint_restore_osd | bool

- name: Verify every OSD by-id alias exists again
  ansible.builtin.command:
    argv:
      - test
      - -L
      - "/dev/disk/by-id/{{ pve_sunbeam_osd_by_id_prefix }}{{ item.vmid }}"
  loop: "{{ pve_sunbeam_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  changed_when: false
  when: pve_sunbeam_savepoint_restore_osd | bool

- name: Rebuild and verify the per-CT SMBIOS identity
  ansible.builtin.include_role:
    name: pve-common-ct-uuid
  vars:
    pve_common_ct_uuid_items: "{{ pve_sunbeam_nodes | map(attribute='vmid') | list }}"
    pve_common_ct_uuid_verify_running: false

- name: Ensure the loop device nodes the primary binds exist
  ansible.builtin.include_tasks: _ensure_loop_nodes.yml

- name: Start the primary container
  ansible.builtin.command:
    argv: ["{{ pve_sunbeam_pct_bin }}", start, "{{ pve_sunbeam_primary_node.vmid }}"]
  changed_when: true

- name: Wait for the primary container to accept commands
  ansible.builtin.command:
    argv: ["{{ pve_sunbeam_pct_bin }}", exec, "{{ pve_sunbeam_primary_node.vmid }}", "--", /bin/true]
  register: pve_sunbeam_restore_primary_exec
  until: pve_sunbeam_restore_primary_exec.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false

- name: Assert the primary container came up
  ansible.builtin.assert:
    that:
      - pve_sunbeam_restore_primary_exec.rc == 0
    fail_msg: >-
      {{ pve_sunbeam_primary_node.hostname }} ({{ pve_sunbeam_primary_node.vmid }}) did
      not accept `pct exec` within 5 minutes after the restore. Check
      `pct status {{ pve_sunbeam_primary_node.vmid }}` and the container's journal on
      {{ pve_sunbeam_host }}.

- name: Start the worker containers in parallel
  ansible.builtin.shell: |
    set -uo pipefail
    pct_bin={{ pve_sunbeam_pct_bin | quote }}
    fail=0
    for vmid in {{ pve_sunbeam_worker_nodes | map(attribute='vmid') | join(' ') }}; do
      (
        "$pct_bin" start "$vmid" \
          || { echo "RESTORE-FAIL $vmid did not start" >&2; exit 1; }
        echo "RESTORE-STARTED $vmid"
      ) &
    done
    for pid in $(jobs -p); do wait "$pid" || fail=1; done
    [ "$fail" -eq 0 ]
  args:
    executable: /bin/bash
  changed_when: true

- name: Wait for every worker container to accept commands
  ansible.builtin.command:
    argv: ["{{ pve_sunbeam_pct_bin }}", exec, "{{ item.vmid }}", "--", /bin/true]
  loop: "{{ pve_sunbeam_worker_nodes }}"
  loop_control:
    label: "{{ item.hostname }} ({{ item.vmid }})"
  register: pve_sunbeam_restore_worker_exec
  until: pve_sunbeam_restore_worker_exec.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false

- name: Assert every worker container came up
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      {{ item.item.hostname }} ({{ item.item.vmid }}) did not accept `pct exec`
      within 5 minutes after the restore.
  loop: "{{ pve_sunbeam_restore_worker_exec.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"

- name: Probe and repair the MicroCeph mons
  ansible.builtin.include_tasks: _restore_mon_check.yml

- name: Probe and repair the MicroCeph OSDs
  ansible.builtin.include_tasks: _restore_osd_check.yml

- name: Wait for the first convergence window after the restore
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-restore-readiness.sh.j2') }}"
  register: pve_sunbeam_restore_ready
  until: "'RESTORE-READY=yes' in pve_sunbeam_restore_ready.stdout"
  retries: "{{ (pve_sunbeam_restore_first_window | int / pve_sunbeam_poll_interval | int) | int }}"
  delay: "{{ pve_sunbeam_poll_interval }}"
  changed_when: false
  failed_when: false

- name: Re-probe and repair the mons when the first window was not enough
  ansible.builtin.include_tasks: _restore_mon_check.yml
  when: "'RESTORE-READY=yes' not in pve_sunbeam_restore_ready.stdout"

- name: Re-probe and repair the OSDs when the first window was not enough
  ansible.builtin.include_tasks: _restore_osd_check.yml
  when: "'RESTORE-READY=yes' not in pve_sunbeam_restore_ready.stdout"

- name: Wait for Ceph, K8s and Sunbeam to converge after the restore
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-restore-readiness.sh.j2') }}"
  register: pve_sunbeam_restore_ready
  until: "'RESTORE-READY=yes' in pve_sunbeam_restore_ready.stdout"
  retries: "{{ ((pve_sunbeam_restore_timeout | int - pve_sunbeam_restore_first_window | int) / pve_sunbeam_poll_interval | int) | int }}"
  delay: "{{ pve_sunbeam_poll_interval }}"
  changed_when: false
  failed_when: false

- name: Assert the cluster converged
  ansible.builtin.assert:
    that:
      - "'RESTORE-READY=yes' in pve_sunbeam_restore_ready.stdout"
    fail_msg: >-
      The environment did not converge within {{ pve_sunbeam_restore_timeout }}s after
      the restore. Last probe output:
      {{ pve_sunbeam_restore_ready.stdout }}

- name: Restore snapd's store proxy (rolled back with the rootfs)
  ansible.builtin.include_tasks: _snapd_store_proxy.yml

- name: Restore containerd's registry proxy (rolled back with the rootfs)
  ansible.builtin.include_tasks: _containerd_registry_proxy.yml

- name: Build post-restore Juju and gateway reconciliation inputs
  ansible.builtin.set_fact:
    pve_sunbeam_restore_reconcile_config:
      pct_bin: "{{ pve_sunbeam_pct_bin }}"
      primary_vmid: "{{ pve_sunbeam_primary_node.vmid }}"
      node_user: "{{ pve_sunbeam_node_user }}"
      openstack_model: "{{ pve_sunbeam_juju_openstack_model }}"
      machines_model: "{{ pve_sunbeam_juju_machines_model }}"
      external_nic: "{{ pve_sunbeam_manifest_external_nic }}"
      physnet: "{{ pve_sunbeam_external_network.name }}"
      juju_recovery_rounds: "{{ pve_sunbeam_restore_juju_recovery_rounds | int }}"
      juju_recovery_delay: "{{ pve_sunbeam_restore_juju_recovery_delay | int }}"
      gateway_timeout: "{{ pve_sunbeam_restore_gateway_timeout | int }}"
      gateway_poll_interval: "{{ pve_sunbeam_restore_gateway_poll_interval | int }}"
      nodes: "{{ pve_sunbeam_nodes }}"

- name: Recover Juju workload errors and ensure every node is an OVN gateway
  ansible.builtin.include_tasks: _restore_reconcile.yml

- name: Wait for the Juju applications to settle after the reconciliation
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-juju-apps-active.sh.j2') }}"
  register: pve_sunbeam_restore_settled
  until: "'SETTLED=yes' in pve_sunbeam_restore_settled.stdout"
  retries: "{{ (pve_sunbeam_restore_settle_timeout | int / pve_sunbeam_poll_interval | int) | int }}"
  delay: "{{ pve_sunbeam_poll_interval }}"
  changed_when: false
  failed_when: false

- name: Assert the Juju applications settled
  ansible.builtin.assert:
    that:
      - "'SETTLED=yes' in pve_sunbeam_restore_settled.stdout"
    fail_msg: >-
      The Juju applications did not all reach the active state within
      {{ pve_sunbeam_restore_settle_timeout }}s after the reconciliation. Last probe:
      {{ pve_sunbeam_restore_settled.stdout }}

- name: Re-apply the mysql-router workload logging fix
  ansible.builtin.include_tasks: logging-scope.yml
  when: pve_sunbeam_obs_logging_tune | bool

- name: Run the standard health verification
  ansible.builtin.include_tasks: verify.yml
  when: pve_sunbeam_savepoint_run_verify | bool

- name: Enable the end-to-end OpenStack check
  ansible.builtin.set_fact:
    pve_sunbeam_vm_volume_test: true
    pve_sunbeam_confirm_external_changes: true
    pve_sunbeam_vm_test_ping: "{{ pve_sunbeam_savepoint_verify_fip_ping | bool }}"
  when: pve_sunbeam_savepoint_verify_openstack | bool

- name: Boot a VM from a volume, attach a floating IP and ping it
  ansible.builtin.include_tasks: vm-volume-test.yml
  when: pve_sunbeam_savepoint_verify_openstack | bool

- name: Report the restore result
  ansible.builtin.debug:
    msg:
      - "restored: {{ pve_sunbeam_savepoint_prefix }}-*"
      - "guests: {{ pve_sunbeam_savepoint_stop_order | map(attribute='hostname') | join(', ') }}"
      - "OSD volumes restored: {{ pve_sunbeam_savepoint_restore_osd }}"
      - "health verify: {{ pve_sunbeam_savepoint_run_verify }}"
      - "openstack end-to-end check: {{ pve_sunbeam_savepoint_verify_openstack }} (floating-ip ping: {{ pve_sunbeam_savepoint_verify_fip_ping }})"
