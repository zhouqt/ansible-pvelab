---
- name: Assert the manifest is keyed by the probed node identities
  vars:
    pve_sunbeam_manifest_rendered: "{{ lookup('template', 'manifest.yaml.j2') | from_yaml }}"
    pve_sunbeam_manifest_expected_keys: >-
      {{ (pve_sunbeam_node_names | default({})).values() | list | sort }}
    pve_sunbeam_manifest_nic_keys: >-
      {{ (pve_sunbeam_manifest_rendered.core.config['external-networks'][pve_sunbeam_external_network.name]['nics']
          | default({})).keys() | list | sort }}
    pve_sunbeam_manifest_microceph_keys: >-
      {{ (pve_sunbeam_manifest_rendered.core.config.microceph_config | default({})).keys() | list | sort }}
  ansible.builtin.assert:
    that:
      - pve_sunbeam_node_names is defined
      - pve_sunbeam_manifest_expected_keys | length == pve_sunbeam_nodes | length
      - pve_sunbeam_manifest_nic_keys == pve_sunbeam_manifest_expected_keys
      - pve_sunbeam_manifest_microceph_keys == pve_sunbeam_manifest_expected_keys
    fail_msg: >-
      The manifest's node-keyed maps are not keyed by the Sunbeam node identity
      (utils.get_fqdn()). Sunbeam looks each node up by that name and silently skips
      one it does not find, so such a node would get no OSD preseed and no external
      NIC / gateway-chassis role.
      probed identities: {{ pve_sunbeam_manifest_expected_keys }}
      nics keys: {{ pve_sunbeam_manifest_nic_keys }}
      microceph_config keys: {{ pve_sunbeam_manifest_microceph_keys }}
      If this stage did not run _node_identity.yml before rendering, add it.
