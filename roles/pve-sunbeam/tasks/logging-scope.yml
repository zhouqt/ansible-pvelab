---
- name: Fix the workload logging of the mysql-router pods
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'tune-workload-logging.sh.j2') }}"
  register: pve_sunbeam_obs_logging_tune
  changed_when: >-
    'CONFIG-PATCHED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
    or 'POLICY-PATCHED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
    or 'TEMPLATE-PATCHED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
    or 'EXECUTOR-PATCHED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
    or 'EXECUTOR-SRC-PATCHED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
    or 'ARCHIVE-PRUNED' in (pve_sunbeam_obs_logging_tune.stdout | default(''))
  failed_when:
    - (pve_sunbeam_obs_logging_tune.rc | default(1) | int) != 0
    - "'LOGGING-TUNE-SUMMARY' not in (pve_sunbeam_obs_logging_tune.stdout | default(''))"

- name: Report the workload logging result
  ansible.builtin.debug:
    msg: "{{ (pve_sunbeam_obs_logging_tune.stdout_lines | default([]))
            | select('search', 'LOGGING-TUNE|CONFIG-|POLICY-|TEMPLATE-|CHARM-SRC-|EXECUTOR|ARCHIVE')
            | list | join(' | ') }}"
