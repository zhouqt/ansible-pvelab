---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Require explicit authorization for the workload logging fix
  ansible.builtin.assert:
    that:
      - pve_sunbeam_confirm_logging_tune | bool
    fail_msg: >-
      This stage rewrites the promtail and logrotate configuration of the live
      mysql-router pods, prunes their rotated-log archive and restarts
      promtail. To confirm, pass -e pve_sunbeam_confirm_logging_tune=true.

- name: Fix the workload logging of the mysql-router pods
  ansible.builtin.include_tasks: logging-scope.yml
