---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Collect the cluster health snapshot from the primary
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'verify-cluster.sh.j2') }}"
  register: pve_sunbeam_verify_raw
  changed_when: false

- name: Split the snapshot into named sections
  ansible.builtin.set_fact:
    pve_sunbeam_verify: >-
      {{ dict(pve_sunbeam_verify_raw.stdout | regex_findall('(?ms)^### ([A-Z_]+)\n(.*?)(?=^### |\Z)')) }}

- name: Probe the OVN metadata data path on every node
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ item.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-metadata-path.sh.j2') }}"
  loop: "{{ pve_sunbeam_nodes }}"
  register: pve_sunbeam_verify_metadata
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.fqdn }}"

- name: Check whether the system UUID helpers are installed on the PVE host
  ansible.builtin.stat:
    path: "{{ pve_common_ct_uuid_helper_dir | default('/usr/local/lib/ansible-pve') }}/ct_uuid_registry.py"
  register: pve_sunbeam_verify_system_uuid_helper

- name: Assert every Sunbeam CT keeps its own SMBIOS system UUID
  ansible.builtin.include_role:
    name: pve-common-ct-uuid
  vars:
    pve_common_ct_uuid_items: "{{ pve_sunbeam_nodes | map(attribute='vmid') | list }}"
    pve_common_ct_uuid_verify_only: true
  when: pve_sunbeam_verify_system_uuid_helper.stat.exists

- name: Report an environment without per-CT system UUIDs
  ansible.builtin.debug:
    msg: >-
      pve-common-ct-uuid is not installed on this host, so the check is skipped.
      Run playbooks/sunbeam/stages/03-system-uuid.yml with
      -e pve_sunbeam_confirm_system_uuid=true (or the pve-env1-prepare stage) to give every
      CT its own system UUID; until then live
      migration between Sunbeam nodes fails with
      "Attempt to migrate guest to the same host".
  when: not pve_sunbeam_verify_system_uuid_helper.stat.exists

- name: Parse the snapshot and assert the health baseline
  ansible.builtin.include_tasks: verify-parse.yml
