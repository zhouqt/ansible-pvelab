---

- name: Assert every planned node is a cluster member
  ansible.builtin.assert:
    that:
      - item.hostname in pve_sunbeam_verify['CLUSTER_LIST']
    fail_msg: >-
      {{ item.fqdn }} is not in the `sunbeam cluster list` output.
  loop: "{{ pve_sunbeam_nodes }}"
  loop_control:
    label: "{{ item.fqdn }}"

- name: Extract the Ceph fsid
  ansible.builtin.set_fact:
    pve_sunbeam_verify_ceph_fsid: >-
      {{ pve_sunbeam_verify['CEPH_FSID'] | default('') | trim }}

- name: Decide whether the cluster matches the configured baseline
  ansible.builtin.set_fact:
    pve_sunbeam_baseline_configured: "{{ pve_sunbeam_baseline_fingerprint | default('') | length > 0 }}"
    pve_sunbeam_baseline_match: >-
      {{ pve_sunbeam_baseline_fingerprint | default('') | length == 0
         or pve_sunbeam_verify_ceph_fsid == pve_sunbeam_baseline_fingerprint }}

- name: Scope the measured exemptions to the baseline environment
  ansible.builtin.set_fact:
    pve_sunbeam_ceph_tolerated_warnings_effective: >-
      {{ pve_sunbeam_ceph_tolerated_warnings if pve_sunbeam_baseline_match | bool else [] }}
    pve_sunbeam_known_blocked_applications_effective: >-
      {{ pve_sunbeam_known_blocked_applications if pve_sunbeam_baseline_match | bool else [] }}

- name: Assert the cluster matches the configured baseline
  ansible.builtin.assert:
    that:
      - pve_sunbeam_baseline_match | bool
    fail_msg: >-
      Ceph fsid is {{ pve_sunbeam_verify_ceph_fsid | default('(unknown)') }}, but
      group_vars declares pve_sunbeam_baseline_fingerprint={{ pve_sunbeam_baseline_fingerprint }}.
      Every other check in this stage describes a *healthy* cluster, and this one is what
      says it is *the expected* cluster: a different fsid means the Ceph cluster was
      re-created (or this stage is pointed at another environment), and its OSDs, pools and
      volumes are not the ones the rest of the playbook reasons about.
      To verify a freshly built environment and record it as the new baseline, run with
      -e pve_sunbeam_baseline_enforced=false, check the output, then update the fingerprint in
      inventory/group_vars/all/sunbeam.yml.
  when:
    - pve_sunbeam_baseline_enforced | bool
    - pve_sunbeam_baseline_configured | bool

- name: Warn when the cluster is not the baseline and enforcement is off
  ansible.builtin.debug:
    msg: >-
      BASELINE MISMATCH: fsid {{ pve_sunbeam_verify_ceph_fsid | default('(unknown)') }} !=
      {{ pve_sunbeam_baseline_fingerprint }}. Enforcement is off
      (pve_sunbeam_baseline_enforced=false), so the assertions below still run, but the
      measured exemptions (pve_sunbeam_ceph_tolerated_warnings and the known blocked
      applications) are switched off: they describe another environment.
  when:
    - not (pve_sunbeam_baseline_match | bool)
    - not (pve_sunbeam_baseline_enforced | bool)

- name: Report the baseline fingerprint
  ansible.builtin.debug:
    msg: >-
      Baseline fingerprint: fsid={{ pve_sunbeam_verify_ceph_fsid | default('(unknown)') }}
      expected={{ pve_sunbeam_baseline_fingerprint | default('(unset)') }}
      match={{ pve_sunbeam_baseline_match | bool }} enforced={{ pve_sunbeam_baseline_enforced | bool }}

- name: Extract the Ceph health state
  ansible.builtin.set_fact:
    pve_sunbeam_verify_ceph_health: >-
      {{ pve_sunbeam_verify['CEPH'] | regex_findall('health: (HEALTH_[A-Z]+)') | join('') or 'UNKNOWN' }}

- name: Assert Ceph is not in an error state
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_ceph_health in ['HEALTH_OK', 'HEALTH_WARN']
    fail_msg: >-
      Ceph health is {{ pve_sunbeam_verify_ceph_health }} (HEALTH_ERR / could not be parsed).
      `ceph -s`:
      {{ pve_sunbeam_verify['CEPH'] }}

- name: Extract the Ceph health warnings
  ansible.builtin.set_fact:
    pve_sunbeam_verify_ceph_warnings: >-
      {{ (pve_sunbeam_verify['CEPH']
          | regex_findall('(?m)health: HEALTH_WARN\n((?:^[ \t]{5,}\S.*$\n?)+)')
          | join('')).split('\n') | map('trim') | select | list }}

- name: Compute the Ceph health warnings that are not tolerated
  ansible.builtin.set_fact:
    pve_sunbeam_verify_ceph_warnings_bad: >-
      {{ (pve_sunbeam_verify_ceph_warnings
          | reject('search', pve_sunbeam_ceph_tolerated_warnings_effective | join('|')) | list)
         if (pve_sunbeam_ceph_tolerated_warnings_effective | length > 0)
         else pve_sunbeam_verify_ceph_warnings }}

- name: Assert every Ceph warning is on the tolerated list
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_ceph_warnings_bad | length == 0
    fail_msg: >-
      Ceph reported non-exempt warnings: {{ pve_sunbeam_verify_ceph_warnings_bad }}.
      Exempted: {{ pve_sunbeam_ceph_tolerated_warnings_effective }} (to accept new environmental
      warnings, add them to pve_sunbeam_ceph_tolerated_warnings in group_vars{% if not (pve_sunbeam_baseline_match | bool) %}
      -- but note this cluster is not the baseline environment, where the exemption list
      was measured, so the exemptions are disabled here and every warning is reported{% endif %}).

- name: Report the Ceph health
  ansible.builtin.debug:
    msg: >-
      Ceph health: {{ pve_sunbeam_verify_ceph_health }}{% if pve_sunbeam_verify_ceph_warnings | length > 0 %}
      (exempted: {{ pve_sunbeam_ceph_tolerated_warnings_effective }}){% endif %}

- name: Parse the Ceph OSD counters
  ansible.builtin.set_fact:
    pve_sunbeam_verify_osd_total: >-
      {{ (pve_sunbeam_verify['CEPH'] | regex_findall('osd: (\d+) osds')
          | first | default(['0']))[0] | int }}
    pve_sunbeam_verify_osd_up: >-
      {{ (pve_sunbeam_verify['CEPH'] | regex_findall('osd: (\d+) osds: (\d+) up')
          | first | default(['0', '0']))[1] | int }}
    pve_sunbeam_verify_osd_in: >-
      {{ (pve_sunbeam_verify['CEPH'] | regex_findall('(\d+) in \(')
          | first | default(['0']))[0] | int }}

- name: Assert every OSD is up and in
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_osd_total > 0
      - pve_sunbeam_verify_osd_up == pve_sunbeam_verify_osd_total
      - pve_sunbeam_verify_osd_in == pve_sunbeam_verify_osd_total
    fail_msg: >-
      Not every OSD is up/in (total={{ pve_sunbeam_verify_osd_total }}
      up={{ pve_sunbeam_verify_osd_up }} in={{ pve_sunbeam_verify_osd_in }}). The osd line of `ceph -s`:
      {{ pve_sunbeam_verify['CEPH'] | regex_findall('(?m)^[ \t]*osd:.*$') | join('') or '(could not be parsed)' }}

- name: Assert all placement groups are active+clean
  ansible.builtin.assert:
    that:
      - "'active+clean' in pve_sunbeam_verify['CEPH']"
    fail_msg: >-
      Not all PGs are active+clean:
      {{ pve_sunbeam_verify['CEPH'] | regex_findall('(?m)^[ \t]*pgs:.*$') | join('') or '(could not be parsed)' }}

- name: Report the Ceph baseline comparison
  ansible.builtin.debug:
    msg:
      - "OSD: {{ pve_sunbeam_verify_osd_total }} (live baseline {{ pve_sunbeam_ceph_expected_osds }}; of which {{ pve_sunbeam_ceph_managed_osd_devices }} are managed by this playbook)"
      - "PG/pool: {{ pve_sunbeam_verify['CEPH'] | regex_findall('(?m)^[ \t]*pools:.*$') | join('') | trim }}"
      - "OSD tree:"
      - "{{ pve_sunbeam_verify['CEPH_OSD_TREE'].split('\n') }}"

- name: Assert the openstack model status carries an application map
  ansible.builtin.assert:
    that:
      - "'applications' in (pve_sunbeam_verify['JUJU_OPENSTACK'] | from_json)"
    fail_msg: >-
      `juju status -m {{ pve_sunbeam_juju_openstack_model }} --format json` returned no
      applications, so the model did not resolve or is empty. Check that name on the
      primary ({{ pve_sunbeam_primary_node.fqdn }}); the templates run juju as
      {{ pve_sunbeam_node_user }}, so a model owned by another juju user has to be spelled
      <user>/<model>.

- name: Assert the machines model status carries an application map
  ansible.builtin.assert:
    that:
      - "'applications' in (pve_sunbeam_verify['JUJU_MACHINES'] | from_json)"
    fail_msg: >-
      `juju status -m {{ pve_sunbeam_juju_machines_model }} --format json` returned no
      applications, so the model did not resolve or is empty. Check that name on the
      primary ({{ pve_sunbeam_primary_node.fqdn }}); Sunbeam creates the IAAS model under
      the controller's `admin` user, which is why the default is
      `admin/openstack-machines` and not the bare name.

- name: Compute the non-active applications in the openstack model
  ansible.builtin.set_fact:
    pve_sunbeam_verify_openstack_bad: >-
      {{ (pve_sunbeam_verify['JUJU_OPENSTACK'] | from_json).applications | dict2items
         | selectattr('value.application-status.current', 'ne', 'active')
         | map(attribute='key') | list }}

- name: Assert every application in the openstack model is active
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_openstack_bad | length == 0
    fail_msg: "Non-active applications in the openstack model: {{ pve_sunbeam_verify_openstack_bad }}"

- name: Compute the non-active applications in the machines model
  ansible.builtin.set_fact:
    pve_sunbeam_verify_machines_bad: >-
      {{ (pve_sunbeam_verify['JUJU_MACHINES'] | from_json).applications | dict2items
         | rejectattr('key', 'in', pve_sunbeam_known_blocked_applications_effective)
         | selectattr('value.application-status.current', 'ne', 'active')
         | map(attribute='key') | list }}

- name: Assert every non-exempt application in the machines model is active
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_machines_bad | length == 0
    fail_msg: >-
      Non-active applications in the openstack-machines model: {{ pve_sunbeam_verify_machines_bad }}.
      Known exemptions: {{ pve_sunbeam_known_blocked_applications_effective }}{% if not (pve_sunbeam_baseline_match | bool) %}
      (disabled: this cluster is not the baseline environment these were measured on){% endif %}.

- name: Build the machines-model application status map
  ansible.builtin.set_fact:
    pve_sunbeam_verify_machines_status: >-
      {{ dict((pve_sunbeam_verify['JUJU_MACHINES'] | from_json).applications | dict2items
              | map(attribute='key')
              | zip((pve_sunbeam_verify['JUJU_MACHINES'] | from_json).applications
                    | dict2items | map(attribute='value.application-status.current'))) }}

- name: Assert the storage-critical applications are active
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_machines_status[item] is defined
      - pve_sunbeam_verify_machines_status[item] == 'active'
    fail_msg: >-
      {{ item }} in openstack-machines is not active (currently {{
      pve_sunbeam_verify_machines_status[item] | default('missing') }}).
  loop:
    - microceph
    - openstack-hypervisor
    - cinder-volume
    - k8s
  loop_control:
    label: "{{ item }}"

- name: Report the status of the exempted applications
  ansible.builtin.debug:
    msg: "{{ item }}: {{ pve_sunbeam_verify_machines_status[item] | default('missing') }}"
  loop: "{{ pve_sunbeam_known_blocked_applications }}"
  loop_control:
    label: "{{ item }}"

- name: Count the healthy cinder-volume services
  ansible.builtin.set_fact:
    pve_sunbeam_verify_cinder_services: >-
      {{ pve_sunbeam_verify['VOLUME_SERVICES']
         | regex_findall('(?m)^\| cinder-volume\s+\| [^|]+\| [^|]+\| enabled\s+\| up\s+\|') | length }}

- name: Assert every node reports an up cinder-volume service
  ansible.builtin.assert:
    that:
      - pve_sunbeam_verify_cinder_services | int == pve_sunbeam_nodes | length
    fail_msg: >-
      Expected {{ pve_sunbeam_nodes | length }} enabled/up cinder-volume services,
      found {{ pve_sunbeam_verify_cinder_services }}. Raw output:
      {{ pve_sunbeam_verify['VOLUME_SERVICES'].split('\n') }}

- name: Assert the metadata data path bypasses the HTTP proxy on every node
  ansible.builtin.assert:
    that:
      - "'env=agent' in (item.stdout | default(''))"
      - item.stdout is search('code=(400|404) ')
      - >-
        not (pve_sunbeam_proxy_enabled | bool)
        or item.stdout is search('METADATA host=\S+ env=agent proxy=enabled bypass=True code=(400|404) ')
    fail_msg: >-
      {{ item.item.fqdn }}: the neutron-ovn-metadata-agent cannot reach its own
      nova-api-metadata directly -- probe said
      '{{ item.stdout | default('') | trim | default('(no output)', true) }}'.
      Expected 'env=agent bypass=True code=400' (or 404). env=file means the agent
      is not running, so only the on-disk config could be inspected. bypass=False
      means the node's management IP is not in the *agent's* no_proxy: Python's
      no_proxy matching is hostname-only and ignores CIDR, so the request goes to the
      HTTP proxy and times out (code=503/0), and guests on that node get
      DataSourceNone from cloud-init and boot without an SSH key. Note the agent reads
      /etc/environment once at start-up, so fixing the file is not enough -- the unit
      has to be restarted (or the node re-run through the node-prepare stage) before
      this assertion can pass.
  loop: "{{ pve_sunbeam_verify_metadata.results }}"
  loop_control:
    label: "{{ item.item.fqdn }}"
  when: pve_sunbeam_verify_metadata is defined

- name: Report the metadata data path
  ansible.builtin.debug:
    msg: "{{ item.item.fqdn }}: {{ item.stdout | default('') | trim }}"
  loop: "{{ pve_sunbeam_verify_metadata.results }}"
  loop_control:
    label: "{{ item.item.fqdn }}"
  when: pve_sunbeam_verify_metadata is defined

- name: Report the verification summary
  ansible.builtin.debug:
    msg:
      - "cluster members: {{ pve_sunbeam_verify['CLUSTER_LIST'] | regex_findall('(?m)^[ \\t]+hostname: (\\S+)') | join(', ') }}"
      - "Ceph: {{ pve_sunbeam_verify_ceph_health }}, {{ pve_sunbeam_verify_osd_total }} OSD up/in, {{ pve_sunbeam_verify['CEPH'] | regex_findall('(?m)^[ \t]*pgs:.*$') | join('') | trim }}"
      - "openstack model: all {{ (pve_sunbeam_verify['JUJU_OPENSTACK'] | from_json).applications | length }} applications active"
      - "openstack-machines model: {{ (pve_sunbeam_verify['JUJU_MACHINES'] | from_json).applications | length }} applications"
      - "cinder-volume service: {{ pve_sunbeam_verify_cinder_services }}/{{ pve_sunbeam_nodes | length }} enabled+up"
      - "volume services:"
      - "{{ pve_sunbeam_verify['VOLUME_SERVICES'].split('\n') }}"
