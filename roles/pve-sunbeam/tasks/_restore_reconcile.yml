---
- name: Stage the recovery helper on the PVE host
  ansible.builtin.copy:
    src: "{{ role_path }}/files/restore_reconcile.py"
    dest: "{{ sunbeam_staging_dir }}/restore_reconcile.py"
    owner: root
    group: root
    mode: "0700"

- name: Reconcile Juju workload errors and per-node OVN gateway state
  ansible.builtin.command:
    argv:
      - python3
      - "{{ sunbeam_staging_dir }}/restore_reconcile.py"
    stdin: "{{ sunbeam_restore_reconcile_config | to_json }}"
  register: sunbeam_restore_reconcile
  changed_when: >-
    sunbeam_restore_reconcile.rc == 0 and
    ((sunbeam_restore_reconcile.stdout | from_json).changed | default(false))
  failed_when: false

- name: Fail when post-restore reconciliation could not complete
  ansible.builtin.fail:
    msg: >-
      Post-restore Juju/OVN reconciliation failed (rc={{ sunbeam_restore_reconcile.rc }}):
      {{ sunbeam_restore_reconcile.stderr | default('') | trim }}
      {{ sunbeam_restore_reconcile.stdout | default('') | trim }}
  when: sunbeam_restore_reconcile.rc != 0

- name: Report post-restore Juju and gateway reconciliation
  ansible.builtin.debug:
    msg: "{{ sunbeam_restore_reconcile.stdout | from_json }}"
