---
- name: Load shared stage facts
  ansible.builtin.include_tasks: _stage_guard.yml

- name: Require explicit authorization for cluster bootstrap
  ansible.builtin.assert:
    that:
      - pve_sunbeam_confirm_cluster_bootstrap | bool
      - pve_sunbeam_confirm_external_changes | bool
    fail_msg: >-
      This stage initializes a new Sunbeam/Juju/K8s control plane on the primary
      ({{ pve_sunbeam_primary_node.fqdn }}).
      To confirm, pass -e pve_sunbeam_confirm_cluster_bootstrap=true -e pve_sunbeam_confirm_external_changes=true.

- name: Check whether the control plane is already bootstrapped
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-cluster-state.sh.j2') }}"
  register: pve_sunbeam_cluster_state
  changed_when: false
  failed_when: false

- name: Derive the bootstrap decision from the cluster state probe
  ansible.builtin.set_fact:
    pve_sunbeam_cluster_is_bootstrapped: >-
      {{ pve_sunbeam_cluster_state.stdout | default('') is search('bootstrapped=yes') }}
    pve_sunbeam_bootstrap_needed: >-
      {{ (not (pve_sunbeam_cluster_state.stdout | default('') is search('bootstrapped=yes')))
         or (pve_sunbeam_bootstrap_repair_incomplete | bool
             and pve_sunbeam_cluster_state.stdout | default('') is search('bootstrap_complete=no')) }}

- name: Refuse to continue when the cluster state could not be determined
  ansible.builtin.assert:
    that:
      - pve_sunbeam_cluster_state.rc == 0
      - pve_sunbeam_cluster_state.stdout | default('') is search('(?m)^bootstrapped=(yes|no)( |$)')
    fail_msg: >-
      `sunbeam cluster list` on {{ pve_sunbeam_primary_node.fqdn }} did not return a usable
      answer, so this run cannot tell an un-bootstrapped control plane from an
      unreachable one:
      {{ pve_sunbeam_cluster_state.stdout | default('') | trim }}
      Re-run once the node answers `su - {{ pve_sunbeam_node_user }} -c 'sunbeam cluster list'`
      by hand. If you are certain this is a cold cluster whose error message is not on
      the probe's whitelist, pass -e pve_sunbeam_allow_unreadable_cluster_state=true.
  ignore_errors: "{{ pve_sunbeam_allow_unreadable_cluster_state | bool }}"

- name: Note that bootstrap will be skipped
  ansible.builtin.debug:
    msg: >-
      The control plane already exists and its bootstrap run finished
      ({{ pve_sunbeam_cluster_state.stdout | trim }}); this run only validates the
      manifest and juju controller and will not bootstrap again.
  when: not (pve_sunbeam_bootstrap_needed | bool)

- name: Warn that the existing control plane never finished bootstrapping
  ansible.builtin.debug:
    msg: >-
      The cluster exists ({{ pve_sunbeam_cluster_state.stdout | trim }}) but the
      local-provider bootstrap never reached its last plan step
      (`sunbeam_bootstrapped` is unset), so the deployment is
      incomplete. Re-running `sunbeam cluster bootstrap`: completed plans are
      no-ops and the CLI resumes at the first unfinished step.
  when:
    - pve_sunbeam_cluster_is_bootstrapped | bool
    - pve_sunbeam_bootstrap_needed | bool

- name: Resolve the Sunbeam node identities
  ansible.builtin.include_tasks: _node_identity.yml
  when: pve_sunbeam_bootstrap_needed | bool

- name: Render the Sunbeam deployment manifest
  ansible.builtin.template:
    src: manifest.yaml.j2
    dest: "{{ pve_sunbeam_staging_dir }}/manifest.yaml"
    mode: "0600"
  when: pve_sunbeam_bootstrap_needed | bool

- name: Require the rendered manifest to be keyed by the probed node identities
  ansible.builtin.include_tasks: _manifest_identity_guard.yml
  when: pve_sunbeam_bootstrap_needed | bool

- name: Read the manifest currently stored in the primary CT
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - cat
      - "{{ pve_sunbeam_manifest_path }}"
  register: pve_sunbeam_manifest_current
  changed_when: false
  failed_when: false

- name: Push the manifest into the primary CT when it differs
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - push
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - "{{ pve_sunbeam_staging_dir }}/manifest.yaml"
      - "{{ pve_sunbeam_manifest_path }}"
      - --user
      - "{{ pve_sunbeam_node_user }}"
      - --group
      - "{{ pve_sunbeam_node_user }}"
      - --perms
      - "0600"
  when:
    - pve_sunbeam_bootstrap_needed | bool
    - >-
      (pve_sunbeam_manifest_current.stdout | default('') | trim)
      != (lookup('template', 'manifest.yaml.j2') | trim)

- name: Ensure the inner LXD masquerades the traffic of its own containers
  ansible.builtin.include_tasks: _inner_lxd_nat.yml
  when: pve_sunbeam_bootstrap_needed | bool

- name: Ensure the next free loop device exists inside the primary CT
  ansible.builtin.include_tasks: _loop_devices.yml
  when: pve_sunbeam_bootstrap_needed | bool

- name: Bootstrap the Sunbeam control plane
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'run-cluster-bootstrap.sh.j2') }}"
  when: pve_sunbeam_bootstrap_needed | bool
  register: pve_sunbeam_cluster_bootstrap_run
  async: "{{ pve_sunbeam_bootstrap_timeout }}"
  poll: "{{ pve_sunbeam_poll_interval }}"
  failed_when: false

- name: Re-check the control plane state
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - bash
      - -s
    stdin: "{{ lookup('template', 'check-cluster-state.sh.j2') }}"
  register: pve_sunbeam_cluster_state_after
  changed_when: false
  failed_when: false

- name: Assert the control plane is bootstrapped
  ansible.builtin.assert:
    that:
      - pve_sunbeam_cluster_state_after.rc == 0
      - "'bootstrapped=yes' in pve_sunbeam_cluster_state_after.stdout"
      - not (pve_sunbeam_bootstrap_needed | bool)
        or 'bootstrap_complete=yes' in pve_sunbeam_cluster_state_after.stdout
    fail_msg: >-
      The control plane was not initialized successfully (probe said
      '{{ pve_sunbeam_cluster_state_after.stdout | default('') | trim }}'). Check
      {{ pve_sunbeam_node_log_dir }}/cluster-bootstrap.log inside {{ pve_sunbeam_primary_node.fqdn }}.

- name: Read the Juju controllers known to the primary CT
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_sunbeam_node_user }}"
      - -c
      - "juju controllers --format json"
  register: pve_sunbeam_juju_controllers
  changed_when: false

- name: Assert the expected Juju controller is present
  ansible.builtin.assert:
    that:
      - pve_sunbeam_controller_name in pve_sunbeam_juju_controllers.stdout
    fail_msg: >-
      Juju controller {{ pve_sunbeam_controller_name }} was not found inside the primary CT.

- name: Read the current Sunbeam cluster members
  ansible.builtin.command:
    argv:
      - "{{ pve_sunbeam_pct_bin }}"
      - exec
      - "{{ pve_sunbeam_primary_node.vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_sunbeam_node_user }}"
      - -c
      - "sunbeam cluster list --format yaml"
  register: pve_sunbeam_cluster_list
  changed_when: false
  failed_when: false

- name: Report bootstrap result
  ansible.builtin.debug:
    msg:
      - "control plane: {{ pve_sunbeam_controller_name }} @ {{ pve_sunbeam_primary_node.fqdn }}"
      - "manifest: {{ pve_sunbeam_manifest_path }}"
      - "bootstrap executed this run: {{ 'yes' if (pve_sunbeam_bootstrap_needed | bool) else 'no (already exists and complete)' }}"
      - "bootstrap CLI rc: {{ pve_sunbeam_cluster_bootstrap_run.rc | default('n/a (skipped)') }}"
      - "after state: {{ pve_sunbeam_cluster_state_after.stdout | default('') | trim }}"
      - "cluster list:"
      - "{{ pve_sunbeam_cluster_list.stdout_lines }}"
