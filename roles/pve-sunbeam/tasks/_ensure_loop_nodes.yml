---

- name: Compute the loop device numbers the primary container needs
  ansible.builtin.set_fact:
    pve_sunbeam_loop_nodes_needed: >-
      {{ ((range(pve_sunbeam_loop_device_first, pve_sunbeam_loop_device_last + 1) | list)
          + (pve_sunbeam_loop_device_low_slots | map(attribute='loop') | list))
         | unique | sort }}

- name: Install the helper that creates the loop device nodes
  ansible.builtin.template:
    src: pve-ensure-loop-nodes.sh.j2
    dest: /usr/local/sbin/pve-ensure-loop-nodes.sh
    owner: root
    group: root
    mode: "0755"
  register: pve_sunbeam_loop_nodes_script

- name: Install the boot unit that keeps the loop device nodes in place
  ansible.builtin.template:
    src: pve-ensure-loop-nodes.service.j2
    dest: /etc/systemd/system/pve-ensure-loop-nodes.service
    owner: root
    group: root
    mode: "0644"
  register: pve_sunbeam_loop_nodes_unit

- name: Reload systemd after installing the loop node unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: pve_sunbeam_loop_nodes_unit.changed

- name: Enable the loop node unit
  ansible.builtin.systemd:
    name: pve-ensure-loop-nodes.service
    enabled: true
  when: pve_sunbeam_loop_nodes_unit.changed

- name: Create the missing loop device nodes
  ansible.builtin.command:
    argv: ["/usr/local/sbin/pve-ensure-loop-nodes.sh"]
  register: pve_sunbeam_loop_nodes_run
  changed_when: "'LOOP-NODES-CREATED=0 REPLACED=0' not in pve_sunbeam_loop_nodes_run.stdout"

- name: Verify every loop device node the primary binds exists
  ansible.builtin.command:
    argv: ["test", "-b", "/dev/loop{{ item }}"]
  loop: "{{ pve_sunbeam_loop_nodes_needed }}"
  loop_control:
    label: "/dev/loop{{ item }}"
  changed_when: false
