---

- name: Define the Juju command prefix and model for this environment
  ansible.builtin.set_fact:
    pve_lma_clients_juju_cmd: "JUJU_DATA={{ pve_yoga_juju_data }} {{ pve_yoga_juju_bin }}"
    pve_lma_clients_model: "{{ pve_yoga_controller_name }}:{{ pve_yoga_model_name }}"
    pve_lma_clients_hub_offer: "{{ pve_lma_controller_name }}:admin/{{ pve_lma_model }}.nagios"
    pve_lma_juju_cmd: "JUJU_DATA={{ pve_lma_juju_data }} {{ pve_lma_juju_bin }}"
    pve_lma_clients_base: >-
      ubuntu@{{ {'focal': '20.04', 'jammy': '22.04', 'noble': '24.04'}[pve_yoga_openstack_series] }}

- name: Require the target environment to be focal
  ansible.builtin.assert:
    that:
      - pve_yoga_openstack_series == 'focal' or (pve_lma_clients_allow_any_series | bool)
    fail_msg: >-
      this role only serves focal environments (currently pve_yoga_openstack_series={{ pve_yoga_openstack_series }}).
      for jammy/noble use --tags openstack-pve-observability (the COS route).

- name: Plan the LMA wiring against the applications actually deployed
  ansible.builtin.shell: |
    set -uo pipefail
    status=$(mktemp)
    {{ pve_obs_hub_pct_bin }} exec {{ pve_obs_hub_juju_client_vmid }} -- \
      su - {{ pve_obs_hub_juju_client_user }} -c \
      "{{ pve_lma_clients_juju_cmd }} status -m {{ pve_lma_clients_model }} --format json" > "$status"
    python3 - "$status" "{{ lma_nrpe_targets | join(',') }}" <<'PY'
    import json, sys
    doc = json.load(open(sys.argv[1]))
    targets = [t for t in sys.argv[2].split(',') if t]
    apps = doc.get('applications') or {}
    saas = doc.get('application-endpoints') or {}

    def is_principal(name):
        return 'subordinate-to' not in apps[name]

    present = sorted(a for a in targets if a in apps)
    general_info = [a for a in present if is_principal(a)]
    external = [a for a in general_info
                if 'nrpe-external-master' in (apps[a].get('endpoint-bindings') or {})]

    keystone_machine = None
    for unit in ((apps.get('keystone') or {}).get('units') or {}).values():
        keystone_machine = unit.get('machine')
        break

    print(json.dumps({
        'app_count': len(apps),
        'present_targets': present,
        'general_info': general_info,
        'external': external,
        'missing_targets': sorted(a for a in targets if a not in apps),
        'has_nrpe': 'nrpe' in apps,
        'has_osc': 'openstack-service-checks' in apps,
        'has_nagios': 'nagios' in apps or 'nagios' in saas,
        'keystone_machine': keystone_machine,
    }))
    PY
    rc=$?
    rm -f "$status"
    exit "$rc"
  args:
    executable: /bin/bash
  register: pve_lma_clients_plan_raw
  changed_when: false

- name: Keep the parsed plan
  ansible.builtin.set_fact:
    pve_lma_clients_plan: "{{ pve_lma_clients_plan_raw.stdout | from_json }}"

- name: Report the plan
  ansible.builtin.debug:
    msg:
      - "model           : {{ pve_lma_clients_model }}({{ pve_lma_clients_plan.app_count }} app)"
      - "nrpe attach targets : {{ pve_lma_clients_plan.general_info | join(', ') }}"
      - "nrpe-external-master targets: {{ pve_lma_clients_plan.external | join(', ') }}"
      - "missing targets  : {{ pve_lma_clients_plan.missing_targets | join(', ') | default('-', true) }}"
      - "keystone machine: {{ pve_lma_clients_plan.keystone_machine }}"

- name: Fail when the model has no keystone to hang openstack-service-checks on
  ansible.builtin.assert:
    that:
      - pve_lma_clients_plan.keystone_machine is not none
      - pve_lma_clients_plan.general_info | length > 0
    fail_msg: >-
      the model {{ pve_lma_clients_model }} has no keystone unit, and nothing to attach nrpe to
      principal -- this env may not be fully deployed.

- name: Deploy nrpe in the environment model
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} deploy nrpe -m {{ pve_lma_clients_model }}
        --base {{ pve_lma_clients_base }} --channel {{ pve_lma_clients_nrpe_channel }}
  when: not pve_lma_clients_plan.has_nrpe
  register: pve_lma_clients_deploy_nrpe
  changed_when: pve_lma_clients_deploy_nrpe.rc == 0

- name: Relate nrpe to every principal application (juju-info → placement + system checks)
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} relate -m {{ pve_lma_clients_model }}
        nrpe:general-info {{ item }}
  loop: "{{ pve_lma_clients_plan.general_info }}"
  loop_control:
    label: "{{ item }}"
  register: pve_lma_clients_relate_gi
  failed_when: >-
    pve_lma_clients_relate_gi.rc != 0
    and 'already exists' not in ((pve_lma_clients_relate_gi.stderr | default(''))
                                 ~ (pve_lma_clients_relate_gi.stdout | default('')))
  changed_when: pve_lma_clients_relate_gi.rc == 0

- name: Relate nrpe-external-master for the charms that provide it
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} relate -m {{ pve_lma_clients_model }}
        {{ item }}:nrpe-external-master nrpe:nrpe-external-master
  loop: "{{ pve_lma_clients_plan.external }}"
  loop_control:
    label: "{{ item }}"
  register: pve_lma_clients_relate_ext
  failed_when: >-
    pve_lma_clients_relate_ext.rc != 0
    and 'already exists' not in ((pve_lma_clients_relate_ext.stderr | default(''))
                                 ~ (pve_lma_clients_relate_ext.stdout | default('')))
  changed_when: pve_lma_clients_relate_ext.rc == 0

- name: Deploy openstack-service-checks next to keystone
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} deploy openstack-service-checks
        -m {{ pve_lma_clients_model }} --base {{ pve_lma_clients_base }}
        --channel {{ pve_lma_clients_osc_channel }}
        --to {{ pve_lma_clients_plan.keystone_machine }}
  when:
    - pve_lma_clients_enable_osc | bool
    - not pve_lma_clients_plan.has_osc
  register: pve_lma_clients_deploy_osc
  changed_when: pve_lma_clients_deploy_osc.rc == 0

- name: Relate openstack-service-checks to keystone and nrpe
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - "{{ pve_lma_clients_juju_cmd }} relate -m {{ pve_lma_clients_model }} {{ item }}"
  loop:
    - "openstack-service-checks:identity-credentials keystone:identity-credentials"
    - "openstack-service-checks:nrpe-external-master nrpe:nrpe-external-master"
  loop_control:
    label: "{{ item }}"
  when: pve_lma_clients_enable_osc | bool
  register: pve_lma_clients_relate_osc
  failed_when: >-
    pve_lma_clients_relate_osc.rc != 0
    and 'already exists' not in ((pve_lma_clients_relate_osc.stderr | default(''))
                                 ~ (pve_lma_clients_relate_osc.stdout | default('')))
  changed_when: pve_lma_clients_relate_osc.rc == 0

- name: Handle the bundled snapd of openstack-service-checks
  ansible.builtin.include_tasks: osc-snap-layer.yml
  when: pve_lma_clients_enable_osc | bool

- name: Read the current openstack-service-checks configuration
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} config openstack-service-checks
        -m {{ pve_lma_clients_model }} --format json
  register: pve_lma_clients_osc_config_raw
  changed_when: false
  failed_when: false
  when: pve_lma_clients_enable_osc | bool

- name: Keep the current openstack-service-checks settings
  ansible.builtin.set_fact:
    pve_lma_clients_osc_config: >-
      {{ (pve_lma_clients_osc_config_raw.stdout | default('{}', true) | from_json).get('settings', {}) }}
  when: pve_lma_clients_enable_osc | bool

- name: Read the Vault root CA from the vault leader
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} exec -m {{ pve_lma_clients_model }}
        --unit vault/0 -- leader-get root-ca
  register: pve_lma_clients_vault_ca
  changed_when: false
  failed_when: false
  when: pve_lma_clients_enable_osc | bool

- name: Configure the Vault CA on openstack-service-checks
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} config openstack-service-checks -m {{ pve_lma_clients_model }}
        trusted_ssl_ca="{{ pve_lma_clients_vault_ca.stdout | b64encode }}"
  when:
    - pve_lma_clients_enable_osc | bool
    - pve_lma_clients_vault_ca.stdout is defined
    - "'BEGIN CERTIFICATE' in (pve_lma_clients_vault_ca.stdout | default(''))"
    - >-
      (pve_lma_clients_osc_config.get('trusted_ssl_ca', {}).get('value', '') | string | trim)
      != (pve_lma_clients_vault_ca.stdout | b64encode | string | trim)
  register: pve_lma_clients_osc_ca
  changed_when: pve_lma_clients_osc_ca.rc == 0

- name: Warn when the Vault CA could not be read
  ansible.builtin.debug:
    msg: >-
      could not fetch the root-ca from vault/0 ({{ pve_lma_clients_vault_ca.stderr | default('') | trim }}):
      openstack-service-checks will use the system default CA, so the HTTPS checks may report certificate errors.
  when:
    - pve_lma_clients_enable_osc | bool
    - "'BEGIN CERTIFICATE' not in (pve_lma_clients_vault_ca.stdout | default(''))"

- name: Read the floating IP ids that must be skipped
  ansible.builtin.command:
    argv:
      - bash
      - "{{ repo_root }}/openstack-wrapper.sh"
      - openstack
      - floating
      - ip
      - list
      - -f
      - json
  environment:
    OPENSTACK_RC_FILE: "{{ pve_yoga_openrc_file }}"
  delegate_to: localhost
  register: pve_lma_clients_fips
  changed_when: false
  failed_when: false
  when: pve_lma_clients_enable_osc | bool

- name: Read the port ids that must be skipped
  ansible.builtin.command:
    argv:
      - bash
      - "{{ repo_root }}/openstack-wrapper.sh"
      - openstack
      - port
      - list
      - -f
      - json
  environment:
    OPENSTACK_RC_FILE: "{{ pve_yoga_openrc_file }}"
  delegate_to: localhost
  register: pve_lma_clients_ports
  changed_when: false
  failed_when: false
  when: pve_lma_clients_enable_osc | bool

- name: Work out the desired skip lists
  ansible.builtin.set_fact:
    pve_lma_clients_desired_fips: "{{ pve_lma_clients_fips.stdout | from_json | map(attribute='ID') | join(',') }}"
    pve_lma_clients_desired_ports: "{{ pve_lma_clients_ports.stdout | from_json | map(attribute='ID') | join(',') }}"
  when:
    - pve_lma_clients_enable_osc | bool
    - pve_lma_clients_fips.rc | default(1) == 0
    - pve_lma_clients_ports.rc | default(1) == 0

- name: Configure openstack-service-checks to skip the existing floating IPs and ports
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} config openstack-service-checks -m {{ pve_lma_clients_model }}
        check-floating-ips=all skip-floating-ips="{{ pve_lma_clients_desired_fips }}"
        check-ports=all skip-ports="{{ pve_lma_clients_desired_ports }}"
  when:
    - pve_lma_clients_enable_osc | bool
    - pve_lma_clients_fips.rc | default(1) == 0
    - pve_lma_clients_ports.rc | default(1) == 0
    - >-
      (pve_lma_clients_osc_config.get('check-floating-ips', {}).get('value', '') | string)
      != 'all'
      or (pve_lma_clients_osc_config.get('skip-floating-ips', {}).get('value', '') | string)
         != (pve_lma_clients_desired_fips | string)
      or (pve_lma_clients_osc_config.get('check-ports', {}).get('value', '') | string)
         != 'all'
      or (pve_lma_clients_osc_config.get('skip-ports', {}).get('value', '') | string)
         != (pve_lma_clients_desired_ports | string)
  register: pve_lma_clients_osc_skip
  changed_when: pve_lma_clients_osc_skip.rc == 0

- name: Warn when the skip lists could not be built
  ansible.builtin.debug:
    msg: >-
      the openstack CLI cannot list FIPs/ports (fips rc={{ pve_lma_clients_fips.rc | default('n/a') }},
      ports rc={{ pve_lma_clients_ports.rc | default('n/a') }}): skipping skip-floating-ips /
      the skip-ports config, osc will generate checks for the existing FIPs/ports.
  when:
    - pve_lma_clients_enable_osc | bool
    - (pve_lma_clients_fips.rc | default(1)) != 0 or (pve_lma_clients_ports.rc | default(1)) != 0

- name: Consume the nagios offer published by the LMA hub
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} consume {{ pve_lma_clients_hub_offer }}
        -m {{ pve_lma_clients_model }}
  when: not pve_lma_clients_plan.has_nagios
  register: pve_lma_clients_consume
  changed_when: pve_lma_clients_consume.rc == 0

- name: Relate nrpe:monitors to the consumed nagios
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_lma_clients_juju_cmd }} relate -m {{ pve_lma_clients_model }}
        nrpe:monitors nagios:monitors
  register: pve_lma_clients_relate_nagios
  failed_when: >-
    pve_lma_clients_relate_nagios.rc != 0
    and 'already exists' not in ((pve_lma_clients_relate_nagios.stderr | default(''))
                                 ~ (pve_lma_clients_relate_nagios.stdout | default('')))
  changed_when: pve_lma_clients_relate_nagios.rc == 0

- name: Wait for the LMA clients to become active
  ansible.builtin.include_role:
    name: pve-obs-cos-hub
    tasks_from: wait-model-active
  vars:
    obs_wait_model_ref: "{{ pve_lma_clients_model }}"
    obs_wait_apps: "{{ ['nrpe', 'nagios'] + (['openstack-service-checks'] if (pve_lma_clients_enable_osc | bool) else []) }}"
    obs_wait_label: "{{ pve_yoga_env_slug }} LMA clients"
    obs_wait_juju_cmd: "{{ pve_lma_clients_juju_cmd }}"
  when: not (pve_lma_clients_skip_wait | bool)

- name: Verify the LMA client wiring
  ansible.builtin.include_tasks: verify.yml
