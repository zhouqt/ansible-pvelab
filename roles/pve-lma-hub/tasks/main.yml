---

- name: Load the LMA hub facts
  ansible.builtin.set_fact:
    pve_obs_hub_active_cts: >-
      {{ (pve_obs_hub_cts | selectattr('group', 'in', pve_lma_hub_ct_groups) | list)
         if (pve_lma_l2_enabled | bool)
         else (pve_obs_hub_cts | selectattr('group', 'in', pve_lma_hub_ct_groups)
               | rejectattr('vmid', 'equalto', pve_lma_l2_vmid | int) | list) }}
    pve_lma_juju_cmd: "JUJU_DATA={{ pve_lma_juju_data }} {{ pve_lma_juju_bin }}"
    pve_lma_nagios_ref: "{{ pve_lma_controller_name }}:admin/{{ pve_lma_model }}"

- name: Require the LMA CT list to hold the controller and the nagios host
  ansible.builtin.assert:
    that:
      - pve_lma_controller_vmid | int in (pve_obs_hub_active_cts | map(attribute='vmid') | map('int') | list)
      - pve_lma_nagios_vmid | int in (pve_obs_hub_active_cts | map(attribute='vmid') | map('int') | list)
      - (pve_lma_l2_enabled | bool) or (pve_obs_hub_active_cts | length == 2)
    fail_msg: >-
      the lma group of pve_obs_hub_cts must contain CT {{ pve_lma_controller_vmid }} /
      {{ pve_lma_nagios_vmid }}; the L2 CT ({{ pve_lma_l2_vmid }}) is only
      only included when pve_lma_l2_enabled=true. Actual: {{ pve_obs_hub_active_cts }}.

- name: Build the bionic container template when it is missing
  ansible.builtin.include_tasks: template.yml

- name: Host-side preflight (shared with pve-obs-hub)
  ansible.builtin.include_role:
    name: pve-obs-hub
    tasks_from: preflight

- name: Create the LMA hub containers (shared with pve-obs-hub)
  ansible.builtin.include_role:
    name: pve-obs-hub
    tasks_from: containers

- name: Bootstrap the Juju 2.9 controller and create the lma-hub model
  ansible.builtin.include_tasks: controller.yml

- name: Deploy nagios and publish the monitors offer
  ansible.builtin.include_tasks: nagios.yml

- name: Monitor the LMA hub machines themselves
  ansible.builtin.include_tasks: self-monitor.yml

- name: Verify the LMA hub
  ansible.builtin.include_tasks: verify.yml
