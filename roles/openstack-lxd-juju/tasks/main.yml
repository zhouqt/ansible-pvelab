---
- name: Check if Juju controller already exists
  shell: >
    {{ juju_openstack_cmd }} controllers --format json 2>/dev/null |
    jq -r '.controllers | keys[]' | grep -q "^{{ os_lxd_juju_controller }}$" && echo "exists" || echo "not_found"
  register: controller_check
  changed_when: false

- name: Bootstrap Juju 2.9 controller on localhost/LXD
  shell: |
    {{ juju_openstack_cmd }} bootstrap localhost {{ os_lxd_juju_controller }} \
      --agent-version={{ os_lxd_juju_agent_version }} \
      --config project={{ os_lxd_project }} \
      --config juju-db-snap-channel=4.4/stable \
      --bootstrap-series=focal \
      --no-gui
  when: controller_check.stdout == "not_found"
  register: bootstrap_result
  timeout: 600

- name: Set model-defaults project
  shell: >
    {{ juju_openstack_cmd }} model-defaults --controller {{ os_lxd_juju_controller }} project={{ os_lxd_project }}
  changed_when: true

- name: Check if model already exists
  shell: >
    {{ juju_openstack_cmd }} models --controller {{ os_lxd_juju_controller }} --format json 2>/dev/null |
    jq -r '.models[].name' | grep -q "{{ os_lxd_model_name }}" && echo "exists" || echo "not_found"
  register: model_check
  changed_when: false

- name: Create Juju model
  shell: >
    {{ juju_openstack_cmd }} add-model {{ os_lxd_model_name }} --controller {{ os_lxd_juju_controller }}
  when: model_check.stdout == "not_found"

- name: Switch to model
  shell: >
    {{ juju_openstack_cmd }} switch {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }}
  changed_when: false

- name: Add 'public' space
  shell: >
    {{ juju_openstack_cmd }} add-space -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} public
  register: add_public
  failed_when: add_public.rc != 0 and 'already exists' not in add_public.stderr

- name: Add 'internal' space
  shell: >
    {{ juju_openstack_cmd }} add-space -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} internal
  register: add_internal
  failed_when: add_internal.rc != 0 and 'already exists' not in add_internal.stderr

- name: Add 'data' space
  shell: >
    {{ juju_openstack_cmd }} add-space -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} data
  register: add_data
  failed_when: add_data.rc != 0 and 'already exists' not in add_data.stderr

- name: Add 'storage' space
  shell: >
    {{ juju_openstack_cmd }} add-space -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} storage
  register: add_storage
  failed_when: add_storage.rc != 0 and 'already exists' not in add_storage.stderr

- name: Get controller container name
  shell: >
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:controller --format json 2>/dev/null |
    jq -r '.machines["0"]["instance-id"]'
  register: ctrl_container
  changed_when: false

- name: Get Juju model UUID
  shell: >
    {{ juju_openstack_cmd }} show-model {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null |
    jq -r '."{{ os_lxd_model_name }}"."model-uuid"'
  register: model_uuid
  changed_when: false

- name: Get MongoDB password from controller agent.conf
  shell: |
    lxc exec {{ ctrl_container.stdout }} --project {{ os_lxd_project }} -- \
      grep statepassword /var/lib/juju/agents/machine-0/agent.conf | awk '{print $2}'
  register: mongo_password
  changed_when: false

- name: Copy TLS certs to snap-accessible path
  shell: |
    lxc exec {{ ctrl_container.stdout }} --project {{ os_lxd_project }} -- bash -c "
      cp /var/lib/juju/ca.crt /var/snap/juju-db/common/ca.crt
      cp /var/lib/juju/server.pem /var/snap/juju-db/common/server.pem
    "
  changed_when: true

- name: Inject subnet records into Juju MongoDB
  shell: |
    lxc exec {{ ctrl_container.stdout }} --project {{ os_lxd_project }} -- \
      juju-db.mongo --quiet --tls \
      --tlsCAFile /var/snap/juju-db/common/ca.crt \
      --tlsCertificateKeyFile /var/snap/juju-db/common/server.pem \
      --host localhost --port 37017 \
      --authenticationDatabase admin \
      -u machine-0 -p "{{ mongo_password.stdout }}" \
      juju --eval '
    var modelUUID = "{{ model_uuid.stdout }}";

    var publicSpace = db.spaces.findOne({"model-uuid": modelUUID, "name": "public"});
    var internalSpace = db.spaces.findOne({"model-uuid": modelUUID, "name": "internal"});
    var dataSpace = db.spaces.findOne({"model-uuid": modelUUID, "name": "data"});
    var storageSpace = db.spaces.findOne({"model-uuid": modelUUID, "name": "storage"});

    if (!publicSpace || !internalSpace || !dataSpace || !storageSpace) {
      print("ERROR: spaces not found. public=" + publicSpace + " internal=" + internalSpace + " data=" + dataSpace + " storage=" + storageSpace);
      quit(1);
    }

    var subnets = [
      {cidr: "192.168.122.0/24", spaceId: publicSpace._id.split(":")[1]},
      {cidr: "192.168.165.0/24", spaceId: internalSpace._id.split(":")[1]},
      {cidr: "192.168.166.0/24", spaceId: dataSpace._id.split(":")[1]},
      {cidr: "192.168.167.0/24", spaceId: storageSpace._id.split(":")[1]}
    ];

    subnets.forEach(function(s) {
      db.subnets.remove({"model-uuid": modelUUID, "cidr": s.cidr});
      db.subnets.insert({
        "_id": modelUUID + ":" + s.cidr,
        "model-uuid": modelUUID,
        "cidr": s.cidr,
        "space-id": s.spaceId,
        "provider-id": "",
        "provider-network-id": "",
        "vlan-tag": 0,
        "availability-zones": null,
        "life": 0,
        "is-public": false
      });
    });

    print("OK: 4 subnets injected for model " + modelUUID);
    db.subnets.find({"model-uuid": modelUUID}).forEach(printjson);
    '
  register: mongo_inject
  changed_when: true

- name: Display MongoDB injection result
  debug:
    msg: "{{ mongo_inject.stdout }}"

- name: Verify spaces configured correctly
  shell: |
    {{ juju_openstack_cmd }} spaces -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} 2>/dev/null | grep -E "public|internal|data|storage"
  register: space_verify
  changed_when: false

