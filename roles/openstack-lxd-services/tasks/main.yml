---
- name: Wait for MySQL InnoDB Cluster to be ready (up to 30 minutes)
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} mysql-innodb-cluster --format json 2>/dev/null | \
      jq -r '.applications["mysql-innodb-cluster"]["application-status"].current'
  register: mysql_status
  until: mysql_status.stdout == "active"
  retries: 60
  delay: 30
  changed_when: false

- name: Get Vault unit IP address
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} vault --format json 2>/dev/null | \
      jq -r '.applications.vault.units["vault/0"]["public-address"]'
  register: vault_ip
  changed_when: false

- name: Wait for Vault to be reachable
  shell: curl -sk http://{{ vault_ip.stdout }}:8200/v1/sys/init 2>/dev/null | jq -r '.initialized'
  register: vault_reachable
  until: vault_reachable.stdout is defined and vault_reachable.stdout != ""
  retries: 30
  delay: 10
  changed_when: false

- name: Check if Vault is already initialized
  shell: curl -sk http://{{ vault_ip.stdout }}:8200/v1/sys/init 2>/dev/null | jq -r '.initialized'
  register: vault_initialized
  changed_when: false

- name: Initialize Vault (1 share / 1 threshold)
  shell: |
    curl -sk http://{{ vault_ip.stdout }}:8200/v1/sys/init \
      -X PUT \
      -d '{"secret_shares": {{ os_lxd_vault_shares }}, "secret_threshold": {{ os_lxd_vault_threshold }}}' \
      2>/dev/null
  register: vault_init_response
  when: vault_initialized.stdout != "true"

- name: Save Vault credentials
  copy:
    content: "{{ vault_init_response.stdout }}"
    dest: "{{ project_dir }}/credentials/vault-unseal-lxd-openstack.json"
    mode: '0600'
  when: vault_init_response is changed

- name: Load Vault credentials
  shell: cat {{ project_dir }}/credentials/vault-unseal-lxd-openstack.json
  register: vault_creds_raw
  changed_when: false

- name: Parse Vault credentials
  set_fact:
    vault_creds: "{{ vault_creds_raw.stdout | from_json }}"

- name: Unseal Vault
  shell: |
    curl -sk http://{{ vault_ip.stdout }}:8200/v1/sys/unseal \
      -X PUT -d '{"key": "{{ vault_creds.unseal_keys_b64[0] }}"}'
  changed_when: true

- name: Wait for Vault to unseal
  shell: curl -sk http://{{ vault_ip.stdout }}:8200/v1/sys/seal-status 2>/dev/null | jq -r '.sealed'
  register: vault_sealed
  until: vault_sealed.stdout == "false"
  retries: 10
  delay: 5
  changed_when: false

- name: Create temporary token for charm authorization
  shell: |
    curl -sk http://{{ vault_ip.stdout }}:8200/v1/auth/token/create \
      -H "X-Vault-Token: {{ vault_creds.root_token }}" \
      -d '{"ttl": "10m"}' 2>/dev/null | jq -r '.auth.client_token'
  register: vault_temp_token
  changed_when: false

- name: Authorize Vault charm
  shell: "{{ juju_openstack_cmd }} run-action --wait -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} vault/leader authorize-charm token={{ vault_temp_token.stdout }}"
  changed_when: true

- name: Generate Vault root CA
  shell: "{{ juju_openstack_cmd }} run-action --wait -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} vault/leader generate-root-ca"
  changed_when: true

- name: Extract Vault CA certificate
  shell: |
    {{ juju_openstack_cmd }} run-action --wait -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} vault/leader get-root-ca --format json 2>/dev/null | \
      jq -r '.[].results.output' > {{ project_dir }}/credentials/vault-ca-lxd-openstack.crt
    test -s {{ project_dir }}/credentials/vault-ca-lxd-openstack.crt
  changed_when: true

- name: Wait for TLS certificates to propagate (5 minutes)
  pause:
    minutes: 5

- name: Get compute container names from ceph-osd unit placement
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} ceph-osd --format json 2>/dev/null | \
      jq -r '[.applications["ceph-osd"].units | to_entries[] | .value.machine] | sort | .[]'
  register: ceph_osd_machines
  changed_when: false

- name: Resolve machine numbers to LXD container names
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null | \
      jq -r '.machines["{{ item }}"].hostname'
  loop: "{{ ceph_osd_machines.stdout_lines }}"
  register: compute_hostnames
  changed_when: false

- name: Set compute container list
  set_fact:
    compute_containers: "{{ compute_hostnames.results | map(attribute='stdout') | list }}"

- name: Discover virbr0 NIC name on compute container
  shell: |
    lxc exec {{ compute_containers[0] }} --project {{ os_lxd_project }} -- bash -c '
      ip -4 -o addr show | grep "192\.168\.122\." | awk "{print \$2}" | head -1
    '
  register: virbr0_nic
  changed_when: false

- name: Set OVN chassis bridge-interface-mappings
  shell: |
    {{ juju_openstack_cmd }} config -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} \
      ovn-chassis bridge-interface-mappings="br-ex:{{ virbr0_nic.stdout }}"
  changed_when: true

- name: Wait for OVN chassis to configure br-ex (30 seconds)
  pause:
    seconds: 30

- name: Migrate IP from eth0 to br-ex on compute containers
  shell: |
    for container in {{ compute_containers | join(' ') }}; do
      lxc exec "$container" --project {{ os_lxd_project }} -- bash -c '
        NIC="{{ virbr0_nic.stdout }}"
        IP=$(ip -4 -o addr show $NIC 2>/dev/null | awk "{print \$4}")
        IP_ADDR=$(echo $IP | cut -d/ -f1)
        GW=192.168.122.1

        if ovs-vsctl port-to-br $NIC 2>/dev/null | grep -q br-ex; then
          ip addr del $IP dev $NIC 2>/dev/null || true
          ip addr add $IP dev br-ex 2>/dev/null || true
          ip link set br-ex up
          ip route replace default via $GW dev br-ex
          ip route replace 192.168.122.0/24 dev br-ex proto kernel scope link src $IP_ADDR

          ETH1_IP=$(ip -4 -o addr show eth1 2>/dev/null | awk "{print \$4}" | cut -d/ -f1)
          ETH2_IP=$(ip -4 -o addr show eth2 2>/dev/null | awk "{print \$4}" | cut -d/ -f1)
          ETH3_IP=$(ip -4 -o addr show eth3 2>/dev/null | awk "{print \$4}" | cut -d/ -f1)
          printf "network:\n  version: 2\n  ethernets:\n    eth0:\n      dhcp4: false\n    eth1:\n      addresses: [${ETH1_IP}/24]\n      routes:\n        - to: 192.168.165.0/24\n          via: 192.168.165.1\n          metric: 200\n      dhcp4: false\n    eth2:\n      addresses: [${ETH2_IP}/24]\n      dhcp4: false\n    eth3:\n      addresses: [${ETH3_IP}/24]\n      dhcp4: false\n  bridges:\n    br-ex:\n      addresses: [${IP}]\n      routes:\n        - to: default\n          via: ${GW}\n      nameservers:\n        addresses: [8.8.8.8, 8.8.4.4]\n      dhcp4: false\n" > /etc/netplan/150-static.yaml
          chmod 600 /etc/netplan/150-static.yaml
          echo "OK: IP migrated to br-ex ($IP)"
        else
          echo "SKIP: $NIC not in br-ex yet"
        fi
      ' 2>/dev/null
    done
  changed_when: true

- name: Fix OVN encap-ip to data network on compute containers
  shell: |
    for container in {{ compute_containers | join(' ') }}; do
      ETH2_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- \
        ip -4 -o addr show eth2 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      lxc exec "$container" --project {{ os_lxd_project }} -- \
        ovs-vsctl set open_vswitch . external_ids:ovn-encap-ip=$ETH2_IP
    done
  changed_when: true

- name: Clear libvirt capabilities cache on compute containers
  shell: |
    for container in {{ compute_containers | join(' ') }}; do
      lxc exec "$container" --project {{ os_lxd_project }} -- bash -c "
        find /var/cache/libvirt -name '*.xml' -delete 2>/dev/null || true
        systemctl restart libvirtd 2>/dev/null || true
      "
    done
  changed_when: true

- name: Restart nova-compute after br-ex IP migration
  shell: |
    for container in {{ compute_containers | join(' ') }}; do
      lxc exec "$container" --project {{ os_lxd_project }} -- systemctl restart nova-compute 2>/dev/null || true
    done
  changed_when: true

- name: Patch neutron metadata agent pyroute2 calls on compute containers
  shell: |
    lxc exec {{ item }} --project {{ os_lxd_project }} -- python3 -c "
    path = '/usr/lib/python3/dist-packages/neutron/agent/ovn/metadata/agent.py'
    with open(path) as f: code = f.read()
    changed = False

    old_del = '''        for ipaddr in current_cidrs - metadata_port.ip_addresses:
            ip2.addr.delete(ipaddr)'''
    new_del = '''        for ipaddr in current_cidrs - metadata_port.ip_addresses:
            try:
                ip2.addr.delete(ipaddr)
            except Exception:
                import subprocess
                subprocess.run(['ip', 'netns', 'exec', namespace,
                                'ip', 'addr', 'del', ipaddr, 'dev',
                                ip2.name], check=False)'''
    if old_del in code:
        code = code.replace(old_del, new_del)
        changed = True

    old_add = '''            if utils.get_ip_version(ipaddr) == 4:
                ip2.addr.add(ipaddr)'''
    new_add = '''            if utils.get_ip_version(ipaddr) == 4:
                try:
                    ip2.addr.add(ipaddr)
                except Exception:
                    import subprocess
                    subprocess.run(['ip', 'netns', 'exec', namespace,
                                    'ip', 'addr', 'add', ipaddr, 'dev',
                                    ip2.name], check=False)'''
    if old_add in code:
        code = code.replace(old_add, new_add)
        changed = True

    old_veth = '''        if ip_lib.device_exists(veth_name[0]):
            ip_lib.IPWrapper().del_veth(veth_name[0])'''
    new_veth = '''        if ip_lib.device_exists(veth_name[0]):
            try:
                ip_lib.IPWrapper().del_veth(veth_name[0])
            except Exception:
                import subprocess
                subprocess.run(['ip', 'link', 'del', veth_name[0]], check=False)'''
    if old_veth in code:
        code = code.replace(old_veth, new_veth)
        changed = True

    if changed:
        with open(path, 'w') as f: f.write(code)
        print('patched')
    else:
        print('already patched')
    "
  loop: "{{ compute_containers }}"
  register: metadata_patch
  changed_when: "'patched' in item.stdout and 'already' not in item.stdout"

- name: Restart neutron-ovn-metadata-agent on compute containers
  shell: |
    for container in {{ compute_containers | join(' ') }}; do
      lxc exec "$container" --project {{ os_lxd_project }} -- bash -c '
        systemctl reset-failed neutron-ovn-metadata-agent 2>/dev/null
        systemctl restart neutron-ovn-metadata-agent 2>/dev/null || true
      '
    done
  changed_when: true
  when: metadata_patch.results | selectattr('changed') | list | length > 0

- name: Wait for ceph-osd charm to be ready (blocked waiting for disks)
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} ceph-osd --format json 2>/dev/null | \
      jq '[.applications["ceph-osd"].units[] | select(."workload-status".current == "active" or .["workload-status"].current == "blocked")] | length'
  register: osd_units_ready
  until: osd_units_ready.stdout | int >= 2
  retries: 60
  delay: 15
  changed_when: false

- name: Patch ceph-volume disk.py to fix device_slaves bug on loop devices
  shell: |
    lxc exec {{ item }} --project {{ os_lxd_project }} -- python3 -c "
    path = '/usr/lib/python3/dist-packages/ceph_volume/util/disk.py'
    with open(path) as f: code = f.read()
    if 'device_slaves = []' not in code:
        code = code.replace('device_slaves = os.listdir', 'device_slaves = []\n        # device_slaves = os.listdir')
        with open(path, 'w') as f: f.write(code)
        print('patched')
    else:
        print('already patched')
    "
  loop: "{{ compute_containers }}"
  changed_when: true
  ignore_errors: true

- name: Check if OSD already initialized on disk
  shell: |
    lxc exec {{ item }} --project {{ os_lxd_project }} -- \
      bash -c 'ceph-volume raw list /dev/osd-block 2>/dev/null | grep -c osd_id || echo 0'
  loop: "{{ compute_containers }}"
  register: osd_exists
  changed_when: false

- name: Activate existing OSD data (re-run scenario)
  shell: |
    lxc exec {{ item.item }} --project {{ os_lxd_project }} -- bash -c '
      ceph-volume raw activate --device /dev/osd-block --no-systemd
      sleep 2
      systemctl start ceph-osd@* || true
    '
  loop: "{{ osd_exists.results }}"
  when: item.stdout | int > 0
  changed_when: true

- name: Add OSD disks via Juju action (first-run only)
  shell: |
    {{ juju_openstack_cmd }} run-action --wait -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} \
      ceph-osd/{{ idx }} add-disk osd-devices=/dev/osd-block
  loop: "{{ osd_exists.results }}"
  loop_control:
    index_var: idx
  when: item.stdout | int == 0
  register: add_disk_result
  failed_when: "'error' in (add_disk_result.stdout | default('') | lower) and 'successful' not in (add_disk_result.stdout | default('') | lower)"

- name: Wait for Ceph OSD to be active
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} ceph-osd --format json 2>/dev/null | \
      jq '[.applications["ceph-osd"].units[] | select(."workload-status".current == "active")] | length'
  register: active_osds
  until: active_osds.stdout | int >= 1
  retries: 60
  delay: 30
  changed_when: false

- name: Deploy OSD auto-activation service in compute containers
  shell: |
    UNIT='[Unit]\nDescription=Activate Ceph OSD on /dev/osd-block\nAfter=network.target\nConditionPathExists=/dev/osd-block\n\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/bin/bash -c "ceph-volume raw activate --device /dev/osd-block --no-systemd && sleep 2 && systemctl start ceph-osd@*"\n\n[Install]\nWantedBy=multi-user.target'
    for container in {{ compute_containers | join(' ') }}; do
      lxc exec "$container" --project {{ os_lxd_project }} -- bash -c "
        printf '$UNIT\n' > /etc/systemd/system/ceph-osd-activate.service
        systemctl daemon-reload
        systemctl enable ceph-osd-activate.service
      "
    done
  changed_when: true

- name: Get ceph-mon container name
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} ceph-mon --format json 2>/dev/null | \
      jq -r '.applications["ceph-mon"].units["ceph-mon/0"]["machine"]'
  register: ceph_mon_machine
  changed_when: false

- name: Configure Ceph pool defaults for 2-OSD cluster
  shell: |
    MON_CONTAINER=$(lxc list --project {{ os_lxd_project }} -f csv -c n | grep "juju-.*-{{ ceph_mon_machine.stdout }}$" | head -1)
    lxc exec "$MON_CONTAINER" --project {{ os_lxd_project }} -- bash -c '
      ceph config set global osd_pool_default_size 2
      ceph config set global osd_pool_default_min_size 1
      for pool in $(ceph osd pool ls); do
        ceph osd pool set "$pool" size 2 --yes-i-really-mean-it 2>/dev/null || true
        ceph osd pool set "$pool" min_size 1 2>/dev/null || true
      done
    '
  changed_when: true
  ignore_errors: true

- name: Source OpenStack credentials and verify hypervisors
  shell: |
    KEYSTONE_IP=$({{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} keystone --format json 2>/dev/null | \
      jq -r '.applications.keystone.units | to_entries[0].value["public-address"]')
    ADMIN_PASS=$({{ juju_openstack_cmd }} run -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --unit keystone/leader 'leader-get admin_passwd' 2>/dev/null)
    export OS_AUTH_URL="https://${KEYSTONE_IP}:5000/v3"
    export OS_USERNAME=admin
    export OS_PASSWORD="$ADMIN_PASS"
    export OS_PROJECT_NAME=admin
    export OS_USER_DOMAIN_NAME=admin_domain
    export OS_PROJECT_DOMAIN_NAME=admin_domain
    export OS_IDENTITY_API_VERSION=3
    export OS_AUTH_TYPE=password
    export OS_REGION_NAME=RegionOne
    export OS_CACERT={{ project_dir }}/credentials/vault-ca-lxd-openstack.crt

    openstack hypervisor list -f value 2>/dev/null
  register: hypervisor_list
  changed_when: false
  retries: 10
  delay: 30
  until: hypervisor_list.stdout is search("up")
  ignore_errors: true

- name: Display hypervisor status
  debug:
    msg: "{{ hypervisor_list.stdout_lines | default(['No hypervisors found']) }}"

- name: Fail if no hypervisors are online
  fail:
    msg: |
      No compute hypervisors are online! Check:
        1. nova-compute logs: juju ssh <machine> -- tail /var/log/nova/nova-compute.log
        2. RabbitMQ connectivity: nova-compute needs to reach RabbitMQ
        3. br-ex IP migration: enp5s0 IP must be on br-ex after OVN takes over
  when: hypervisor_list.stdout is not search("up")
