---

- name: Switch to k8s-lxd model
  shell: "{{ juju_k8s_cmd }} switch {{ k8s_lxd_juju_controller }}:{{ k8s_lxd_model_name }}"
  changed_when: true

- name: Check if charmed-kubernetes already deployed
  shell: "{{ juju_k8s_cmd }} status --format json 2>/dev/null | jq -r '.applications | keys[]' | grep -q \"^kubernetes-control-plane$\" && echo \"exists\" || echo \"not_found\""
  register: deploy_check
  changed_when: false

- name: Deploy Charmed Kubernetes with LXD overlay
  shell: |
    {{ juju_k8s_cmd }} deploy charmed-kubernetes \
      --channel {{ k8s_channel }} \
      --overlay {{ project_dir }}/{{ k8s_lxd_overlay_file }}
  when: deploy_check.stdout == "not_found"
  register: deploy_result

- name: Fix calico ignore-loose-rpf (rp_filter conflict in LXD)
  shell: "{{ juju_k8s_cmd }} config calico ignore-loose-rpf=true"
  changed_when: true
  ignore_errors: true

- name: Set kubelet feature gate on control-plane (KubeletInUserNamespace for LXD)
  shell: "{{ juju_k8s_cmd }} config kubernetes-control-plane kubelet-extra-args=\"feature-gates=KubeletInUserNamespace=true\""
  changed_when: true
  ignore_errors: true

- name: Set kubelet feature gate on workers (KubeletInUserNamespace for LXD)
  shell: "{{ juju_k8s_cmd }} config kubernetes-worker kubelet-extra-args=\"feature-gates=KubeletInUserNamespace=true\""
  changed_when: true
  ignore_errors: true

- name: Wait for model containers to appear in LXD project (up to 5 min)
  shell: |
    COUNT=$(lxc list --project {{ k8s_lxd_project }} -c n --format csv 2>/dev/null | grep -v "^juju-.*-0$" | wc -l)
    EXPECTED={{ k8s_lxd_control_plane_units + k8s_lxd_worker_units + k8s_lxd_etcd_units + 1 + 1 }}
    echo "$COUNT/$EXPECTED"
    [ "$COUNT" -ge "$EXPECTED" ]
  register: containers_ready
  until: containers_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Wait for containers to get IPv4 addresses
  shell: |
    NO_IP=$(lxc list --project {{ k8s_lxd_project }} -c n,4 --format csv 2>/dev/null | grep -v "192.168" | wc -l)
    echo "Containers without IP: $NO_IP"
    [ "$NO_IP" -eq 0 ]
  register: ips_ready
  until: ips_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Get list of model containers
  shell: lxc list --project {{ k8s_lxd_project }} -c n --format csv 2>/dev/null | grep -v "^$"
  register: model_containers
  changed_when: false

- name: Fix routing metric on all containers (eth0 preferred over eth1)
  shell: |
    lxc exec {{ item }} --project {{ k8s_lxd_project }} -- bash -c '
      cat > /etc/netplan/60-route-metric.yaml << EOF
    network:
      version: 2
      ethernets:
        eth0:
          dhcp4: true
          dhcp4-overrides:
            route-metric: 100
        eth1:
          dhcp4: true
          dhcp4-overrides:
            route-metric: 200
    EOF
      chmod 600 /etc/netplan/60-route-metric.yaml
      netplan apply 2>&1
    '
  loop: "{{ model_containers.stdout_lines }}"
  changed_when: true
  ignore_errors: true

- name: Verify internet connectivity from first container
  shell: |
    FIRST=$(lxc list --project {{ k8s_lxd_project }} -c n --format csv | head -1)
    lxc exec $FIRST --project {{ k8s_lxd_project }} -- ping -c 1 -W 5 8.8.8.8 2>&1
  register: ping_test
  changed_when: false
  ignore_errors: true

- name: Display connectivity result
  debug:
    msg: "{{ 'Internet connectivity OK' if ping_test.rc == 0 else 'WARNING: No internet from containers - check virbr0 NAT' }}"

- name: Get errored units
  shell: "{{ juju_k8s_cmd }} status --format json 2>/dev/null | jq -r '.applications[].units[]? | select(.[\"workload-status\"].current == \"error\") | .[\"workload-status\"].current' | head -1"
  register: errored_check
  changed_when: false
  ignore_errors: true

- name: Resolve all errored units
  shell: |
    for unit in $({{ juju_k8s_cmd }} status --format json 2>/dev/null | jq -r '[.applications[].units | to_entries[] | select(.value["workload-status"].current == "error") | .key] | .[]'); do
      echo "Resolving $unit..."
      {{ juju_k8s_cmd }} resolved "$unit" 2>/dev/null || true
    done
  when: errored_check.stdout == "error"
  changed_when: true
  ignore_errors: true

- name: Wait for all units to become active (up to 60 min)
  shell: |
    {{ juju_k8s_cmd }} status --format json 2>/dev/null | jq -r '
      [.applications[].units | to_entries[]? |
       .value,
       (.value.subordinates // {} | to_entries[]? | .value)
      ] | map(select(.["workload-status"].current != "active")) | length
    '
  register: pending_units
  until: pending_units.stdout | int == 0
  retries: 120
  delay: 30
  changed_when: false
  ignore_errors: true

- name: Resolve errored units during wait (retry)
  shell: |
    for unit in $({{ juju_k8s_cmd }} status --format json 2>/dev/null | jq -r '[.applications[].units | to_entries[] | select(.value["workload-status"].current == "error") | .key] | .[]'); do
      {{ juju_k8s_cmd }} resolved "$unit" 2>/dev/null || true
    done
  changed_when: false
  ignore_errors: true

- name: Display Juju status
  shell: "{{ juju_k8s_cmd }} status"
  register: final_status
  changed_when: false

- name: Show deployment status
  debug:
    msg: "{{ final_status.stdout }}"

- name: Get kubeapi-load-balancer IP
  shell: "{{ juju_k8s_cmd }} status --format json | jq -r '.applications[\"kubeapi-load-balancer\"].units[\"kubeapi-load-balancer/0\"][\"public-address\"]'"
  register: lb_ip
  changed_when: false
  ignore_errors: true

- name: Get kubeconfig from control-plane
  shell: "{{ juju_k8s_cmd }} exec -u kubernetes-control-plane/0 -- cat /root/.kube/config"
  register: kubeconfig_raw
  changed_when: false
  ignore_errors: true

- name: Save kubeconfig with corrected server address
  copy:
    content: "{{ kubeconfig_raw.stdout | regex_replace('server: https://127.0.0.1:6443', 'server: https://' + lb_ip.stdout + ':6443') }}"
    dest: "{{ project_dir }}/ck8s-kubeconfig.yaml"
    mode: '0600'
  when: kubeconfig_raw.rc == 0 and lb_ip.rc == 0

- name: Install kubectl if not present
  shell: which kubectl || sudo snap install kubectl --classic
  changed_when: false
  ignore_errors: true

- name: Verify kubectl access - get nodes
  shell: kubectl --kubeconfig={{ project_dir }}/ck8s-kubeconfig.yaml get nodes -o wide
  register: kubectl_nodes
  changed_when: false
  ignore_errors: true

- name: Deploy test pod
  shell: kubectl --kubeconfig={{ project_dir }}/ck8s-kubeconfig.yaml run test-nginx --image=quay.io/nginx/nginx-unprivileged:latest --restart=Never
  register: test_deploy
  changed_when: test_deploy.rc == 0
  ignore_errors: true

- name: Wait for test pod to be Running (up to 3 min)
  shell: kubectl --kubeconfig={{ project_dir }}/ck8s-kubeconfig.yaml get pod test-nginx -o jsonpath='{.status.phase}'
  register: test_pod_status
  until: test_pod_status.stdout == "Running"
  retries: 18
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Verify test pod is serving traffic
  shell: kubectl --kubeconfig={{ project_dir }}/ck8s-kubeconfig.yaml exec test-nginx -- curl -s http://localhost:8080 2>&1 | head -3
  register: test_pod_verify
  changed_when: false
  ignore_errors: true

- name: Clean up test pod
  shell: kubectl --kubeconfig={{ project_dir }}/ck8s-kubeconfig.yaml delete pod test-nginx --ignore-not-found=true
  changed_when: false
  ignore_errors: true

- name: Display Charmed K8s on LXD summary
  debug:
    msg: |
      ========================================
      Charmed Kubernetes on LXD
      ========================================

      Controller: {{ k8s_lxd_juju_controller }}
      Model: {{ k8s_lxd_model_name }}
      LXD project: {{ k8s_lxd_project }}
      Channel: {{ k8s_channel }}
      Load Balancer: {{ lb_ip.stdout | default('unknown') }}
      Kubeconfig: {{ project_dir }}/ck8s-kubeconfig.yaml

      Nodes:
      {{ kubectl_nodes.stdout | default('Unable to get nodes') }}

      Test pod: {{ 'PASSED' if test_pod_status.stdout | default('') == 'Running' else 'FAILED or SKIPPED' }}

      Known limitations:
        - Docker Hub may be unreachable; use quay.io images
        - containerd ships v1.6.8 from charm resource
        - virbr1 routing metric fix applied via netplan override

      ========================================
