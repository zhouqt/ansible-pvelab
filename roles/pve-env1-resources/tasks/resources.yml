---

- name: Check which flavors already exist
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['flavor', 'show', item.id | string, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  loop: "{{ pve_env1_resources_flavors }}"
  loop_control:
    label: "{{ item.name }} (id {{ item.id }})"
  register: pve_env1_resources_flavor_probe
  changed_when: false
  failed_when: false

- name: Select the flavors that are missing
  ansible.builtin.set_fact:
    pve_env1_resources_flavors_missing: >-
      {{ pve_env1_resources_flavor_probe.results | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: Create the missing flavors
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['flavor', 'create',
         '--id', item.id | string, '--vcpus', item.vcpus | string,
         '--ram', item.ram | string, '--disk', item.disk | string,
         '--public', item.name] }}
  environment: "{{ pve_env1_openstack_env }}"
  loop: "{{ pve_env1_resources_flavors_missing }}"
  loop_control:
    label: "{{ item.name }} (id {{ item.id }})"

- name: Check which images already exist
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['image', 'show', item.name, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  loop: "{{ pve_env1_resources_images }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_env1_resources_image_probe
  changed_when: false
  failed_when: false

- name: Select the images that are missing
  ansible.builtin.set_fact:
    pve_env1_resources_images_missing: >-
      {{ pve_env1_resources_image_probe.results | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: Create the local image cache directory
  ansible.builtin.file:
    path: "{{ pve_env1_image_cache_dir }}"
    state: directory
    mode: "0755"
  when: pve_env1_resources_images_missing | length > 0

- name: Look for the cached image files
  ansible.builtin.stat:
    path: "{{ item.file }}"
  loop: "{{ pve_env1_resources_images_missing }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_env1_resources_image_cache
  changed_when: false

- name: Select the cached image files that are not there yet
  ansible.builtin.set_fact:
    pve_env1_resources_image_downloads: >-
      {{ pve_env1_resources_image_cache.results | default([])
         | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}

- name: Download the images missing from the local cache
  ansible.builtin.command:
    argv: >-
      {{ ['curl', '-fL', '--retry', '3', '--connect-timeout', '15']
         + (['-x', pve_env1_image_download_proxy] if pve_env1_image_download_proxy | length > 0 else [])
         + ['-o', item.file, item.url] }}
  loop: "{{ pve_env1_resources_image_downloads }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_env1_resources_image_fetch
  failed_when: false

- name: Require every missing image to have been downloaded
  ansible.builtin.assert:
    that: item.rc | default(0) == 0
    fail_msg: >-
      downloading {{ item.item.url }} failed ({{ item.item.name }}). download.cirros-cloud.net will
      302 to github.com, which most environments cannot reach directly -- use
      -e pve_env1_image_download_proxy=http://<proxy> to re-run, or copy the image by hand into
      {{ item.item.file }} (checksum {{ item.item.checksum }}).
  loop: "{{ pve_env1_resources_image_fetch.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read back the cached image files with their checksums
  ansible.builtin.stat:
    path: "{{ item.file }}"
    get_checksum: true
    checksum_algorithm: "{{ item.checksum.split(':')[0] }}"
  loop: "{{ pve_env1_resources_images_missing }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_env1_resources_image_files
  changed_when: false

- name: Require the cached image files to match their expected checksums
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.item.checksum == (item.item.checksum.split(':')[0] ~ ':' ~ item.stat.checksum)
    fail_msg: >-
      image cache checksum mismatch: {{ item.item.file }} (expected {{ item.item.checksum }}, got
      {{ item.item.checksum.split(':')[0] }}:{{ item.stat.checksum | default('file missing') }}).
      delete that file and re-run this stage to download it again.
  loop: "{{ pve_env1_resources_image_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Upload the missing images to Glance
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['image', 'create', '--file', item.file,
         '--disk-format', item.disk_format, '--container-format', 'bare',
         '--public', item.name] }}
  environment: "{{ pve_env1_openstack_env }}"
  loop: "{{ pve_env1_resources_images_missing }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check whether the external network already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['network', 'show', pve_env1_resources_ext_net, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_ext_net_probe
  changed_when: false
  failed_when: false

- name: Create the external network
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['network', 'create', '--external',
         '--provider-network-type', 'flat',
         '--provider-physical-network', pve_env1_resources_physical_network,
         pve_env1_resources_ext_net] }}
  environment: "{{ pve_env1_openstack_env }}"
  when: pve_env1_resources_ext_net_probe.rc != 0

- name: Check whether the external subnet already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['subnet', 'show', pve_env1_resources_ext_subnet, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_ext_subnet_probe
  changed_when: false
  failed_when: false

- name: Create the external subnet
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['subnet', 'create',
         '--network', pve_env1_resources_ext_net,
         '--subnet-range', pve_env1_juju_public_cidr,
         '--gateway', pve_env1_gateway,
         '--allocation-pool', 'start=' ~ pve_env1_resources_floating_pool_start ~ ',end=' ~ pve_env1_resources_floating_pool_end,
         '--no-dhcp', pve_env1_resources_ext_subnet] }}
  environment: "{{ pve_env1_openstack_env }}"
  when: pve_env1_resources_ext_subnet_probe.rc != 0

- name: Check whether the tenant network already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['network', 'show', pve_env1_resources_tenant_net, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_tenant_net_probe
  changed_when: false
  failed_when: false

- name: Create the tenant network
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['network', 'create', pve_env1_resources_tenant_net] }}"
  environment: "{{ pve_env1_openstack_env }}"
  when: pve_env1_resources_tenant_net_probe.rc != 0

- name: Check whether the tenant subnet already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['subnet', 'show', pve_env1_resources_tenant_subnet, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_tenant_subnet_probe
  changed_when: false
  failed_when: false

- name: Create the tenant subnet
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['subnet', 'create',
         '--network', pve_env1_resources_tenant_net,
         '--subnet-range', pve_env1_resources_tenant_cidr,
         '--gateway', pve_env1_resources_tenant_gateway,
         '--dns-nameserver', pve_env1_resources_tenant_dns,
         pve_env1_resources_tenant_subnet] }}
  environment: "{{ pve_env1_openstack_env }}"
  when: pve_env1_resources_tenant_subnet_probe.rc != 0

- name: Check whether the router already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['router', 'show', pve_env1_resources_router, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_router_probe
  changed_when: false
  failed_when: false

- name: Create the router
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['router', 'create', pve_env1_resources_router] }}"
  environment: "{{ pve_env1_openstack_env }}"
  when: pve_env1_resources_router_probe.rc != 0

- name: Read the external network id
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['network', 'show', pve_env1_resources_ext_net, '-f', 'json', '-c', 'id'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_ext_net_info
  changed_when: false

- name: Read the tenant subnet id
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['subnet', 'show', pve_env1_resources_tenant_subnet, '-f', 'json', '-c', 'id'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_tenant_subnet_info
  changed_when: false

- name: Read the current router state
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['router', 'show', pve_env1_resources_router, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_router_info
  changed_when: false

- name: Point the router at the external network
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['router', 'set', pve_env1_resources_router, '--external-gateway', pve_env1_resources_ext_net] }}"
  environment: "{{ pve_env1_openstack_env }}"
  when: >-
    (((pve_env1_resources_router_info.stdout | from_json).external_gateway_info | default({}, true)) or {}).get('network_id')
    != (pve_env1_resources_ext_net_info.stdout | from_json).id

- name: Attach the tenant subnet to the router
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['router', 'add', 'subnet', pve_env1_resources_router, pve_env1_resources_tenant_subnet] }}"
  environment: "{{ pve_env1_openstack_env }}"
  when: >-
    (pve_env1_resources_tenant_subnet_info.stdout | from_json).id
    not in ((pve_env1_resources_router_info.stdout | from_json).interfaces_info | default([])
            | map(attribute='subnet_id') | list)

- name: Resolve the project used by the client RC
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['project', 'show', pve_env1_resources_project,
         '--domain', pve_env1_resources_project_domain, '-f', 'json', '-c', 'id'] }}
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_project_info
  changed_when: false

- name: Resolve the default security group of that project
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['security', 'group', 'list',
         '--project', (pve_env1_resources_project_info.stdout | from_json).id, '-f', 'json'] }}
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_secgroups
  changed_when: false

- name: Derive the default security group id
  ansible.builtin.set_fact:
    pve_env1_resources_secgroup_id: >-
      {{ ((pve_env1_resources_secgroups.stdout | from_json)
          | selectattr('Name', 'equalto', pve_env1_resources_secgroup) | list | first).ID }}

- name: Read the current rules of the default security group
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['security', 'group', 'rule', 'list',
         pve_env1_resources_secgroup_id, '-f', 'json'] }}
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_secgroup_current
  changed_when: false

- name: Create the missing ingress rules on the default security group
  ansible.builtin.command:
    argv: >-
      {{ pve_env1_openstack_argv + ['security', 'group', 'rule', 'create',
         '--ingress', '--ethertype', 'IPv4', '--proto', item.proto]
         + (['--dst-port', item.dst_port | string] if item.dst_port is defined else [])
         + [pve_env1_resources_secgroup_id] }}
  environment: "{{ pve_env1_openstack_env }}"
  loop: "{{ pve_env1_resources_secgroup_rules }}"
  loop_control:
    label: "{{ item.proto }}{{ ':' ~ item.dst_port if item.dst_port is defined else '' }}"
  when: >-
    (pve_env1_resources_secgroup_current.stdout | from_json)
    | selectattr('Direction', 'equalto', 'ingress')
    | selectattr('Ethertype', 'equalto', 'IPv4')
    | selectattr('IP Protocol', 'equalto', item.proto)
    | selectattr('Port Range', 'equalto', item.port_range | default(''))
    | list | length == 0

- name: Check whether the test keypair already exists
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['keypair', 'show', pve_env1_resources_keypair, '-f', 'json'] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_keypair_probe
  changed_when: false
  failed_when: false

- name: Create the test keypair
  ansible.builtin.command:
    argv: "{{ pve_env1_openstack_argv + ['keypair', 'create', pve_env1_resources_keypair] }}"
  environment: "{{ pve_env1_openstack_env }}"
  register: pve_env1_resources_keypair_out
  when: pve_env1_resources_keypair_probe.rc != 0

- name: Save the keypair private key on the control node
  ansible.builtin.copy:
    content: "{{ pve_env1_resources_keypair_out.stdout }}\n"
    dest: "{{ pve_env1_keypair_private_key_file }}"
    mode: "0600"
  when: pve_env1_resources_keypair_probe.rc != 0

- name: Look for the keypair private key on the control node
  ansible.builtin.stat:
    path: "{{ pve_env1_keypair_private_key_file }}"
  register: pve_env1_resources_keypair_key
  changed_when: false

- name: Warn when the keypair exists but its private key is not available here
  ansible.builtin.debug:
    msg: >-
      keypair {{ pve_env1_resources_keypair }} already exists in OpenStack, but this machine has no matching private key
      {{ pve_env1_keypair_private_key_file }} (an existing keypair can no longer export its private key).
      to get SSH access to the instances: delete the keypair and re-run this stage (it regenerates and saves the private key),
      or change pve_env1_resources_keypair to a different name.
  when:
    - pve_env1_resources_keypair_probe.rc == 0
    - not pve_env1_resources_keypair_key.stat.exists