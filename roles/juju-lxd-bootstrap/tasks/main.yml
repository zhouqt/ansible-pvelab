---

- name: Check if Juju controller already exists
  shell: "{{ juju_k8s_cmd }} controllers --format json 2>/dev/null | jq -r '.controllers | keys[]' | grep -q \"^{{ k8s_lxd_juju_controller }}$\" && echo \"exists\" || echo \"not_found\""
  register: controller_check
  changed_when: false

- name: Bootstrap Juju controller on localhost/LXD
  shell: |
    {{ juju_k8s_cmd }} bootstrap localhost {{ k8s_lxd_juju_controller }} \
      --agent-version={{ k8s_lxd_juju_agent_version }} \
      --config project={{ k8s_lxd_project }} \
      --config juju-db-snap-channel={{ k8s_lxd_juju_db_channel }} \
      --bootstrap-base=ubuntu@22.04 \
      --debug --verbose
  when: controller_check.stdout == "not_found"
  register: bootstrap_result
  timeout: 600

- name: Display bootstrap result
  debug:
    msg: "{{ 'Controller bootstrapped successfully' if bootstrap_result.rc | default(0) == 0 else 'Bootstrap skipped (controller exists)' }}"

- name: Set model-defaults project to LXD project
  shell: "{{ juju_k8s_cmd }} model-defaults --controller {{ k8s_lxd_juju_controller }} project={{ k8s_lxd_project }}"
  changed_when: true

- name: Check if model already exists
  shell: "{{ juju_k8s_cmd }} models --controller {{ k8s_lxd_juju_controller }} --format json 2>/dev/null | jq -r '.models[].name' | grep -q \"{{ k8s_lxd_model_name }}\" && echo \"exists\" || echo \"not_found\""
  register: model_check
  changed_when: false

- name: Create Juju model
  shell: "{{ juju_k8s_cmd }} add-model {{ k8s_lxd_model_name }} --controller {{ k8s_lxd_juju_controller }}"
  when: model_check.stdout == "not_found"

- name: Switch to model
  shell: "{{ juju_k8s_cmd }} switch {{ k8s_lxd_juju_controller }}:{{ k8s_lxd_model_name }}"
  changed_when: true

- name: Verify model-config project is correct
  shell: "{{ juju_k8s_cmd }} model-config --controller {{ k8s_lxd_juju_controller }} -m {{ k8s_lxd_model_name }} project"
  register: model_project
  changed_when: false

- name: Fail if model project is wrong
  fail:
    msg: |
      Model project is '{{ model_project.stdout }}' but expected '{{ k8s_lxd_project }}'.
      Model containers will be created in the wrong LXD project!
      Fix: juju model-defaults project={{ k8s_lxd_project }}
  when: model_project.stdout | trim != k8s_lxd_project

- name: Display bootstrap summary
  debug:
    msg: |
      Juju controller ready for Charmed Kubernetes on LXD:
        Controller: {{ k8s_lxd_juju_controller }}
        Agent version: {{ k8s_lxd_juju_agent_version }}
        Model: {{ k8s_lxd_model_name }}
        LXD project: {{ model_project.stdout | trim }}
