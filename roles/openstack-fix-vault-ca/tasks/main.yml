---
- name: Switch to openstack model
  shell: "{{ juju_openstack_cmd }} switch {{ juju_controller_name }}:admin/{{ juju_model_name }}"
  changed_when: false

- name: Verify Vault CA certificate exists
  stat:
    path: "{{ project_dir }}/credentials/vault-ca.crt"
  register: vault_ca_file

- name: Create VAULT_CA cert file for distribution
