    dest: /tmp/vault-ca.crt
    mode: '0644'

- name: Distribute Vault CA to all OpenStack units
  shell: |
    for unit in {{ openstack_units | join(' ') }}; do
      echo "Copying CA cert to $unit"
      {{ juju_openstack_cmd }} scp /tmp/vault-ca.crt $unit:/tmp/vault-ca.crt 2>/dev/null || true
      {{ juju_openstack_cmd }} ssh $unit 'sudo cp /tmp/vault-ca.crt /usr/local/share/ca-certificates/vault_juju_ca_cert.crt && sudo update-ca-certificates' 2>/dev/null || true
    done
    echo "Done!"
  register: ca_dist_result
  changed_when: "'Done' in ca_dist_result.stdout"
  ignore_errors: true

- name: Display CA distribution result
  debug:
    msg: "Vault CA distribution: {{ ca_dist_result is defined and 'Done' in ca_dist_result.stdout ? 'COMPLETED' : 'PARTIAL - check individual units' }}"

