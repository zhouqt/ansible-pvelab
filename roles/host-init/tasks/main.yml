---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages to latest version
  apt:
    upgrade: dist
    autoremove: yes

- name: Install libvirt, podman and lxd packages
  apt:
    name:
      - libvirt-daemon-system
      - libvirt-clients
      - podman
      - lxd
      - lxd-client
    state: present

- name: Add current user to libvirt and lxd groups
  user:
    name: "{{ ansible_user_id }}"
    groups: libvirt,lxd
    append: yes
  when: ansible_user_id != 'root'

- name: Ensure libvirtd service is running and enabled
  systemd:
    name: libvirtd
    state: started
    enabled: yes

- name: Ensure LXD service is running and enabled
  systemd:
    name: snap.lxd.daemon.service
    state: started
    enabled: yes
  ignore_errors: yes

- name: Ensure LXD storage pool directory exists
  file:
    path: "{{ lxd_storage_pool_path }}"
    state: directory
    mode: '0755'

- name: Check if LXD storage pool exists
  command: lxc storage list --format json
  register: lxd_storage_list
  changed_when: false

- name: Get existing default pool source path
  set_fact:
    existing_default_pool_source: "{{ (lxd_storage_list.stdout | from_json) | selectattr('name', 'equalto', 'default') | map(attribute='config.source') | list | first }}"
  when: >
    lxd_storage_list.stdout | from_json
    | selectattr('name', 'equalto', 'default')
    | list | length > 0

- name: Update default pool source path if differs
  command: lxc storage set default source={{ lxd_storage_pool_path }}
  when: >
    existing_default_pool_source is defined
    and existing_default_pool_source != lxd_storage_pool_path

- name: Create LXD storage pool named default if not exists
  command: >
    lxc storage create {{ lxd_storage_pool_name }} dir source={{ lxd_storage_pool_path }}
  when: >
    lxd_storage_list.stdout | from_json
    | selectattr('name', 'equalto', lxd_storage_pool_name)
    | list | length == 0

- name: Configure default profile with cloud-init settings
  copy:
    dest: /tmp/lxd-default-profile.yaml
    content: |
      config:
        boot.autostart: "false"
        user.user-data: |
          apt:
            primary:
              - arches: [default]
                uri: http://cn.archive.ubuntu.com/ubuntu
            security:
              - arches: [default]
                uri: http://cn.archive.ubuntu.com/ubuntu
          users:
            - name: ubuntu
              passwd: "$6$iR6Cg/jYoXelLfsL$v8mDO85JwobyLlLv0VOSZ1Zv4A2nNpCAmwAE/UvbP5nVd4wYEvivmuzmt.rkMGd5KsguuVwIzT.Px9HUW0VLL0"
              lock_passwd: false
              ssh-import-id: lp:zhouqt
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
          ssh_pwauth: yes
          package_update: true
          package_upgrade: false
          package_reboot_if_required: false
          locale: en_US.UTF-8
          timezone: Asia/Shanghai
          runcmd:
            - [apt-get, purge, -y, unattended-upgrades]
      devices:
        root:
          path: /
          pool: {{ lxd_storage_pool_name }}
          type: disk
    mode: '0644'

- name: Apply cloud-init configuration to default profile
  command: lxc profile edit default /tmp/lxd-default-profile.yaml

- name: Cleanup temporary profile file
  file:
    path: /tmp/lxd-default-profile.yaml
    state: absent

- name: Check existing libvirt networks
  command: virsh net-list --all --name
  register: libvirt_net_list
  changed_when: false

- name: Create libvirt network XML definitions
  template:
    src: libvirt-network.xml.j2
    dest: "/tmp/{{ item.name }}.xml"
    mode: '0644'
  loop: "{{ libvirt_bridges }}"
  when: item.name not in libvirt_net_list.stdout_lines

- name: Define and start libvirt networks
  shell: |
    virsh net-define /tmp/{{ item.name }}.xml
    virsh net-start {{ item.name }}
    virsh net-autostart {{ item.name }}
  loop: "{{ libvirt_bridges }}"
  when: item.name not in libvirt_net_list.stdout_lines

- name: Cleanup temporary XML files
  file:
    path: "/tmp/{{ item.name }}.xml"
    state: absent
  loop: "{{ libvirt_bridges }}"
