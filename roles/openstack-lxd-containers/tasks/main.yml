---
- name: Check if compute containers exist
  shell: lxc list --project {{ os_lxd_project }} -f csv -c n | grep -c "os-compute-" || echo "0"
  register: compute_count
  changed_when: false

- name: Create compute LXD containers
  shell: |
    lxc init ubuntu:20.04 os-compute-{{ item }} \
      --project {{ os_lxd_project }}
    lxc config set os-compute-{{ item }} --project {{ os_lxd_project }} \
      limits.memory={{ os_lxd_compute_mem }} limits.cpu={{ os_lxd_compute_cores }}
    lxc config set os-compute-{{ item }} --project {{ os_lxd_project }} raw.lxc \
      "lxc.apparmor.profile = unconfined
    lxc.cgroup2.devices.allow = a
    lxc.cap.drop =
    lxc.hook.mount =
    lxc.mount.entry = /dev/mapper dev/mapper none bind,create=dir 0 0"
    lxc config device add os-compute-{{ item }} kvm unix-char \
      source=/dev/kvm path=/dev/kvm --project {{ os_lxd_project }}
    lxc config device add os-compute-{{ item }} vhost-net unix-char \
      source=/dev/vhost-net path=/dev/vhost-net --project {{ os_lxd_project }}
    lxc start os-compute-{{ item }} --project {{ os_lxd_project }}
    lxc profile add os-compute-{{ item }} data-net --project {{ os_lxd_project }}
    lxc profile add os-compute-{{ item }} storage-net --project {{ os_lxd_project }}
    lxc profile add os-compute-{{ item }} public-net --project {{ os_lxd_project }}
  loop: [0, 1]
  when: compute_count.stdout | int < 2
  ignore_errors: true

- name: Wait for compute containers to get IP addresses
  shell: |
    for i in $(seq 1 60); do
      IP=$(lxc list os-compute-{{ item }} --project {{ os_lxd_project }} -f csv -c 4 2>/dev/null | grep "192.168.122" | cut -d' ' -f1)
      if [ -n "$IP" ]; then
        echo "$IP"
        exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT"
    exit 1
  loop: [0, 1]
  register: compute_ips
  changed_when: false

- name: Prepare compute containers for Juju
  shell: |
    lxc exec os-compute-{{ item }} --project {{ os_lxd_project }} -- bash -c '
      apt-get update -qq
      apt-get install -y -qq openssh-server qemu-kvm lshw dmidecode
      systemctl enable --now ssh
      umount /proc/meminfo 2>/dev/null || true
      rm -f /etc/resolv.conf
      echo "nameserver 8.8.8.8" > /etc/resolv.conf
      echo "nameserver 8.8.4.4" >> /etc/resolv.conf
      echo "127.0.0.1 os-compute-{{ item }}" >> /etc/hosts
      sed -i "s/udev_sync = 1/udev_sync = 0/" /etc/lvm/lvm.conf
      sed -i "s/udev_rules = 1/udev_rules = 0/" /etc/lvm/lvm.conf
      sed -i "s/obtain_device_list_from_udev = 1/obtain_device_list_from_udev = 0/" /etc/lvm/lvm.conf
    '
  loop: [0, 1]
  when: compute_count.stdout | int < 2

- name: Inject SSH keys into compute containers
  shell: |
    lxc exec os-compute-{{ item }} --project {{ os_lxd_project }} -- bash -c '
      mkdir -p /home/ubuntu/.ssh
      chmod 700 /home/ubuntu/.ssh
      chown ubuntu:ubuntu /home/ubuntu/.ssh
    '
    cat ~/.ssh/id_rsa.pub | lxc exec os-compute-{{ item }} --project {{ os_lxd_project }} -- \
      bash -c 'cat >> /home/ubuntu/.ssh/authorized_keys && chmod 600 /home/ubuntu/.ssh/authorized_keys && chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys'
  loop: [0, 1]
  when: compute_count.stdout | int < 2

- name: Fix hostname on compute containers
  shell: |
    lxc exec os-compute-{{ item }} --project {{ os_lxd_project }} -- bash -c '
      SHORT=$(hostname -s)
      hostnamectl set-hostname "$SHORT"
      sed -i "s/127.0.1.1.*/127.0.1.1 $SHORT/" /etc/hosts
    '
  loop: [0, 1]
  changed_when: true

- name: Create OSD loopback files
  shell: |
    FILE="{{ os_lxd_osd_loopback_dir }}/ceph-osd-compute-{{ item }}.img"
    [ -f "$FILE" ] || truncate -s {{ os_lxd_osd_disk_size }} "$FILE"
  loop: [0, 1]

- name: Setup loop devices for OSD
  shell: |
    FILE="{{ os_lxd_osd_loopback_dir }}/ceph-osd-compute-{{ item }}.img"
    DEV=$(losetup -j "$FILE" -O NAME --noheadings | tr -d ' ')
    if [ -z "$DEV" ]; then
      DEV=$(losetup --find --show "$FILE")
    fi
    echo "$DEV"
  loop: [0, 1]
  register: osd_loop_devs
  become: true

- name: Pass through OSD loop devices to compute containers
  shell: >
    lxc config device add os-compute-{{ item.item }} osd-loop unix-block
    source={{ item.stdout }} path=/dev/osd-block
    mode=0660 uid=64045 gid=64045
    --project {{ os_lxd_project }}
  loop: "{{ osd_loop_devs.results }}"
  failed_when: false
  changed_when: false

- name: Deploy OSD loopback systemd services
  template:
    src: osd-loopback.service.j2
    dest: "/etc/systemd/system/ceph-osd-loopback-{{ item }}.service"
    mode: "0644"
  vars:
    osd_storage_file: "{{ os_lxd_osd_loopback_dir }}/ceph-osd-compute-{{ item }}.img"
    osd_index: "{{ item }}"
  loop: [0, 1]
  become: true

- name: Enable OSD loopback services
  systemd:
    name: "ceph-osd-loopback-{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [0, 1]
  become: true

- name: Get current machine count in model
  shell: juju-29 status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null | jq '.machines | length'
  register: current_machines
  changed_when: false
  ignore_errors: true

- name: Add 14 LXD containers as machines
  shell: juju-29 add-machine -n 14 --series focal -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }}
  when: (current_machines.stdout | default("0") | int) < 14
  register: add_containers

- name: Wait for containers to start
  shell: |
    juju-29 status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null | \
      jq '[.machines[] | select(.["juju-status"].current == "started")] | length'
  register: started_count
  until: started_count.stdout | int >= 14
  retries: 60
  delay: 10
  changed_when: false
  when: add_containers is changed

- name: Add compute containers to Juju via SSH
  shell: |
    ssh-keyscan -H {{ item.stdout }} >> ~/.ssh/known_hosts 2>/dev/null
    juju-29 add-machine ssh:ubuntu@{{ item.stdout }} -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }}
  loop: "{{ compute_ips.results }}"
  when: (current_machines.stdout | default("0") | int) < 16
  ignore_errors: true

- name: Wait for all 16 machines to be started
  shell: |
    juju-29 status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null | \
      jq '[.machines[] | select(.["juju-status"].current == "started")] | length'
  register: all_machines
  until: all_machines.stdout | int >= 16
  retries: 60
  delay: 15
  changed_when: false

- name: Get machine-to-container mapping from Juju
  shell: |
    juju-29 status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} --format json 2>/dev/null | \
      python3 -c "
    import sys,json
    d=json.load(sys.stdin)
    for mid, m in d.get('machines',{}).items():
        hostname = m.get('hostname','')
        print(f'{mid}:{hostname}')
    "
  register: machine_map
  changed_when: false

- name: Add data-net profile to ovn-central container (machine 8)
  shell: |
    CONTAINER=$(echo "{{ machine_map.stdout }}" | grep "^8:" | cut -d: -f2)
    if [ -n "$CONTAINER" ]; then
      lxc profile add "$CONTAINER" data-net --project {{ os_lxd_project }} 2>/dev/null || true
      lxc restart "$CONTAINER" --project {{ os_lxd_project }}
      echo "Added data-net to $CONTAINER"
    fi
  register: ovn_central_nic
  changed_when: "'Added' in ovn_central_nic.stdout"

- name: Add storage-net profile to ceph-mon container (machine 9)
  shell: |
    CONTAINER=$(echo "{{ machine_map.stdout }}" | grep "^9:" | cut -d: -f2)
    if [ -n "$CONTAINER" ]; then
      lxc profile add "$CONTAINER" storage-net --project {{ os_lxd_project }} 2>/dev/null || true
      lxc restart "$CONTAINER" --project {{ os_lxd_project }}
      echo "Added storage-net to $CONTAINER"
    fi
  register: ceph_mon_nic
  changed_when: "'Added' in ceph_mon_nic.stdout"

- name: Add public-net profile to compute containers (machines 0/1) — eth4 uplink for br-ex
  shell: |
    for mid in 0 1; do
      CONTAINER=$(echo "{{ machine_map.stdout }}" | grep "^${mid}:" | cut -d: -f2)
      if [ -n "$CONTAINER" ]; then
        if lxc config device show "$CONTAINER" --project {{ os_lxd_project }} | grep -q "^eth4:"; then
          echo "$CONTAINER: eth4 already present"
          continue
        fi
        lxc profile add "$CONTAINER" public-net --project {{ os_lxd_project }} 2>/dev/null || true
        lxc restart "$CONTAINER" --project {{ os_lxd_project }}
        echo "Added public-net to $CONTAINER"
      fi
    done
  register: compute_public_nic
  changed_when: "'Added public-net' in compute_public_nic.stdout"

- name: Wait for restarted containers to get IPs
  pause:
    seconds: 15
  when: ovn_central_nic is changed or ceph_mon_nic is changed or compute_public_nic is changed

- name: Collect current IPs from all containers
  shell: |
    OVN_CONTAINER=$(echo "{{ machine_map.stdout }}" | grep "^8:" | cut -d: -f2)
    CEPH_CONTAINER=$(echo "{{ machine_map.stdout }}" | grep "^9:" | cut -d: -f2)
    for container in $(lxc list --project {{ os_lxd_project }} -f csv -c n | grep "juju-"); do
      ETH0_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth0 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      ETH1_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth1 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      ETH0_MAC=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip link show eth0 2>/dev/null | grep ether | awk '{print $2}')
      ETH1_MAC=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip link show eth1 2>/dev/null | grep ether | awk '{print $2}')
      ETH2_IP=""
      ETH3_IP=""
      if [ "$container" = "$OVN_CONTAINER" ]; then
        ETH2_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth2 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      fi
      if [ "$container" = "$CEPH_CONTAINER" ]; then
        ETH3_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth3 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      fi
      echo "$container|$ETH0_IP|$ETH1_IP|$ETH0_MAC|$ETH1_MAC|$ETH2_IP|$ETH3_IP"
    done
  register: container_ips
  changed_when: false

- name: Apply static IP netplan to all containers
  shell: |
    for entry in {% for line in container_ips.stdout_lines %}{{ line }} {% endfor %}; do
      name=$(echo "$entry" | cut -d'|' -f1)
      eth0_ip=$(echo "$entry" | cut -d'|' -f2)
      eth1_ip=$(echo "$entry" | cut -d'|' -f3)
      eth0_mac=$(echo "$entry" | cut -d'|' -f4)
      eth1_mac=$(echo "$entry" | cut -d'|' -f5)
      eth2_ip=$(echo "$entry" | cut -d'|' -f6)
      eth3_ip=$(echo "$entry" | cut -d'|' -f7)
      [ -z "$eth0_ip" ] || [ -z "$eth1_ip" ] || [ -z "$eth0_mac" ] || [ -z "$eth1_mac" ] && continue

      ETH2_BLOCK=""
      if [ -n "$eth2_ip" ]; then
        ETH2_BLOCK="    eth2:\n      addresses: [${eth2_ip}/24]\n      dhcp4: false\n"
      fi
      ETH3_BLOCK=""
      if [ -n "$eth3_ip" ]; then
        ETH3_BLOCK="    eth3:\n      addresses: [${eth3_ip}/24]\n      dhcp4: false\n"
      fi

      lxc exec "$name" --project {{ os_lxd_project }} -- bash -c "
        printf 'network:\n  version: 2\n  ethernets:\n    eth0:\n      match:\n        macaddress: $eth0_mac\n      addresses: [$eth0_ip/24]\n      routes:\n        - to: default\n          via: 192.168.122.1\n          metric: 100\n      nameservers:\n        addresses: [8.8.8.8, 8.8.4.4]\n      dhcp4: false\n    eth1:\n      match:\n        macaddress: $eth1_mac\n      addresses: [$eth1_ip/24]\n      routes:\n        - to: 192.168.165.0/24\n          via: 192.168.165.1\n          metric: 200\n      dhcp4: false\n${ETH2_BLOCK}${ETH3_BLOCK}' > /etc/netplan/150-static.yaml
        chmod 600 /etc/netplan/150-static.yaml
        netplan apply 2>/dev/null || true
      " 2>/dev/null || true
      echo "OK \$name: eth0=\$eth0_ip eth1=\$eth1_ip eth2=\$eth2_ip eth3=\$eth3_ip"
    done
  changed_when: true

- name: Apply static IP netplan to compute containers
  shell: |
    for container in os-compute-0 os-compute-1; do
      ETH0_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth0 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      ETH1_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth1 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      ETH4_IP=$(lxc exec "$container" --project {{ os_lxd_project }} -- ip -4 -o addr show eth4 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
      [ -z "$ETH0_IP" ] || [ -z "$ETH1_IP" ] && continue

      ETH4_BLOCK=""
      if [ -n "$ETH4_IP" ]; then
        ETH4_BLOCK="    eth4:\n      dhcp4: false\n"
      fi

      lxc exec "$container" --project {{ os_lxd_project }} -- bash -c "
        printf 'network:\n  version: 2\n  ethernets:\n    eth0:\n      addresses: [${ETH0_IP}/24]\n      routes:\n        - to: default\n          via: 192.168.122.1\n      nameservers:\n        addresses: [8.8.8.8, 8.8.4.4]\n      dhcp4: false\n    eth1:\n      addresses: [${ETH1_IP}/24]\n      routes:\n        - to: 192.168.165.0/24\n          via: 192.168.165.1\n          metric: 200\n      dhcp4: false\n${ETH4_BLOCK}' > /etc/netplan/150-static.yaml
        chmod 600 /etc/netplan/150-static.yaml
        netplan apply 2>/dev/null || true
      " 2>/dev/null || true
      echo "OK $container: eth0=$ETH0_IP eth1=$ETH1_IP eth4=$ETH4_IP"
    done
  changed_when: true

