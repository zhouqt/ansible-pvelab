---

- name: Get cinder/0 machine info from Juju
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} cinder --format json | \
    python3 -c "import sys,json; d=json.load(sys.stdin); u=d['applications']['cinder']['units']['{{ iscsi_cinder_unit }}']; print(u['machine'], d['machines'][u['machine']]['hostname'])"
  register: cinder_machine_info
  changed_when: false

- name: Set cinder container name from Juju
  set_fact:
    iscsi_cinder_container: "{{ cinder_machine_info.stdout.split()[1] }}"
    iscsi_cinder_machine: "{{ cinder_machine_info.stdout.split()[0] }}"

- name: Get cinder container current IPs
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      ip -4 -o addr show | awk '/eth[0-9]/ {split($4,a,"/"); print $2, a[1]}'
  register: cinder_ips
  changed_when: false

- name: Set cinder container IP facts
  set_fact:
    iscsi_cinder_eth0_ip: "{{ cinder_ips.stdout_lines | select('match', '^eth0') | first | split() | last }}"
    iscsi_cinder_eth1_ip: "{{ cinder_ips.stdout_lines | select('match', '^eth1') | first | split() | last }}"
    iscsi_portal_ip_1: "{{ cinder_ips.stdout_lines | select('match', '^eth1') | first | split() | last }}"
    iscsi_cinder_eth2_ip: "{{ iscsi_portal_ip_2 }}"

- name: Detect OpenStack release from cinder package
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      dpkg -l python3-cinder 2>/dev/null | awk '/^ii/ {print $3}' | sed 's/^[0-9]*://' | cut -d. -f1
  register: cinder_version
  changed_when: false

- name: Map cinder version to release name
  set_fact:
    iscsi_openstack_release: >-
      {%- set ver = cinder_version.stdout | int -%}
      {%- if ver >= 18 -%}yoga
      {%- elif ver >= 17 -%}xena
      {%- elif ver >= 16 -%}ussuri
      {%- elif ver >= 15 -%}train
      {%- elif ver >= 14 -%}stein
      {%- elif ver >= 13 -%}rocky
      {%- elif ver >= 12 -%}queens
      {%- else -%}queens
      {%- endif -%}

- name: Set charm template paths based on release
  set_fact:
    iscsi_charm_cinder_conf: "{{ iscsi_openstack_release }}/cinder.conf"

- name: Display discovered configuration
  debug:
    msg: |
      Container: {{ iscsi_cinder_container }}
      Machine: {{ iscsi_cinder_machine }}
      eth0 IP: {{ iscsi_cinder_eth0_ip }}
      eth1 IP: {{ iscsi_cinder_eth1_ip }}
      Portal IP 1: {{ iscsi_portal_ip_1 }}
      OpenStack release: {{ iscsi_openstack_release }}
      Charm template: {{ iscsi_charm_cinder_conf }}

- name: Check if loopback storage file exists
  stat:
    path: "{{ iscsi_storage_file }}"
  register: storage_file

- name: Create sparse loopback storage file
  shell: "truncate -s {{ iscsi_storage_size }} {{ iscsi_storage_file }}"
  when: not storage_file.stat.exists

- name: Check if VG {{ iscsi_vg_name }} exists
  shell: "vgs {{ iscsi_vg_name }} 2>/dev/null"
  register: vg_check
  failed_when: false
  changed_when: false
  become: true

- name: Setup loop device and create VG
  shell: |
    DEV=$(losetup -j {{ iscsi_storage_file }} -O NAME --noheadings | tr -d ' ')
    if [ -z "$DEV" ]; then
      DEV=$(losetup --find --show {{ iscsi_storage_file }})
    fi
    pvcreate -f "$DEV"
    vgcreate {{ iscsi_vg_name }} "$DEV"
  when: vg_check.rc != 0
  become: true

- name: Deploy iscsi-loopback systemd service
  template:
    src: iscsi-loopback.service.j2
    dest: "/etc/systemd/system/iscsi-loopback-{{ iscsi_vg_name }}.service"
    mode: "0644"
  become: true

- name: Enable iscsi-loopback service
  systemd:
    name: "iscsi-loopback-{{ iscsi_vg_name }}"
    enabled: true
    daemon_reload: true
  become: true

- name: Set cinder container to privileged mode
  shell: >
    lxc config set {{ iscsi_cinder_container }}
    --project {{ iscsi_cinder_project }}
    security.privileged true
  changed_when: false

- name: Set cgroup device access (allow all for device-mapper)
  shell: |
    lxc config set {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} raw.lxc "lxc.cgroup2.devices.allow = a
    lxc.mount.entry = /dev/mapper dev/mapper none bind,create=dir 0 0"

- name: Get loop device for storage file
  shell: "losetup -j {{ iscsi_storage_file }} -O NAME --noheadings | tr -d ' '"
  register: loop_device
  changed_when: false
  become: true

- name: Pass through loop device to cinder container
  shell: >
    lxc config device add {{ iscsi_cinder_container }} loop-storage unix-block
    source={{ loop_device.stdout }} path={{ loop_device.stdout }}
    --project {{ iscsi_cinder_project }}
  failed_when: false
  changed_when: false

- name: Add virbr2 NIC to cinder container
  shell: >
    lxc config device add {{ iscsi_cinder_container }} eth2 nic
    nictype=bridged parent={{ iscsi_portal_bridge_2 }}
    --project {{ iscsi_cinder_project }}
  failed_when: false
  changed_when: false

- name: Restart cinder container to apply cgroup/mount changes
  shell: "lxc restart {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }}"

- name: Wait for cinder container to be ready
  shell: "lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- systemctl is-system-running --wait"
  retries: 12
  delay: 5
  register: container_ready
  until: container_ready.rc == 0
  failed_when: false

- name: Clean up conflicting netplan files
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    rm -f /etc/netplan/50-cloud-init.yaml /etc/netplan/60-route-metric.yaml /etc/netplan/99-juju.yaml'
  changed_when: false

- name: Deploy netplan with eth2 to cinder container
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    cat > /etc/netplan/150-static.yaml << EOF
    {{ lookup("template", "netplan-cinder.yaml.j2") }}
    EOF
    chmod 600 /etc/netplan/150-static.yaml'
  changed_when: false

- name: Disable cloud-init network config
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    mkdir -p /etc/cloud/cloud.cfg.d
    echo "network: {config: disabled}" > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg'
  changed_when: false

- name: Apply netplan and restart networkd
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    netplan apply 2>/dev/null; sleep 3; systemctl restart systemd-networkd'
  changed_when: false

- name: Wait for network to come up
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      ip -4 addr show eth0 | grep -q {{ iscsi_cinder_eth0_ip }}
  retries: 10
  delay: 3
  register: net_check
  until: net_check.rc == 0

- name: Install lvm2 and tgt in cinder container
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    apt-get update -qq && apt-get install -y -qq lvm2 tgt'
  register: pkg_install
  changed_when: "'newly installed' in pkg_install.stdout"

- name: Disable udev sync in LVM config
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    sed -i "s/udev_sync = 1/udev_sync = 0/" /etc/lvm/lvm.conf
    sed -i "s/udev_rules = 1/udev_rules = 0/" /etc/lvm/lvm.conf
    sed -i "s/obtain_device_list_from_udev = 1/obtain_device_list_from_udev = 0/" /etc/lvm/lvm.conf'
  changed_when: false

- name: Configure tgt to include cinder volume configs
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    grep -q "include /var/lib/cinder/volumes" /etc/tgt/targets.conf || \
    echo "include /var/lib/cinder/volumes/*" >> /etc/tgt/targets.conf'
  changed_when: false

- name: Start and enable tgt service
  shell: >
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} --
    bash -c 'systemctl restart tgt && systemctl enable tgt'
  changed_when: false

- name: Check if lvm-iscsi already in backends template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      grep -q ',lvm-iscsi' {{ iscsi_charm_template_dir }}/{{ iscsi_charm_backends_file }}
  register: backends_check
  failed_when: false
  changed_when: false

- name: Add lvm-iscsi to enabled_backends in charm template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      sed -i 's/enabled_backends = {{ '{{' }} backends {{ '}}' }}/enabled_backends = {{ '{{' }} backends {{ '}}' }},lvm-iscsi/' \
      {{ iscsi_charm_template_dir }}/{{ iscsi_charm_backends_file }}
  when: backends_check.rc != 0

- name: Check if verify_glance_signatures already in cinder.conf template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      grep -q 'verify_glance_signatures' {{ iscsi_charm_template_dir }}/{{ iscsi_charm_cinder_conf }}
  register: verify_check
  failed_when: false
  changed_when: false

- name: Add verify_glance_signatures to cinder.conf template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      sed -i '/osapi_volume_listen = {{ '{{' }} bind_host {{ '}}' }}/a verify_glance_signatures = disabled' \
      {{ iscsi_charm_template_dir }}/{{ iscsi_charm_cinder_conf }}
  when: verify_check.rc != 0

- name: Check if [lvm-iscsi] section already in cinder.conf template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      grep -q '^\[lvm-iscsi\]' {{ iscsi_charm_template_dir }}/{{ iscsi_charm_cinder_conf }}
  register: section_check
  failed_when: false
  changed_when: false

- name: Add [lvm-iscsi] section to cinder.conf template
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- bash -c '
    cat >> {{ iscsi_charm_template_dir }}/{{ iscsi_charm_cinder_conf }} << EOF

    [lvm-iscsi]
    volume_driver = cinder.volume.drivers.lvm.LVMVolumeDriver
    volume_group = {{ iscsi_vg_name }}
    target_protocol = iscsi
    target_helper = tgtadm
    volume_backend_name = {{ iscsi_volume_backend_name }}
    target_ip_address = {{ iscsi_portal_ip_1 }}
    lvm_type = default
    EOF'
  when: section_check.rc != 0

- name: Trigger charm config-changed hook to re-render cinder.conf
  shell: >
    {{ juju_openstack_cmd }} run -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }}
    --unit {{ iscsi_cinder_unit }} "hooks/config-changed"
  changed_when: false

- name: Verify cinder.conf has lvm-iscsi backend
  shell: |
    lxc exec {{ iscsi_cinder_container }} --project {{ iscsi_cinder_project }} -- \
      grep -q 'enabled_backends.*lvm-iscsi' /etc/cinder/cinder.conf
  retries: 3
  delay: 5

- name: Get compute node containers from Juju
  shell: |
    {{ juju_openstack_cmd }} status -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} ceph-osd --format json | \
    python3 -c "import sys,json; d=json.load(sys.stdin); [print(f\"{d['machines'][v['machine']]['hostname']}:{v['machine']}\") for u,v in d['applications']['ceph-osd']['units'].items()]"
  register: compute_info
  changed_when: false
  when: iscsi_setup_multipath

- name: Set compute node facts
  set_fact:
    iscsi_compute_containers: "{{ compute_info.stdout_lines | map('split', ':') | map('first') | list }}"
    iscsi_compute_machines: "{{ dict(compute_info.stdout_lines | map('split', ':')) }}"
  when: iscsi_setup_multipath

- name: Add virbr2 NIC to compute containers
  shell: >
    lxc config device add {{ item }} eth2 nic
    nictype=bridged parent={{ iscsi_portal_bridge_2 }}
    --project {{ iscsi_compute_lxd_project }}
  loop: "{{ iscsi_compute_containers }}"
  failed_when: false
  changed_when: false
  when: iscsi_setup_multipath

- name: Install open-iscsi and multipath-tools on compute nodes
  shell: >
    {{ juju_openstack_cmd }} ssh -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} {{ iscsi_compute_machines[item] }}
    'sudo apt-get install -y -qq open-iscsi multipath-tools'
  loop: "{{ iscsi_compute_containers }}"

  when: iscsi_setup_multipath

- name: Deploy multipath.conf to compute nodes
  shell: |
    {{ juju_openstack_cmd }} ssh -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} {{ iscsi_compute_machines[item] }} '
    sudo tee /etc/multipath.conf > /dev/null << EOF
    defaults {
        user_friendly_names yes
    }
    EOF'
  loop: "{{ iscsi_compute_containers }}"
  changed_when: false

  when: iscsi_setup_multipath

- name: Enable multipathd and iscsid on compute nodes
  shell: >
    {{ juju_openstack_cmd }} ssh -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} {{ iscsi_compute_machines[item] }}
    'sudo systemctl enable --now multipathd iscsid'
  loop: "{{ iscsi_compute_containers }}"
  changed_when: false

  when: iscsi_setup_multipath

- name: Configure nova-compute to use multipath
  shell: >
    {{ juju_openstack_cmd }} config -m {{ os_lxd_juju_controller }}:{{ os_lxd_model_name }} nova-compute use-multipath=true
  changed_when: false

  when: iscsi_setup_multipath

- name: Create LVM_iSCSI volume type
  shell: >
    bash -c 'source {{ iscsi_openstack_rc }} >/dev/null 2>&1 &&
    openstack volume type create {{ iscsi_volume_backend_name }}
    --property volume_backend_name={{ iscsi_volume_backend_name }}'
  register: voltype_result
  failed_when: "voltype_result.rc != 0 and 'already exists' not in voltype_result.stderr"
  changed_when: "'already exists' not in voltype_result.stderr"
