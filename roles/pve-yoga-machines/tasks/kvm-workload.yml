---

- name: Check for VMID collision with an existing container
  ansible.builtin.command: "pct status {{ pve_yoga_kvm_workload.vmid }}"
  register: pve_yoga_kvm_ct_status
  failed_when: false
  changed_when: false

- name: Refuse to overwrite an existing CT with the KVM workload VMID
  ansible.builtin.assert:
    that:
      - pve_yoga_kvm_ct_status.rc != 0
    fail_msg: "VMID {{ pve_yoga_kvm_workload.vmid }} is already an LXC container; refusing to overwrite it."

- name: Check whether the KVM workload VM exists
  ansible.builtin.command: "qm status {{ pve_yoga_kvm_workload.vmid }}"
  register: pve_yoga_kvm_status
  failed_when: false
  changed_when: false

- name: Create KVM workload VM
  ansible.builtin.shell: |
    set -euo pipefail
    cd /var/tmp
    image=ubuntu-22.04-server-cloudimg-amd64.img
    if [ ! -s "$image" ]; then
      curl -fsSLo "$image" "{{ pve_yoga_kvm_image_url }}"
    fi
    qm create {{ pve_yoga_kvm_workload.vmid }} \
      --name {{ pve_yoga_kvm_workload.hostname }} \
      --ostype l26 --cores {{ pve_yoga_kvm_workload.cores }} \
      --memory {{ pve_yoga_kvm_workload.memory }} --balloon 0 \
      --cpu host --sockets 1 \
      --net0 virtio,bridge={{ pve_yoga_network_spaces[0].bridge }},firewall=0 \
      --net1 virtio,bridge={{ pve_yoga_network_spaces[1].bridge }},firewall=0 \
      --net2 virtio,bridge={{ pve_yoga_network_spaces[2].bridge }},firewall=0 \
      --net3 virtio,bridge={{ pve_yoga_network_spaces[3].bridge }},firewall=0 \
      --net4 virtio,bridge={{ pve_yoga_compute_uplink_bridge }},firewall=0 \
      --onboot 1 --startup order=3 --agent 1 --serial0 socket --vga std
    qm importdisk {{ pve_yoga_kvm_workload.vmid }} "$image" '{{ pve_storage }}'
    qm set {{ pve_yoga_kvm_workload.vmid }} --scsihw virtio-scsi-pci \
      --scsi0 '{{ pve_storage }}:vm-{{ pve_yoga_kvm_workload.vmid }}-disk-0,iothread=1'
    qm resize {{ pve_yoga_kvm_workload.vmid }} scsi0 {{ pve_yoga_kvm_workload.disk }}G
    qm set {{ pve_yoga_kvm_workload.vmid }} --ide2 '{{ pve_storage }}:cloudinit' --boot order=scsi0
    qm set {{ pve_yoga_kvm_workload.vmid }} \
      --ciuser ubuntu --sshkeys /root/juju-yoga-client.pub \
      --ipconfig0 ip={{ pve_yoga_public_prefix }}.{{ pve_yoga_kvm_workload.vmid - pve_yoga_ip_offset }}/24,gw={{ pve_yoga_public_gateway }} \
      --ipconfig1 ip={{ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].oam }}/24 \
      --ipconfig2 ip={{ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].internal }}/24 \
      --ipconfig3 ip={{ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].storage }}/24 \
      --nameserver 8.8.8.8
  args:
    executable: /bin/bash
  environment:
    HTTP_PROXY: "{{ pve_yoga_http_proxy }}"
    HTTPS_PROXY: "{{ pve_yoga_https_proxy }}"
    http_proxy: "{{ pve_yoga_http_proxy }}"
    https_proxy: "{{ pve_yoga_https_proxy }}"
  when: pve_yoga_kvm_status.rc != 0

- name: Read configuration of the KVM workload VM
  ansible.builtin.command: "qm config {{ pve_yoga_kvm_workload.vmid }}"
  register: pve_yoga_kvm_config
  changed_when: false

- name: Verify KVM workload VM identity, static NICs, and cloud-init user
  ansible.builtin.assert:
    that:
      - "'name: ' ~ pve_yoga_kvm_workload.hostname in pve_yoga_kvm_config.stdout"
      - "'ipconfig0: ip=' ~ pve_yoga_public_prefix ~ '.' ~ (pve_yoga_kvm_workload.vmid - pve_yoga_ip_offset) ~ '/24,gw=' ~ pve_yoga_public_gateway in pve_yoga_kvm_config.stdout"
      - "pve_yoga_kvm_config.stdout is search('(?m)^net0: .*bridge=' ~ pve_yoga_network_spaces[0].bridge ~ '(?:,|$)')"
      - "pve_yoga_kvm_config.stdout is search('(?m)^net1: .*bridge=' ~ pve_yoga_network_spaces[1].bridge ~ '(?:,|$)')"
      - "pve_yoga_kvm_config.stdout is search('(?m)^net2: .*bridge=' ~ pve_yoga_network_spaces[2].bridge ~ '(?:,|$)')"
      - "pve_yoga_kvm_config.stdout is search('(?m)^net3: .*bridge=' ~ pve_yoga_network_spaces[3].bridge ~ '(?:,|$)')"
      - "pve_yoga_kvm_config.stdout is search('(?m)^net4: .*bridge=' ~ pve_yoga_compute_uplink_bridge ~ '(?:,|$)')"
      - "pve_yoga_kvm_config.stdout is not search('(?m)^ipconfig4:')"
      - "('ipconfig1: ip=' ~ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].oam ~ '/24') in pve_yoga_kvm_config.stdout"
      - "('ipconfig2: ip=' ~ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].internal ~ '/24') in pve_yoga_kvm_config.stdout"
      - "('ipconfig3: ip=' ~ pve_yoga_workload_secondary_network_ips[pve_yoga_kvm_workload.vmid | string].storage ~ '/24') in pve_yoga_kvm_config.stdout"
      - "'ciuser: ubuntu' in pve_yoga_kvm_config.stdout"
      - "'sshkeys:' in pve_yoga_kvm_config.stdout"
    fail_msg: "the name, NICs, addresses or cloud-init user of VMID {{ pve_yoga_kvm_workload.vmid }} do not match the inventory; refusing to change them automatically."

- name: Read rendered cloud-init user data for the KVM workload VM
  ansible.builtin.command: "qm cloudinit dump {{ pve_yoga_kvm_workload.vmid }} user"
  register: pve_yoga_kvm_cloudinit
  changed_when: false

- name: Verify the KVM workload VM receives the Juju client key
  ansible.builtin.assert:
    that:
      - "pve_yoga_machines_client_pubkey.stdout | trim in pve_yoga_kvm_cloudinit.stdout"
    fail_msg: "the cloud-init data of VMID {{ pve_yoga_kvm_workload.vmid }} does not contain the Juju client public key; refusing to continue."

- name: Check runtime state of the KVM workload VM
  ansible.builtin.command: "qm status {{ pve_yoga_kvm_workload.vmid }}"
  register: pve_yoga_kvm_runtime_status
  changed_when: false

- name: Start the KVM workload VM if stopped
  ansible.builtin.command: "qm start {{ pve_yoga_kvm_workload.vmid }}"
  when: "'status: stopped' in pve_yoga_kvm_runtime_status.stdout"
