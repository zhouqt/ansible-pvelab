---
- name: Verify PVE storage is configured
  ansible.builtin.command: pvesm status
  register: pve_env1_storage_inventory
  changed_when: false

- name: Check whether MAAS controller CT already exists
  ansible.builtin.command: "pct status {{ pve_env1_maas_vmid }}"
  register: pve_env1_maas_status
  failed_when: false
  changed_when: false

- name: Assert MAAS CT and PVE storage are ready
  ansible.builtin.assert:
    that:
      - "pve_common_storage in pve_env1_storage_inventory.stdout"
      - pve_env1_maas_status.rc == 0
    fail_msg: "run playbooks/env1/stages/02-maas.yml first and confirm {{ pve_common_storage }} is usable."

- name: Check PVE local focal template inventory
  ansible.builtin.command: pveam list local
  register: pve_env1_template_inventory
  changed_when: false

- name: Require focal template before building workload machines
  ansible.builtin.assert:
    that:
      - pve_env1_focal_template in pve_env1_template_inventory.stdout
    fail_msg: "{{ pve_env1_focal_template }} is missing; prepare the focal template first."

- name: Verify Juju client SSH identity is present
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_env1_juju_client_user }}"
      - -c
      - test -s ~/.ssh/id_ed25519.pub
  register: pve_env1_juju_client_key_check
  changed_when: false

- name: Verify Juju client has the required private key
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_env1_juju_client_user }}"
      - -c
      - test -s ~/.ssh/id_ed25519
  register: pve_env1_juju_client_private_key_check
  changed_when: false

- name: Read available Juju models
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_env1_juju_client_user }}"
      - -c
      - "{{ pve_env1_juju_bin }} models --controller {{ pve_env1_juju_controller_name }} --format json"
  register: pve_env1_workload_juju_models
  changed_when: false

- name: Require Juju model listing to succeed
  ansible.builtin.assert:
    that:
      - pve_env1_workload_juju_models.rc == 0
      - "'models' in (pve_env1_workload_juju_models.stdout | from_json)"
    fail_msg: "cannot read the Juju model inventory; refusing to register workload guests while the model state is unknown."

- name: Read current OpenStack Juju machine inventory
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_env1_juju_client_user }}"
      - -c
      - "{{ pve_env1_juju_bin }} status -m {{ pve_env1_juju_controller_name }}:openstack --format json"
  register: pve_env1_workload_openstack_status
  changed_when: false

- name: Fail safely if the OpenStack Juju status command fails
  ansible.builtin.assert:
    that:
      - pve_env1_workload_openstack_status.rc == 0
      - "'machines' in (pve_env1_workload_openstack_status.stdout | from_json)"
    fail_msg: "cannot read the OpenStack Juju model status; refusing to change PVE based on an incomplete machine inventory."

- name: Require the openstack Juju model to exist
  ansible.builtin.assert:
    that:
      - "'models' in (pve_env1_workload_juju_models.stdout | from_json)"
      - >-
        ((pve_env1_workload_juju_models.stdout | from_json).models
         | selectattr('short-name', 'equalto', 'openstack') | list | length) == 1
    fail_msg: "run playbooks/env1/stages/03-juju-ctrl.yml first to create the Juju controller and the openstack model."

- name: Validate the topology table shape
  ansible.builtin.assert:
    that:
      - pve_env1_topology | length > 0
      - pve_env1_topology | map(attribute='vmid') | unique | length == pve_env1_topology | length
      - pve_env1_topology | map(attribute='hostname') | unique | length == pve_env1_topology | length
      - "pve_env1_topology | map(attribute='kind') | unique | sort == ['ct', 'kvm']"
      - pve_env1_workload_cts | length >= 1
      - pve_env1_workload_kvms | length == 1
      - "'openstack' in pve_env1_teardown_models"
    fail_msg: "pve_env1_topology is invalid: vmid/hostname must be unique, kind may only be ct/kvm, and there must be exactly one KVM."

- name: Require every haproxy-writing API charm to appear exactly once
  ansible.builtin.assert:
    that:
      - >-
        (pve_env1_topology | rejectattr('writer', 'none') | map(attribute='writer') | list)
        | unique | length
        == (pve_env1_topology | rejectattr('writer', 'none') | list | length)
    fail_msg: "the same haproxy writer appears on several machines; each writer must live on exactly one machine."

- name: Require the expected replica counts and contiguous unit indexes
  vars:
    pve_env1_expected_units:
      mysql-innodb-cluster: 3
      ovn-central: 3
      ceph-mon: 3
      ceph-osd: 3
      nova-compute: 2
      nova-compute-kvm: 1
  ansible.builtin.assert:
    that:
      - >-
        (pve_env1_machine_of_unit.keys() | select('match', '^' ~ item.key ~ '/[0-9]+$') | list | length)
        == item.value
      - >-
        (pve_env1_machine_of_unit.keys() | select('match', '^' ~ item.key ~ '/[0-9]+$')
         | map('regex_replace', '^.*/', '') | map('int') | list | sort)
        == range(item.value) | list
    fail_msg: "the unit numbers of {{ item.key }} must be the contiguous range 0..{{ item.value | int - 1 }}, exactly {{ item.value }} of them."
  loop: "{{ pve_env1_expected_units | dict2items }}"
  loop_control:
    label: "{{ item.key }} × {{ item.value }}"

- name: Require replica units of one application to land on distinct machines
  ansible.builtin.assert:
    that:
      - >-
        (pve_env1_machine_of_unit.keys() | select('match', '^' ~ item ~ '/[0-9]+$')
         | map('extract', pve_env1_machine_of_unit) | list) | unique | length
        == (pve_env1_machine_of_unit.keys() | select('match', '^' ~ item ~ '/[0-9]+$') | list | length)
    fail_msg: "the replicas of {{ item }} land on the same machine; replicas must be spread across machines."
  loop:
    - mysql-innodb-cluster
    - ovn-central
    - ceph-mon
    - ceph-osd
    - nova-compute

- name: Require every nova-compute unit to sit on a machine with a br-ex uplink
  ansible.builtin.assert:
    that:
      - item.uplink | bool
    fail_msg: "VMID {{ item.vmid }} runs nova-compute but has no dedicated br-ex uplink (uplink: true)."
  when: item.units | select('match', '^nova-compute/[0-9]+$') | list | length > 0
  loop: "{{ pve_env1_topology }}"
  loop_control:
    label: "vmid {{ item.vmid }} {{ item.hostname }}"

- name: Forbid cinder and nova-compute on the same machine
  ansible.builtin.assert:
    that:
      - >-
        not (item.writer is not none and item.writer == 'cinder'
             and (item.units | select('match', '^nova-compute/[0-9]+$') | list | length) > 0)
    fail_msg: "VMID {{ item.vmid }} hosts both cinder and nova-compute; their ceph keyrings would overwrite each other."
  loop: "{{ pve_env1_topology }}"
  loop_control:
    label: "vmid {{ item.vmid }} {{ item.hostname }}"

- name: Derive the workload registration addresses from the topology
  ansible.builtin.set_fact:
    pve_env1_workload_registration_ips: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for v in pve_env1_workload_vmids -%}
      {%-   set ns.out = ns.out + [pve_env1_juju_network_spaces[0].cidr
             | regex_replace('\\.0/24$', '.' ~ ((v | int) - (pve_env1_ip_offset | int)))] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Validate already-registered Juju machines against the topology addresses
  ansible.builtin.assert:
    that:
      - item.value.get('dns-name', '') in pve_env1_workload_registration_ips
    fail_msg: >-
      Juju machine {{ item.key }} ({{ item.value.get('dns-name', '') }}) is not in the address set declared by the topology table;
      the machine mapping of the existing model disagrees with pve_env1_topology; refusing to keep changing PVE on top of it.
  loop: "{{ (pve_env1_workload_openstack_status.stdout | from_json).machines | dict2items }}"
  loop_control:
    label: "Juju machine {{ item.key }}"

- name: Build the Juju workload CT inventory from the topology
  ansible.builtin.set_fact:
    pve_env1_workload_containers: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for e in pve_env1_workload_cts -%}
      {%-   set last = (e.vmid | int) - (pve_env1_ip_offset | int) -%}
      {%-   set ns.out = ns.out + [{
            'vmid': e.vmid | int,
            'hostname': e.hostname,
            'ip': pve_env1_juju_network_spaces[0].cidr | regex_replace('\\.0/24$', '.' ~ last),
            'tags': 'juju,openstack',
            'uplink': e.uplink | bool,
            'secondary_networks': pve_env1_secondary_network_ips[e.vmid | string]}] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Validate the derived CT inventory against the topology
  ansible.builtin.assert:
    that:
      - pve_env1_workload_containers | length == pve_env1_workload_cts | length
      - (pve_env1_workload_containers | map(attribute='vmid') | unique | list | length) == (pve_env1_workload_containers | length)
      - item.secondary_networks is mapping
      - (item.secondary_networks.keys() | list | sort) == ['internal', 'oam', 'storage']
      - (item.secondary_networks.oam.split('.') | last | int) == (item.vmid | int) - (pve_env1_ip_offset | int)
      - (item.secondary_networks.internal.split('.') | last | int) == (item.vmid | int) - (pve_env1_ip_offset | int)
      - (item.secondary_networks.storage.split('.') | last | int) == (item.vmid | int) - (pve_env1_ip_offset | int)
      - (item.ip.split('.') | last | int) == (item.vmid | int) - (pve_env1_ip_offset | int)
    fail_msg: >-
      the derived address of VMID {{ item.vmid }} ({{ item.hostname }}) does not follow "last octet = vmid -
      {{ pve_env1_ip_offset }}" pattern, or the secondary subnet addresses are malformed.
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "VMID {{ item.vmid }} {{ item.hostname }}"

- name: Check for existing Juju workload CTs
  ansible.builtin.command: "pct config {{ item.vmid }}"
  register: pve_env1_workload_ct_configs
  failed_when: false
  changed_when: false
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Check workload VMIDs are not occupied by KVM guests
  ansible.builtin.command: "qm status {{ item.vmid }}"
  register: pve_env1_workload_qm_status
  failed_when: false
  changed_when: false
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Validate existing workload VMIDs are not occupied by KVM guests
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: "VMID {{ item.item.vmid }} is taken by a KVM VM; refusing to create or reuse a workload guest."
  loop: "{{ pve_env1_workload_qm_status.results }}"
  loop_control:
    label: "{{ item.item.vmid }}"

- name: Validate identity of existing workload CTs
  ansible.builtin.assert:
    that:
      - "item.rc != 0 or ('hostname: ' ~ item.item.hostname) in item.stdout"
      - "item.rc != 0 or ('ip=' ~ item.item.ip ~ '/24') in item.stdout"
    fail_msg: "VMID {{ item.item.vmid }} is already a CT with a different config; refusing to overwrite or reuse it."
  loop: "{{ pve_env1_workload_ct_configs.results }}"
  loop_control:
    label: "{{ item.item.vmid }} {{ item.item.hostname }}"

- name: Validate secondary network NIC identity of existing OpenStack workload CTs
  ansible.builtin.assert:
    that:
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=' ~ pve_env1_juju_network_spaces[0].bridge)
        | select('search', 'ip=' ~ item.item.ip | regex_escape ~ '/24')
        | select('search', 'gw=' ~ pve_env1_gateway | regex_escape)
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=' ~ pve_env1_juju_network_spaces[1].bridge)
        | select('search', 'ip=' ~ item.item.secondary_networks.oam ~ '/24')
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=' ~ pve_env1_juju_network_spaces[2].bridge)
        | select('search', 'ip=' ~ item.item.secondary_networks.internal ~ '/24')
        | list | length) == 1
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('search', 'bridge=' ~ pve_env1_juju_network_spaces[3].bridge)
        | select('search', 'ip=' ~ item.item.secondary_networks.storage ~ '/24')
        | list | length) == 1
    fail_msg: "the oam/internal/storage NICs of VMID {{ item.item.vmid }} do not match the addresses/bridges the topology declares; refusing to reuse it."
  loop: "{{ pve_env1_workload_ct_configs.results | selectattr('item.tags', 'search', 'openstack') | list }}"
  loop_control:
    label: "{{ item.item.vmid }} {{ item.item.hostname }}"

- name: Validate PVE compute uplink variable invariants
  ansible.builtin.assert:
    that:
      - pve_env1_compute_uplink_bridge in pve_env1_juju_network_spaces | map(attribute='bridge') | list
      - pve_env1_compute_uplink_pve_net_index | int == 4
      - pve_env1_compute_uplink_guest_interface is match('^ens[0-9]+$')
      - pve_env1_compute_uplink_vmids | length > 0
      - (pve_env1_compute_uplink_vmids | difference(pve_env1_workload_vmids)) | length == 0
      - (pve_env1_compute_uplink_vmids | difference(pve_env1_compute_ct_vmids) | sort)
        == (pve_env1_workload_kvms | map(attribute='vmid') | list | sort)
    fail_msg: >-
      the dedicated uplink must be net4 on a compute node and free of L3; guests with an uplink may only come from
      entries marked uplink: true (pct adds the NIC for CTs, kvm-workload.yml does it for KVM guests).

- name: Validate existing compute CT uplink NIC configuration
  ansible.builtin.assert:
    that:
      - >-
        item.rc != 0 or
        (item.stdout_lines | select('match', '^net4:') | list | length) == 0 or
        (
          (item.stdout_lines | select('match', '^net4:') | list | length) == 1
          and
          (item.stdout_lines | select('match', '^net4:') | first)
            is search('name=' ~ pve_env1_compute_uplink_guest_interface ~ '(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first)
            is search('bridge=' ~ pve_env1_compute_uplink_bridge ~ '(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first) is search('ip=manual(?:,|$)')
          and
          (item.stdout_lines | select('match', '^net4:') | first) is not search('(?:^|,)gw=')
        )
    fail_msg: >-
      compute CT VMID {{ item.item.vmid }} already has net4, but it is not the L3-free
      {{ pve_env1_compute_uplink_guest_interface }}→{{ pve_env1_compute_uplink_bridge }} uplink; refusing to overwrite it.
  loop: >-
    {{ pve_env1_workload_ct_configs.results
       | selectattr('item.vmid', 'in', pve_env1_compute_ct_vmids) | list }}
  loop_control:
    label: "CT {{ item.item.vmid }}"

- name: Read runtime state of existing compute CTs missing the uplink NIC
  ansible.builtin.command: "pct status {{ item.item.vmid }}"
  register: pve_env1_compute_uplink_ct_status
  changed_when: false
  when:
    - item.rc == 0
    - (item.stdout_lines | select('match', '^net4:') | list | length) == 0
  loop: >-
    {{ pve_env1_workload_ct_configs.results
       | selectattr('item.vmid', 'in', pve_env1_compute_ct_vmids) | list }}
  loop_control:
    label: "CT {{ item.item.vmid }}"

- name: Require existing compute CTs to be stopped before adding a missing uplink NIC
  ansible.builtin.assert:
    that:
      - '"status: stopped" in item.stdout'
      - pve_env1_start_existing_compute_after_uplink | bool
    fail_msg: >-
      CT {{ item.item.item.vmid }} needs its dedicated pub11 uplink but is either running, or
      pve_env1_start_existing_compute_after_uplink is false. Stop it in a controlled maintenance window
      and rerun with -e pve_env1_start_existing_compute_after_uplink=true to authorize NIC addition and
      the normal pve-env1-machines startup stage.
  loop: "{{ pve_env1_compute_uplink_ct_status.results | default([]) | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "CT {{ item.item.item.vmid }}"

- name: Add missing uplink NIC to stopped compute CTs
  ansible.builtin.command:
    argv:
      - pct
      - set
      - "{{ item.item.item.vmid }}"
      - --net4
      - "name={{ pve_env1_compute_uplink_guest_interface }},bridge={{ pve_env1_compute_uplink_bridge }},ip=manual"
  loop: "{{ pve_env1_compute_uplink_ct_status.results | default([]) | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "CT {{ item.item.item.vmid }}"

- name: Read Juju client public key
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_env1_juju_client_user }}"
      - -c
      - cat ~/.ssh/id_ed25519.pub
  register: pve_env1_juju_client_pubkey
  changed_when: false

- name: Check whether the Juju client key is authorized on the MAAS CT
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - bash
      - -lc
      - "grep -qxF {{ pve_env1_juju_client_pubkey.stdout | quote }} /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys"
  register: pve_env1_juju_client_key_authorized
  failed_when: false
  changed_when: false

- name: Authorize the Juju client key for the MAAS CT user
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_env1_juju_client_vmid }}"
      - --
      - bash
      - -lc
      - >-
        install -d -m 0700 -o {{ pve_env1_juju_client_user }} -g {{ pve_env1_juju_client_user }} /home/{{ pve_env1_juju_client_user }}/.ssh;
        touch /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys;
        grep -qxF {{ pve_env1_juju_client_pubkey.stdout | quote }} /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys
        || printf '%s\\n' {{ pve_env1_juju_client_pubkey.stdout | quote }} >> /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys;
        chown {{ pve_env1_juju_client_user }}:{{ pve_env1_juju_client_user }} /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys;
        chmod 0600 /home/{{ pve_env1_juju_client_user }}/.ssh/authorized_keys
  when: pve_env1_juju_client_key_authorized.rc != 0

- name: Copy Juju client public key to PVE for workload bootstrapping
  ansible.builtin.copy:
    content: "{{ pve_env1_juju_client_pubkey.stdout | trim }}\n"
    dest: /root/juju-client.pub
    owner: root
    group: root
    mode: "0600"

- name: Copy Juju CT initialization script to PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/common/juju-ct-init.sh"
    dest: /root/juju-ct-init.sh
    owner: root
    group: root
    mode: "0700"

- name: Create missing Juju workload LXC containers
  ansible.builtin.command:
    argv: >-
      {{ [repo_root ~ '/scripts/env1/create-workload-ct.sh',
          '--vmid', (item.vmid | string),
          '--hostname', item.hostname,
          '--ip', item.ip,
          '--gateway', pve_env1_gateway,
          '--template', pve_env1_focal_template,
          '--storage', pve_common_storage,
          '--tags', item.tags,
          '--bridge0', pve_env1_juju_network_spaces[0].bridge,
          '--bridge1', pve_env1_juju_network_spaces[1].bridge,
          '--bridge2', pve_env1_juju_network_spaces[2].bridge,
          '--bridge3', pve_env1_juju_network_spaces[3].bridge,
          '--oam-ip', item.secondary_networks.oam,
          '--internal-ip', item.secondary_networks.internal,
          '--storage-ip', item.secondary_networks.storage,
          '--apply']
         + (['--openstack'] if ('openstack' in item.tags) else [])
         + (['--uplink', '--uplink-interface', pve_env1_compute_uplink_guest_interface,
             '--uplink-bridge', pve_env1_compute_uplink_bridge]
            if (item.uplink | bool) else []) }}
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }} {{ item.ip }}"
  register: pve_env1_create_ct
  changed_when: "'CREATED:' in pve_env1_create_ct.stdout"

- name: Read compute CT configurations after optional uplink NIC addition or creation
  ansible.builtin.command: "pct config {{ item }}"
  register: pve_env1_compute_uplink_ct_configs_after
  changed_when: false
  loop: "{{ pve_env1_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"

- name: Verify compute CT uplink NIC configuration after provisioning
  ansible.builtin.assert:
    that:
      - "item.stdout is search('(?m)^net4: .*name=' ~ pve_env1_compute_uplink_guest_interface ~ '(?:,|$)')"
      - "item.stdout is search('(?m)^net4: .*bridge=' ~ pve_env1_compute_uplink_bridge ~ '(?:,|$)')"
      - "item.stdout is search('(?m)^net4: .*ip=manual(?:,|$)')"
      - "item.stdout is not search('(?m)^net4: .*gw=')"
    fail_msg: "the dedicated uplink config of CT {{ item.item }} was not written persistently; refusing to register machines."
  loop: "{{ pve_env1_compute_uplink_ct_configs_after.results }}"
  loop_control:
    label: "CT {{ item.item }}"

- name: Copy the ussuri OSD thin-LV helper to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/env1/setup-osd-lv.sh"
    dest: /root/ussuri-setup-osd-lv.sh
    owner: root
    group: root
    mode: "0700"

- name: Provision each ceph-osd container's dedicated thin-LV disk before first boot
  ansible.builtin.command:
    argv:
      - /root/ussuri-setup-osd-lv.sh
      - "{{ pve_env1_osd_spec }}"
  environment:
    OSD_LV_PREFIX: "{{ pve_env1_osd_lv_prefix }}"
    OSD_SIZE_MB: "{{ pve_env1_osd_size_mb }}"
    OSD_THINPOOL: "{{ pve_env1_osd_thinpool }}"
    OSD_THINPOOL_MAX_DATA_PERCENT: "{{ pve_env1_osd_thinpool_max_data_percent }}"
  register: pve_env1_osd_lv
  changed_when: "'USSURI-SETUP-OSD-LV-DONE' in pve_env1_osd_lv.stdout"
  when: pve_env1_osd_spec | trim | length > 0

- name: Copy the cap.drop baseline writer to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/env1/set-capdrop.py"
    dest: /root/ussuri-set-capdrop.py
    owner: root
    group: root
    mode: "0700"

- name: Copy the CT virtual-machine device passthrough helper to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/env1/ct-vm-devices.sh"
    dest: /root/ussuri-ct-vm-devices.sh
    owner: root
    group: root
    mode: "0700"

- name: Ensure workload LXC containers can run Juju agents
  ansible.builtin.command:
    argv:
      - python3
      - /root/ussuri-set-capdrop.py
      - "{{ item.vmid }}"
      - USSURI WORKLOAD SETTINGS
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"
  register: pve_env1_capdrop
  changed_when: "'CHANGED' in pve_env1_capdrop.stdout"

- name: Give every workload container its own SMBIOS system UUID
  ansible.builtin.include_role:
    name: pve-common-ct-uuid
  vars:
    pve_common_ct_uuid_items: "{{ pve_env1_workload_containers | map(attribute='vmid') | list }}"
    pve_common_ct_uuid_apply_live: true

- name: Pass through /dev/net/tun and /dev/kvm to the compute LXC containers
  ansible.builtin.command:
    argv:
      - /root/ussuri-ct-vm-devices.sh
      - "{{ item }}"
  loop: "{{ pve_env1_compute_ct_vmids }}"
  loop_control:
    label: "CT {{ item }}"
  register: pve_env1_ct_vm_devices
  changed_when: "'ADDED' in pve_env1_ct_vm_devices.stdout"

- name: Start workload LXC containers
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    if ! pct status "$vmid" | grep -q 'status: running'; then
      pct start "$vmid"
      echo "STARTED $vmid"
    fi
  args:
    executable: /bin/bash
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"
  register: pve_env1_workload_ct_start
  changed_when: "'STARTED ' in pve_env1_workload_ct_start.stdout"

- name: Initialize workload CTs and authorize the Juju client
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ item.vmid }}
    key=$(< /root/juju-client.pub)
    for attempt in $(seq 1 15); do
      if pct exec "$vmid" -- env JUJU_CLIENT_PUBKEY="$key" bash -s </root/juju-ct-init.sh 2>/dev/null; then
        exit 0
      fi
      sleep 4
    done
    echo "CT $vmid did not finish juju-ct-init.sh" >&2
    exit 1
  args:
    executable: /bin/bash
  loop: "{{ pve_env1_workload_containers }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.hostname }}"

- name: Create the KVM workload VMs declared in the topology
  ansible.builtin.include_tasks: kvm-workload.yml
  vars:
    pve_env1_kvm: >-
      {{ {'vmid': item.vmid | int,
          'hostname': item.hostname,
          'cores': pve_env1_kvm_cores,
          'memory': pve_env1_kvm_memory,
          'disk': pve_env1_kvm_disk,
          'ip': pve_env1_juju_network_spaces[0].cidr
                | regex_replace('\.0/24$', '.' ~ ((item.vmid | int) - (pve_env1_ip_offset | int)))} }}
    pve_env1_kvm_secondary_networks: "{{ pve_env1_secondary_network_ips[item.vmid | string] }}"
  loop: "{{ pve_env1_workload_kvms }}"
  loop_control:
    label: "VMID {{ item.vmid }} {{ item.hostname }}"

- name: Copy Juju workload registration helper to PVE host
  ansible.builtin.copy:
    src: "{{ role_path }}/files/add-juju-machine.sh"
    dest: /root/add-juju-machine.sh
    owner: root
    group: root
    mode: "0700"

- name: Install Juju workload registration helper in MAAS CT
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ pve_env1_juju_client_vmid }}"
      - /root/add-juju-machine.sh
      - /usr/local/sbin/add-juju-machine.sh
      - --perms
      - "0755"
  changed_when: false

- name: Copy Juju workload registration script to PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/env1/register-workload-machines.sh"
    dest: /root/register-workload-machines.sh
    owner: root
    group: root
    mode: "0700"

- name: Seed the MAAS controller IP in Juju client known_hosts
  ansible.builtin.shell: |
    set -euo pipefail
    ip={{ pve_env1_maas_ip }}
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    for attempt in $(seq 1 12); do
      if ssh-keyscan -T 3 -H "$ip" >"$tmp" 2>/dev/null && [ -s "$tmp" ]; then
        pct exec {{ pve_env1_juju_client_vmid }} -- su - {{ pve_env1_juju_client_user }} -c \
          "install -d -m 0700 ~/.ssh; touch ~/.ssh/known_hosts; \
           ssh-keygen -R \"$ip\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
           ssh-keygen -R \"[$ip]:22\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
           cat >> ~/.ssh/known_hosts" <"$tmp"
        exit 0
      fi
      sleep 5
    done
    echo "SSH did not become available on MAAS client $ip" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Seed the controller host key in Juju client known_hosts
  ansible.builtin.shell: |
    set -euo pipefail
    ip={{ pve_env1_juju_controller_ip }}
    keyscan=$(ssh-keyscan -H "$ip" 2>/dev/null)
    [[ -n "$keyscan" ]] || { echo "SSH did not become available on Juju controller $ip" >&2; exit 1; }
    printf '%s\n' "$keyscan" | pct exec {{ pve_env1_juju_client_vmid }} -- su - {{ pve_env1_juju_client_user }} -c \
      "install -d -m 0700 ~/.ssh; touch ~/.ssh/known_hosts; \
       ssh-keygen -R \"$ip\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
       ssh-keygen -R \"[$ip]:22\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
       cat >> ~/.ssh/known_hosts"
  args:
    executable: /bin/bash
  changed_when: false

- name: Register and verify PVE workload machine IDs
  ansible.builtin.command: /root/register-workload-machines.sh
  environment:
    CLIENT_VMID: "{{ pve_env1_juju_client_vmid }}"
    CLIENT_USER: "{{ pve_env1_juju_client_user }}"
    JUJU_BIN: "{{ pve_env1_juju_bin }}"
    MODEL: openstack
    WORKLOAD_VMIDS: "{{ pve_env1_workload_vmids | join(' ') }}"
    IP_OFFSET: "{{ pve_env1_ip_offset }}"
    PRIMARY_PREFIX: "{{ pve_env1_juju_network_spaces[0].cidr | regex_replace('\\.0/24$', '') }}"
  register: pve_env1_workload_registration
  changed_when: "'JUJU-WORKLOAD-MAPPING-CHANGED' in pve_env1_workload_registration.stdout"

- name: Install the env1 static name resolution map into every guest
  ansible.builtin.include_tasks: hosts-sync.yml
