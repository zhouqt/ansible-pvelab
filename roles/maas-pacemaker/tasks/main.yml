---

- name: Start pacemaker service on all nodes
  systemd:
    name: pacemaker
    state: started
    enabled: yes
  delegate_to: "{{ item }}"
  loop: "{{ groups['maas_ha'] }}"
  tags: pacemaker

- name: Wait for cluster to be ready
  command: crm status
  register: crm_status
  until: crm_status.rc == 0
  retries: 10
  delay: 10
  changed_when: false
  tags: pacemaker

- name: Set cluster properties
  command: >
    crm configure property
    stonith-enabled={{ pacemaker_stonith_enabled }}
    no-quorum-policy={{ pacemaker_no_quorum_policy }}
  run_once: true
  tags: pacemaker

- name: Create MAAS VIP resource
  command: >
    pcs resource create res_maas_vip ocf:heartbeat:IPaddr2
    ip={{ maas_vip }} cidr_netmask=24
    op monitor interval=10s
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create PostgreSQL VIP resource
  command: >
    pcs resource create res_pgsql_vip ocf:heartbeat:IPaddr2
    ip={{ pgsql_vip }} cidr_netmask=24
    op monitor interval=10s
    meta migration-threshold=0 target-role=Started
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create HAProxy clone resource
  command: pcs resource create haproxy lsb:haproxy op monitor interval=15s
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Clone HAProxy resource
  command: pcs resource clone haproxy
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Stop PostgreSQL for Pacemaker management
  systemd:
    name: postgresql
    state: stopped
    enabled: no
  delegate_to: "{{ item }}"
  loop: "{{ groups['maas_ha'] }}"
  tags: pacemaker

- name: Create pgsql resource
  shell: |
    crm configure primitive pgsql pgsql \
      params rep_mode={{ replication_mode }} \
      pgctl=/usr/lib/postgresql/{{ postgresql_version }}/bin/pg_ctl \
      psql=/usr/bin/psql \
      pgdata=/var/lib/postgresql/{{ postgresql_version }}/main/ \
      socketdir=/var/run/postgresql \
      config=/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf \
      logfile=/var/log/postgresql/postgresql-{{ postgresql_version }}-ha.log \
      master_ip={{ pgsql_vip }} \
      node_list="{{ groups['maas_ha'] | join(' ') }}" \
      primary_conninfo_opt="password={{ replication_pass }} keepalives_idle=60 keepalives_interval=5 keepalives_count=5" \
      restart_on_promote=true \
      op start timeout=120s interval=0s on-fail=restart \
      op monitor timeout=60s interval=4s on-fail=restart \
      op monitor timeout=60s interval=3s on-fail=restart role=Master \
      op promote timeout=120s interval=0s on-fail=restart \
      op demote timeout=60s interval=0s on-fail=stop \
      op stop timeout=120s interval=0s on-fail=block \
      op notify timeout=60s interval=0s
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create ms_pgsql master/slave resource
  shell: |
    crm configure ms ms_pgsql pgsql \
      meta master-max=1 master-node-max=1 clone-max=3 clone-node-max=1 notify=true target-role=Started
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create promotion order constraint
  command: >
    crm configure order ord_promote Mandatory: ms_pgsql:promote res_pgsql_vip:start symmetrical=false
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create demotion order constraint
  command: >
    crm configure order ord_demote Optional: ms_pgsql:demote res_pgsql_vip:stop symmetrical=false
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Create VIP colocation constraint
  command: >
    crm configure colocation pgsql_vip inf: res_pgsql_vip ms_pgsql:Master
  run_once: true
  ignore_errors: yes
  tags: pacemaker

- name: Wait for cluster to settle
  pause:
    seconds: 30
  tags: pacemaker

- name: Show cluster status
  command: crm_mon -1 -A
  register: cluster_status
  changed_when: false
  tags: pacemaker

- name: Display cluster status
  debug:
    msg: "{{ cluster_status.stdout_lines }}"
  tags: pacemaker