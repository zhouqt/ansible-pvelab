---

- name: Load juju SSH public key for VM injection
  ansible.builtin.set_fact:
    co_juju_ssh_pubkey: "{{ lookup('file', co_juju_ssh_pubkey_path) }}"

- name: Display cinder-oceanstor configuration
  ansible.builtin.debug:
    msg: |
      App:           {{ co_app }}
      Subordinate:   {{ co_subordinate_charm }} → {{ co_subordinate_app }}
      MySQL Router:  {{ co_mysql_router_app }}
      VM:            {{ co_vm_name }} ({{ co_vm_cpu }} CPU, {{ co_vm_memory }})
      Network:       enp5s0={{ co_eth0_ip }} ({{ co_eth0_bridge }}),
                     enp6s0={{ co_eth1_ip }} ({{ co_eth1_bridge }})
      Simulator:     {{ co_sim_resturl }}
      iSCSI target:  {{ co_sim_iscsi_target_ip }}:3260
      Pool:          {{ co_sim_storagepool }}
      Volume type:   {{ co_volume_type }} (backend_name={{ co_volume_backend_name }})

- name: Verify juju command is available
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} version"
  register: co_juju_version_check
  become: false
  changed_when: false
  failed_when: co_juju_version_check.rc != 0

- name: Verify Juju controller is accessible
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} show-controller {{ juju_controller_name }}"
  register: co_controller_check
  become: false
  changed_when: false
  failed_when: co_controller_check.rc != 0

- name: Verify OpenStack model exists
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} show-model {{ juju_controller_name }}:{{ juju_model_name }}"
  register: co_model_check
  become: false
  changed_when: false
  failed_when: co_model_check.rc != 0

- name: Check required upstream services are active
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ juju_model_name }} --format=json | \
    python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    apps = data.get('applications', {})
    required = ['mysql-innodb-cluster', 'rabbitmq-server', 'keystone', 'glance', 'vault']
    inactive = []
    for r in required:
        if r not in apps:
            inactive.append(f'{r}=MISSING')
        elif apps[r].get('application-status', {}).get('current') != 'active':
            inactive.append(f'{r}={apps[r][\"application-status\"][\"current\"]}')
    if inactive:
        print('NOT_READY: ' + ', '.join(inactive))
        sys.exit(1)
    print('OK')
    "
  register: co_prereq_check
  become: false
  changed_when: false

- name: Fail if upstream services not ready
  ansible.builtin.fail:
    msg: |
      Required upstream services not active: {{ co_prereq_check.stdout }}
      Run openstack-lxd-services role first.
      If vault is sealed, unseal it using credentials/vault-unseal-lxd-openstack.json.
  when: co_prereq_check.rc != 0

- name: Verify OceanStor simulator REST endpoint is reachable
  ansible.builtin.command:
    cmd: "curl -k -s -o /dev/null -w '%{http_code}' --connect-timeout 5 {{ co_sim_resturl }}"
  register: co_sim_rest_check
  become: false
  changed_when: false
  failed_when: false

- name: Verify OceanStor simulator iSCSI portal is reachable
  ansible.builtin.wait_for:
    host: "{{ co_sim_iscsi_target_ip }}"
    port: 3260
    timeout: 5
  register: co_sim_iscsi_check
  ignore_errors: true

- name: Fail if OceanStor simulator is not reachable
  ansible.builtin.fail:
    msg: |
      OceanStor simulator not reachable.
        REST endpoint {{ co_sim_resturl }} returned HTTP {{ co_sim_rest_check.stdout | default('N/A') }}
        iSCSI portal  {{ co_sim_iscsi_target_ip }}:3260 unreachable.
      Start the simulator before running this role.
  when: co_sim_rest_check.rc != 0 or co_sim_iscsi_check is failed

- name: Check current cinder-volume-oceanstor status
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }} --format=json | \
    python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception:
        print('NOT_DEPLOYED')
        sys.exit(1)
    apps = d.get('applications', {})
    app = apps.get('{{ co_app }}', {})
    status = app.get('application-status', {}).get('current', '')
    if status == 'active':
        print('ACTIVE')
        sys.exit(0)
    if app:
        print('PRESENT_BUT_' + status.upper())
        sys.exit(0)
    print('NOT_DEPLOYED')
    sys.exit(1)
    "
  register: co_status_check
  become: false
  changed_when: false
  failed_when: false

- name: Parse cinder-volume-oceanstor current state
  ansible.builtin.set_fact:
    co_already_deployed: "{{ co_status_check.stdout == 'ACTIVE' }}"

- name: Display idempotency decision
  ansible.builtin.debug:
    msg: >-
      cinder-volume-oceanstor already deployed and active: {{ co_already_deployed }}.
      {% if co_already_deployed %}Skipping deploy/relate/config, going to verify.{% else %}Proceeding with fresh deploy.{% endif %}

- name: Check if cinder-oceanstor-vm already exists in LXD
  ansible.builtin.command:
    cmd: "lxc list {{ co_vm_name }} --project {{ co_lxd_project }} -f csv -c n"
  register: co_lxc_check
  become: false
  changed_when: false

- name: Verify focal-vm LXD image alias exists
  ansible.builtin.command:
    cmd: "lxc image list {{ co_lxd_image_alias }} -f csv -c l"
  register: co_image_check
  become: false
  changed_when: false
  failed_when: co_image_check.stdout.strip() == ""

- name: Create cinder-oceanstor-vm KVM VM
  ansible.builtin.command:
    cmd: >-
      lxc init {{ co_lxd_image_alias }} {{ co_vm_name }} --vm
      --project {{ co_lxd_project }}
      -c limits.cpu={{ co_vm_cpu }}
      -c limits.memory={{ co_vm_memory }}
  register: co_lxc_init
  become: false
  changed_when: co_lxc_init.rc == 0
  failed_when: co_lxc_init.rc != 0 and 'already exists' not in co_lxc_init.stderr
  when: co_lxc_check.stdout.strip() == ""

- name: Override root disk size on cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "lxc config device override {{ co_vm_name }} root size={{ co_vm_root_disk }} --project {{ co_lxd_project }}"
  register: co_lxc_rootdisk
  become: false
  changed_when: co_lxc_rootdisk.rc == 0
  when: co_lxc_check.stdout.strip() == ""

- name: Render cloud-init user-data for cinder-oceanstor-vm
  ansible.builtin.template:
    src: user-data.j2
    dest: "/tmp/{{ co_vm_name }}-user-data"
    mode: '0644'
  become: false
  when: co_lxc_check.stdout.strip() == ""

- name: Inject cloud-init user-data into cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "lxc config set {{ co_vm_name }} user.user-data=\"$(cat /tmp/{{ co_vm_name }}-user-data)\" --project {{ co_lxd_project }}"
  register: co_lxc_userdata
  become: false
  changed_when: co_lxc_userdata.rc == 0
  when: co_lxc_check.stdout.strip() == ""

- name: Add bridged NIC enp5s0 (lxdbr165, internal) to cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: >-
      lxc config device add {{ co_vm_name }} eth0 nic
      nictype=bridged parent={{ co_eth0_bridge }} name=eth0
      --project {{ co_lxd_project }}
  register: co_lxc_eth0
  become: false
  changed_when: co_lxc_eth0.rc == 0
  failed_when: co_lxc_eth0.rc != 0 and 'already exists' not in co_lxc_eth0.stderr
  when: co_lxc_check.stdout.strip() == ""

- name: Add bridged NIC enp6s0 (lxdbr122, public) to cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: >-
      lxc config device add {{ co_vm_name }} eth1 nic
      nictype=bridged parent={{ co_eth1_bridge }} name=eth1
      --project {{ co_lxd_project }}
  register: co_lxc_eth1
  become: false
  changed_when: co_lxc_eth1.rc == 0
  failed_when: co_lxc_eth1.rc != 0 and 'already exists' not in co_lxc_eth1.stderr
  when: co_lxc_check.stdout.strip() == ""

- name: Start cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "lxc start {{ co_vm_name }} --project {{ co_lxd_project }}"
  register: co_lxc_start
  become: false
  changed_when: co_lxc_start.rc == 0
  failed_when: co_lxc_start.rc != 0
  when: co_lxc_check.stdout.strip() == ""

- name: Wait for cinder-oceanstor-vm to be reachable on enp5s0 IP
  ansible.builtin.command:
    cmd: "ping -c 1 -W 2 {{ co_eth0_ip }}"
  register: co_vm_ping
  become: false
  until: co_vm_ping.rc == 0
  retries: "{{ (co_vm_boot_timeout / co_vm_boot_poll_interval) | int }}"
  delay: "{{ co_vm_boot_poll_interval }}"
  changed_when: false
  when: co_lxc_check.stdout.strip() == ""

- name: Display VM boot success
  ansible.builtin.debug:
    msg: "cinder-oceanstor-vm is up at {{ co_eth0_ip }}"
  when: co_lxc_check.stdout.strip() == ""

- name: Remove conflicting cloud-init netplan in cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "lxc exec {{ co_vm_name }} --project {{ co_lxd_project }} -- rm -f /etc/netplan/50-cloud-init.yaml /etc/netplan/50-lxd.yaml"
  register: co_vm_rm_netplan
  become: false
  changed_when: co_vm_rm_netplan.rc == 0
  when: co_lxc_check.stdout.strip() == ""

- name: Write 99-static.yaml netplan in cinder-oceanstor-vm
  ansible.builtin.shell: |
    lxc exec {{ co_vm_name }} --project {{ co_lxd_project }} -- bash -c "
      cat > /etc/netplan/99-static.yaml <<'NETPLAN'
    network:
      version: 2
      ethernets:
        enp5s0:
          dhcp4: false
          addresses: [{{ co_eth0_ip }}/24]
          routes:
            - {to: {{ co_internal_cidr }}, via: {{ co_internal_gw }}
        enp6s0:
          dhcp4: false
          addresses: [{{ co_eth1_ip }}/24]
          routes:
            - {to: 0.0.0.0/0, via: {{ co_external_gw }}
          nameservers: {addresses: [{{ co_external_gw }}, 8.8.8.8]}
    NETPLAN
      netplan generate && netplan apply
      systemctl enable --now iscsid
    "
  register: co_vm_static_ip
  become: false
  changed_when: co_vm_static_ip.rc == 0
  failed_when: co_vm_static_ip.rc != 0
  when: co_lxc_check.stdout.strip() == ""

- name: Wait for SSH to be ready inside cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "ssh -i {{ co_juju_ssh_key_path }} -o StrictHostKeyChecking=no -o ConnectTimeout=3 ubuntu@{{ co_eth0_ip }} true"
  register: co_vm_ssh
  become: false
  until: co_vm_ssh.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: co_lxc_check.stdout.strip() == ""

- name: Verify iscsid is active inside cinder-oceanstor-vm
  ansible.builtin.command:
    cmd: "ssh -i {{ co_juju_ssh_key_path }} -o StrictHostKeyChecking=no ubuntu@{{ co_eth0_ip }} 'sudo systemctl is-active iscsid'"
  register: co_vm_iscsid_active
  become: false
  changed_when: false
  failed_when: co_vm_iscsid_active.stdout.strip() != "active"
  when: co_lxc_check.stdout.strip() == ""

- name: Verify iscsiadm can discover simulator targets
  ansible.builtin.command:
    cmd: "ssh -i {{ co_juju_ssh_key_path }} -o StrictHostKeyChecking=no ubuntu@{{ co_eth0_ip }} 'sudo iscsiadm -m discovery -t sendtargets -p {{ co_sim_iscsi_target_ip }}:3260'"
  register: co_vm_iscsi_discovery
  become: false
  changed_when: false
  failed_when: co_vm_iscsi_discovery.rc != 0
  when: co_lxc_check.stdout.strip() == ""

- name: Display iscsiadm discovery result
  ansible.builtin.debug:
    msg: "iscsiadm discovery: {{ co_vm_iscsi_discovery.stdout_lines }}"
  when: co_lxc_check.stdout.strip() == ""

- name: Add cinder-oceanstor host SSH key to known_hosts
  ansible.builtin.command:
    cmd: "ssh-keyscan -H {{ co_eth0_ip }} >> ~/.ssh/known_hosts"
  become: false
  changed_when: false
  when: not co_already_deployed

- name: Add cinder-oceanstor-vm as a juju machine
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-machine -m {{ juju_controller_name }}:{{ juju_model_name }} ssh:ubuntu@{{ co_eth0_ip }}"
  register: co_add_machine
  become: false
  changed_when: co_add_machine.rc == 0
  when: not co_already_deployed

- name: Get cinder-volume-oceanstor machine id
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }} --format=json | \
    python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    units = d.get('applications', {}).get('{{ co_app }}', {}).get('units', {})
    if units:
        print(list(units.values())[0]['machine'])
    else:
        machines = d.get('machines', {})
        m_ids = sorted(machines.keys(), key=int)
        print(m_ids[-1] if m_ids else '')
    "
  register: co_machine_id_raw
  become: false
  changed_when: false
  when: not co_already_deployed

- name: Set co_machine_id fact
  ansible.builtin.set_fact:
    co_machine_id: "{{ co_machine_id_raw.stdout }}"
  when: not co_already_deployed

- name: Deploy cinder-volume-oceanstor principal
  ansible.builtin.command:
    cmd: >-
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ juju_model_name }}
      cinder {{ co_app }}
      --series {{ co_series }}
      --to {{ co_machine_id }}
      --channel {{ co_cinder_channel }}
      --config block-device=None
      --bind "internal public=public"
  register: co_deploy_cinder
  become: false
  changed_when: co_deploy_cinder.rc == 0
  failed_when: co_deploy_cinder.rc != 0 and 'already exists' not in co_deploy_cinder.stderr
  when: not co_already_deployed

- name: Deploy cinder-oceanstor subordinate (Huawei driver)
  ansible.builtin.command:
    cmd: >-
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ juju_model_name }}
      {{ co_subordinate_charm }} {{ co_subordinate_app }}
      --series {{ co_series }}
  register: co_deploy_oceanstor
  become: false
  changed_when: co_deploy_oceanstor.rc == 0
  failed_when: co_deploy_oceanstor.rc != 0 and 'already exists' not in co_deploy_oceanstor.stderr
  when: not co_already_deployed

- name: Deploy cinder-volume-oceanstor-mysql-router
  ansible.builtin.command:
    cmd: >-
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ juju_model_name }}
      mysql-router {{ co_mysql_router_app }}
      --series {{ co_series }}
      --revision {{ co_mysql_router_revision }}
      --channel {{ co_mysql_router_channel }}
      --bind "internal"
  register: co_deploy_mysql_router
  become: false
  changed_when: co_deploy_mysql_router.rc == 0
  failed_when: co_deploy_mysql_router.rc != 0 and 'already exists' not in co_deploy_mysql_router.stderr
  when: not co_already_deployed

- name: Add relation mysql-router:db-router → mysql-innodb-cluster:db-router
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_mysql_router_app }}:db-router mysql-innodb-cluster:db-router"
  register: co_rel_db_router
  become: false
  changed_when: co_rel_db_router.rc == 0
  failed_when: co_rel_db_router.rc != 0 and 'already exists' not in co_rel_db_router.stderr
  when: not co_already_deployed

- name: Add relation mysql-router:shared-db → cinder-volume-oceanstor:shared-db
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_mysql_router_app }}:shared-db {{ co_app }}:shared-db"
  register: co_rel_shared_db
  become: false
  changed_when: co_rel_shared_db.rc == 0
  failed_when: co_rel_shared_db.rc != 0 and 'already exists' not in co_rel_shared_db.stderr
  when: not co_already_deployed

- name: Add relation cinder-volume-oceanstor:amqp → rabbitmq-server:amqp
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }}:amqp rabbitmq-server:amqp"
  register: co_rel_amqp
  become: false
  changed_when: co_rel_amqp.rc == 0
  failed_when: co_rel_amqp.rc != 0 and 'already exists' not in co_rel_amqp.stderr
  when: not co_already_deployed

- name: Add relation cinder-volume-oceanstor:identity-service → keystone:identity-service
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name}}:{{ juju_model_name }} {{ co_app }}:identity-service keystone:identity-service"
  register: co_rel_keystone
  become: false
  changed_when: co_rel_keystone.rc == 0
  failed_when: co_rel_keystone.rc != 0 and 'already exists' not in co_rel_keystone.stderr
  when: not co_already_deployed

- name: Add relation cinder-volume-oceanstor:image-service → glance:image-service
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }}:image-service glance:image-service"
  register: co_rel_glance
  become: false
  changed_when: co_rel_glance.rc == 0
  failed_when: co_rel_glance.rc != 0 and 'already exists' not in co_rel_glance.stderr
  when: not co_already_deployed

- name: Add relation cinder-oceanstor:cinder-volume-service → cinder-volume-oceanstor:cinder-volume-service
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_subordinate_app }}:cinder-volume-service {{ co_app }}:cinder-volume-service"
  register: co_rel_subordinate
  become: false
  changed_when: co_rel_subordinate.rc == 0
  failed_when: co_rel_subordinate.rc != 0 and 'already exists' not in co_rel_subordinate.stderr
  when: not co_already_deployed

- name: Configure cinder-volume-oceanstor region
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} config -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }} region={{ co_cinder_region }}"
  register: co_config_region
  become: false
  changed_when: co_config_region.rc == 0
  when: not co_already_deployed

- name: Configure cinder-oceanstor (Huawei backend) credentials and target
  ansible.builtin.command:
    cmd: >-
      {{ juju_openstack_cmd }} config -m {{ juju_controller_name }}:{{ juju_model_name }}
      {{ co_subordinate_app }}
      username={{ co_sim_username }}
      userpassword={{ co_sim_userpassword }}
      resturl={{ co_sim_resturl }}
      storagepool={{ co_sim_storagepool }}
      iscsidefaulttargetip={{ co_sim_iscsi_target_ip }}
      protocol={{ co_sim_protocol }}
      volume-backend-name={{ co_volume_backend_name }}
      enforce-multipath-image-xfer={{ co_enforce_multipath_image_xfer | string | lower }}
      use-multipath-for-image-xfer={{ co_use_multipath_for_image_xfer | string | lower }}
  register: co_config_oceanstor
  become: false
  changed_when: co_config_oceanstor.rc == 0
  when: not co_already_deployed

- name: Wait for cinder-volume-oceanstor to reach active status
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }} --format=json | \
    python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception:
        print('WAITING')
        sys.exit(1)
    status = d.get('applications', {}).get('{{ co_app }}', {}).get('application-status', {}).get('current', '')
    msg = d.get('applications', {}).get('{{ co_app }}', {}).get('application-status', {}).get('message', '')
    if status == 'active':
        print('ACTIVE')
        sys.exit(0)
    print('WAITING: ' + status + (' / ' + msg if msg else ''))
    sys.exit(1)
    "
  register: co_active_check
  become: false
  until: co_active_check.stdout == 'ACTIVE' or ansible_check_mode
  retries: "{{ co_active_wait_retries }}"
  delay: "{{ co_active_wait_delay }}"
  changed_when: false

- name: Capture cinder-volume-oceanstor status for summary
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ juju_model_name }} {{ co_app }} --format=json | \
    python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    print(d['applications']['{{ co_app }}']['application-status']['current'])
    "
  register: co_app_status
  become: false
  changed_when: false

- name: Create cinder volume type {{ co_volume_type }} in RegionOceanstor
  ansible.builtin.shell: |
    bash {{ playbook_dir }}/openstack-wrapper.sh openstack \
      --os-region-name {{ co_cinder_region }} volume type create {{ co_volume_type }} \
      --property volume_backend_name={{ co_volume_backend_name }} || true
  register: co_volume_type_create
  become: false
  changed_when: "'Created' in co_volume_type_create.stdout or 'created' in co_volume_type_create.stdout"

- name: Verify cinder-volume service registered in RegionOceanstor
  ansible.builtin.shell: |
    bash {{ playbook_dir }}/openstack-wrapper.sh openstack --os-region-name {{ co_cinder_region }} \
      volume service list -c Binary -c Host -c State 2>&1 | \
      grep -E 'cinder-volume.*cinder-volume-oceanstor' || echo "NOT_FOUND"
  register: co_volume_service_check
  become: false
  changed_when: false
  failed_when: "'NOT_FOUND' in co_volume_service_check.stdout"

- name: Verify volume type {{ co_volume_type }} exists
  ansible.builtin.shell: |
    bash {{ playbook_dir }}/openstack-wrapper.sh openstack --os-region-name {{ co_cinder_region }} \
      volume type show {{ co_volume_type }} -c name -c properties 2>&1
  register: co_volume_type_check
  become: false
  changed_when: false
  failed_when: co_volume_type_check.rc != 0

- name: Display cinder-oceanstor deployment summary
  ansible.builtin.debug:
    msg: |
      cinder-oceanstor deployment complete.
        App:        {{ co_app }} status={{ co_app_status.stdout }}
        Volume svc: {{ co_volume_service_check.stdout }}
        Volume type: {{ co_volume_type_check.stdout }}

      Next steps (separate opt-in role):
        ansible-playbook -i inventory.yml site.yml --tags openstack-lxd-nova-compute-kvm
