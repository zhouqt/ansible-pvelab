---
- name: Switch to openstack model
  shell: "{{ juju_openstack_cmd }} switch {{ juju_controller_name }}:admin/{{ juju_model_name }}"
  changed_when: false

- name: Create script to add service role to nova and neutron users
  copy:
    content: |
      #!/usr/bin/env python3
      import pymysql

      conn = pymysql.connect(
          host="127.0.0.1",
          user="keystone",
          password="nzKBhZ4P6dygyXMmWYPHR4JC3zBGgKS3",
          database="keystone"
      )
      cursor = conn.cursor()

      cursor.execute("SELECT id FROM domain WHERE name='service_domain'")
      domain_result = cursor.fetchone()
      if not domain_result:
          print("service_domain not found, creating...")
          cursor.execute("INSERT INTO domain (id, name) VALUES ('6226f688213048e38c12e230d14fd971', 'service_domain')")
          conn.commit()
          domain_id = '6226f688213048e38c12e230d14fd971'
      else:
          domain_id = domain_result[0]
      print(f"Service domain ID: {domain_id}")

      cursor.execute("SELECT id FROM role WHERE name='service'")
      role_result = cursor.fetchone()
      if not role_result:
          print("Service role not found!")
      else:
          service_role_id = role_result[0]
          print(f"Service role ID: {service_role_id}")

      cursor.execute("SELECT id FROM project WHERE name='services'")
      project_result = cursor.fetchone()
      if not project_result:
          print("Services project not found!")
      else:
          services_project_id = project_result[0]
          print(f"Services project ID: {services_project_id}")

      cursor.execute("SELECT user_id FROM local_user WHERE name='nova' AND domain_id=%s", (domain_id,))
      nova_result = cursor.fetchone()
      if nova_result:
          nova_user_id = nova_result[0]
          print(f"Nova user ID in service_domain: {nova_user_id}")

          cursor.execute(
              "SELECT * FROM assignment WHERE actor_id=%s AND target_id=%s AND role_id=%s",
              (nova_user_id, services_project_id, service_role_id)
          )
          if cursor.fetchone():
              print("Nova user already has service role in services project")
          else:
              cursor.execute(
                  "INSERT INTO assignment (actor_id, target_id, role_id, inherited) VALUES (%s, %s, %s, 0)",
                  (nova_user_id, services_project_id, service_role_id)
              )
              conn.commit()
              print("Added service role to nova user in services project")
      else:
          print("Nova user not found in service_domain")

      cursor.execute("SELECT user_id FROM local_user WHERE name='neutron' AND domain_id=%s", (domain_id,))
      neutron_result = cursor.fetchone()
      if neutron_result:
          neutron_user_id = neutron_result[0]
          print(f"Neutron user ID in service_domain: {neutron_user_id}")

          cursor.execute(
              "SELECT * FROM assignment WHERE actor_id=%s AND target_id=%s AND role_id=%s",
              (neutron_user_id, services_project_id, service_role_id)
          )
          if cursor.fetchone():
              print("Neutron user already has service role in services project")
          else:
              cursor.execute(
                  "INSERT INTO assignment (actor_id, target_id, role_id, inherited) VALUES (%s, %s, %s, 0)",
                  (neutron_user_id, services_project_id, service_role_id)
              )
              conn.commit()
              print("Added service role to neutron user in services project")
      else:
          print("Neutron user not found in service_domain")

      conn.close()
      print("Done!")
    dest: /tmp/add_service_role.py
    mode: '0755'

- name: Copy script to keystone leader and execute
  shell: |
    {{ juju_openstack_cmd }} scp /tmp/add_service_role.py keystone/leader:/tmp/add_service_role.py
    {{ juju_openstack_cmd }} ssh keystone/leader 'sudo python3 /tmp/add_service_role.py'
  register: add_service_role_result
  changed_when: "'service role' in add_service_role_result.stdout"
  ignore_errors: true

- name: Restart Keystone Apache to clear cached tokens
  shell: "{{ juju_openstack_cmd }} ssh keystone/leader 'sudo systemctl restart apache2'"
  changed_when: true

- name: Disable service_token_roles_required in Neutron
  shell: |
    {{ juju_openstack_cmd }} ssh neutron-api/leader 'sudo sed -i "s/service_token_roles_required = True/service_token_roles_required = False/g" /etc/neutron/neutron.conf'
    {{ juju_openstack_cmd }} ssh neutron-api/leader 'sudo systemctl restart neutron-server'
  changed_when: true
  ignore_errors: true

- name: Wait for Neutron to stabilize
  shell: sleep 10
  changed_when: false

- name: Fix service_token_roles in Nova cloud controller
  shell: |
    {{ juju_openstack_cmd }} ssh nova-cloud-controller/leader 'sudo sed -i "s/service_token_roles = Admin/service_token_roles = service/g" /etc/nova/nova.conf'
    {{ juju_openstack_cmd }} ssh nova-cloud-controller/leader 'sudo systemctl restart apache2'
  changed_when: true
  ignore_errors: true

- name: Fix service_token_roles in Neutron
  shell: |
    {{ juju_openstack_cmd }} ssh neutron-api/leader 'sudo sed -i "s/service_token_roles = Admin/service_token_roles = service/g" /etc/neutron/neutron.conf'
    {{ juju_openstack_cmd }} ssh neutron-api/leader 'sudo systemctl restart neutron-server'
  changed_when: true
  ignore_errors: true

- name: Fix service_token_roles in all Nova compute units
  shell: |
    for unit in $({{ juju_openstack_cmd }} status nova-compute --format json 2>/dev/null | jq -r '.applications.nova-compute.units | keys[]'); do
      echo "Fixing $unit"
      {{ juju_openstack_cmd }} ssh $unit 'sudo sed -i "s/service_token_roles = Admin/service_token_roles = service/g" /etc/nova/nova.conf 2>/dev/null' || true
      {{ juju_openstack_cmd }} ssh $unit 'sudo systemctl restart nova-compute 2>/dev/null' || true
    done
  changed_when: true
  ignore_errors: true

- name: Restart neutron-ovn-metadata-agent on all OVN chassis
  shell: |
    for unit in $({{ juju_openstack_cmd }} status ovn-chassis --format json 2>/dev/null | jq -r '.applications.ovn-chassis.units | keys[]'); do
      echo "Restarting neutron-ovn-metadata-agent on $unit"
      {{ juju_openstack_cmd }} ssh $unit 'sudo systemctl restart neutron-ovn-metadata-agent' 2>/dev/null || true
    done
  changed_when: true
  ignore_errors: true

- name: Wait for services to stabilize
  shell: sleep 15
  changed_when: false

- name: Test OpenStack server list
  shell: bash -c 'source {{ project_dir }}/credentials/admin-openrc.sh && openstack server list'
  register: test_server_list
  until: test_server_list.rc == 0
  retries: 5
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Display test result
  debug:
    msg: "Nova-Neutron authentication test: {{ test_server_list.rc == 0 ? 'SUCCESS' : 'FAILED - ' + test_server_list.stdout }}"

