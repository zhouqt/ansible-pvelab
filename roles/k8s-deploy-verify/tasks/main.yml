---
- name: Create .kube directory
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0700'

- name: Get kubeconfig from kubernetes-control-plane leader
  shell: "{{ juju_k8s_cmd }} ssh kubernetes-control-plane/leader -- cat /home/ubuntu/config"
  register: kubeconfig
  changed_when: false
  ignore_errors: true

- name: Save kubeconfig
  copy:
    content: "{{ kubeconfig.stdout }}"
    dest: "{{ ansible_env.HOME }}/.kube/config"
    mode: '0600'
  when: kubeconfig.rc == 0

- name: Install kubectl if not present
  shell: which kubectl || sudo snap install kubectl --classic
  changed_when: false
  ignore_errors: true

- name: Verify kubectl access - get nodes
  shell: kubectl get nodes -o wide
  register: kubectl_nodes
  changed_when: false
  ignore_errors: true

- name: Verify system pods
  shell: kubectl get pods -A
  register: kubectl_pods
  changed_when: false
  ignore_errors: true

- name: Delete existing test pod if present
  shell: kubectl delete pod test-nginx --ignore-not-found=true
  changed_when: false
  ignore_errors: true

- name: Deploy test nginx pod
  shell: kubectl run test-nginx --image={{ k8s_test_image }} --port=80
  register: test_deploy
  changed_when: test_deploy.rc == 0
  ignore_errors: true

- name: Wait for test pod to be Running (up to 5 min)
  shell: kubectl get pod test-nginx -o jsonpath='{.status.phase}'
  register: test_pod_status
  until: test_pod_status.stdout == "Running"
  retries: 30
  delay: 10
  changed_when: false
  ignore_errors: true

- name: Verify test pod is serving traffic
  shell: kubectl exec test-nginx -- curl -s localhost 2>&1 | head -3
  register: test_pod_verify
  changed_when: false
  ignore_errors: true

- name: Clean up test pod
  shell: kubectl delete pod test-nginx --ignore-not-found=true
  changed_when: false

- name: Display Charmed K8s summary
  debug:
    msg: |
      ========================================
      Charmed Kubernetes on OpenStack
      ========================================

      Controller: {{ juju_controller_name }}
      Cloud: {{ openstack_cloud_name }}
      Model: {{ k8s_model_name }}
      Channel: {{ k8s_channel }}
      Calico CIDR: {{ calico_cidr }}

      Nodes:
      {{ kubectl_nodes.stdout | default('Unable to get nodes') }}

      Test pod ({{ k8s_test_image }}): {{ 'PASSED' if test_pod_status.stdout | default('') == 'Running' else 'FAILED' }}
      {{ test_pod_verify.stdout | default('') }}

      LoadBalancer: {{ 'Enabled (Octavia)' if k8s_lb_enabled | default(false) else 'Disabled (use NodePort or Ingress)' }}

