---
- name: Check if external network exists
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack network show {{ external_network_name }} -f value -c id 2>/dev/null'
  register: ext_net_check
  changed_when: false
  ignore_errors: true

- name: Create external network
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack network create {{ external_network_name }} --external --provider-network-type flat --provider-physical-network physnet1'
  when: ext_net_check.rc != 0

- name: Check if external subnet exists
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack subnet show {{ external_subnet_name }} -f value -c id 2>/dev/null'
  register: ext_subnet_check
  changed_when: false
  ignore_errors: true

- name: Create external subnet
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack subnet create {{ external_subnet_name }} --network {{ external_network_name }} --subnet-range {{ external_cidr }} --gateway {{ external_gateway }} --allocation-pool start={{ external_allocation_pool_start }},end={{ external_allocation_pool_end }} --no-dhcp'
  when: ext_subnet_check.rc != 0

- name: Check if internal network exists
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack network show {{ internal_network_name }} -f value -c id 2>/dev/null'
  register: int_net_check
  changed_when: false
  ignore_errors: true

- name: Create internal network
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack network create {{ internal_network_name }}'
  when: int_net_check.rc != 0

- name: Check if internal subnet exists
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack subnet show {{ internal_subnet_name }} -f value -c id 2>/dev/null'
  register: int_subnet_check
  changed_when: false
  ignore_errors: true

- name: Create internal subnet
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack subnet create {{ internal_subnet_name }} --network {{ internal_network_name }} --subnet-range {{ internal_cidr }} --gateway {{ internal_gateway }} --dns-nameserver 8.8.8.8 --dns-nameserver 8.8.4.4'
  when: int_subnet_check.rc != 0

- name: Check if router exists
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack router show router1 -f value -c id 2>/dev/null'
  register: router_check
  changed_when: false
  ignore_errors: true

- name: Create router
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack router create router1'
  when: router_check.rc != 0

- name: Set router gateway
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack router set router1 --external-gateway {{ external_network_name }}'
  ignore_errors: true

- name: Add router interface
  shell: bash -c 'source {{ openstack_rc_file }} >/dev/null 2>&1 && openstack router add subnet router1 {{ internal_subnet_name }}'
  ignore_errors: true
