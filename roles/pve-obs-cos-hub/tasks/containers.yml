---

- name: Read the Juju client public key from CT {{ pve_obs_cos_hub_juju_client_vmid }}
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_cos_hub_juju_client_user }}"
      - -c
      - "cat ~/.ssh/id_ed25519.pub"
  register: pve_obs_cos_hub_client_pubkey
  changed_when: false

- name: Validate the Juju client public key
  ansible.builtin.assert:
    that:
      - pve_obs_cos_hub_client_pubkey.stdout is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( .*)?$')
    fail_msg: >-
      the ubuntu user on CT {{ pve_obs_cos_hub_juju_client_vmid }} has no usable ed25519 public key;
      initialise that CT the way the reference environment does (--tags pve-env1-juju-ctrl).

- name: Create the missing hub CTs
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - create
      - "{{ item.item.vmid }}"
      - "{{ pve_obs_cos_hub_templates[item.item.series] }}"
      - --hostname
      - "{{ item.item.name }}"
      - --ostype
      - ubuntu
      - --cores
      - "{{ item.item.cores }}"
      - --memory
      - "{{ item.item.memory }}"
      - --swap
      - "0"
      - --rootfs
      - "{{ pve_common_storage }}:{{ item.item.disk }}"
      - --unprivileged
      - "0"
      - --features
      - nesting=1,fuse=1,keyctl=1
      - --net0
      - >-
        name=eth0,bridge={{ pve_obs_cos_hub_bridge }},ip={{ item.item.ip }}/24,gw={{ pve_obs_cos_hub_gateway }}
      - --nameserver
      - "{{ pve_obs_cos_hub_nameserver }}"
      - --onboot
      - "1"
      - --tags
      - obs-hub
      - --start
      - "0"
  loop: "{{ pve_obs_cos_hub_ct_exists.results }}"
  loop_control:
    label: "CT {{ item.item.vmid }} {{ item.item.name }}"
  when: item.rc != 0

- name: Read the configuration of every hub CT
  ansible.builtin.command: "{{ pve_obs_cos_hub_pct_bin }} config {{ item.vmid }}"
  loop: "{{ pve_obs_cos_hub_active_cts }}"
  loop_control:
    label: "CT {{ item.vmid }} {{ item.name }}"
  register: pve_obs_cos_hub_ct_config
  changed_when: false

- name: Require each hub CT to match its declared identity and static NIC
  ansible.builtin.assert:
    that:
      - "'hostname: ' ~ item.item.name in item.stdout"
      - "item.stdout is search('(?m)^net0: .*bridge=' ~ pve_obs_cos_hub_bridge ~ '(?:,|$)')"
      - "item.stdout is search('(?m)^net0: .*ip=' ~ (pve_obs_cos_hub_prefix | regex_replace('\\.', '[.]')) ~ '[.]' ~ item.item.ip.split('.')[-1] ~ '/24')"
      - "item.stdout is search('(?m)^net0: .*gw=' ~ (pve_obs_cos_hub_gateway | regex_replace('\\.', '[.]')) ~ '(?:,|$)')"
      - "'ip=dhcp' not in item.stdout"
      - "item.stdout is search('(?m)^unprivileged:\\s*0\\s*$') or item.stdout is not search('(?m)^unprivileged:')"
    fail_msg: >-
      the hostname/static NICs/privileged flag of CT {{ item.item.vmid }} do not match the inventory; refusing to rewrite
      (change the vmid, or destroy that CT by hand first).
  loop: "{{ pve_obs_cos_hub_ct_config.results }}"
  loop_control:
    label: "CT {{ item.item.vmid }}"

- name: Ensure an empty lxc.cap.drop line in every hub CT
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "lxc.cap.drop:"
    regexp: "^lxc\\.cap\\.drop:"
    insertbefore: '^\['
  loop: "{{ pve_obs_cos_hub_active_cts }}"
  loop_control:
    label: "CT {{ item.vmid }}"

- name: Check the runtime state of every hub CT
  ansible.builtin.command: "{{ pve_obs_cos_hub_pct_bin }} status {{ item.vmid }}"
  loop: "{{ pve_obs_cos_hub_active_cts }}"
  loop_control:
    label: "CT {{ item.vmid }}"
  register: pve_obs_cos_hub_ct_runtime
  changed_when: false

- name: Start the stopped hub CTs
  ansible.builtin.command: "{{ pve_obs_cos_hub_pct_bin }} start {{ item.item.vmid }}"
  loop: "{{ pve_obs_cos_hub_ct_runtime.results }}"
  loop_control:
    label: "CT {{ item.item.vmid }}"
  when: "'status: stopped' in item.stdout"

- name: Split the hub CTs into snap users and snap-less ones
  ansible.builtin.set_fact:
    pve_obs_cos_hub_snap_cts: >-
      {{ pve_obs_cos_hub_active_cts | rejectattr('snap', 'defined') | list
         + (pve_obs_cos_hub_active_cts | selectattr('snap', 'defined') | selectattr('snap') | list) }}
    pve_obs_cos_hub_nosnap_cts: >-
      {{ pve_obs_cos_hub_active_cts | selectattr('snap', 'defined') | rejectattr('snap') | list }}

- name: Disable snapd seeding on the CTs that do not use snaps
  ansible.builtin.shell: |
    set -euo pipefail
    for vmid in {{ pve_obs_cos_hub_nosnap_cts | map(attribute='vmid') | join(' ') }}; do
      if {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- systemctl is-enabled snapd.seeded.service >/dev/null 2>&1; then
        {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- systemctl disable snapd.seeded.service >/dev/null
        {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- systemctl stop snapd.seeded.service >/dev/null 2>&1 || true
        echo "SNAPD-SEED-DISABLED $vmid"
      else
        echo "SNAPD-SEED-ALREADY-DISABLED $vmid"
      fi
    done
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_nosnap_seed
  changed_when: "'SNAPD-SEED-DISABLED' in pve_obs_cos_hub_nosnap_seed.stdout"

- name: Wait for systemd in every hub CT
  ansible.builtin.command: "{{ pve_obs_cos_hub_pct_bin }} exec {{ item.vmid }} -- systemctl is-system-running"
  loop: "{{ pve_obs_cos_hub_active_cts }}"
  loop_control:
    label: "CT {{ item.vmid }}"
  register: pve_obs_cos_hub_ct_systemd
  until: pve_obs_cos_hub_ct_systemd.stdout | trim in ['running', 'degraded']
  failed_when: pve_obs_cos_hub_ct_systemd.stdout | trim not in ['running', 'degraded']
  retries: 30
  delay: 5
  changed_when: false

- name: Push the CT init script to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/pve/scripts/juju-ct-init.sh"
    dest: /root/obs-hub-ct-init.sh
    owner: root
    group: root
    mode: "0700"

- name: Initialize the hub CTs (ubuntu user, NOPASSWD sudo, client key)
  ansible.builtin.shell: |
    set -euo pipefail
    for vmid in {{ pve_obs_cos_hub_active_cts | map(attribute='vmid') | join(' ') }}; do
      {{ pve_obs_cos_hub_pct_bin }} push "$vmid" /root/obs-hub-ct-init.sh /root/juju-ct-init.sh --perms 0700
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- env JUJU_CLIENT_PUBKEY='{{ pve_obs_cos_hub_client_pubkey.stdout | trim }}' \
        bash /root/juju-ct-init.sh
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- rm -f /root/juju-ct-init.sh
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Push the APT-mirror helper to the PVE host
  ansible.builtin.copy:
    src: "{{ repo_root }}/pve/scripts/yoga-apt-mirror.sh"
    dest: /root/obs-hub-apt-mirror.sh
    owner: root
    group: root
    mode: "0700"
  when: pve_openstack_apt_mirror | length > 0

- name: Point the hub CTs at the APT mirror
  ansible.builtin.shell: |
    set -euo pipefail
    for vmid in {{ pve_obs_cos_hub_active_cts | map(attribute='vmid') | join(' ') }}; do
      {{ pve_obs_cos_hub_pct_bin }} push "$vmid" /root/obs-hub-apt-mirror.sh /root/apt-mirror.sh --perms 0700
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- bash /root/apt-mirror.sh '{{ pve_openstack_apt_mirror }}'
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- rm -f /root/apt-mirror.sh
    done
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_ct_apt_mirror
  changed_when: "'changed=1' in pve_obs_cos_hub_ct_apt_mirror.stdout"
  when: pve_openstack_apt_mirror | length > 0

- name: Install snapd and openssh-server in every hub CT that uses snaps
  ansible.builtin.shell: |
    set -euo pipefail
    for vmid in {{ pve_obs_cos_hub_snap_cts | map(attribute='vmid') | join(' ') }}; do
      if {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- sh -c 'command -v snap' >/dev/null 2>&1; then
        echo "SNAPD-PRESENT $vmid"
        continue
      fi
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- env DEBIAN_FRONTEND=noninteractive apt-get update -qq
      {{ pve_obs_cos_hub_pct_bin }} exec "$vmid" -- env DEBIAN_FRONTEND=noninteractive \
        apt-get install -y -qq snapd openssh-server >/dev/null
      echo "SNAPD-INSTALLED $vmid"
    done
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_ct_snapd
  changed_when: "'SNAPD-INSTALLED' in pve_obs_cos_hub_ct_snapd.stdout"

- name: Require snapd to answer in every hub CT that uses snaps
  ansible.builtin.command: "{{ pve_obs_cos_hub_pct_bin }} exec {{ item.vmid }} -- snap version"
  loop: "{{ pve_obs_cos_hub_snap_cts }}"
  loop_control:
    label: "CT {{ item.vmid }}"
  register: pve_obs_cos_hub_ct_snap_version
  until: pve_obs_cos_hub_ct_snap_version.rc == 0
  failed_when: pve_obs_cos_hub_ct_snap_version.rc != 0
  retries: 30
  delay: 5
  changed_when: false

- name: Report the hub container inventory
  ansible.builtin.debug:
    msg: >-
      hub CTs: {% for ct in pve_obs_cos_hub_active_cts %}{{ ct.vmid }}({{ ct.name }}, {{ ct.ip }}, {{ ct.series }}){% if not loop.last %}, {% endif %}{% endfor %}
