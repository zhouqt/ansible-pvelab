---

- name: Expose /dev/kmsg to the k8s node container
  ansible.builtin.shell: |
    set -euo pipefail
    conf=$({{ pve_obs_cos_hub_pct_bin }} config {{ pve_obs_cos_hub_k8s_vmid }})
    if grep -qE '^dev[0-9]+: /dev/kmsg(,|$)' <<<"$conf"; then
      echo "DEV-KMSG-PRESENT"
      exit 0
    fi
    idx=0
    while grep -qE "^dev${idx}:" <<<"$conf"; do idx=$((idx + 1)); done
    {{ pve_obs_cos_hub_pct_bin }} set {{ pve_obs_cos_hub_k8s_vmid }} \
      --dev${idx} /dev/kmsg,mode=0644,deny-write=1
    echo "DEV-KMSG-ADDED dev${idx}"
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_kmsg
  changed_when: "'DEV-KMSG-ADDED' in pve_obs_cos_hub_kmsg.stdout"

- name: Require /dev/kmsg inside the k8s node container
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - test
      - -e
      - /dev/kmsg
  register: pve_obs_cos_hub_kmsg_check
  until: pve_obs_cos_hub_kmsg_check.rc == 0
  failed_when: pve_obs_cos_hub_kmsg_check.rc != 0
  retries: 30
  delay: 3
  changed_when: false

- name: Load the kernel modules the k8s snap needs on the PVE host
  ansible.builtin.command: "{{ pve_obs_cos_hub_modprobe_bin }} {{ item }}"
  loop: "{{ pve_obs_cos_hub_kernel_modules }}"
  loop_control:
    label: "{{ item }}"
  register: pve_obs_cos_hub_modprobe
  changed_when: false

- name: Persist the kernel modules across host reboots
  ansible.builtin.copy:
    content: "{{ pve_obs_cos_hub_kernel_modules | join('\n') }}\n"
    dest: /etc/modules-load.d/pve-obs-hub-k8s.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply the k8s node sysctls inside CT {{ pve_obs_cos_hub_k8s_vmid }}
  ansible.builtin.shell: |
    set -euo pipefail
    cat > /etc/sysctl.d/99-obs-hub-k8s.conf <<'EOF'
    {% for key, value in pve_obs_cos_hub_k8s_sysctls.items() %}
    {{ key }} = {{ value }}
    {% endfor %}
    EOF
    sysctl --system >/dev/null
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_k8s_sysctl
  changed_when: false

- name: Install the Canonical Kubernetes snap
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - snap
      - install
      - k8s
      - --classic
      - "--channel={{ pve_obs_cos_hub_k8s_channel }}"
  register: pve_obs_cos_hub_k8s_snap_install
  changed_when: "'installed' in pve_obs_cos_hub_k8s_snap_install.stdout"
  failed_when: >-
    pve_obs_cos_hub_k8s_snap_install.rc != 0
    and 'already installed' not in pve_obs_cos_hub_k8s_snap_install.stdout

- name: Require the k8s binary to be on disk
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - test
      - -x
      - "{{ pve_obs_cos_hub_k8s_bin }}"
  register: pve_obs_cos_hub_k8s_bin_check
  until: pve_obs_cos_hub_k8s_bin_check.rc == 0
  failed_when: pve_obs_cos_hub_k8s_bin_check.rc != 0
  retries: 30
  delay: 5
  changed_when: false

- name: Clear a start-limit-hit on the kubelet service
  ansible.builtin.shell: |
    set -uo pipefail
    unit=snap.k8s.kubelet
    run() { {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- "$@"; }
    if run systemctl is-active --quiet "$unit"; then
      echo "KUBELET-ACTIVE"
      exit 0
    fi
    if run systemctl is-failed --quiet "$unit"; then
      run systemctl reset-failed "$unit"
      run systemctl start "$unit" || true
      echo "KUBELET-RESTARTED"
      exit 0
    fi
    echo "KUBELET-NOT-RUNNING-YET"
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_kubelet
  changed_when: "'KUBELET-RESTARTED' in pve_obs_cos_hub_kubelet.stdout"

- name: Check whether the cluster is already bootstrapped
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - status
  register: pve_obs_cos_hub_k8s_status_before
  changed_when: false
  failed_when: false

- name: Bootstrap the single-node cluster
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - bootstrap
  register: pve_obs_cos_hub_k8s_bootstrap
  when: >-
    pve_obs_cos_hub_k8s_status_before.rc != 0
    or 'not bootstrapped' in pve_obs_cos_hub_k8s_status_before.stdout
    or 'not bootstrapped' in pve_obs_cos_hub_k8s_status_before.stderr

- name: Wait for the node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - wait
      - --for=condition=Ready
      - node
      - --all
      - --timeout=900s
  register: pve_obs_cos_hub_k8s_node_ready
  until: pve_obs_cos_hub_k8s_node_ready.rc == 0
  failed_when: pve_obs_cos_hub_k8s_node_ready.rc != 0
  retries: 30
  delay: 20
  changed_when: false

- name: Render the containerd proxy drop-in
  when: pve_obs_cos_hub_http_proxy | length > 0
  ansible.builtin.copy:
    dest: /root/pve-obs-hub-containerd-proxy.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment=HTTP_PROXY={{ pve_obs_cos_hub_http_proxy }}
      Environment=HTTPS_PROXY={{ pve_obs_cos_hub_http_proxy }}
      Environment=NO_PROXY=localhost,127.0.0.1,192.168.0.0/16,10.0.0.0/8,registry.jujucharms.com,ghcr.io

- name: Apply the containerd proxy drop-in inside CT {{ pve_obs_cos_hub_k8s_vmid }}
  when: pve_obs_cos_hub_http_proxy | length > 0
  ansible.builtin.command:
    argv:
      - "{{ repo_root }}/scripts/obs/ct-containerd-proxy.sh"
      - --vmid
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --dropin
      - /root/pve-obs-hub-containerd-proxy.conf
      - --pct
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - --apply
  register: pve_obs_cos_hub_containerd_proxy
  changed_when: "'CHANGED:containerd' in pve_obs_cos_hub_containerd_proxy.stdout"

- name: Stage the local-path provisioner manifest on the PVE host
  ansible.builtin.copy:
    src: local-path-storage.yaml
    dest: /root/pve-obs-hub-local-path.yaml
    owner: root
    group: root
    mode: "0644"

- name: Push the local-path provisioner manifest into CT {{ pve_obs_cos_hub_k8s_vmid }}
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - push
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - /root/pve-obs-hub-local-path.yaml
      - /root/pve-obs-hub-local-path.yaml
      - --perms
      - "0644"
  changed_when: false

- name: Install the local-path provisioner
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - apply
      - -f
      - /root/pve-obs-hub-local-path.yaml
  register: pve_obs_cos_hub_local_path_apply
  changed_when: "'unchanged' not in pve_obs_cos_hub_local_path_apply.stdout"

- name: Wait for the local-path provisioner to become available
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - -n
      - local-path-storage
      - rollout
      - status
      - deployment/local-path-provisioner
      - --timeout=300s
  register: pve_obs_cos_hub_local_path_rollout
  until: pve_obs_cos_hub_local_path_rollout.rc == 0
  failed_when: pve_obs_cos_hub_local_path_rollout.rc != 0
  retries: 12
  delay: 15
  changed_when: false

- name: Require the local-storage StorageClass to exist
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - get
      - sc
      - "{{ pve_obs_cos_hub_storage_class }}"
  register: pve_obs_cos_hub_sc
  until: pve_obs_cos_hub_sc.rc == 0
  failed_when: pve_obs_cos_hub_sc.rc != 0
  retries: 30
  delay: 10
  changed_when: false

- name: Require the StorageClass to be the cluster default
  ansible.builtin.shell: |
    set -euo pipefail
    {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} kubectl get sc \
      -o jsonpath='{range .items[*]}{.metadata.name}={.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}{"\n"}{end}'
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_sc_default
  changed_when: false

- name: Patch the StorageClass to be default when it is not
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - patch
      - sc
      - "{{ pve_obs_cos_hub_storage_class }}"
      - -p
      - '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  when: >-
    (pve_obs_cos_hub_storage_class ~ '=true') not in pve_obs_cos_hub_sc_default.stdout

- name: Drop the default annotation from any other StorageClass
  ansible.builtin.shell: |
    set -euo pipefail
    run() { {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} "$@"; }
    others=$(run kubectl get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{"\n"}{end}' \
      | grep -v -x '{{ pve_obs_cos_hub_storage_class }}' || true)
    for sc in $others; do
      run kubectl patch sc "$sc" --type merge \
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' >/dev/null
      echo "UNSET-DEFAULT $sc"
    done
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_sc_unset
  changed_when: "'UNSET-DEFAULT' in pve_obs_cos_hub_sc_unset.stdout"

- name: Enable the load-balancer addon (MetalLB) on the k8s node
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - enable
      - load-balancer
  register: pve_obs_cos_hub_lb_enable
  changed_when: false

- name: Require the MetalLB memberlist secret
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.shell: |
    set -euo pipefail
    run() { {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} "$@"; }
    for _ in $(seq 1 30); do
      if run kubectl -n metallb-system get secret metallb-memberlist >/dev/null 2>&1; then
        echo "SECRET-PRESENT"; exit 0
      fi
      if run kubectl -n metallb-system get ns metallb-system >/dev/null 2>&1; then break; fi
      sleep 5
    done
    run kubectl -n metallb-system create secret generic metallb-memberlist \
      --from-literal=secretkey="$(openssl rand -base64 128)" >/dev/null
    echo "SECRET-CREATED"
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_memberlist
  changed_when: "'SECRET-CREATED' in pve_obs_cos_hub_memberlist.stdout"

- name: Stage the MetalLB pool manifest on the PVE host
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /root/pve-obs-hub-metallb-pool.yaml
    owner: root
    group: root
    mode: "0644"

- name: Push the MetalLB pool manifest into CT {{ pve_obs_cos_hub_k8s_vmid }}
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - push
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - /root/pve-obs-hub-metallb-pool.yaml
      - /root/pve-obs-hub-metallb-pool.yaml
      - --perms
      - "0644"
  changed_when: false

- name: Apply the MetalLB pool
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - apply
      - -f
      - /root/pve-obs-hub-metallb-pool.yaml
  register: pve_obs_cos_hub_lb_pool
  until: pve_obs_cos_hub_lb_pool.rc == 0
  failed_when: pve_obs_cos_hub_lb_pool.rc != 0
  retries: 20
  delay: 10
  changed_when: "'unchanged' not in pve_obs_cos_hub_lb_pool.stdout"

- name: Wait for the MetalLB controller and speaker to become available
  when: pve_obs_cos_hub_lb_enabled | bool
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_cos_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_cos_hub_k8s_vmid }}"
      - --
      - "{{ pve_obs_cos_hub_k8s_bin }}"
      - kubectl
      - -n
      - metallb-system
      - rollout
      - status
      - "{{ item }}"
      - --timeout=600s
  loop:
    - deployment/metallb-controller
    - daemonset/metallb-speaker
  loop_control:
    label: "{{ item }}"
  register: pve_obs_cos_hub_lb_rollout
  until: pve_obs_cos_hub_lb_rollout.rc == 0
  failed_when: pve_obs_cos_hub_lb_rollout.rc != 0
  retries: 10
  delay: 20
  changed_when: false

- name: Report the k8s node version and StorageClass
  ansible.builtin.shell: |
    set -euo pipefail
    {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} version 2>/dev/null || true
    {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} kubectl get nodes -o wide
    {{ pve_obs_cos_hub_pct_bin }} exec {{ pve_obs_cos_hub_k8s_vmid }} -- {{ pve_obs_cos_hub_k8s_bin }} kubectl get sc
  args:
    executable: /bin/bash
  register: pve_obs_cos_hub_k8s_report
  changed_when: false

- name: Show the k8s node inventory
  ansible.builtin.debug:
    msg: "{{ pve_obs_cos_hub_k8s_report.stdout_lines }}"
