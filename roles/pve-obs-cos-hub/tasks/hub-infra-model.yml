---

- name: "{{ obs_model }} — compute the model reference"
  ansible.builtin.set_fact:
    obs_model_ref: "{{ pve_obs_hub_cos_controller }}:admin/{{ obs_model }}"

- name: "{{ obs_model }} — read the models of the hub controller"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - "{{ pve_obs_hub_juju_cmd }} models --controller {{ pve_obs_hub_cos_controller }} --format json"
  register: obs_models
  changed_when: false

- name: "{{ obs_model }} — create the model when it does not exist"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} add-model --controller {{ pve_obs_hub_cos_controller }}
        {{ obs_model }} {{ pve_obs_hub_manual_cloud }} --config enable-os-upgrade=false
  when: >-
    (((obs_models.stdout | from_json).models | default([], true))
     | selectattr('short-name', 'equalto', obs_model) | list | length) == 0

- name: "{{ obs_model }} — point the model at the lab HTTP proxy"
  when: pve_obs_hub_http_proxy | length > 0
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} model-config -m {{ obs_model_ref }}
        http-proxy={{ pve_obs_hub_http_proxy }} https-proxy={{ pve_obs_hub_http_proxy }}
        no-proxy={{ pve_obs_hub_no_proxy }}
  register: obs_model_proxy
  changed_when: false

- name: "{{ obs_model }} — seed known_hosts for {{ obs_add_machine_ip }}"
  ansible.builtin.shell: |
    set -euo pipefail
    ip={{ obs_add_machine_ip }}
    keyscan=$(ssh-keyscan -T 5 -H "$ip" 2>/dev/null)
    [[ -n "$keyscan" ]] || { echo "SSH did not become available on $ip" >&2; exit 1; }
    printf '%s\n' "$keyscan" | {{ pve_obs_hub_pct_bin }} exec {{ pve_obs_hub_juju_client_vmid }} -- \
      su - {{ pve_obs_hub_juju_client_user }} -c \
      "install -d -m 0700 ~/.ssh; touch ~/.ssh/known_hosts; \
       ssh-keygen -R \"$ip\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
       ssh-keygen -R \"[$ip]:22\" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true; \
       cat >> ~/.ssh/known_hosts"
  args:
    executable: /bin/bash
  changed_when: false
  when: obs_add_machine_ip | length > 0

- name: "{{ obs_model }} — read the model status"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - "{{ pve_obs_hub_juju_cmd }} status -m {{ obs_model_ref }} --format json"
  register: obs_status
  changed_when: false
  failed_when: false

- name: "{{ obs_model }} — register {{ obs_add_machine_ip }} as a machine"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} add-machine ssh:ubuntu@{{ obs_add_machine_ip }}
        -m {{ obs_model_ref }}
  when:
    - obs_add_machine_ip | length > 0
    - obs_add_machine_ip not in obs_status.stdout

- name: "{{ obs_model }} — wait for the machine to report its address"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - "{{ pve_obs_hub_juju_cmd }} status -m {{ obs_model_ref }} --format json"
  register: obs_status_after
  changed_when: false
  until: obs_add_machine_ip in obs_status_after.stdout
  retries: 60
  delay: 10
  when: obs_add_machine_ip | length > 0

- name: "{{ obs_model }} — find the machine carrying {{ obs_add_machine_ip }}"
  ansible.builtin.set_fact:
    obs_machine_matches: >-
      {{ ((obs_status_after.stdout | default(obs_status.stdout, true) | from_json).machines
          | default({}, true) | dict2items
          | selectattr('value.ip-addresses', 'defined')
          | selectattr('value.ip-addresses', 'contains', obs_add_machine_ip) | list) }}

- name: "{{ obs_model }} — pick the machine spec for cos-proxy"
  ansible.builtin.set_fact:
    obs_machine_spec: >-
      {{ obs_deploy_to if obs_deploy_to | length > 0
         else (obs_machine_matches[0].key | default('')) }}

- name: "{{ obs_model }} — require a machine to deploy cos-proxy onto"
  ansible.builtin.assert:
    that: obs_machine_spec | length > 0
    fail_msg: >-
      cannot find the machine to deploy cos-proxy on in {{ obs_model }} (target IP {{ obs_add_machine_ip }}).
      principal charms on a manual cloud must pass --to explicitly.

- name: "{{ obs_model }} — deploy cos-proxy"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} deploy cos-proxy -m {{ obs_model_ref }}
        --channel {{ pve_obs_hub_cos_proxy_channel }} --series jammy
        --to {{ obs_machine_spec }}
  register: obs_deploy_cos_proxy
  failed_when: >-
    obs_deploy_cos_proxy.rc != 0
    and 'already exists' not in (obs_deploy_cos_proxy.stderr | default(''))
  changed_when: obs_deploy_cos_proxy.rc == 0

- name: "{{ obs_model }} — deploy nrpe (subordinate)"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} deploy nrpe -m {{ obs_model_ref }}
        --channel {{ pve_obs_hub_nrpe_channel }} --series jammy
  register: obs_deploy_nrpe
  failed_when: >-
    obs_deploy_nrpe.rc != 0
    and 'already exists' not in (obs_deploy_nrpe.stderr | default(''))
  changed_when: obs_deploy_nrpe.rc == 0

- name: "{{ obs_model }} — deploy grafana-agent (subordinate)"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - >-
        {{ pve_obs_hub_juju_cmd }} deploy grafana-agent -m {{ obs_model_ref }}
        --channel {{ pve_obs_hub_grafana_agent_channel }} --series jammy
  register: obs_deploy_agent
  failed_when: >-
    obs_deploy_agent.rc != 0
    and 'already exists' not in (obs_deploy_agent.stderr | default(''))
  changed_when: obs_deploy_agent.rc == 0

- name: "{{ obs_model }} — consume the COS offers and relate the charms"
  ansible.builtin.shell: |
    set -uo pipefail
    juju() {
      {{ pve_obs_hub_pct_bin }} exec {{ pve_obs_hub_juju_client_vmid }} -- \
        su - {{ pve_obs_hub_juju_client_user }} -c \
        "{{ pve_obs_hub_juju_cmd }} $* -m {{ obs_model_ref }}"
    }
    rc=0
    run() {
      out=$(juju "$@" 2>&1)
      echo "juju $*: $out"
      if grep -qi 'error' <<<"$out" && ! grep -qi 'already' <<<"$out"; then
        rc=1
      fi
    }
    for offer in {{ pve_obs_hub_infra_consumes | join(' ') }}; do
      run consume {{ pve_obs_hub_cos_controller }}:admin/{{ pve_obs_hub_cos_model }}."$offer"
    done
    {% for relation in pve_obs_hub_infra_relations %}
    run relate {{ relation }}
    {% endfor %}
    exit "$rc"
  args:
    executable: /bin/bash
  register: obs_wiring
  changed_when: "'already' not in obs_wiring.stdout"

- name: "{{ obs_model }} — wait for cos-proxy"
  when: not (pve_obs_hub_skip_wait | bool)
  ansible.builtin.include_tasks: wait-model-active.yml
  vars:
    obs_wait_model_ref: "{{ obs_model_ref }}"
    obs_wait_apps: [cos-proxy]
    obs_wait_label: "{{ obs_model }} cos-proxy"

- name: "{{ obs_model }} — read the final status"
  ansible.builtin.command:
    argv:
      - "{{ pve_obs_hub_pct_bin }}"
      - exec
      - "{{ pve_obs_hub_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_obs_hub_juju_client_user }}"
      - -c
      - "{{ pve_obs_hub_juju_cmd }} status -m {{ obs_model_ref }}"
  register: obs_status_final
  changed_when: false

- name: "{{ obs_model }} — show the monitoring stack"
  ansible.builtin.debug:
    msg: "{{ obs_status_final.stdout_lines }}"
