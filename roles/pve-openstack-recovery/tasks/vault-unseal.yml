---

- name: Define the isolated Juju 3.x command prefix
  ansible.builtin.set_fact:
    pve_openstack_juju_cmd: "JUJU_DATA={{ pve_openstack_juju_data }} {{ pve_openstack_juju_bin }}"
    pve_openstack_model: "{{ pve_openstack_controller_name }}:{{ pve_openstack_model_name }}"

- name: Read OpenStack Juju status to locate the Vault unit
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_openstack_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_openstack_juju_client_user }}"
      - -c
      - "{{ pve_openstack_juju_cmd }} status -m {{ pve_openstack_model }} --format json"
  register: pve_openstack_unseal_status
  changed_when: false

- name: Derive the Vault unit address
  ansible.builtin.set_fact:
    pve_openstack_unseal_vault_address: >-
      {{ ((pve_openstack_unseal_status.stdout | from_json).applications.vault.units
          | default({}, true) | dict2items | map(attribute='value') | first
          | default({}, true))['public-address'] | default('') }}
  when: "'vault' in (pve_openstack_unseal_status.stdout | from_json).applications"

- name: Derive the Vault unit CT vmid
  ansible.builtin.set_fact:
    pve_openstack_unseal_vault_vmid: >-
      {{ (pve_openstack_unseal_vault_address.split('.') | last | int) + (pve_openstack_ip_offset | int) }}
  when:
    - "'vault' in (pve_openstack_unseal_status.stdout | from_json).applications"
    - pve_openstack_unseal_vault_address | default('') | length > 0

- name: Ensure the OpenStack Vault service is running on its machine
  ansible.builtin.shell: |
    set -euo pipefail
    vmid={{ pve_openstack_unseal_vault_vmid | default(0) | int }}
    if pct exec "$vmid" -- systemctl is-active --quiet vault.service; then
      echo "VAULT-SERVICE-ALREADY-ACTIVE"
    else
      pct exec "$vmid" -- systemctl reset-failed vault.service || true
      pct exec "$vmid" -- systemctl start vault.service
      echo "VAULT-SERVICE-STARTED"
    fi
  args:
    executable: /bin/bash
  register: pve_openstack_unseal_service
  changed_when: "'VAULT-SERVICE-STARTED' in pve_openstack_unseal_service.stdout"
  when: pve_openstack_unseal_vault_vmid | default(0) | int > 0

- name: Load the OpenStack Vault unseal keys from the credentials file
  ansible.builtin.set_fact:
    pve_openstack_unseal_vault_keys: >-
      {{ (lookup('ansible.builtin.file', pve_openstack_vault_init_file, errors='ignore')
          | default('{}', true) | from_json)['keys'] | default([], true) }}
  no_log: true

- name: Read the OpenStack Vault seal status
  ansible.builtin.command:
    argv:
      - curl
      - -sk
      - "http://{{ pve_openstack_unseal_vault_address | default('') }}:8200/v1/sys/seal-status"
  register: pve_openstack_unseal_seal_status
  changed_when: false
  failed_when: false
  until: pve_openstack_unseal_seal_status.rc == 0
  retries: 24
  delay: 5
  when: pve_openstack_unseal_vault_address | default('') | length > 0

- name: Unseal the OpenStack Vault with the first three keys when sealed
  ansible.builtin.command:
    argv:
      - curl
      - -sk
      - "http://{{ pve_openstack_unseal_vault_address }}:8200/v1/sys/unseal"
      - -X
      - PUT
      - -d
      - '{"key": "{{ item }}"}'
  loop: "{{ pve_openstack_unseal_vault_keys[:3] }}"
  when:
    - pve_openstack_unseal_vault_address | default('') | length > 0
    - pve_openstack_unseal_vault_keys | length >= 3
    - pve_openstack_unseal_seal_status.stdout | default('') | trim | length > 0
    - (pve_openstack_unseal_seal_status.stdout | from_json).sealed | default(true)
  no_log: true

- name: Require the OpenStack Vault to be unsealed
  ansible.builtin.command:
    argv:
      - curl
      - -sk
      - "http://{{ pve_openstack_unseal_vault_address }}:8200/v1/sys/seal-status"
  register: pve_openstack_unseal_seal_after
  changed_when: false
  failed_when: false
  until: >-
    (pve_openstack_unseal_seal_after.stdout | default('') | trim | length > 0)
    and not ((pve_openstack_unseal_seal_after.stdout | from_json).sealed | default(true))
  retries: 24
  delay: 5
  when: pve_openstack_unseal_vault_address | default('') | length > 0
