---

- name: Read OpenStack Juju status for the MySQL recovery assessment
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ pve_openstack_juju_client_vmid }}"
      - --
      - su
      - "-"
      - "{{ pve_openstack_juju_client_user }}"
      - -c
      - "{{ pve_openstack_juju_cmd }} status -m {{ pve_openstack_model }} --format json"
  register: pve_openstack_mysql_recovery_status
  changed_when: false

- name: Assess the MySQL InnoDB cluster for a complete-outage rebuild
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        app = json.load(sys.stdin).get('applications', {}).get('mysql-innodb-cluster', {})
        units = app.get('units') or {}
        bad = sorted(u for u, v in units.items()
                     if (v.get('workload-status') or {}).get('current') in ('blocked', 'error'))
        leader = sorted(u for u, v in units.items() if v.get('leader'))
        order = leader + [u for u in sorted(units) if u not in leader]
        msgs = [(v.get('workload-status') or {}).get('message', '') for v in units.values()]
        total = [u for u, v in units.items()
                 if (v.get('workload-status') or {}).get('current') not in ('active',)]
        complete = bool(units) and len(total) == len(units) and any(
            'not active' in m or 'complete outage' in m or 'inaccessible' in m for m in msgs)
        print(json.dumps({'bad': bad, 'order': order, 'complete_outage': complete}))
    stdin: "{{ pve_openstack_mysql_recovery_status.stdout }}"
  register: pve_openstack_mysql_recovery_assess
  changed_when: false

- name: Derive the rebuild unit order and the unhealthy unit list
  ansible.builtin.set_fact:
    pve_openstack_mysql_rebuild_bad: "{{ (pve_openstack_mysql_recovery_assess.stdout | from_json).bad }}"
    pve_openstack_mysql_rebuild_units: "{{ (pve_openstack_mysql_recovery_assess.stdout | from_json).order }}"
    pve_openstack_mysql_complete_outage: "{{ (pve_openstack_mysql_recovery_assess.stdout | from_json).complete_outage }}"
