---

- name: Require the yoga host baseline check to be explicitly requested
  ansible.builtin.assert:
    that:
      - pve_yoga_run_host_baseline | bool
    fail_msg: >-
      pve-yoga-prepare is a one-off validation step. Make sure the pve host has registered
      the four SDN vnets {{ pve_yoga_network_spaces | map(attribute='bridge') | join('/') }}
      (zone public/internal) and applied, run it explicitly with -e pve_yoga_run_host_baseline=true.

- name: Check PVE host bridge inventory
  ansible.builtin.command: "ip -o link show {{ item.bridge }}"
  loop: "{{ pve_yoga_network_spaces }}"
  loop_control:
    label: "{{ item.bridge }} ({{ item.name }})"
  changed_when: false

- name: Read PVE host NAT POSTROUTING rules
  ansible.builtin.command: iptables -t nat -S POSTROUTING
  register: pve_yoga_prepare_nat_rules
  changed_when: false

- name: Require public SNAT for internet egress
  ansible.builtin.assert:
    that:
      - >-
        pve_yoga_prepare_nat_rules.stdout_lines
        | select('search', '-s ' ~ (pve_yoga_public_cidr | regex_replace('\.', '[.]'))) | list | length > 0
    fail_msg: >-
      the SNAT egress rule for public ({{ pve_yoga_public_cidr }}) is missing. Make sure the SDN subnet
      public-{{ pve_yoga_public_cidr | replace('/', '-') }} carries `snat 1` and is applied
      (PVE generates the matching iptables POSTROUTING SNAT rules).

- name: Check PVE local template inventory
  ansible.builtin.command: pveam list local
  register: pve_yoga_prepare_template_inventory
  changed_when: false

- name: Require the jammy CT template
  ansible.builtin.assert:
    that:
      - pve_yoga_jammy_template.split(':')[1] in pve_yoga_prepare_template_inventory.stdout
    fail_msg: >-
      {{ pve_yoga_jammy_template }} is missing. On the pve host run
      `pveam update && pveam download local ubuntu-22.04-standard_22.04-1_amd64.tar.zst`
      and retry.
