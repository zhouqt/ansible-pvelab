---

- name: Set Octavia deployment facts
  ansible.builtin.set_fact:
    octavia_model: "{{ juju_model_name | default('openstack') }}"
    octavia_channel: "ussuri/stable"
    octavia_series: "focal"
    octavia_ca_dir: "{{ playbook_dir }}/credentials/octavia-ca"
    focal_image_path: "/home/Data/iso-root/focal-server-cloudimg-amd64.img"

- name: Verify juju command is available
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} version"
  register: juju_version
  changed_when: false
  failed_when: juju_version.rc != 0

- name: Verify Juju controller is accessible
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} show-controller {{ juju_controller_name }}"
  register: controller_check
  changed_when: false
  failed_when: controller_check.rc != 0

- name: Verify OpenStack model exists
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} show-model {{ juju_controller_name }}:{{ octavia_model }}"
  register: model_check
  changed_when: false
  failed_when: model_check.rc != 0

- name: Check required OpenStack services are deployed
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} --format=json | \
    python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    apps = data.get('applications', {})
    required = ['keystone', 'neutron-api', 'nova-cloud-controller', 'mysql-innodb-cluster', 'rabbitmq-server', 'vault', 'ovn-central']
    missing = [s for s in required if s not in apps]
    if missing:
        print('MISSING: ' + ', '.join(missing))
        sys.exit(1)
    print('OK')
    "
  register: services_check
  changed_when: false

- name: Fail if required OpenStack services not deployed
  ansible.builtin.fail:
    msg: |
      Required OpenStack services not deployed: {{ services_check.stdout }}
      Run openstack-lxd-services role first.
  when: services_check.rc != 0

- name: Verify Vault is unsealed
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} vault --format=json | \
    python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    vault_units = data.get('applications', {}).get('vault', {}).get('units', {})
    for unit, info in vault_units.items():
        status = info.get('workload-status', {}).get('current', '')
        message = info.get('workload-status', {}).get('message', '')
        if status != 'active':
            print(f'Vault {unit} is {status}: {message}')
            sys.exit(1)
    print('OK')
    "
  register: vault_check
  changed_when: false

- name: Fail if Vault is not ready
  ansible.builtin.fail:
    msg: |
      Vault is not ready: {{ vault_check.stdout }}
      Unseal Vault first using credentials/vault-unseal-lxd-openstack.json
  when: vault_check.rc != 0

- name: Create Octavia CA directory
  ansible.builtin.file:
    path: "{{ octavia_ca_dir }}"
    state: directory
    mode: '0755'

- name: Check if Octavia issuing CA exists
  ansible.builtin.stat:
    path: "{{ octavia_ca_dir }}/octavia-issuing-ca.pem"
  register: issuing_ca_stat

- name: Generate Octavia certificates if missing
  ansible.builtin.shell: |
    cd {{ octavia_ca_dir }}
    mkdir -p demoCA/newcerts
    touch demoCA/index.txt demoCA/index.txt.attr

    openssl genrsa -des3 -passout pass:foobar -out octavia-issuing-ca-key.pem 2048
    openssl req -x509 -passin pass:foobar -new -nodes -key octavia-issuing-ca-key.pem \
        -subj "/C=CN/ST=Shanghai/O=Homelab/CN=Octavia Issuing CA" -days 3650 -out octavia-issuing-ca.pem

    openssl genrsa -des3 -passout pass:foobar -out octavia-controller-ca-key.pem 2048
    openssl req -x509 -passin pass:foobar -new -nodes -key octavia-controller-ca-key.pem \
        -subj "/C=CN/ST=Shanghai/O=Homelab/CN=Octavia Controller CA" -days 3650 -out octavia-controller-ca.pem

    openssl req -newkey rsa:2048 -nodes -keyout octavia-controller-key.pem \
        -subj "/C=CN/ST=Shanghai/O=Homelab/CN=Octavia Controller" -out octavia-controller.csr
    openssl ca -passin pass:foobar -config /etc/ssl/openssl.cnf \
        -cert octavia-controller-ca.pem -keyfile octavia-controller-ca-key.pem \
        -create_serial -batch -in octavia-controller.csr -days 3650 -out octavia-controller-cert.pem
    cat octavia-controller-cert.pem octavia-controller-key.pem > octavia-controller-bundle.pem
  args:
    creates: "{{ octavia_ca_dir }}/octavia-issuing-ca.pem"
  when: not issuing_ca_stat.stat.exists

- name: Check if Octavia SSH key exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/credentials/octavia-amphora-ssh-key"
  register: ssh_key_stat

- name: Generate Octavia SSH key if missing
  ansible.builtin.command:
    cmd: ssh-keygen -t rsa -b 4096 -N "" -f {{ playbook_dir }}/credentials/octavia-amphora-ssh-key
    creates: "{{ playbook_dir }}/credentials/octavia-amphora-ssh-key"
  when: not ssh_key_stat.stat.exists

- name: Check OpenStack RC file exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh"
  register: rc_file_stat

- name: Fail if OpenStack RC file not found
  ansible.builtin.fail:
    msg: |
      OpenStack RC file not found: {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
      Run openstack-lxd-config role first to generate credentials.
  when: not rc_file_stat.stat.exists

- name: Verify OpenStack CLI is working
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack token issue -f value -c id
  args:
    executable: /bin/bash
  register: openstack_token
  changed_when: false
  failed_when: openstack_token.rc != 0

- name: Check ML2 port security is enabled
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} config -m {{ juju_controller_name }}:{{ octavia_model }} neutron-api enable-ml2-port-security"
  register: port_security_config
  changed_when: false

- name: Enable ML2 port security if not enabled
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} config -m {{ juju_controller_name }}:{{ octavia_model }} neutron-api enable-ml2-port-security=true"
  when: port_security_config.stdout == "false"
  register: enable_port_security
  changed_when: enable_port_security.rc == 0

- name: Wait for neutron-api to settle after port security change
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} neutron-api --format=json"
  register: neutron_status
  until: >
    (neutron_status.stdout | from_json).applications['neutron-api']['application-status'].current == 'active'
  retries: 30
  delay: 10
  changed_when: false
  when: enable_port_security is changed

- name: Display prerequisites check passed
  ansible.builtin.debug:
    msg: "All prerequisites verified/auto-configured. Proceeding with Octavia deployment."

- name: Deploy Octavia charm
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ octavia_model }}
      octavia --channel {{ octavia_channel }} --series {{ octavia_series }}
      --config enable-amphora=true
  register: octavia_deploy
  changed_when: octavia_deploy.rc == 0
  failed_when: octavia_deploy.rc != 0 and 'already exists' not in octavia_deploy.stderr

- name: Deploy octavia-mysql-router
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ octavia_model }}
      mysql-router octavia-mysql-router --channel 8.0/stable --series {{ octavia_series }}
  register: mysql_router_deploy
  changed_when: mysql_router_deploy.rc == 0
  failed_when: mysql_router_deploy.rc != 0 and 'already exists' not in mysql_router_deploy.stderr

- name: Deploy octavia-ovn-chassis
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ octavia_model }}
      ovn-chassis octavia-ovn-chassis --channel 20.03/stable
  register: ovn_chassis_deploy
  changed_when: ovn_chassis_deploy.rc == 0
  failed_when: ovn_chassis_deploy.rc != 0 and 'already exists' not in ovn_chassis_deploy.stderr

- name: Deploy octavia-diskimage-retrofit
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} deploy -m {{ juju_controller_name }}:{{ octavia_model }}
      octavia-diskimage-retrofit --channel {{ octavia_channel }}
      --config retrofit-series=focal
  register: retrofit_deploy
  changed_when: retrofit_deploy.rc == 0
  failed_when: retrofit_deploy.rc != 0 and 'already exists' not in retrofit_deploy.stderr

- name: Add Octavia relations
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} add-relation -m {{ juju_controller_name }}:{{ octavia_model }} {{ item }}"
  loop:
    - "octavia-mysql-router:db-router mysql-innodb-cluster:db-router"
    - "octavia-mysql-router:shared-db octavia:shared-db"
    - "octavia:identity-service keystone:identity-service"
    - "octavia:amqp rabbitmq-server:amqp"
    - "octavia:neutron-api neutron-api:neutron-load-balancer"
    - "octavia:certificates vault:certificates"
    - "octavia-ovn-chassis:ovsdb-subordinate octavia:ovsdb-subordinate"
    - "octavia-ovn-chassis:ovsdb ovn-central:ovsdb"
    - "octavia-ovn-chassis:certificates vault:certificates"
    - "octavia:ovsdb-cms ovn-central:ovsdb-cms"
    - "octavia-diskimage-retrofit:juju-info octavia:juju-info"
    - "octavia-diskimage-retrofit:identity-credentials keystone:identity-credentials"
    - "octavia-diskimage-retrofit:certificates vault:certificates"
  register: relation_result
  changed_when: relation_result.rc == 0
  failed_when: relation_result.rc != 0 and 'already exists' not in relation_result.stderr
  loop_control:
    label: "{{ item.split()[0] }}"

- name: Read Octavia certificates
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ octavia_ca_dir }}/octavia-issuing-ca.pem"
    - "{{ octavia_ca_dir }}/octavia-issuing-ca-key.pem"
    - "{{ octavia_ca_dir }}/octavia-controller-ca.pem"
    - "{{ octavia_ca_dir }}/octavia-controller-bundle.pem"
  register: octavia_certs

- name: Read Octavia SSH public key
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/credentials/octavia-amphora-ssh-key.pub"
  register: octavia_ssh_pub

- name: Configure Octavia with certificates
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} config -m {{ juju_controller_name }}:{{ octavia_model }} octavia
      lb-mgmt-issuing-cacert="{{ octavia_certs.results[0].content }}"
      lb-mgmt-issuing-ca-private-key="{{ octavia_certs.results[1].content }}"
      lb-mgmt-issuing-ca-key-passphrase=foobar
      lb-mgmt-controller-cacert="{{ octavia_certs.results[2].content }}"
      lb-mgmt-controller-cert="{{ octavia_certs.results[3].content }}"
      amp-ssh-key-name=octavia-amphora-ssh
      amp-ssh-pub-key="{{ octavia_ssh_pub.content }}"
      os-internal-network=192.168.165.0/24
  changed_when: true

- name: Wait for Octavia deployment to settle
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} octavia --format=json"
  register: octavia_status
  until: >
    (octavia_status.stdout | from_json).applications.octavia.units is defined and
    (octavia_status.stdout | from_json).applications.octavia.units.values() | list |
    selectattr('workload-status.current', 'equalto', 'active') | list | length > 0
  retries: 60
  delay: 10
  changed_when: false

- name: Source OpenStack credentials and enable port security on int-net
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack network set int-net --enable-port-security
  args:
    executable: /bin/bash
  register: port_security_result
  changed_when: true
  failed_when: port_security_result.rc != 0 and 'Unrecognized attribute' not in port_security_result.stderr

- name: Check if focal image exists in Glance
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image show ubuntu-focal -f value -c id 2>/dev/null || echo "NOT_FOUND"
  args:
    executable: /bin/bash
  register: focal_image_check
  changed_when: false

- name: Check if local focal image exists
  ansible.builtin.stat:
    path: "{{ focal_image_path }}"
  register: focal_image_stat
  when: focal_image_check.stdout == "NOT_FOUND"

- name: Download Ubuntu Focal cloud image
  ansible.builtin.get_url:
    url: https://cloud-images.ubuntu.com/focal/current/focal-server-cloudimg-amd64.img
    dest: "{{ focal_image_path }}"
    mode: '0644'
  when:
    - focal_image_check.stdout == "NOT_FOUND"
    - not focal_image_stat.stat.exists

- name: Upload Ubuntu Focal image to Glance
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image create ubuntu-focal \
      --file {{ focal_image_path }} \
      --disk-format qcow2 \
      --container-format bare \
      --property os_distro=ubuntu \
      --property os_version=20.04 \
      --property architecture=x86_64 \
      --property product_name='com.ubuntu.cloud:server:20.04:amd64' \
      --property version_name='20.04' \
      --public
  args:
    executable: /bin/bash
  when: focal_image_check.stdout == "NOT_FOUND"
  register: focal_upload
  changed_when: focal_upload.rc == 0

- name: Wait for focal image to become active
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image show ubuntu-focal -f value -c status
  args:
    executable: /bin/bash
  register: focal_status
  until: focal_status.stdout == "active"
  retries: 30
  delay: 5
  changed_when: false
  when: focal_image_check.stdout == "NOT_FOUND"

- name: Check if Amphora image already exists
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image list --tag octavia-amphora -f value -c ID | head -1
  args:
    executable: /bin/bash
  register: amphora_image_check
  changed_when: false

- name: Get octavia-diskimage-retrofit unit name
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} octavia-diskimage-retrofit --format=json | \
    python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d['applications']['octavia-diskimage-retrofit']['units'].keys())[0])"
  register: retrofit_unit
  changed_when: false
  when: amphora_image_check.stdout == ""

- name: Run retrofit-image action to create Amphora image
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} run-action -m {{ juju_controller_name }}:{{ octavia_model }}
      {{ retrofit_unit.stdout }} retrofit-image --wait
  register: retrofit_result
  when: amphora_image_check.stdout == ""
  failed_when: "retrofit_result.rc != 0 or 'status: failed' in retrofit_result.stdout"

- name: Get newly created Amphora image name
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image list --tag octavia-diskimage-retrofit -f value -c Name | head -1
  args:
    executable: /bin/bash
  register: amphora_image_name
  changed_when: false
  when: amphora_image_check.stdout == ""

- name: Add octavia-amphora tag to Amphora image
  ansible.builtin.shell: |
    source {{ playbook_dir }}/credentials/admin-openrc-lxd-openstack.sh
    openstack image set "{{ amphora_image_name.stdout }}" --tag octavia-amphora
  args:
    executable: /bin/bash
  when:
    - amphora_image_check.stdout == ""
    - amphora_image_name.stdout != ""
  changed_when: true

- name: Get octavia unit name
  ansible.builtin.shell: |
    {{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} octavia --format=json | \
    python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d['applications']['octavia']['units'].keys())[0])"
  register: octavia_unit
  changed_when: false

- name: Run configure-resources action on Octavia
  ansible.builtin.command:
    cmd: >
      {{ juju_openstack_cmd }} run-action -m {{ juju_controller_name }}:{{ octavia_model }}
      {{ octavia_unit.stdout }} configure-resources --wait
  register: configure_resources_result
  changed_when: '"status: completed" in configure_resources_result.stdout'
  failed_when: "configure_resources_result.rc != 0 and 'status: failed' in configure_resources_result.stdout"

- name: Verify Octavia is ready
  ansible.builtin.command:
    cmd: "{{ juju_openstack_cmd }} status -m {{ juju_controller_name }}:{{ octavia_model }} octavia --format=json"
  register: final_status
  changed_when: false

- name: Display Octavia status
  ansible.builtin.debug:
    msg: |
      Octavia deployment complete!
      Status: {{ (final_status.stdout | from_json).applications.octavia['application-status'].current }}

      To test:
        source credentials/admin-openrc-lxd-openstack.sh
        openstack loadbalancer create --name test-lb --vip-subnet-id int-subnet --wait
        openstack loadbalancer list
