applications:
  calico:
    options:
      cidr: "10.244.0.0/16"
      ignore-loose-rpf: true
  kubernetes-control-plane:
    constraints: "cores=2 mem=4096 root-disk=20G"
    num_units: 1
  kubernetes-worker:
    constraints: "cores=2 mem=4096 root-disk=20G"
    num_units: 1
  etcd:
    constraints: "cores=1 mem=2048 root-disk=10G"
    num_units: 1
  easyrsa:
    constraints: "cores=1 mem=1024 root-disk=10G"
    num_units: 1
  kubeapi-load-balancer:
    constraints: "cores=1 mem=1024 root-disk=10G"
    num_units: 1
