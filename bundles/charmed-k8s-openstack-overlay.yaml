applications:
  calico:
    options:
      cidr: "10.244.0.0/16"
  kubernetes-control-plane:
    constraints: "cores=2 mem=4096 root-disk=20G"
    num_units: 1
  kubernetes-worker:
    constraints: "cores=2 mem=4096 root-disk=20G"
    num_units: 2
  etcd:
    constraints: "cores=1 mem=2048 root-disk=10G"
    num_units: 1
  easyrsa:
    constraints: "cores=1 mem=1024 root-disk=5G"
    num_units: 1
  kubeapi-load-balancer:
    constraints: "cores=1 mem=1024 root-disk=5G"
    num_units: 1
  openstack-integrator:
    charm: openstack-integrator
    num_units: 1
    trust: true
    constraints: "cores=1 mem=1024 root-disk=5G"
  openstack-cloud-controller:
    charm: openstack-cloud-controller
  cinder-csi:
    charm: cinder-csi

relations:
  - [openstack-integrator:clients, kubernetes-control-plane:openstack]
  - [openstack-cloud-controller:openstack, openstack-integrator:clients]
  - [openstack-cloud-controller:kube-control, kubernetes-control-plane:kube-control]
  - [openstack-cloud-controller:external-cloud-provider, kubernetes-control-plane:external-cloud-provider]
  - [cinder-csi:openstack, openstack-integrator:clients]
  - [cinder-csi:kube-control, kubernetes-control-plane:kube-control]
  - [easyrsa:client, openstack-cloud-controller:certificates]
  - [easyrsa:client, cinder-csi:certificates]
