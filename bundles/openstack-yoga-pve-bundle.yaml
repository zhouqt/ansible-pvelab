applications:
  keystone:
    charm: ch:keystone
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
  keystone-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  nova-cloud-controller:
    charm: ch:nova-cloud-controller
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
      network-manager: Neutron
  nova-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  placement:
    charm: ch:placement
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
  placement-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  glance:
    charm: ch:glance
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
  glance-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  openstack-dashboard:
    charm: ch:openstack-dashboard
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
  dashboard-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  neutron-api:
    charm: ch:neutron-api
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
      neutron-security-groups: true
      flat-network-providers: physnet1
  neutron-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable
  neutron-api-plugin-ovn:
    charm: ch:neutron-api-plugin-ovn
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
      ovn-dhcp4-global-options: ""

  cinder:
    charm: ch:cinder
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin
      block-device: None
      glance-api-version: 2
  cinder-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable
  cinder-ceph:
    charm: ch:cinder-ceph
    channel: yoga/stable
    options:
      openstack-origin: *openstack-origin

  memcached:
    charm: ch:memcached
    channel: latest/stable

  vault:
    charm: ch:vault
    channel: 1.7/stable
  vault-mysql-router:
    charm: ch:mysql-router
    channel: 8.0/stable

  mysql-innodb-cluster:
    charm: ch:mysql-innodb-cluster
    channel: 8.0/stable
    options:
      innodb-buffer-pool-size: 256M

  rabbitmq-server:
    charm: ch:rabbitmq-server
    channel: 3.9/stable

  ovn-central:
    charm: ch:ovn-central
    channel: 22.03/stable
  ovn-chassis:
    charm: ch:ovn-chassis
    channel: 22.03/stable
    options:
      ovn-bridge-mappings: physnet1:br-ex

  ceph-mon:
    charm: ch:ceph-mon
    channel: quincy/stable
    options:
      expected-osd-count: 4
      monitor-count: 3
  ceph-osd:
    charm: ch:ceph-osd
    channel: quincy/stable
    options:
      osd-devices: /dev/osd-block
      osd-encrypt: false

  ntp:
    charm: ch:ntp
    channel: stable
  nrpe:
    charm: ch:nrpe
    channel: stable
