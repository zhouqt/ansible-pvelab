---

sunbeam_host: pve host
sunbeam_pve_storage: pve-thin-pool
sunbeam_pve_thinpool_lv: pve-thin-pool
sunbeam_template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
sunbeam_ct_ostype: ubuntu
sunbeam_ct_cores: 8
sunbeam_ct_memory_mb: 32768
sunbeam_ct_swap_mb: 0
sunbeam_ct_features: nesting=1,fuse=1,keyctl=1
sunbeam_ct_nameserver: 8.8.8.8
sunbeam_ct_onboot: 1
sunbeam_ct_startup_order: 5
sunbeam_ct_tags: sunbeam
sunbeam_rootfs_size_gb: 50
sunbeam_osd_size_gb: 50

sunbeam_domain: sunbeam.test
sunbeam_osd_by_id_prefix: pve-ceph-osd-
sunbeam_osd_microceph_device_prefix: pve-ceph-osd-device-
sunbeam_osd_slots_default: { lv: 40, by_id: 41 }
sunbeam_char_devices_default:
  - { index: 0, path: "/dev/kmsg", mode: "0644", extra: "deny-write=1" }
  - { index: 1, path: "/dev/kvm", mode: "0660" }
  - { index: 2, path: "/dev/net/tun", mode: "0666" }
sunbeam_loop_device_first: 2
sunbeam_loop_device_last: 31

sunbeam_nodes_input:
  - vmid: 1281
    hostname: sunbeam-01
    primary: true
    role: control,compute,storage
    pub_ip: 192.168.21.21
    internal_ip: 192.168.23.21
    osd_slots: { lv: 32, by_id: 35 }
    char_devices:
      - { index: 0, path: "/dev/kmsg", mode: "0644", extra: "deny-write=1" }
      - { index: 1, path: "/dev/loop-control", mode: "0660" }
      - { index: 33, path: "/dev/net/tun", mode: "0666" }
      - { index: 34, path: "/dev/kvm", mode: "0660" }
    mounts:
      - "/proc/sys/vm/overcommit_memory proc/sys/vm/overcommit_memory none bind,create=file 0 0"
      - "/proc/sys/kernel/panic proc/sys/kernel/panic none bind,create=file 0 0"
      - "/proc/sys/kernel/panic_on_oops proc/sys/kernel/panic_on_oops none bind,create=file 0 0"
      - "/dev/loop-control dev/loop-control none bind,create=file 0 0"
  - vmid: 1282
    hostname: sunbeam-02
    primary: false
    role: compute,storage
    pub_ip: 192.168.21.22
    internal_ip: 192.168.23.22
    osd_slots: { lv: 3, by_id: 35 }
    char_devices:
      - { index: 0, path: "/dev/kmsg", mode: "0644", extra: "deny-write=1" }
      - { index: 1, path: "/dev/kvm", mode: "0660" }
      - { index: 2, path: "/dev/net/tun", mode: "0666" }
  - vmid: 1283
    hostname: sunbeam-03
    primary: false
    role: compute,storage
    pub_ip: 192.168.21.23
    internal_ip: 192.168.23.23
    osd_slots: { lv: 4, by_id: 35 }
    char_devices:
      - { index: 0, path: "/dev/kmsg", mode: "0644", extra: "deny-write=1" }
      - { index: 1, path: "/dev/kvm", mode: "0660" }
      - { index: 2, path: "/dev/vhost-vsock", mode: "0660" }
      - { index: 3, path: "/dev/net/tun", mode: "0666" }

sunbeam_cluster_list_expected_nodes: 3

sunbeam_interface_names: { generic: eth0, internal: eth1, external: eth2 }
sunbeam_pve_bridges: { generic: pub21, internal: int23, external: pub12 }

sunbeam_management_cidr: 192.168.21.0/24
sunbeam_management_gateway: 192.168.21.1
sunbeam_internal_cidr: 192.168.23.0/24
sunbeam_external_network:
  name: physnet1
  openstack_name: external-network
  cidr: 192.168.12.0/24
  gateway: 192.168.12.1
  floating_range: 192.168.12.200-192.168.12.229
  network_type: flat
  segmentation_id: 0
  allow_shared_l2: true
sunbeam_external_reserved_ips:
  - 192.168.12.1
sunbeam_external_reserved_ranges: []
sunbeam_k8s_loadbalancer_range: 172.16.1.201-172.16.1.240
sunbeam_tenant_cidr: 192.168.0.0/24
sunbeam_tenant_network_name: demo-network
sunbeam_dns_nameservers: 8.8.8.8

sunbeam_proxy_enabled: true
sunbeam_proxy_allow_unreachable: false
sunbeam_proxy_url: http://192.168.11.2:12345
sunbeam_proxy_no_proxy_tail:
  - 10.1.0.0/16
  - 10.140.97.0/24
  - 10.140.97.1
  - 10.152.183.0/24
  - 172.16.1.0/24

sunbeam_snap_name: openstack
sunbeam_snap_channel: 2024.1/stable
sunbeam_snap_revision: "1101"
sunbeam_snap_version_marker: "2024.1"
sunbeam_juju_channel: 3.6/stable
sunbeam_juju_version: "3.6.29"
sunbeam_microceph_channel: squid/stable
sunbeam_microceph_revision: "1895"
sunbeam_microceph_version: "19.2.3"
sunbeam_snapd_deb_version: "2.76.3"
sunbeam_expected_ubuntu_release: "24.04"
sunbeam_expected_ubuntu_codename: noble

sunbeam_controller_name: localhost-localhost
sunbeam_cluster_model: openstack-machines
sunbeam_region: RegionOne
sunbeam_database_topology: single

sunbeam_demo_username: demo
sunbeam_demo_password: "{{ vault_sunbeam_demo_password | default('') }}"

sunbeam_node_user: sunbeam
sunbeam_node_home: /home/sunbeam
sunbeam_manifest_path: /home/sunbeam/sunbeam-deploy-manifest.yaml
sunbeam_admin_openrc_path: /home/sunbeam/sunbeam-admin-openrc
sunbeam_join_token_dir: /home/sunbeam
sunbeam_join_token_path: "{{ sunbeam_join_token_dir }}/join-token.asc"
sunbeam_join_token_primary_path: "{{ sunbeam_join_token_dir }}/join-token-{{ vmid }}.asc"
sunbeam_join_wrapper_path: /usr/local/sbin/sunbeam-join-node.sh
sunbeam_osd_setup_script: /usr/local/sbin/microceph-osd-device-setup
sunbeam_osd_service_dropin: /etc/systemd/system/snap.microceph.osd.service.d/10-osd-device.conf
sunbeam_node_log_dir: /var/log/sunbeam
sunbeam_etc_environment: /etc/environment
sunbeam_apt_proxy_file: /etc/apt/apt.conf.d/95proxy
sunbeam_demo_openrc_path: /home/sunbeam/sunbeam-demo-openrc

sunbeam_tls_provider: self-signed
sunbeam_tls_endpoints:
  - public

sunbeam_confirm_pve_create: false
sunbeam_confirm_cluster_bootstrap: false
sunbeam_confirm_cluster_join: false
sunbeam_confirm_external_changes: false
sunbeam_confirm_ceph_osd: false
sunbeam_confirm_tls: false

sunbeam_allow_unreadable_cluster_state: false
sunbeam_repair_openrc: false
sunbeam_ceph_remove_bootstrap_osd: false
sunbeam_pve_preflight_only: false

sunbeam_nodes: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for n in sunbeam_nodes_input -%}
  {%- set lv = '/dev/' ~ sunbeam_pve_storage ~ '/vm-' ~ n.vmid ~ '-disk-1' -%}
  {%- set by_id = '/dev/disk/by-id/' ~ sunbeam_osd_by_id_prefix ~ n.vmid -%}
  {%- set slots = n.osd_slots | default(sunbeam_osd_slots_default) -%}
  {%- set devs = [{'index': slots.lv, 'path': lv}] -%}
  {%- if slots.by_id is defined and slots.by_id is not none -%}
  {%-   set _ = devs.append({'index': slots.by_id, 'path': by_id}) -%}
  {%- endif -%}
  {%- set nics = n.interfaces | default(sunbeam_interface_names) -%}
  {%- set bridges = {} -%}
  {%- for role, nic in nics.items() -%}
  {%-   set _ = bridges.update({nic: sunbeam_pve_bridges[role]}) -%}
  {%- endfor -%}
  {%- set derived = {
        'fqdn': n.hostname ~ '.' ~ sunbeam_domain,
        'interfaces': nics,
        'pve_bridges': bridges,
        'osd_pve_lv': lv,
        'osd_by_id': by_id,
        'osd_microceph_device': '/dev/disk/by-id/' ~ sunbeam_osd_microceph_device_prefix ~ n.vmid,
        'pve_devices': devs,
        'char_devices': sunbeam_char_devices_default,
        'mounts': [],
        'loop_devices': n.primary | default(false),
      } -%}
  {%- set _ = ns.out.append(derived | combine(n)) -%}
  {%- endfor -%}
  {{ ns.out }}

sunbeam_primary_node: "{{ sunbeam_nodes | selectattr('primary') | list | first }}"
sunbeam_worker_nodes: "{{ sunbeam_nodes | rejectattr('primary') | list }}"
sunbeam_ceph_managed_osd_devices: "{{ sunbeam_nodes | length }}"
sunbeam_ceph_osd_devices: "{{ sunbeam_nodes | map(attribute='osd_microceph_device') | list }}"

sunbeam_compute_nodes: "{{ sunbeam_nodes | selectattr('role', 'search', 'compute') | list }}"

sunbeam_loop_nodes: "{{ sunbeam_nodes | selectattr('loop_devices') | list }}"

sunbeam_host_expected_bridges: "{{ sunbeam_pve_bridges.values() | list }}"
sunbeam_host_expected_vnets: "{{ sunbeam_pve_bridges.values() | list }}"
sunbeam_host_expected_subnets:
  - "{{ sunbeam_management_cidr }}"
  - "{{ sunbeam_internal_cidr }}"
  - "{{ sunbeam_external_network.cidr }}"
sunbeam_host_expected_subnet_ids: >-
  {{ sunbeam_host_expected_subnets | map('regex_replace', '/', '-') | list }}
sunbeam_manifest_external_nic: "{{ sunbeam_interface_names.external }}"
sunbeam_vm_test_network: "{{ sunbeam_tenant_network_name }}"

sunbeam_proxy_no_proxy: >-
  {{ ['localhost', '127.0.0.1', '::1', '.' ~ sunbeam_domain, '.svc', '.svc.cluster.local',
      sunbeam_management_cidr]
     + (sunbeam_nodes | map(attribute='pub_ip') | list)
     + [sunbeam_internal_cidr]
     + (sunbeam_nodes | map(attribute='internal_ip') | list)
     + sunbeam_proxy_no_proxy_tail }}
sunbeam_proxy_no_proxy_effective: "{{ sunbeam_proxy_no_proxy | join(',') }}"

sunbeam_tls_endpoint_apps:
  public: traefik-public
  internal: traefik
  rgw: traefik-rgw

sunbeam_ceph_unmanaged_osds:
  - { osd: 1, location: sunbeam-01, path: /var/snap/microceph/common/data/osd/ceph-1/osd-backing.img }
sunbeam_ceph_expected_osds: >-
  {{ (sunbeam_ceph_managed_osd_devices | int)
     + (0 if (sunbeam_ceph_remove_bootstrap_osd | bool) else (sunbeam_ceph_unmanaged_osds | length)) }}
sunbeam_ceph_expected_pgs: 193
sunbeam_ceph_expected_pools: 7
sunbeam_ceph_pool_size: 3
sunbeam_ceph_pool_min_size: 2
sunbeam_health_require_all_active: false
sunbeam_known_blocked_applications: [sunbeam-machine]
sunbeam_ceph_tolerated_warnings:
  - "is low on available space"
  - "experiencing slow operations in BlueStore"
sunbeam_pve_module_release: 7.0.2-6-pve

sunbeam_baseline_fingerprint: "84753f2d-7b95-4e9b-8047-e1fd516e1c62"
sunbeam_baseline_enforced: true

sunbeam_thinpool_max_data_percent: 90
sunbeam_ct_rootfs_warn_percent: 85
sunbeam_snap_hold_forever: true
sunbeam_hold_snapd_deb: true
sunbeam_held_snaps:
  - openstack
  - microceph
  - k8s
  - openstack-hypervisor
  - cinder-volume
  - epa-orchestrator
  - snapd

sunbeam_vm_volume_test: false
sunbeam_vm_test_name: sunbeam-ansible-smoke
sunbeam_vm_test_volume_name: sunbeam-ansible-volume-smoke
sunbeam_vm_test_image_name: sunbeam-ansible-cirros-smoke
sunbeam_vm_test_volume_size_gb: 1
sunbeam_vm_test_cirros_url: "{{ sunbeam_cirros_image_url }}"
sunbeam_vm_test_flavor: m1.tiny

sunbeam_flavors:
  - { name: cirros,      ram: 512,  disk: 1,  vcpus: 1 }
  - { name: m1.nano,     ram: 128,  disk: 1,  vcpus: 1 }
  - { name: m1.tiny,     ram: 512,  disk: 4,  vcpus: 1 }
  - { name: m1.tiny-sev, ram: 512,  disk: 4,  vcpus: 1, extras: "hw:mem_encryption=true" }
  - { name: m1.micro,    ram: 256,  disk: 5,  vcpus: 1 }
  - { name: m1.small,    ram: 2048, disk: 10, vcpus: 1 }
  - { name: m1.medium,   ram: 4096, disk: 20, vcpus: 2 }

sunbeam_flavors_remove:
  - m1.small-sev
  - m1.medium-sev
  - m1.large
  - m1.large-sev

sunbeam_cirros_image_name: cirros
sunbeam_cirros_image_url: https://download.cirros-cloud.net/0.5.2/cirros-0.5.2-x86_64-disk.img
