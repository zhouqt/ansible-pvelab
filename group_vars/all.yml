    revision: 617
    num_units: 3
    config:
      osd-devices: /dev/osd-block
      osd-format: ext4
      ceph-cluster-network: 192.168.14.0/24
      ceph-public-network: 192.168.13.0/24
      source: distro

  - app: ceph-fs
    charm: ceph-fs
    channel: octopus/stable
    revision: 45
    movable: true
    config:
      ceph-osd-replication-count: 2

