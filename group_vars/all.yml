pve_ussuri_control_plane_apps:
  - app: mysql-innodb-cluster
    charm: mysql-innodb-cluster
    channel: 8.0/stable
    revision: 159
    num_units: 3
    config:
      innodb-buffer-pool-size: 256M

  - app: rabbitmq-server
    charm: rabbitmq-server
    channel: 3.8/stable
    revision: 222

  - app: vault
    charm: vault
    channel: 1.7/stable
    revision: 371
  - app: vault-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: keystone
    charm: keystone
    channel: ussuri/stable
    revision: 691
    config:
      admin-password: "{{ pve_keystone_admin_password }}"
    bind: "internal public={{ pve_juju_public_native_space }} admin=internal"
  - app: keystone-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: glance
    charm: glance
    channel: ussuri/stable
    revision: 589
    config:
      ceph-osd-replication-count: 2
    bind: "internal public={{ pve_juju_public_native_space }} admin=internal"
  - app: glance-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: nova-cloud-controller
    charm: nova-cloud-controller
    channel: ussuri/stable
    revision: 748
    config:
      network-manager: Neutron
    bind: "internal public={{ pve_juju_public_native_space }} admin=internal"
  - app: nova-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: placement
    charm: placement
    channel: ussuri/stable
    revision: 99
    bind: internal
  - app: placement-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: neutron-api
    charm: neutron-api
    channel: ussuri/stable
    revision: 588
    config:
      dns-domain: test-b.example.com
      enable-ml2-port-security: "true"
      flat-network-providers: physnet1
      neutron-security-groups: "true"
    bind: "internal public={{ pve_juju_public_native_space }} admin=internal"
  - app: neutron-api-plugin-ovn
    charm: neutron-api-plugin-ovn
    channel: ussuri/stable
    revision: 98
    subordinate: true
    config:
      ovn-source: distro
  - app: neutron-mysql-router
    charm: mysql-router
    channel: 8.0/stable
    revision: 257
    subordinate: true
    bind: internal

  - app: cinder
    charm: cinder
    channel: ussuri/stable
    revision: 670
