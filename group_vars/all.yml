pve_ussuri_public_prefix: "{{ pve_juju_network_spaces[0].cidr | regex_replace('\\.0/24$', '') }}"
pve_ussuri_client_stage_dir: "/home/{{ pve_juju_client_user }}/ussuri-staging"
pve_ussuri_kvm_image: ubuntu-20.04-server-cloudimg-amd64.img
pve_ussuri_kvm_image_url: "https://cloud-images.ubuntu.com/releases/focal/release/{{ pve_ussuri_kvm_image }}"
pve_ussuri_kvm_cores: 4
pve_ussuri_kvm_memory: 8192
pve_ussuri_kvm_disk: 32
pve_ussuri_slug: pve-openstack
pve_ussuri_openrc_file: "{{ playbook_dir }}/credentials/admin-openrc-{{ pve_ussuri_slug }}.sh"
pve_ussuri_vault_ca_file: "{{ playbook_dir }}/credentials/vault-ca-{{ pve_ussuri_slug }}.crt"

pve_ussuri_workload_vmids: "{{ pve_ussuri_topology | map(attribute='vmid') | list }}"
pve_ussuri_workload_cts: "{{ pve_ussuri_topology | selectattr('kind', 'equalto', 'ct') | list }}"
pve_ussuri_workload_kvms: "{{ pve_ussuri_topology | selectattr('kind', 'equalto', 'kvm') | list }}"
pve_ussuri_machine_of_unit: >-
  {%- set ns = namespace(m={}) -%}
  {%- for e in pve_ussuri_topology -%}
  {%-   set midx = loop.index0 | string -%}
  {%-   if e.writer -%}
  {%-     set ns.m = ns.m | combine({e.writer: midx}) -%}
  {%-   endif -%}
  {%-   for u in e.units -%}
  {%-     set ns.m = ns.m | combine({u: midx}) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ ns.m }}
pve_ussuri_unit_machines: >-
  {%- set ns = namespace(m={}) -%}
  {%- for e in pve_ussuri_topology -%}
  {%-   set midx = loop.index0 -%}
  {%-   if e.writer -%}
  {%-     set cur = ns.m.get(e.writer, {}) -%}
  {%-     set ns.m = ns.m | combine({e.writer: cur | combine({'': midx})}) -%}
  {%-   endif -%}
  {%-   for u in e.units -%}
  {%-     set parts = u.split('/') -%}
  {%-     set app = parts[0] -%}
  {%-     set idx = parts[1] if parts | length > 1 else '' -%}
  {%-     set cur = ns.m.get(app, {}) -%}
  {%-     set ns.m = ns.m | combine({app: cur | combine({idx: midx})}) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ ns.m }}
pve_compute_uplink_vmids: >-
  {{ pve_ussuri_topology | selectattr('uplink', 'equalto', true) | map(attribute='vmid') | list }}
pve_ussuri_compute_ct_vmids: >-
  {{ pve_ussuri_workload_cts | selectattr('uplink', 'equalto', true) | map(attribute='vmid') | list }}
pve_ussuri_vault_vmid: >-
  {{ (pve_ussuri_topology | selectattr('writer', 'equalto', 'vault') | list | first).vmid }}
pve_ussuri_vault_address: >-
  {{ pve_juju_network_spaces[0].cidr
     | regex_replace('\.0/24$', '.' ~ ((pve_ussuri_vault_vmid | int) - (pve_ussuri_ip_offset | int))) }}
pve_ussuri_secondary_network_ips: >-
  {%- set ns = namespace(m={}) -%}
  {%- for v in pve_ussuri_workload_vmids -%}
  {%-   set last = (v | int) - (pve_ussuri_ip_offset | int) -%}
  {%-   set ns.m = ns.m | combine({v | string: {
           'oam':      pve_juju_network_spaces[1].cidr | regex_replace('\\.0/24$', '.' ~ last),
           'internal': pve_juju_network_spaces[2].cidr | regex_replace('\\.0/24$', '.' ~ last),
           'storage':  pve_juju_network_spaces[3].cidr | regex_replace('\\.0/24$', '.' ~ last)}}) -%}
  {%- endfor -%}
  {{ ns.m }}

pve_ussuri_osd_lv_prefix: ussuri-osd
pve_ussuri_osd_size_mb: 30720
pve_ussuri_osd_thinpool_vg: pve-thin-pool
pve_ussuri_osd_thinpool: "{{ pve_ussuri_osd_thinpool_vg }}/{{ pve_ussuri_osd_thinpool_vg }}"
pve_ussuri_osd_thinpool_max_data_percent: 75
pve_ussuri_osd_by_index: >-
  {%- set ns = namespace(m={}) -%}
  {%- for e in pve_ussuri_topology -%}
  {%-   for u in e.units -%}
  {%-     if u.startswith('ceph-osd/') -%}
  {%-       set ns.m = ns.m | combine({u.split('/')[1]: e.vmid}) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ ns.m }}
pve_ussuri_osd_spec: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for i in pve_ussuri_osd_by_index | dictsort -%}
  {%-   set ns.out = ns.out + [i[1] ~ ':' ~ i[0]] -%}
  {%- endfor -%}
  {{ ns.out | join(' ') }}

