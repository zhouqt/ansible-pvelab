pve_ussuri_savepoint_env_short: focal-ussuri-env1

pve_ussuri_savepoint_take: false
pve_ussuri_savepoint_restore: false
pve_ussuri_savepoint_name: ""

pve_ussuri_savepoint_client_vmid: 1000
pve_ussuri_savepoint_controller_vmid: 1001
pve_ussuri_savepoint_kvms: "{{ pve_ussuri_workload_kvms | map(attribute='vmid') | list }}"
pve_ussuri_savepoint_compute_guests: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for e in pve_ussuri_topology if e.uplink -%}
  {%-   set ns.out = ns.out + [{'vmid': e.vmid, 'kind': e.kind}] -%}
  {%- endfor -%}
  {{ ns.out }}
pve_ussuri_savepoint_cts_always: >-
  {{ [pve_ussuri_savepoint_client_vmid, pve_ussuri_savepoint_controller_vmid]
     + (pve_ussuri_workload_cts | map(attribute='vmid') | list) }}
pve_ussuri_savepoint_include_empty_cts: false
pve_ussuri_savepoint_empty_cts: []
pve_ussuri_savepoint_cts: >-
  {{ pve_ussuri_savepoint_cts_always
     + (pve_ussuri_savepoint_empty_cts if pve_ussuri_savepoint_include_empty_cts | bool else []) }}

pve_ussuri_savepoint_include_maas_mp: false
pve_ussuri_savepoint_include_cloudinit: false
pve_ussuri_savepoint_include_extra_lvs: true
pve_ussuri_savepoint_extra_lvs: >-
  {{ pve_ussuri_osd_by_index | dictsort | map('first')
     | map('regex_replace', '^', pve_ussuri_osd_lv_prefix ~ '-') | list }}
pve_ussuri_savepoint_exclude_volumes: []

pve_ussuri_savepoint_pool_max_data_percent: 75

pve_ussuri_savepoint_restore_conf: false
pve_ussuri_savepoint_restore_parallel: 6
pve_ussuri_savepoint_converge: true

pve_ussuri_savepoint_public_prefix: "192.168.11"
pve_ussuri_savepoint_ip_offset: 1000
pve_ussuri_savepoint_ceph_mon_vmid: >-
  {{ pve_ussuri_topology | selectattr('units', 'contains', 'ceph-mon/0')
     | map(attribute='vmid') | first }}

pve_ussuri_savepoint_juju_controller: pve-ctrl
pve_ussuri_savepoint_juju_model: openstack
pve_ussuri_savepoint_juju_client_vmid: 1000
pve_ussuri_savepoint_juju_client_user: ubuntu

pve_ussuri_savepoint_mysql_app: mysql-innodb-cluster
pve_ussuri_savepoint_mysql_unit_indexes: [0, 1, 2]
pve_ussuri_savepoint_mysql_selfheal_polls: 5
pve_ussuri_savepoint_mysql_poll_delay: 60
pve_ussuri_savepoint_mysql_settle_polls: 20

pve_ussuri_savepoint_vault_vmid: >-
  {{ pve_ussuri_topology | selectattr('writer', 'equalto', 'vault')
     | map(attribute='vmid') | first }}
pve_ussuri_savepoint_vault_addr: >-
  http://{{ pve_ussuri_savepoint_public_prefix }}.{{ pve_ussuri_savepoint_vault_vmid - pve_ussuri_savepoint_ip_offset }}:8200
pve_ussuri_savepoint_vault_init_keys_file: "{{ lookup('env', 'HOME') }}/setup-test-env/pass/vault-init-keys.txt"

pve_ussuri_run_teardown: false
pve_ussuri_teardown_models: [openstack, lma]
pve_ussuri_teardown_destroy_models: true

pve_ussuri_teardown_ct_vmids: >-
  {{ range(1101, 1128) | reject('in', pve_ussuri_workload_kvms | map(attribute='vmid') | list) | list }}
pve_ussuri_teardown_kvm_vmids: "{{ pve_ussuri_workload_kvms | map(attribute='vmid') | list }}"
pve_ussuri_teardown_extra_ct_vmids: []
pve_ussuri_teardown_extra_kvm_vmids: []

pve_ussuri_teardown_discard_lvs: true
pve_ussuri_teardown_backup_dir: "/var/lib/ansible-pve/teardown-backup-{{ ansible_date_time.date | default('manual') }}"
pve_ussuri_teardown_known_hosts_octets: "{{ range(101, 128) | list }}"
