---

- name: Deploy OpenStack control plane on PVE Juju
  hosts: pve
  become: false
  pre_tasks:
    - name: Validate PVE Juju network spaces before deploying OpenStack charms
      ansible.builtin.include_role:
        name: pve-env1-juju-network
      vars:
        pve_env1_juju_network_validate_only: true
  roles: [pve-env1-control-plane]
