---

- name: Sunbeam on PVE — flavors
  hosts: pve
  gather_facts: false
  vars:
    sunbeam_stage: flavors
  vars_files:
    - ../../group_vars/sunbeam_pve.yml
  tasks:
    - name: Load the stage implementation
      ansible.builtin.include_role:
        name: sunbeam-pve
        tasks_from: flavors.yml
