---

- name: Sunbeam on PVE — system-uuid
  hosts: pve
  gather_facts: false
  vars:
    sunbeam_stage: system-uuid
  vars_files:
    - ../../group_vars/sunbeam_pve.yml
  tasks:
    - name: Load the stage implementation
      ansible.builtin.include_role:
        name: sunbeam-pve
        tasks_from: system-uuid.yml
