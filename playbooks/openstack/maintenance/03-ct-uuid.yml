---

- name: Give every openstack container its own SMBIOS system UUID
  hosts: pve
  become: false
  tasks:
    - name: Apply the per-container SMBIOS system UUIDs
      ansible.builtin.include_role:
        name: pve-common-ct-uuid
      vars:
        pve_common_ct_uuid_items: >-
          {{ ([pve_openstack_controller_vmid | int]
              + (pve_openstack_workload_cts | map(attribute='vmid') | map('int') | list)) }}
        pve_common_ct_uuid_apply_live: true
      when: pve_openstack_run_ct_system_uuid | bool