---

pve_sunbeam_host: pve-host
pve_sunbeam_storage: pve-thin-pool
pve_sunbeam_thinpool_lv: pve-thin-pool
pve_sunbeam_template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
pve_sunbeam_ct_ostype: ubuntu
pve_sunbeam_ct_cores: 8
pve_sunbeam_ct_memory_mb: 32768
pve_sunbeam_ct_swap_mb: 0
pve_sunbeam_ct_features: nesting=1,fuse=1,keyctl=1
pve_sunbeam_ct_nameserver: 8.8.8.8
pve_sunbeam_ct_onboot: 1
pve_sunbeam_ct_startup_order: 5
pve_sunbeam_ct_tags: sunbeam
pve_sunbeam_rootfs_size_gb: 80
pve_sunbeam_osd_size_gb: 50

pve_sunbeam_domain: sunbeam.test
pve_sunbeam_osd_by_id_prefix: pve-ceph-osd-
pve_sunbeam_osd_microceph_device_prefix: pve-ceph-osd-device-
pve_sunbeam_osd_slots_default: { lv: 40, by_id: 41 }
pve_sunbeam_char_devices_default:
  - { index: 0, path: "/dev/kmsg", mode: "0644", extra: "deny-write=1" }
  - { index: 1, path: "/dev/loop-control", mode: "0660" }
  - { index: 33, path: "/dev/kvm", mode: "0660" }
  - { index: 34, path: "/dev/net/tun", mode: "0666" }
pve_sunbeam_loop_device_first: 2
pve_sunbeam_loop_device_last: 31
pve_sunbeam_loop_device_low_slots:
  - { slot: 36, loop: 0 }
  - { slot: 37, loop: 1 }
pve_sunbeam_loop_reap_stale_csi_devices: false

pve_sunbeam_nodes_input:
  - vmid: 1201
    hostname: sunbeam-01
    primary: true
    role: control,compute,storage
    pub_ip: 192.168.21.31
    internal_ip: 192.168.23.31
    mounts:
      - "/proc/sys/vm/overcommit_memory proc/sys/vm/overcommit_memory none bind,create=file 0 0"
      - "/proc/sys/kernel/panic proc/sys/kernel/panic none bind,create=file 0 0"
      - "/proc/sys/kernel/panic_on_oops proc/sys/kernel/panic_on_oops none bind,create=file 0 0"
      - "/dev/loop-control dev/loop-control none bind,create=file 0 0"
  - vmid: 1202
    hostname: sunbeam-02
    primary: false
    role: compute,storage
    pub_ip: 192.168.21.32
    internal_ip: 192.168.23.32
    mounts:
      - "/dev/loop-control dev/loop-control none bind,create=file 0 0"
  - vmid: 1203
    hostname: sunbeam-03
    primary: false
    role: compute,storage
    pub_ip: 192.168.21.33
    internal_ip: 192.168.23.33
    mounts:
      - "/dev/loop-control dev/loop-control none bind,create=file 0 0"

pve_sunbeam_cluster_list_expected_nodes: 3

pve_sunbeam_interface_names: { generic: eth0, internal: eth1, external: eth2 }
pve_sunbeam_bridges: { generic: pub21, internal: int23, external: pub22 }

pve_sunbeam_management_cidr: 192.168.21.0/24
pve_sunbeam_management_gateway: 192.168.21.1
pve_sunbeam_internal_cidr: 192.168.23.0/24
pve_sunbeam_external_network:
  name: physnet1
  openstack_name: external-network
  cidr: 192.168.22.0/24
  gateway: 192.168.22.1
  floating_range: 192.168.22.200-192.168.22.229
  network_type: flat
  segmentation_id: 0
  allow_shared_l2: false
pve_sunbeam_external_reserved_ips:
  - 192.168.22.1
pve_sunbeam_external_reserved_ranges: []
pve_sunbeam_k8s_loadbalancer_range: 172.16.1.201-172.16.1.240
pve_sunbeam_k8s_loadbalancer_cidr: 172.16.1.0/24
pve_sunbeam_tenant_cidr: 192.168.0.0/24
pve_sunbeam_tenant_network_name: demo-network
pve_sunbeam_dns_nameservers: 8.8.8.8

pve_sunbeam_proxy_enabled: false
pve_sunbeam_proxy_allow_unreachable: false
pve_sunbeam_proxy_url: http://192.168.11.2:12345
pve_sunbeam_snapd_store_proxy_url: http://192.168.11.1:12345
pve_sunbeam_containerd_registry_proxy_url: http://192.168.11.1:12345
pve_sunbeam_proxy_no_proxy_tail:
  - 10.1.0.0/16
  - 10.140.97.0/24
  - 10.140.97.1
  - 10.152.183.0/24
  - 172.16.1.0/24

pve_sunbeam_snap_name: openstack
pve_sunbeam_snap_channel: 2024.1/stable
pve_sunbeam_snap_revision: "1101"
pve_sunbeam_snap_version_marker: "2024.1"
pve_sunbeam_juju_channel: 3.6/stable
pve_sunbeam_juju_version: "3.6.29"
pve_sunbeam_microceph_channel: squid/stable
pve_sunbeam_microceph_revision: "1895"
pve_sunbeam_microceph_version: "19.2.3"
pve_sunbeam_snapd_deb_version: "2.77.1"
pve_sunbeam_kernel_modules_stub: true
pve_sunbeam_expected_ubuntu_release: "24.04"
pve_sunbeam_expected_ubuntu_codename: noble

pve_sunbeam_controller_name: localhost-localhost
pve_sunbeam_cluster_model: openstack-machines
pve_sunbeam_region: RegionOne
pve_sunbeam_database_topology: single

pve_sunbeam_demo_username: demo
pve_sunbeam_demo_password: "{{ vault_sunbeam_demo_password | default('') }}"

pve_sunbeam_node_user: sunbeam
pve_sunbeam_node_home: /home/sunbeam
pve_sunbeam_manifest_path: /home/sunbeam/sunbeam-deploy-manifest.yaml
pve_sunbeam_admin_openrc_path: /home/sunbeam/sunbeam-admin-openrc
pve_sunbeam_join_token_dir: /home/sunbeam
pve_sunbeam_join_token_path: "{{ pve_sunbeam_join_token_dir }}/join-token.asc"
pve_sunbeam_join_token_primary_path: "{{ pve_sunbeam_join_token_dir }}/join-token-{{ vmid }}.asc"
pve_sunbeam_join_wrapper_path: /usr/local/sbin/sunbeam-join-node.sh
pve_sunbeam_osd_setup_script: /usr/local/sbin/microceph-osd-device-setup
pve_sunbeam_osd_service_dropin: /etc/systemd/system/snap.microceph.osd.service.d/10-osd-device.conf
pve_sunbeam_node_log_dir: /var/log/sunbeam
pve_sunbeam_etc_environment: /etc/environment
pve_sunbeam_apt_proxy_file: /etc/apt/apt.conf.d/95proxy
pve_sunbeam_demo_openrc_path: /home/sunbeam/sunbeam-demo-openrc
pve_sunbeam_inner_lxd_raw_lxc: "lxc.apparmor.profile=unchanged"

pve_sunbeam_tls_provider: self-signed
pve_sunbeam_tls_endpoints:
  - public

pve_sunbeam_confirm_pve_create: false
pve_sunbeam_confirm_cluster_bootstrap: false
pve_sunbeam_confirm_cluster_join: false
pve_sunbeam_confirm_external_changes: false
pve_sunbeam_confirm_ceph_osd: false
pve_sunbeam_confirm_tls: false
pve_sunbeam_confirm_observability: false

pve_sunbeam_allow_unreadable_cluster_state: false
pve_sunbeam_bootstrap_repair_incomplete: true
pve_sunbeam_repair_openrc: false
pve_sunbeam_ceph_remove_bootstrap_osd: false
pve_sunbeam_preflight_only: false

pve_sunbeam_env_id: env2
pve_sunbeam_savepoint_tag: noble-sunbeam-2024.1
pve_sunbeam_savepoint_name: ""
pve_sunbeam_savepoint_prefix: "sp-{{ pve_sunbeam_savepoint_tag }}-{{ pve_sunbeam_env_id }}{% if pve_sunbeam_savepoint_name | length > 0 %}-{{ pve_sunbeam_savepoint_name }}{% endif %}"
pve_sunbeam_savepoint_take: false
pve_sunbeam_savepoint_restore: false
pve_sunbeam_savepoint_include_osd: true
pve_sunbeam_savepoint_repair_network: true
pve_sunbeam_savepoint_verify_fip_ping: true

pve_sunbeam_obs_controller: "{{ pve_obs_cos_hub_cos_controller }}"
pve_sunbeam_obs_account_user: sunbeam-obs
pve_sunbeam_obs_switch_back_controller: sunbeam-controller
pve_sunbeam_obs_hub_juju_client_vmid: "{{ pve_obs_cos_hub_juju_client_vmid }}"
pve_sunbeam_obs_hub_juju_client_user: "{{ pve_obs_cos_hub_juju_client_user }}"
pve_sunbeam_obs_hub_juju_cmd: "JUJU_DATA={{ pve_obs_cos_hub_juju_data }} {{ pve_obs_cos_hub_juju_bin }}"
pve_sunbeam_obs_grafana_offer: "admin/{{ pve_obs_cos_hub_cos_model }}.grafana"
pve_sunbeam_obs_prometheus_offer: "admin/{{ pve_obs_cos_hub_cos_model }}.prometheus"
pve_sunbeam_obs_loki_offer: "admin/{{ pve_obs_cos_hub_cos_model }}.loki"
pve_sunbeam_obs_hub_vip: "{{ pve_obs_cos_hub_lb_pool_addresses[0] | regex_replace('/.*$', '') }}"
pve_sunbeam_obs_extra_integrations:
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector,      endpoint: send-remote-write,           offer: "{{ pve_sunbeam_obs_prometheus_offer }}"}
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector,      endpoint: send-loki-logs,              offer: "{{ pve_sunbeam_obs_loki_offer }}"}
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector,      endpoint: grafana-dashboards-provider, offer: "{{ pve_sunbeam_obs_grafana_offer }}"}
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector-infra, endpoint: send-remote-write,          offer: "{{ pve_sunbeam_obs_prometheus_offer }}"}
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector-infra, endpoint: send-loki-logs,             offer: "{{ pve_sunbeam_obs_loki_offer }}"}
  - {model: "{{ pve_sunbeam_juju_openstack_model }}", app: opentelemetry-collector-infra, endpoint: grafana-dashboards-provider, offer: "{{ pve_sunbeam_obs_grafana_offer }}"}
  - {model: "{{ pve_sunbeam_juju_machines_model }}", app: opentelemetry-collector,      endpoint: send-remote-write,           offer: "{{ pve_sunbeam_obs_prometheus_offer }}"}
  - {model: "{{ pve_sunbeam_juju_machines_model }}", app: opentelemetry-collector,      endpoint: send-loki-logs,              offer: "{{ pve_sunbeam_obs_loki_offer }}"}
  - {model: "{{ pve_sunbeam_juju_machines_model }}", app: opentelemetry-collector,      endpoint: grafana-dashboards-provider, offer: "{{ pve_sunbeam_obs_grafana_offer }}"}

pve_sunbeam_nodes: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for n in pve_sunbeam_nodes_input -%}
  {%- set lv = '/dev/' ~ pve_sunbeam_storage ~ '/vm-' ~ n.vmid ~ '-disk-1' -%}
  {%- set by_id = '/dev/disk/by-id/' ~ pve_sunbeam_osd_by_id_prefix ~ n.vmid -%}
  {%- set slots = n.osd_slots | default(pve_sunbeam_osd_slots_default) -%}
  {%- set devs = [{'index': slots.lv, 'path': lv}] -%}
  {%- if slots.by_id is defined and slots.by_id is not none -%}
  {%-   set _ = devs.append({'index': slots.by_id, 'path': by_id}) -%}
  {%- endif -%}
  {%- set nics = n.interfaces | default(pve_sunbeam_interface_names) -%}
  {%- set bridges = {} -%}
  {%- for role, nic in nics.items() -%}
  {%-   set _ = bridges.update({nic: pve_sunbeam_bridges[role]}) -%}
  {%- endfor -%}
  {%- set derived = {
        'fqdn': n.hostname ~ '.' ~ pve_sunbeam_domain,
        'interfaces': nics,
        'pve_bridges': bridges,
        'osd_pve_lv': lv,
        'osd_by_id': by_id,
        'osd_microceph_device': '/dev/disk/by-id/' ~ pve_sunbeam_osd_microceph_device_prefix ~ n.vmid,
        'pve_devices': devs,
        'char_devices': pve_sunbeam_char_devices_default,
        'mounts': [],
        'loop_devices': n.primary | default(false),
      } -%}
  {%- set _ = ns.out.append(derived | combine(n)) -%}
  {%- endfor -%}
  {{ ns.out }}

pve_sunbeam_primary_node: "{{ pve_sunbeam_nodes | selectattr('primary') | list | first }}"
pve_sunbeam_worker_nodes: "{{ pve_sunbeam_nodes | rejectattr('primary') | list }}"
pve_sunbeam_ceph_managed_osd_devices: "{{ pve_sunbeam_nodes | length }}"
pve_sunbeam_ceph_osd_devices: "{{ pve_sunbeam_nodes | map(attribute='osd_microceph_device') | list }}"

pve_sunbeam_compute_nodes: "{{ pve_sunbeam_nodes | selectattr('role', 'search', 'compute') | list }}"

pve_sunbeam_loop_nodes: "{{ pve_sunbeam_nodes | selectattr('loop_devices') | list }}"

pve_sunbeam_host_expected_bridges: "{{ pve_sunbeam_bridges.values() | list }}"
pve_sunbeam_host_expected_vnets: "{{ pve_sunbeam_bridges.values() | list }}"
pve_sunbeam_host_expected_subnets:
  - "{{ pve_sunbeam_management_cidr }}"
  - "{{ pve_sunbeam_internal_cidr }}"
  - "{{ pve_sunbeam_external_network.cidr }}"
pve_sunbeam_host_expected_subnet_ids: >-
  {{ pve_sunbeam_host_expected_subnets | map('regex_replace', '/', '-') | list }}
pve_sunbeam_host_expected_snat_cidrs:
  - "{{ pve_sunbeam_management_cidr }}"
  - "{{ pve_sunbeam_external_network.cidr }}"
pve_sunbeam_manifest_external_nic: "{{ pve_sunbeam_interface_names.external }}"
pve_sunbeam_vm_test_network: "{{ pve_sunbeam_tenant_network_name }}"

pve_sunbeam_proxy_no_proxy: >-
  {{ ['localhost', '127.0.0.1', '::1', '.' ~ pve_sunbeam_domain, '.svc', '.svc.cluster.local',
      pve_sunbeam_management_cidr]
     + (pve_sunbeam_nodes | map(attribute='pub_ip') | list)
     + [pve_sunbeam_internal_cidr]
     + (pve_sunbeam_nodes | map(attribute='internal_ip') | list)
     + pve_sunbeam_proxy_no_proxy_tail }}
pve_sunbeam_proxy_no_proxy_effective: "{{ pve_sunbeam_proxy_no_proxy | join(',') }}"

pve_sunbeam_tls_endpoint_apps:
  public: traefik-public
  internal: traefik
  rgw: traefik-rgw

pve_sunbeam_ceph_unmanaged_osds: []
pve_sunbeam_ceph_expected_osds: >-
  {{ (pve_sunbeam_ceph_managed_osd_devices | int)
     + (0 if (pve_sunbeam_ceph_remove_bootstrap_osd | bool) else (pve_sunbeam_ceph_unmanaged_osds | length)) }}
pve_sunbeam_ceph_expected_pgs: 385
pve_sunbeam_ceph_expected_pools: 7
pve_sunbeam_ceph_pool_size: 3
pve_sunbeam_ceph_pool_min_size: 2
pve_sunbeam_health_require_all_active: false
pve_sunbeam_known_blocked_applications: [sunbeam-machine]
pve_sunbeam_ceph_tolerated_warnings:
  - "pool\\(s\\) have no replicas configured"
  - "experiencing slow operations in BlueStore"
pve_sunbeam_module_release: 7.0.2-6-pve

pve_sunbeam_baseline_fingerprint: "2faacd72-c0f3-4c39-ac88-302eb9ee15c7"
pve_sunbeam_baseline_enforced: true

pve_sunbeam_thinpool_max_data_percent: 90
pve_sunbeam_ct_rootfs_warn_percent: 85
pve_sunbeam_snap_hold_forever: true
pve_sunbeam_hold_snapd_deb: true
pve_sunbeam_held_snaps:
  - openstack
  - microceph
  - k8s
  - openstack-hypervisor
  - cinder-volume
  - epa-orchestrator
  - snapd

pve_sunbeam_vm_volume_test: false
pve_sunbeam_vm_test_name: sunbeam-ansible-smoke
pve_sunbeam_vm_test_volume_name: sunbeam-ansible-volume-smoke
pve_sunbeam_vm_test_image_name: sunbeam-ansible-cirros-smoke
pve_sunbeam_vm_test_volume_size_gb: 1
pve_sunbeam_vm_test_cirros_url: "{{ pve_sunbeam_cirros_image_url }}"
pve_sunbeam_vm_test_flavor: m1.tiny
pve_sunbeam_vm_test_ping: false
pve_sunbeam_vm_test_security_group: sunbeam-ansible-smoke
pve_sunbeam_vm_test_ping_timeout: 120

pve_sunbeam_flavors:
  - { name: cirros,      ram: 512,  disk: 1,  vcpus: 1 }
  - { name: m1.nano,     ram: 128,  disk: 1,  vcpus: 1 }
  - { name: m1.tiny,     ram: 512,  disk: 4,  vcpus: 1 }
  - { name: m1.tiny-sev, ram: 512,  disk: 4,  vcpus: 1, extras: "hw:mem_encryption=true" }
  - { name: m1.micro,    ram: 256,  disk: 5,  vcpus: 1 }
  - { name: m1.small,    ram: 2048, disk: 10, vcpus: 1 }
  - { name: m1.medium,   ram: 4096, disk: 20, vcpus: 2 }

pve_sunbeam_flavors_remove:
  - m1.small-sev
  - m1.medium-sev
  - m1.large
  - m1.large-sev

pve_sunbeam_cirros_image_name: cirros
pve_sunbeam_cirros_image_url: https://download.cirros-cloud.net/0.5.2/cirros-0.5.2-x86_64-disk.img
