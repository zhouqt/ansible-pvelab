---

pve_common_host: pve-host
pve_common_ssh_port: 2222
pve_common_storage: pve-thin-pool

pve_common_no_proxy: "127.0.0.1,localhost,192.168.11.0/24"

apt_mirror: "cn.archive.ubuntu.com"

openstack_region: "RegionOne"

k8s_channel: "1.32/stable"

lma_nrpe_targets:
  - nova-compute
  - nova-compute-kvm
  - ceph-osd
  - ceph-mon
  - keystone
  - cinder
  - glance
  - neutron-api
  - nova-cloud-controller
  - rabbitmq-server
  - mysql-innodb-cluster
  - vault
  - openstack-dashboard
  - placement
  - ovn-central

repo_root: "{{ inventory_dir | dirname }}"

