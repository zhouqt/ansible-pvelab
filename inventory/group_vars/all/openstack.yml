---
pve_yoga_env_number: 3
pve_yoga_default_env_number: 3
pve_yoga_openstack_series: jammy
pve_yoga_openstack_version: "yoga"
pve_yoga_profile: "{{ pve_yoga_openstack_series }}-{{ pve_yoga_openstack_version }}"
pve_yoga_profiles:
  "jammy-yoga":
    version_short: yoga
    origin: distro
    openstack: yoga/stable
    ceph: quincy/stable
    ceph_source: ""
    ovn: "22.03/stable"
    ovn_source: ""
    vault: 1.7/stable
    rabbitmq: 3.9/stable
    mysql: 8.0/stable
    lxc_template: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    kvm_image: ubuntu-22.04-server-cloudimg-amd64.img
    kvm_image_url: "https://cloud-images.ubuntu.com/releases/jammy/release/ubuntu-22.04-server-cloudimg-amd64.img"
    unit_python3_packages: []
  "jammy-2024.1":
    version_short: caracal
    origin: cloud:jammy-caracal
    openstack: 2024.1/stable
    ceph: squid/stable
    ceph_source: cloud:jammy-caracal
    ovn: "24.03/stable"
    ovn_source: cloud:jammy-caracal
    vault: 1.7/stable
    rabbitmq: 3.9/stable
    mysql: 8.0/stable
    lxc_template: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    kvm_image: ubuntu-22.04-server-cloudimg-amd64.img
    kvm_image_url: "https://cloud-images.ubuntu.com/releases/jammy/release/ubuntu-22.04-server-cloudimg-amd64.img"
    unit_python3_packages: []
  "noble-2024.1":
    version_short: caracal
    origin: distro
    openstack: 2024.1/stable
    ceph: squid/stable
    ceph_source: distro
    ovn: "24.03/stable"
    ovn_source: distro
    vault: 1.8/stable
    rabbitmq: "3.12/stable"
    mysql: 8.0/stable
    lxc_template: "local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
    kvm_image: ubuntu-24.04-server-cloudimg-amd64.img
    kvm_image_url: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    unit_python3_packages:
      - python3-setuptools
      - python3-six
  "focal-ussuri":
    version_short: ussuri
    origin: distro
    openstack: ussuri/stable
    ceph: octopus/stable
    ceph_source: distro
    ovn: "20.03/stable"
    ovn_source: distro
    vault: 1.7/stable
    rabbitmq: 3.8/stable
    mysql: 8.0/stable
    lxc_template: "local:vztmpl/ubuntu-focal-cloudimg-rootfs_20.04-6_amd64.tar.xz"
    kvm_image: ubuntu-20.04-server-cloudimg-amd64.img
    kvm_image_url: "https://cloud-images.ubuntu.com/releases/focal/release/ubuntu-20.04-server-cloudimg-amd64.img"
    unit_python3_packages:
      - python3-six
    app_revisions:
      keystone: 691
      keystone-mysql-router: 257
      nova-cloud-controller: 748
      nova-mysql-router: 257
      placement: 99
      placement-mysql-router: 257
      glance: 589
      glance-mysql-router: 257
      neutron-api: 588
      neutron-mysql-router: 257
      neutron-api-plugin-ovn: 98
      cinder: 670
      cinder-mysql-router: 257
      cinder-ceph: 518
      vault: 371
      vault-mysql-router: 257
      mysql-innodb-cluster: 159
      rabbitmq-server: 222
      nova-compute: 779
      ovn-central: 35
      ovn-chassis: 321
      ceph-mon: 177
      ceph-osd: 617
      ntp: 52
    app_options:
      neutron-api-plugin-ovn:
        ovn-source: distro
pve_yoga_juju_bin: /snap/bin/juju_yoga
pve_yoga_juju_channel: "3.6/stable"
pve_yoga_juju_agent_version: ""
pve_yoga_juju_db_channel: "4.4/stable"
pve_yoga_juju_client_vmid: 1000
pve_yoga_juju_client_user: ubuntu
pve_yoga_juju_data: /home/ubuntu/.local/share/juju
pve_yoga_juju_stage_dir: "/home/{{ pve_yoga_juju_client_user }}/yoga-bundles"
pve_yoga_model_name: openstack
pve_yoga_default_space: internal
pve_yoga_env_slug: "{{ pve_yoga_openstack_series }}-{{ pve_yoga_profiles[pve_yoga_profile].version_short }}-env{{ pve_yoga_env_number }}"
pve_yoga_vmid_base: "{{ (pve_yoga_env_number | int * 100) + 1000 }}"
pve_yoga_controller_vmid: "{{ pve_yoga_vmid_base | int }}"
pve_yoga_controller_name: "{{ pve_yoga_env_slug }}-ctrl"
pve_yoga_controller_ip: "192.168.{{ pve_yoga_env_number }}0.10"
pve_yoga_ip_offset: "{{ pve_yoga_vmid_base | int - 10 }}"
pve_yoga_network_spaces:
  - name: public
    bridge: "pub{{ pve_yoga_env_number }}0"
    cidr: "192.168.{{ pve_yoga_env_number }}0.0/24"
    net_index: 0
    zone: public
    snat: true
  - name: oam
    bridge: "pub{{ pve_yoga_env_number }}1"
    cidr: "192.168.{{ pve_yoga_env_number }}1.0/24"
    net_index: 1
    zone: public
    snat: true
  - name: internal
    bridge: "int{{ pve_yoga_env_number }}2"
    cidr: "192.168.{{ pve_yoga_env_number }}2.0/24"
    net_index: 2
    zone: internal
    snat: false
  - name: storage
    bridge: "int{{ pve_yoga_env_number }}3"
    cidr: "192.168.{{ pve_yoga_env_number }}3.0/24"
    net_index: 3
    zone: internal
    snat: false
pve_yoga_compute_machine_indices: [4, 5]
pve_yoga_public_cidr: >-
  {{ pve_yoga_network_spaces | selectattr('name', 'equalto', 'public') | map(attribute='cidr') | first }}
pve_yoga_internal_cidr: >-
  {{ pve_yoga_network_spaces | selectattr('name', 'equalto', pve_yoga_default_space) | map(attribute='cidr') | first }}
pve_yoga_public_prefix: "{{ pve_yoga_public_cidr | regex_replace('\\.0/24$', '') }}"
pve_yoga_public_gateway: "{{ pve_yoga_public_cidr | regex_replace('\\.0/24$', '.1') }}"
pve_yoga_no_proxy_cidrs: "{{ pve_yoga_network_spaces | map(attribute='cidr') | join(',') }}"
pve_yoga_http_proxy: ""
pve_yoga_https_proxy: ""
pve_yoga_apt_mirror: "{{ apt_mirror }}"
pve_yoga_compute_uplink_bridge: "pub{{ pve_yoga_env_number }}0"
pve_yoga_compute_uplink_net_index: 4
pve_yoga_compute_uplink_guest_interface: ens22
pve_yoga_compute_uplink_ovn_mapping: "br-ex:{{ pve_yoga_compute_uplink_guest_interface }}"
pve_yoga_compute_uplink_ovn_bridge_mapping: "physnet1:br-ex"
pve_yoga_compute_uplink_vmids:
  - "{{ pve_yoga_vmid_base | int + 4 }}"
  - "{{ pve_yoga_vmid_base | int + 5 }}"
pve_yoga_workload_vmids:
  - "{{ pve_yoga_vmid_base | int + 1 }}"
  - "{{ pve_yoga_vmid_base | int + 2 }}"
  - "{{ pve_yoga_vmid_base | int + 3 }}"
  - "{{ pve_yoga_vmid_base | int + 6 }}"
  - "{{ pve_yoga_vmid_base | int + 4 }}"
  - "{{ pve_yoga_vmid_base | int + 5 }}"
pve_yoga_workload_kvm_vmid: "{{ pve_yoga_vmid_base | int + 5 }}"
pve_yoga_guest_vmids: "{{ [pve_yoga_controller_vmid] + pve_yoga_workload_vmids }}"
pve_yoga_workload_cts:
  - {vmid: "{{ pve_yoga_vmid_base | int + 1 }}", hostname: "{{ pve_yoga_env_slug }}-01", cores: 4, memory: 8192}
  - {vmid: "{{ pve_yoga_vmid_base | int + 2 }}", hostname: "{{ pve_yoga_env_slug }}-02", cores: 4, memory: 8192}
  - {vmid: "{{ pve_yoga_vmid_base | int + 3 }}", hostname: "{{ pve_yoga_env_slug }}-03", cores: 2, memory: 4096}
  - {vmid: "{{ pve_yoga_vmid_base | int + 6 }}", hostname: "{{ pve_yoga_env_slug }}-06", cores: 2, memory: 4096}
  - {vmid: "{{ pve_yoga_vmid_base | int + 4 }}", hostname: "{{ pve_yoga_env_slug }}-04", cores: 4, memory: 8192}
pve_yoga_kvm_workload:
  vmid: "{{ pve_yoga_vmid_base | int + 5 }}"
  hostname: "{{ pve_yoga_env_slug }}-05"
  cores: 4
  memory: 8192
  disk: 32
pve_yoga_osd_vmids:
  - "{{ pve_yoga_vmid_base | int + 1 }}"
  - "{{ pve_yoga_vmid_base | int + 2 }}"
  - "{{ pve_yoga_vmid_base | int + 3 }}"
  - "{{ pve_yoga_vmid_base | int + 4 }}"
pve_yoga_osd_size_mb: 30720
pve_yoga_osd_lv_prefix: "{{ pve_yoga_env_slug }}-osd"
pve_yoga_osd_thinpool_vg: pve-thin-pool
pve_yoga_osd_thinpool: "{{ pve_yoga_osd_thinpool_vg }}/{{ pve_yoga_osd_thinpool_vg }}"
pve_yoga_osd_thinpool_max_data_percent: 90
pve_yoga_workload_secondary_network_ips: >-
  {%- set ns = namespace(m={}) -%}
  {%- for v in pve_yoga_guest_vmids -%}
  {%-   set last = (v | int) - (pve_yoga_ip_offset | int) -%}
  {%-   set ns.m = ns.m | combine({v | string: {
           'oam':      pve_yoga_network_spaces[1].cidr | regex_replace('\\.0/24$', '.' ~ last),
           'internal': pve_yoga_network_spaces[2].cidr | regex_replace('\\.0/24$', '.' ~ last),
           'storage':  pve_yoga_network_spaces[3].cidr | regex_replace('\\.0/24$', '.' ~ last)}}) -%}
  {%- endfor -%}
  {{ ns.m }}
pve_yoga_lxc_template: "{{ pve_yoga_profiles[pve_yoga_profile].lxc_template }}"
pve_yoga_kvm_image: "{{ pve_yoga_profiles[pve_yoga_profile].kvm_image }}"
pve_yoga_kvm_image_url: "{{ pve_yoga_profiles[pve_yoga_profile].kvm_image_url }}"
pve_yoga_unit_python3_packages: "{{ pve_yoga_profiles[pve_yoga_profile].unit_python3_packages }}"
pve_yoga_core_applications:
  - keystone
  - nova-cloud-controller
  - neutron-api
  - glance
  - cinder
  - placement

pve_yoga_recover_deferred_apps:
  - ceph-osd

pve_yoga_run_host_baseline: false
pve_yoga_run_sdn: false
pve_yoga_sdn_stop_guests: false
pve_yoga_run_ct_system_uuid: false
pve_yoga_control_plane_two_wave: true
pve_yoga_control_plane_wave1_apps:
  - keystone
  - keystone-mysql-router
  - vault
  - vault-mysql-router
  - mysql-innodb-cluster
pve_yoga_mysql_selfheal_timeout: 10m
pve_yoga_run_teardown: false
pve_yoga_teardown_allow_default_env: false
pve_yoga_teardown_remove_sdn: false
pve_yoga_teardown_remove_osd_files: true
pve_yoga_teardown_discard_lvs: true
pve_yoga_teardown_remove_legacy_files_dir: false
pve_yoga_teardown_credential_files: []
pve_yoga_teardown_remove_legacy_client: false
pve_yoga_savepoint_take: false
pve_yoga_savepoint_restore: false
pve_yoga_savepoint_name: ""
pve_yoga_savepoint_include_osd: true
pve_yoga_savepoint_restore_run_recovery: true
pve_yoga_seed_restore: false
pve_yoga_seed_restore_name: "seed"
pve_yoga_seed_restore_client_store: true
pve_yoga_seed_restore_admin_donor: ""
pve_yoga_seed_restore_probe_timeout: 300
pve_yoga_credentials_dir: "{{ playbook_dir }}/credentials"
pve_yoga_keystone_admin_password_file: "{{ pve_yoga_credentials_dir }}/{{ pve_yoga_env_slug }}-keystone-admin-password.txt"
pve_yoga_vault_init_file: "{{ pve_yoga_credentials_dir }}/{{ pve_yoga_env_slug }}-vault-init.json"
pve_yoga_keystone_admin_password: >-
  {{ vault_pve_yoga_keystone_admin_password
     | default(vault_pve_keystone_admin_password
     | default(lookup('ansible.builtin.file', pve_yoga_keystone_admin_password_file, errors='ignore')
               | default('', true) | trim)) }}
pve_yoga_vault_root_token: >-
  {{ vault_pve_yoga_vault_root_token
     | default((lookup('ansible.builtin.file', pve_yoga_vault_init_file, errors='ignore')
                | default('{}', true) | from_json).root_token | default('')) }}
pve_yoga_deploy_control_template: deploy-yoga-control-plane.sh.j2

pve_yoga_env_short: "{{ pve_yoga_env_slug | regex_replace('^' ~ pve_yoga_openstack_series ~ '-', '') }}"
pve_yoga_openrc_file: "{{ pve_yoga_credentials_dir }}/admin-openrc-pve-{{ pve_yoga_env_short }}.sh"
pve_yoga_ca_cert_file: "{{ pve_yoga_credentials_dir }}/vault-ca-pve-{{ pve_yoga_env_short }}.crt"
pve_yoga_keypair_private_key_file: "{{ pve_yoga_credentials_dir }}/{{ pve_yoga_env_short }}-test-key.pem"
pve_yoga_control_route_gateway: "192.168.11.1"
pve_yoga_image_cache_dir: "/home/ubuntu/pve-yoga-images"
pve_yoga_image_download_proxy: ""
pve_yoga_resources_physical_network: "{{ pve_yoga_compute_uplink_ovn_bridge_mapping.split(':')[0] }}"
pve_yoga_resources_user: admin
pve_yoga_resources_project: admin
pve_yoga_resources_project_domain: admin_domain
pve_yoga_resources_region: RegionOne
pve_yoga_resources_flavors:
  - {name: m1.tiny, id: 1, vcpus: 1, ram: 512, disk: 1}
  - {name: m1.small, id: 2, vcpus: 1, ram: 2048, disk: 10}
  - {name: cirros, id: 100, vcpus: 1, ram: 512, disk: 1}
pve_yoga_resources_images:
  - name: cirros-0.6.2
    file: "{{ pve_yoga_image_cache_dir }}/cirros-0.6.2-x86_64-disk.img"
    url: "https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img"
    checksum: "md5:c8fc807773e5354afe61636071771906"
    disk_format: qcow2
pve_yoga_resources_ext_net: ext-net
pve_yoga_resources_ext_subnet: ext-subnet
pve_yoga_resources_tenant_net: tenant-net
pve_yoga_resources_tenant_subnet: tenant-subnet
pve_yoga_resources_tenant_cidr: "10.0.0.0/24"
pve_yoga_resources_tenant_gateway: "10.0.0.1"
pve_yoga_resources_tenant_dns: "8.8.8.8"
pve_yoga_resources_router: router1
pve_yoga_resources_floating_pool_start: "{{ pve_yoga_public_prefix }}.200"
pve_yoga_resources_floating_pool_end: "{{ pve_yoga_public_prefix }}.250"
pve_yoga_resources_secgroup: default
pve_yoga_resources_secgroup_rules:
  - {proto: icmp, port_range: ""}
  - {proto: tcp, dst_port: 22, port_range: "22:22"}
pve_yoga_resources_keypair: yoga-test-key
