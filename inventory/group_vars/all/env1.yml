    url: "https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img"
    checksum: "md5:87617e24a5e30cb3b87fda8c0764838f"
    disk_format: qcow2
pve_env1_resources_ext_net: ext-net
pve_env1_resources_ext_subnet: ext-subnet
pve_env1_resources_floating_pool_start: "{{ pve_env1_juju_public_cidr | regex_replace('\\.0/24$', '.220') }}"
pve_env1_resources_floating_pool_end: "{{ pve_env1_juju_public_cidr | regex_replace('\\.0/24$', '.229') }}"
pve_env1_resources_tenant_net: tenant-net
pve_env1_resources_tenant_subnet: tenant-subnet
pve_env1_resources_tenant_cidr: "10.0.0.0/24"
pve_env1_resources_tenant_gateway: "10.0.0.1"
pve_env1_resources_tenant_dns: 8.8.8.8
pve_env1_resources_router: router1
pve_env1_resources_secgroup: default
pve_env1_resources_secgroup_rules:
  - {proto: icmp, port_range: ""}
  - {proto: tcp, dst_port: 22, port_range: "22:22"}
pve_env1_resources_keypair: pve-openstack-test-key
pve_env1_keypair_private_key_file: "{{ pve_env1_credentials_dir }}/{{ pve_env1_slug }}-test-key.pem"

pve_env1_savepoint_env_short: focal-ussuri-env1

pve_env1_savepoint_take: false
pve_env1_savepoint_restore: false
pve_env1_savepoint_name: ""

pve_env1_savepoint_client_vmid: 1000
pve_env1_savepoint_controller_vmid: 1001
pve_env1_savepoint_kvms: "{{ pve_env1_workload_kvms | map(attribute='vmid') | list }}"
pve_env1_savepoint_compute_guests: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for e in pve_env1_topology if e.uplink -%}
  {%-   set ns.out = ns.out + [{'vmid': e.vmid, 'kind': e.kind}] -%}
  {%- endfor -%}
  {{ ns.out }}
pve_env1_savepoint_cts_always: >-
  {{ [pve_env1_savepoint_client_vmid, pve_env1_savepoint_controller_vmid]
     + (pve_env1_workload_cts | map(attribute='vmid') | list) }}
pve_env1_savepoint_include_empty_cts: false
pve_env1_savepoint_empty_cts: []
pve_env1_savepoint_cts: >-
  {{ pve_env1_savepoint_cts_always
     + (pve_env1_savepoint_empty_cts if pve_env1_savepoint_include_empty_cts | bool else []) }}

pve_env1_savepoint_include_maas_mp: false
pve_env1_savepoint_include_cloudinit: false
pve_env1_savepoint_include_extra_lvs: true
pve_env1_savepoint_extra_lvs: >-
  {{ pve_env1_osd_by_index | dictsort | map('first')
     | map('regex_replace', '^', pve_env1_osd_lv_prefix ~ '-') | list }}
pve_env1_savepoint_exclude_volumes: []

pve_env1_savepoint_pool_max_data_percent: 75

pve_env1_savepoint_restore_conf: false
pve_env1_savepoint_restore_parallel: 6
pve_env1_savepoint_converge: true

pve_env1_savepoint_public_prefix: "192.168.11"
pve_env1_savepoint_ip_offset: 1000
pve_env1_savepoint_ceph_mon_vmid: >-
  {{ pve_env1_topology | selectattr('units', 'contains', 'ceph-mon/0')
     | map(attribute='vmid') | first }}

pve_env1_savepoint_juju_controller: pve-ctrl
pve_env1_savepoint_juju_model: openstack
pve_env1_savepoint_juju_client_vmid: 1000
pve_env1_savepoint_juju_client_user: ubuntu

pve_env1_savepoint_mysql_app: mysql-innodb-cluster
pve_env1_savepoint_mysql_unit_indexes: [0, 1, 2]
pve_env1_savepoint_mysql_selfheal_polls: 5
pve_env1_savepoint_mysql_poll_delay: 60
pve_env1_savepoint_mysql_settle_polls: 20

pve_env1_savepoint_vault_vmid: >-
  {{ pve_env1_topology | selectattr('writer', 'equalto', 'vault')
     | map(attribute='vmid') | first }}
pve_env1_savepoint_vault_addr: >-
  http://{{ pve_env1_savepoint_public_prefix }}.{{ pve_env1_savepoint_vault_vmid - pve_env1_savepoint_ip_offset }}:8200
