pve_env1_teardown_ct_vmids: >-
  {{ range(1101, 1128) | reject('in', pve_env1_workload_kvms | map(attribute='vmid') | list) | list }}
pve_env1_teardown_kvm_vmids: "{{ pve_env1_workload_kvms | map(attribute='vmid') | list }}"
pve_env1_teardown_extra_ct_vmids: []
pve_env1_teardown_extra_kvm_vmids: []

pve_env1_teardown_discard_lvs: true
pve_env1_teardown_backup_dir: "/var/lib/ansible-pve/teardown-backup-{{ ansible_date_time.date | default('manual') }}"
pve_env1_teardown_known_hosts_octets: "{{ range(101, 128) | list }}"
