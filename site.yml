- name: Prepare OpenStack for K8s deployment (flavors, quotas)
  hosts: localhost
  connection: local
  tags: [k8s-lxd-os, k8s-lxd-os-prepare]
  vars:
    k8s_openstack_rc: "{{ project_dir }}/credentials/admin-openrc-lxd-openstack.sh"
    project_dir: "/home/zhouqt/ansible-homelab"
  tasks:
    - name: Create m1.k8s-node flavor (2vCPU/4GB/20GB)
      shell: |
        bash -c 'source {{ k8s_openstack_rc }} >/dev/null 2>&1 && \
          openstack flavor show m1.k8s-node >/dev/null 2>&1 || \
          openstack flavor create m1.k8s-node --vcpus 2 --ram 4096 --disk 20 --public'
      changed_when: false

    - name: Create m1.small flavor (1vCPU/2GB/20GB)
      shell: |
        bash -c 'source {{ k8s_openstack_rc }} >/dev/null 2>&1 && \
          openstack flavor show m1.small >/dev/null 2>&1 || \
          openstack flavor create m1.small --vcpus 1 --ram 2048 --disk 20 --public'
      changed_when: false

    - name: Create m1.micro flavor (1vCPU/1GB/5GB)
      shell: |
        bash -c 'source {{ k8s_openstack_rc }} >/dev/null 2>&1 && \
          openstack flavor show m1.micro >/dev/null 2>&1 || \
          openstack flavor create m1.micro --vcpus 1 --ram 1024 --disk 5 --public'
      changed_when: false

    - name: Get admin project ID
      shell: |
        bash -c 'source {{ k8s_openstack_rc }} >/dev/null 2>&1 && \
          openstack project show admin --domain admin_domain -f value -c id'
      register: admin_project_id
      changed_when: false

    - name: Increase compute quotas for K8s deployment
      shell: |
        bash -c 'source {{ k8s_openstack_rc }} >/dev/null 2>&1 && \
          openstack quota set {{ admin_project_id.stdout }} \
            --instances {{ os_quota_instances | default(30) }} \
            --cores {{ os_quota_cores | default(40) }} \
            --ram {{ os_quota_ram | default(102400) }}'
      changed_when: false

    - name: Increase network quotas for K8s deployment
      shell: |
        set -o pipefail
        source {{ k8s_openstack_rc }} >/dev/null 2>&1
        TOKEN=$(openstack token issue -f value -c id)
        NEUTRON=$(openstack endpoint list --service network --interface public -f value -c URL)
        REQ=(curl -sS -f -X PUT "$NEUTRON/quotas/{{ admin_project_id.stdout }}"
             -H "X-Auth-Token: $TOKEN" -H "Content-Type: application/json")
        [ -n "${OS_CACERT:-}" ] && REQ+=(--cacert "$OS_CACERT")
        "${REQ[@]}" -d '{"quota": {"security_group": {{ os_quota_secgroups | default(50) }}, "security_group_rule": {{ os_quota_secgroup_rules | default(500) }}, "floatingip": {{ os_quota_floating_ips | default(50) }}, "port": {{ os_quota_ports | default(200) }}}}'
      register: k8s_network_quota_set
      changed_when: false
      failed_when: false

    - name: Warn when the network quotas could not be raised
      debug:
        msg: >-
          WARNING: could not update neutron quotas (rc={{ k8s_network_quota_set.rc }}):
          {{ k8s_network_quota_set.stderr | default('') | trim }}.
          Juju creates one security group per machine, so a low secgroups quota
          makes provisioning fail with "failed to create a security group".
      when: k8s_network_quota_set.rc | default(0) != 0

